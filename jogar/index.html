<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14163a">
<meta name="description" content="Jogue Mosaica no navegador: estratégia por turnos em ilhas, 12 clãs, 30 turnos.">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Mosaica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: tabuleiro em tela cheia (canvas) com HUD flutuante; painel lateral no desktop, gaveta inferior no celular. */
:root{
  --void:#14163a;        /* céu entre os ladrilhos */
  --void-2:#0c0d26;
  --ink:#f3efff;         /* texto principal */
  --muted:#aeb0d8;       /* texto secundário */
  --glass:rgba(28,30,72,.86);
  --glass-line:rgba(190,192,255,.18);
  --lumen:#ffd36b;       /* moeda e ação principal */
  --lumen-ink:#3a2a00;
  --danger:#ff8a7a;
  --ok:#9ee6a8;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"MosaicaNum","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--void-2);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--lumen);outline-offset:2px}
#hud{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#hud > *{pointer-events:auto}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:8px 10px;backdrop-filter:blur(8px)}
.brand{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.02em;margin-right:4px}
.stat{display:flex;align-items:baseline;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{color:var(--muted);font-size:12px}
.stat.gold{color:var(--lumen);font-weight:700}
.spacer{flex:1}
.btn{border:1px solid var(--glass-line);background:rgba(255,255,255,.07);border-radius:10px;padding:6px 11px;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--lumen);color:var(--lumen-ink);border-color:transparent;font-weight:700}
.btn.primary:hover:not(:disabled){background:#ffe08f}
.btn.small{padding:4px 9px;font-size:13px}
#panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(78px + env(safe-area-inset-top,0px));width:300px;max-height:calc(100% - 100px);overflow:auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:12px}
#panel h3{font-family:var(--font-display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
#panel .sec{display:flex;flex-direction:column;gap:6px}
#panel .sec + .sec{border-top:1px solid var(--glass-line);padding-top:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok)}
.act{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;width:100%}
.act .c{color:var(--lumen);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.score td{padding:3px 0}
table.score td:last-child{text-align:right}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--glass);border:1px solid var(--glass-line);padding:7px 14px;border-radius:999px;animation:tin .25s ease-out;max-width:min(90vw,520px);text-align:center}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#logbox{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));max-height:40%;overflow:auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:10px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
#logbox div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.overlay{position:fixed;inset:0;background:rgba(8,9,28,.72);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
.sheet{background:#1d1f4c;border:1px solid var(--glass-line);border-radius:18px;padding:20px;width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
.sheet p{margin:0;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--glass-line);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.card.sel{border-color:var(--lumen);background:rgba(255,211,107,.10)}
.card b{font-family:var(--font-display);font-weight:600;font-size:16px}
.card .d{font-size:13px;color:var(--muted)}
.tier{display:flex;flex-direction:column;gap:8px}
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.branch{display:flex;flex-direction:column}
.branch .link{width:2px;height:10px;margin-left:37px;background:var(--glass-line)}
.branch .link.on{background:var(--lumen)}
.tnode{flex-direction:row;align-items:flex-start;gap:10px}
.tnode img{width:52px;height:52px;flex:none}
.tnode > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tnode.locked img{filter:grayscale(.8);opacity:.55}
.tnode .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
#start .sheet{width:min(880px,100%)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(38px,8vw,64px);line-height:1;margin:0;letter-spacing:.01em;background:linear-gradient(90deg,#ffd36b,#f59fd0 45%,#8fd7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--glass-line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px}
.seg button.on{background:var(--lumen);color:var(--lumen-ink);border-color:transparent;font-weight:700}
input[type=number]{background:rgba(255,255,255,.06);border:1px solid var(--glass-line);color:var(--ink);border-radius:10px;padding:6px 10px;width:120px;font:inherit}
details summary{cursor:pointer;color:var(--muted)}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted);max-width:70ch}
@media (max-width:720px){
  #top{gap:6px;padding:6px 8px}
  .brand{display:none}
  #sSeason small,#sScore small{display:none}
  .long{display:none}
  #top{gap:5px}
  #top .btn{padding:5px 7px;font-size:12.5px}
  #top .stat{padding:3px 7px;font-size:13px}
  .spacer{display:none}
  .btn{padding:5px 8px;font-size:13px}
  #panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:38%}
  #logbox{bottom:auto;top:calc(130px + env(safe-area-inset-top,0px));max-height:30%}
  #toasts{bottom:auto;top:calc(104px + env(safe-area-inset-top,0px))}
}
#panel.collapsed{width:auto;padding:6px;left:auto}
#panel.collapsed .mini{border:none;background:transparent;gap:14px}
.item{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
.item img{width:52px;height:52px;flex:none}
.item > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.item b{font-family:var(--font-display);font-weight:600;font-size:15px}
.item .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.item .d{font-size:12.5px;color:var(--muted)}
.portrait{width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.06);flex:none}
.pt{width:30px;height:30px;flex:none;margin:-4px 0}
.tl{display:flex;align-items:center;gap:8px}
.chars{display:flex;gap:2px;margin:-4px 0 2px;flex:none}
.chars img{width:52px;height:52px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* ===== Telas reorganizadas: início, HUD (placar no topo + losangos embaixo), árvore radial ===== */
#top{display:none}
#board,.tboard{align-self:center;display:flex;align-items:stretch;gap:0;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:6px 6px;backdrop-filter:blur(8px);max-width:100%}
.kpi{display:flex;flex-direction:column;align-items:center;padding:2px 16px;min-width:0;position:relative}
.kpi + .kpi::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;margin-top:-4px;transform:rotate(45deg);background:var(--glass-line)}
.kpi span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kpi b{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b small{font-size:13px;color:var(--muted);font-weight:500}
.kpi.gold b{color:var(--lumen)}
#sSeason{align-self:center;margin-top:-4px;background:var(--glass);border:1px solid var(--glass-line);font-size:13px}
#sSeason small{margin-left:4px}
#dock{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:clamp(6px,3vw,22px);pointer-events:none}
.dk{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:9px;background:none;border:0;padding:6px 2px 0;width:76px;position:relative}
.dk .gem{width:50px;height:50px;transform:rotate(45deg);border-radius:13px;background:#24275e;border:2px solid rgba(214,216,255,.55);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.dk .gem svg{transform:rotate(-45deg);width:28px;height:28px}
.dk .dl{font-family:var(--font-display);font-weight:600;font-size:13.5px;line-height:1.1;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.dk:hover:not(:disabled) .gem{transform:rotate(45deg) scale(1.07);background:#2f3378}
.dk:disabled{opacity:.45;cursor:not-allowed}
.dk.primary .gem{background:var(--lumen);border-color:#fff3c8;color:var(--lumen-ink)}
.dk.primary:hover:not(:disabled) .gem{background:#ffe08f}
.dk .badge{position:absolute;top:-2px;right:8px;background:var(--ok);color:#10301a;font-weight:700;font-size:11.5px;border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums}
.dk.busy .gem{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(405deg)}}
#bUndo{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:64px;padding:4px 0 0;z-index:2}
#bUndo .gem{width:42px;height:42px;border-radius:11px;background:#2f3378;border-color:#ffd36b}
#bUndo .gem svg{width:24px;height:24px}
#bUndo .dl{font-size:12px}
#panel{top:calc(84px + env(safe-area-inset-top,0px));max-height:calc(100% - 230px)}
#toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
@media (max-width:720px){
  .kpi{padding:2px 10px}.kpi b{font-size:20px}.kpi span{font-size:10px}
  .dk{width:64px}.dk .gem{width:44px;height:44px;border-radius:11px}.dk .dl{font-size:12px}
  #panel{top:auto;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-height:40%}
  #toasts{top:calc(132px + env(safe-area-inset-top,0px));bottom:auto}
  #logbox{top:calc(96px + env(safe-area-inset-top,0px))}
}
/* telas cheias (início, nova partida, tecnologia) */
.screen{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
#home{background:linear-gradient(180deg,rgba(12,13,38,.15) 0%,rgba(31,24,84,.55) 55%,rgba(16,58,82,.85) 100%);justify-content:space-between;overflow:hidden}
#home .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3cf;opacity:.6;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:clamp(20px,9vh,96px);position:relative}
.logo svg{width:clamp(96px,22vw,132px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.4));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.logo h1{font-family:var(--font-display);font-weight:700;font-size:clamp(46px,12vw,78px);letter-spacing:.08em;line-height:1;margin:6px 0 0;background:linear-gradient(90deg,#ffd36b,#f59fd0 45%,#8fd7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:0;color:var(--muted);font-size:15px;letter-spacing:.04em;text-align:center}
.menu{display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(300px,100%);position:relative;z-index:1}
.tile-btn{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:.03em;padding:13px 22px;border:0;background:rgba(36,39,94,.92);color:var(--ink);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);transition:transform .12s,background .12s;display:flex;flex-direction:column;align-items:center}
.tile-btn small{font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0}
.tile-btn:hover{transform:scale(1.03);background:rgba(52,56,128,.95)}
.tile-btn.primary{background:var(--lumen);color:var(--lumen-ink)}
.tile-btn.primary:hover{background:#ffe08f}
.tile-btn.primary small{color:#6b5310}
.isle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:36vh;width:auto;max-width:none;pointer-events:none;opacity:.95}
.isle .fl{animation:bob 6s ease-in-out infinite}
.isle .fl:nth-child(2n){animation-duration:7.5s;animation-delay:-2s}
.isle .fl:nth-child(3n){animation-duration:5.2s;animation-delay:-4s}
#home #homeDock{position:relative;bottom:auto;padding-bottom:4px}
#home .dk .dl{font-size:13px}
#setup{background:rgba(8,9,28,.82)}
#setup .sheet{margin:auto 0}
.backbtn{width:44px;height:44px;transform:rotate(45deg);border-radius:11px;background:#24275e;border:2px solid rgba(214,216,255,.55);display:grid;place-items:center;flex:none}
.backbtn svg{transform:rotate(-45deg);width:22px;height:22px}
#techv{background:radial-gradient(circle at 50% 46%,#24275e 0,#0c0d26 70%);z-index:18;gap:8px;padding-inline:0}
#techv .tbar{display:flex;align-items:center;gap:12px;width:100%;max-width:900px;padding-inline:max(16px,env(safe-area-inset-left,0px));}
#techv .tbar .tboard{margin-inline:auto;background:transparent;border-color:transparent}
#techv .tbar .ghost{width:44px;flex:none}
.twrap{flex:1;width:100%;overflow:auto;display:flex;min-height:0;scrollbar-width:none}
.twrap::-webkit-scrollbar{display:none}
.twrap svg{margin:auto;height:100%;width:auto;aspect-ratio:1/1;min-height:420px;max-width:none;display:block;flex:none}
@media (max-width:720px){.twrap svg{height:auto;width:640px;min-height:0}}
.tn{cursor:pointer}
.tn:focus{outline:none}
.tn:focus-visible .hx{stroke:#fff;stroke-width:4}
.tn text{font-family:var(--font-display);font-weight:600;font-size:15px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:#0c0d26;stroke-width:4px;stroke-linejoin:round}
.tn.locked text{fill:#7d80b0}
.tn .cost{font-family:var(--font-body);font-weight:700;font-size:13px;fill:var(--lumen-ink);stroke:none}
.tn.sel .hx{stroke:#fff;stroke-width:4}
.tinfo{width:min(560px,calc(100% - 32px));background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;backdrop-filter:blur(8px)}
.tinfo img{width:56px;height:56px;flex:none}
.tinfo > div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.tinfo b{font-family:var(--font-display);font-weight:600;font-size:17px}
.tfoot{color:var(--muted);font-size:13px;text-align:center;max-width:56ch;padding-inline:16px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist .btn{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:15px;text-align:left}
.mlist .btn span.muted{font-size:13px}

/* ===== Painel de seleção compacto (faixa + ações + detalhes recolhíveis) ===== */
#panel{gap:8px;padding:10px 12px}
.strip{display:flex;align-items:center;gap:10px;min-width:0}
.sic{width:46px;height:46px;flex:none;border-radius:12px;background:rgba(255,255,255,.06);object-fit:contain}
span.sic{width:30px;height:30px;margin:8px;border-radius:7px;transform:rotate(45deg)}
.sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.stitle{display:flex;align-items:center;gap:8px;min-width:0}
.stitle b{font-family:var(--font-display);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctag{flex:none;font-size:11.5px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.ctag .sw{width:8px;height:8px;margin-right:4px}
.sline{color:var(--muted);font-size:13px;line-height:1.3}
.ptog{flex:none;width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:14px}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px 2px}
.acts::-webkit-scrollbar{display:none}
.pa{display:flex;align-items:center;gap:6px;flex:none;padding:5px 10px 5px 6px;font-size:13px}
.pa .pt{width:26px;height:26px;margin:-3px 0}
.pa .c{color:var(--lumen);font-weight:700;font-variant-numeric:tabular-nums}
.pa:disabled .c{color:var(--muted)}
.pa:not(:disabled){border-color:var(--lumen);background:rgba(255,211,107,.16);color:#fff;animation:pulse 1.8s ease-in-out infinite}
.pa:not(:disabled):hover{background:rgba(255,211,107,.28)}
.pa:disabled{opacity:.45}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,211,107,.0)}50%{box-shadow:0 0 0 4px rgba(255,211,107,.28),0 0 14px rgba(255,211,107,.35)}}
@media (prefers-reduced-motion:reduce){.pa:not(:disabled){animation:none}}
@media (max-width:720px){
  #panel{max-height:46%;bottom:calc(108px + env(safe-area-inset-bottom,0px))}
  .sic{width:40px;height:40px}
  .stitle b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.logo svg,.isle .fl,#home .stars i,.dk.busy .gem{animation:none}}

#danger{align-self:center;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,200,90,.6);background:rgba(70,48,10,.92);color:#ffe6ae;border-radius:999px;padding:5px 12px 5px 6px;font-size:13px;max-width:100%;text-align:left}
#danger.hi{border-color:#ff8a7a;background:rgba(92,20,22,.94);color:#ffe1dc;animation:dz 1.2s ease-in-out infinite}
#danger .dz{flex:none;width:22px;height:22px;border-radius:50%;background:#ffc85a;color:#3a2a00;font-weight:700;display:grid;place-items:center;font-family:var(--font-display)}
#danger.hi .dz{background:#ff6e5a;color:#fff}
@keyframes dz{50%{box-shadow:0 0 0 5px rgba(255,110,90,.25)}}
#coach{align-self:center;width:min(430px,100%);background:#fff6dc;color:#33270a;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 26px rgba(0,0,0,.45);border:2px solid var(--lumen);animation:tin .3s ease-out}
#coach .cq{display:flex;gap:10px;align-items:flex-start}
#coach .cn{flex:none;font-family:var(--font-display);font-weight:600;font-size:12.5px;background:var(--lumen);color:var(--lumen-ink);border-radius:999px;padding:2px 9px;margin-top:1px}
#coach p{margin:0;font-size:14.5px;line-height:1.35}
#coach .cb{display:flex;justify-content:flex-end;gap:8px}
#coach .btn{border-color:rgba(60,45,10,.3);background:rgba(60,45,10,.08);color:#33270a}
#coach .btn.primary{background:#33270a;color:#fff6dc}
.dk.coachhl .gem{animation:chl 1.1s ease-in-out infinite}
@keyframes chl{50%{box-shadow:0 0 0 7px rgba(255,211,107,.45),0 0 22px rgba(255,211,107,.8)}}
#banner{position:fixed;left:0;right:0;top:34%;z-index:17;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 16px;text-align:center;background:linear-gradient(90deg,rgba(12,13,38,0),rgba(12,13,38,.88) 22%,rgba(12,13,38,.88) 78%,rgba(12,13,38,0))}
#banner b{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,7.5vw,40px);line-height:1.05;letter-spacing:.02em;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#banner span{font-size:14.5px;color:var(--ink)}
#banner.go{animation:bn 2.1s cubic-bezier(.2,.9,.3,1) both}
@keyframes bn{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tg{flex:none;min-width:74px;text-align:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:var(--muted)}
.tg.on{background:var(--lumen);color:var(--lumen-ink)}
.mlist .btn .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.mlist .btn>span:first-child{min-width:0;white-space:normal}
#coach p{flex:1}
#coach .cq .btn{flex:none;padding:3px 9px;font-size:12.5px}
@media (max-width:720px){#toasts{position:static;transform:none;align-self:center;order:5}#coach p{font-size:14px}}
.lorec{cursor:default;gap:8px}.lorec p{font-size:14px;line-height:1.45;max-width:70ch}.lorec .lrow{display:flex;gap:12px;align-items:flex-start}.lorec .lrow img{width:60px;height:60px;flex:none;border-radius:12px;background:rgba(255,255,255,.06)}.lorec .lrow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.card details p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.card.spc{background:linear-gradient(160deg,rgba(140,108,240,.16),rgba(255,255,255,.03))}
.ctag.spt{align-self:flex-start;background:rgba(140,108,240,.25);color:#e4ddff;margin-top:2px}
.newbest{display:inline-block;align-self:flex-start;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,#ffd36b,#f59fd0);color:#2a1a10;font-family:var(--font-display);font-weight:600}
.endstats{margin:0}
.endrow{flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){#danger.hi,.dk.coachhl .gem,#coach{animation:none}#banner.go{animation-timing-function:linear}}

ado.","{c} está desprotegida. Deixe uma unidade dentro dela ou derrote o inimigo ao lado.","Este é o seu <b>Batedor</b>. Toque nele para ver até onde ele anda.","Os <b>pontos brancos</b> mostram o alcance. Toque num deles para andar e revelar o mapa.","Toque na <b>casa destacada</b> do seu território e use a ação dourada que aparece embaixo. Colher faz a cidade crescer.","Agora toque na sua <b>capital</b> (a cidade com o losango dourado) e treine uma unidade. Cidade vazia pode ser tomada.","Abra <b>Tecnologia</b> para ver o que o seu clã pode aprender. Cada pesquisa libera unidades ou construções.","Quando não houver mais o que fazer, toque em <b>Encerrar turno</b>. Os outros clãs jogam e você recebe Lumens (✦).","Hora de crescer: leve uma unidade até a <b>aldeia neutra</b> destacada e encerre o turno em cima dela para ocupá-la.","Hora de crescer: explore com o Batedor até achar uma <b>aldeia neutra</b> (telhados cinza) e encerre o turno em cima dela.","Você já sabe o essencial. Vence quem tiver mais pontos no turno {n}, ou quem conquistar todos os rivais. As dicas completas ficam no Menu.","Veterano!","{u} ganhou +5 de vida","Aldeia ocupada!","Cidade conquistada!","{city} agora é do clã {c}","Cidade perdida","{c} tomou {city}","Clã eliminado","{c} saiu do mosaico","Grande Obra concluída · +300 pontos","Monumento erguido","{m} · +250 pontos","Último turno","Faça valer cada ação","Faltam 5 turnos para o fim da partida.","{c} está sem defesa","Há um inimigo que alcança a cidade no próximo turno, e ela é a sua <b>última cidade</b>: se cair, a partida acaba. Deixe uma unidade dentro dela ou treine uma agora.","Há um inimigo que alcança a cidade no próximo turno. Deixe uma unidade dentro dela ou treine uma agora.","Encerrar mesmo assim","Defender a cidade","Guia encerrado. As dicas ficam no Menu.","Brasa","vulcões e cinza","Pontes viram terra firme (a lava solidifica) e Aríetes custam 5 ✦.","Quando o mundo se partiu, o vulcão Ígnea continuou aceso num único ladrilho. Os Brasa nasceram ao redor dele e juraram nunca deixar a primeira chama apagar. Para eles, só o fogo solda de volta o que foi quebrado.","Forja-Vulcão","Maré","recifes","Porto: unidades na água têm +1 de movimento e pescar custa 1 ✦.","O arquipélago dos Maré afundou na Grande Quebra e o povo inteiro passou uma geração em jangadas. Aprenderam a ler as correntes seguindo os peixes-lanterna. Hoje procuram, ladrilho por ladrilho, o recife onde tudo começou.","Farol de Coral","Raiz","floresta densa","Unidades na floresta têm +1 de defesa.","Os Raiz descendem dos jardineiros da Árvore-Mãe, cujas raízes seguraram os últimos pedaços de chão durante a Quebra. Cada cidade deles nasce de uma semente dela. Unir o mosaico é, para os Raiz, replantar a floresta original.","Casa-Árvore","Geada","tundra","Atravessa água rasa sem barco (gelo).","Expulsos das terras quentes, os Geada atravessaram a pé um mar congelado e sobreviveram onde ninguém mais quis morar. Domaram os ursos brancos e fizeram do inverno um aliado. Agora descem da tundra para cobrar o lugar que lhes foi negado.","Iglu de Cristal","Duna","deserto","Oásis: o mercado custa 3 ✦ e as Caravanas trazem Lumens.","Onde caíram estilhaços de Lumen no deserto, brotaram oásis. Os Duna foram os primeiros a encontrá-los e ergueram bazares em volta de cada um. Suas caravanas ligam os ladrilhos pelo comércio antes de qualquer exército chegar.","Palácio do Oásis","Vento","planaltos","Cavaleiros têm +1 de movimento e custam 3 ✦.","Nômades dos planaltos, os Vento nunca construíram muralhas: a casa deles é a sela. Dizem que ouviram a Quebra chegar no assobio do vento e por isso sobreviveram. Cavalgam atrás da voz que promete um mundo inteiro outra vez.","Moinho dos Ventos","Fera","savanas e matas","Matilha: caçar custa só 1 ✦.","Crianças perdidas na Quebra foram acolhidas por uma matilha de lobos-do-musgo. Cresceram caçando juntas e voltaram como um clã que divide tudo o que abate. Para os Fera, o mosaico é um território de caça que precisa de uma só matilha.","Toca do Totem","Lume","cânions de cristal","Pontes de Lumen custam 1 ✦ e duram o dobro.","Monges dos cânions de cristal, os Lume descobriram como solidificar a luz e fizeram as primeiras Pontes de Lumen. Guardam o segredo em mosteiros dourados. Acreditam que o mundo se reúne com pontes, não com espadas, mas levam espadas mesmo assim.","Obelisco de Lumen","Autômatos","cidadelas de metal","Blindagem: todas as unidades nascem com +3 de vida.","Exército de robôs humanoides","No ano de 2053, os Autômatos travam a Guerra do Futuro contra os Astros e estão perdendo. A Unidade Zero calculou a única saída: voltar no tempo e conquistar o passado antes que o inimigo chegue. Um exército de robôs humanoides atravessou o portal e ergueu o seu primeiro data center na era do mosaico.","Data Center","Astros","cratera de pouso","Visão orbital: unidades enxergam +1 casa à frente.","Extraterrestres","Os Astros vieram das estrelas para dominar o mundo em 2053 e encontraram uma resistência de metal. Quando interceptaram o plano dos Autômatos, lançaram uma nave pelo mesmo portal do tempo. Pousaram no passado com uma missão: caçar os robôs e tomar o mundo antes que a guerra comece.","Nave Pousada","Espectros","brumas eternas","Névoa: atravessam montanhas sem Escalada e têm +1 de defesa nelas.","Povo das sombras","Os Espectros são as sombras de quem desapareceu na Grande Quebra, presas entre um ladrilho e outro. Vivem nas brumas e atravessam montanhas como se fossem neblina. Se o mosaico for unido, acreditam que voltarão a ter corpo.","Mausoléu das Brumas","Colossos","ruínas celestes","Pele de pedra: cada golpe sofrido causa 1 de dano a menos.","Anjos caídos de pedra","Os Colossos eram anjos. Quando o mundo se partiu, caíram do céu junto com os estilhaços e, ao tocar o chão, as asas e a pele viraram pedra. Gigantes lentos e quase indestrutíveis, querem religar o mosaico para erguer a escada de volta para casa.","Trono Caído","Coleta","Colher frutas no campo (+1 pop). e cada cidade ganha +1 de população.","Escada do Céu","Todas as suas unidades ganham +1 de defesa.","Batedor","Lanceiro","Fundeiro","Cavaleiro","Aríete","Guardião","Piromante","Lança fogo a 2 casas com ataque 3.","Arpoador","Ataque 3 e defesa 2: o lanceiro dos recifes.","Druida","No começo do turno, cura 3 de vida dos aliados vizinhos.","Cavaleiro de Urso","Montaria pesada: 16 de vida e ataque 3.","Caravana","Anda 2 casas e rende +1 ✦ por turno enquanto viver (contam até 2 caravanas).","Falcoeiro","O falcão ataca a 3 casas de distância.","Lobo de Matilha","Barato e veloz: anda 2 casas, ataca e recua.","Sentinela de Cristal","Escudo de cristal: defesa 4.","Mecha","Robô gigante com 20 de vida e ataque 4. Exige cidade nível 3.","Disco Voador","Voa sobre água, floresta e montanha, 2 casas por turno.","Assombração","Ataca sem sofrer contra-ataque.","Serafim de Pedra","Asas de pedra: cruza floresta e montanha sem parar.","Campo","Floresta","Montanha","Água rasa","Oceano","Frutas","Peixes","Minério","Oficina","+1 ✦ por turno nesta cidade","Explorador","Uma expedição revela o mapa ao redor e um Batedor fica pronto para agir","Defesa ×3 para quem guarda a cidade","Tesouro","+5 ✦ agora","Fronteira","O território cresce para raio 2","Festival","+3 de população","Super-unidade grátis","Jardim de Lumen","+150 pontos","Rota de comércio","+2 ✦ por turno nesta cidade","Farol do Mosaico","Explorar 60% do mapa","Metrópole","Ter uma cidade nível 5","Império","Ter 5 cidades","Arena dos Veteranos","Vencer 10 combates","Fácil","Difícil","Primavera","chuvas e rios cheios","calor e sol forte","Outono","ventanias nos planaltos","gelo e neve","Bagas-de-luz","Recurso · frutas","Arbusto de bagas que brilham ao entardecer. Colha com Coleta.","Cervo-musgo","Recurso · caça","Cervo manso com galhos de musgo. Cace com a tecnologia Caça.","Peixe-lanterna","Recurso · peixes","Peixe que acende uma luz na água rasa. Pesque com Navegação.","Cristal-vivo","Recurso · minério","Cristais que crescem dentro da rocha. Construa uma Mina com Mineração.","Fazenda","Construção · +2 pop","Canteiros de trigo dourado. Exige Lavoura.","Mina de cristal","Galeria com trilhos e carrinho de cristais. Exige Mineração.","Mercado","Construção · +1 ✦/turno","Barraca de trocas da cidade. Um por cidade. Exige Comércio.","Serraria","Toras empilhadas e uma serra movida a Lumen. Exige Silvicultura.","Ruínas antigas","Exploração","Arco de um mundo anterior ao mosaico. A primeira unidade a chegar ganha um prêmio.","Santuário de Lumen","Construção · +2 pop · +60 pts","Altar de pedra com um cristal de Lumen. Pode ser erguido em campo ou floresta livres; cada novo santuário custa 4 ✦ a mais.","Travessia","Luz solidificada sobre a água rasa. Qualquer clã pode atravessar enquanto ela durar.","Bem-vindo ao Mosaica","Seu clã começa com uma capital e um Batedor. Toque no Batedor para ver aonde ele anda (pontos brancos). Leve unidades até as aldeias neutras e encerre o turno em cima delas para ocupá-las.","Lumens e cidades","Os Lumens (✦) chegam a cada turno. Toque nas casas do seu território para colher recursos: a cidade ganha população, sobe de nível e cada nível dá um prêmio.","Tecnologia","Em Tecnologia você libera unidades e construções. No nível 2, a Engenharia libera a Grande Obra do seu clã, que vale 300 pontos.","Combate","Círculos vermelhos mostram quem você pode atacar, com a prévia do dano. Se moveu errado, use Desfazer antes de atacar (não vale depois de abrir ruínas).","Como vencer","A partida dura 30 turnos. Vence quem tiver mais pontos, ou quem conquistar todos os rivais. Cidades conquistadas ficam instáveis por 3 turnos, e cada cidade acima de 5 custa 1 ✦ por turno.","Tabuleiro do jogo","Placar","Pontos","Lumens","Turno","Desfazer o último movimento (atalho: Z)","Desfazer","Ações","Atalho: espaço","Atalho: Enter","Renda por turno: cidade nível 1 rende 2 ✦, +1 por nível, e a capital rende +1.","Combate sem dados: dano = fatia de ataque × Ataque × 4. Se o defensor sobrevive e alcança o atacante, ele contra-ataca.","Floresta, montanha e cidades dão defesa ×1,5. Muralha dá ×3.","Tecnologia custa 4 + nível × número de cidades. Crescer rápido encarece a pesquisa.","Estações: a cada 8 turnos alterna verão (colheitas +1 pop) e inverno (água rasa congela e vira caminho).","Modo Estações (opcional): primavera, verão, outono e inverno se alternam a cada {n} turnos, e cada estação dá +{b} de ataque aos clãs dela.","Pontes de Lumen ligam ilhas por 3 ✦. Pactos dão trégua de 5 turnos; romper custa 150 pontos.","Cidade conquistada fica instável por 3 turnos (sem renda e sem treinar). Cada cidade acima de 5 custa 1 ✦ por turno.","Cada clã tem uma unidade exclusiva (marcada com ★ ao treinar), uma capital própria e uma história.","Pontos: níveis das cidades, território, tecnologias, unidades, exploração e monumentos.","Entendi","derrota","vitória",", ","pop"],"en":["Language","Game created (seed {s}). You lead the {c} clan.","Seasons Mode: it begins in {s}, which empowers {f}.","the {t} technology","a Scout who joined the clan","a map of the region","{c} explored ruins and found {m}.","Ruins: you found {m}!","ruins!","{a} ({ac}) attacked {d} ({dc}): {n} damage",", defeated","; {u} became a veteran",", counterattack of {n}",", attacker fell","{c} researched {t}.","Architecture: buildings improved and bridges made permanent.","Cartography: the whole map has been revealed.","{c} raised the Great Work {g} in {city}.","Great Work: {g} (+300 points).","{c} raised the Great Work {g}.","{c} built a Plaza in {city}.","{c} expanded the territory of {city}.","territory +","{c} walled {city}.","Pick glowberries","Hunt moss deer","Catch lanternfish","Build crystal mine","Build sawmill","Raise Lumen shrine","Build farm","Build market","{c} hardened lava and created new land.","{c} raised a Lumen Bridge.","{city} ({c}) reached level {n}.","An explorer from {c} left {city} and revealed {n} tiles.","The explorer revealed {n} map tiles and a Scout is ready to act.","The explorer r t season's clans get +{b} attack on all units. Winter freezes shallow water, and harvests yield +1 pop only in summer.","(your clan)","Advanced options","Map seed","The same number always generates the same map. Leave it as is for a random map.","{c} in danger","it's your last city","could fall next turn","Enemies near {c}","{c} is unprotected and it's your last city. Keep a unit inside it or defeat the enemy next to it.","{c} is unprotected. Keep a unit inside it or defeat the enemy next to it.","This is your <b>Scout</b>. Tap it to see how far it can move.","The <b>white dots</b> show its range. Tap one to move and reveal the map.","Tap the <b>highlighted tile</b> in your territory and use the golden action that appears below. Harvesting makes the city grow.","Now tap your <b>capital</b> (the city with the golden diamond) and train a unit. An empty city can be taken.","Open <b>Technology</b> to see what your clan can learn. Each research unlocks units or buildings.","When there's nothing left to do, tap <b>End turn</b>. The other clans play and you receive Lumens (✦).","Time to grow: bring a unit to the highlighted <b>neutral village</b> and end the turn on it to occupy it.","Time to grow: explore with the Scout until you find a <b>neutral village</b> (gray roofs) and end the turn on it.","You know the essentials. Whoever has the most points on turn {n} wins, or whoever conquers all rivals. The full tips are in the Menu.","Veteran!","{u} gained +5 health","Village occupied!","City conquered!","{city} now belongs to the {c} clan","City lost","{c} took {city}","Clan eliminated","{c} left the mosaic","Great Work completed · +300 points","Monument raised","{m} · +250 points","Last turn","Make every action count","5 turns left until the end of the game.","{c} is undefended","An enemy can reach the city next turn, and it is your <b>last city</b>: if it falls, the game is over. Keep a unit inside it or train one now.","An enemy can reach the city next turn. Keep a unit inside it or train one now.","End anyway","Defend the city","Guide closed. The tips are in the Menu.","Ember","volcanoes and ash","Bridges become solid ground (the lava hardens) and Rams cost 5 ✦.","When the world shattered, the volcano Ignea kept burning on a single tile. The Ember were born around it and swore never to let the first flame go out. To them, only fire can weld back what was broken.","Volcano Forge","Tide","reefs","Harbor: units on water get +1 movement and fishing costs 1 ✦.","The Tide archipelago sank in the Great Shattering, and the whole people spent a generation on rafts. They learned to read the currents by following the lanternfish. Today they search, tile by tile, for the reef where it all began.","Coral Lighthouse","Root","dense forest","Units in forest get +1 defense.","The Root descend from the gardeners of the Mother Tree, whose roots held the last pieces of ground together during the Shattering. Each of their cities grows from one of its seeds. For the Root, uniting the mosaic means replanting the original forest.","Tree House","Frost","tundra","Crosses shallow water without boats (ice).","Driven out of the warm lands, the Frost crossed a frozen sea on foot and survived where no one else wanted to live. They tamed the white bears and made winter an ally. Now they come down from the tundra to claim the place they were denied.","Crystal Igloo","Dune","desert","Oasis: the market costs 3 ✦ and Caravans bring Lumens.","Where shards of Lumen fell in the desert, oases sprang up. The Dune were the first to find them and built bazaars around each one. Their caravans link the tiles through trade before any army arrives.","Oasis Palace","Wind","highlands","Riders get +1 movement and cost 3 ✦.","Nomads of the highlands, the Wind never built walls: their home is the saddle. They say they heard the Shattering coming in the whistle of the wind, and that is why they survived. They ride after the voice that promises a whole world once more.","Windmill","Beast","savannas and woods","Pack: hunting costs only 1 ✦.","Children lost in the Shattering were taken in by a pack of moss wolves. They grew up hunting together and returned as a clan that shares everything it brings down. For the Beast, the mosaic is a hunting ground that needs a single pack.","Totem Den","Glow","crystal canyons","Lumen Bridges cost 1 ✦ and last twice as long.","Monks of the crystal canyons, the Glow discovered how to solidify light and made the first Lumen Bridges. They guard the secret in golden monasteries. They believe the world is reunited with bridges, not swords, but they carry swords anyway.","Lumen Obelisk","Automatons","metal citadels","Armor plating: all units are built with +3 health.","Army of humanoid robots","In the year 2053, the Automatons are fighting the War of the Future against the Astrals, and they are losing. Unit Zero calculated the only way out: travel back in time and conquer the past before the enemy arrives. An army of humanoid robots crossed the portal and built its first data center in the age of the mosaic.","Data Center","Astrals","landing crater","Orbital sight: units see +1 tile ahead.","Extraterrestrials","The Astrals came from the stars to conquer the world in 2053 and met a resistance made of metal. When they intercepted the Automatons' plan, they launched a ship through the same time portal. They landed in the past with one mission: hunt down the robots and take the world before the war begins.","Landed Ship","Specters","eternal mists","Mist: they cross mountains without Climbing and get +1 defense on them.","People of the shadows","The Specters are the shadows of those who vanished in the Great Shattering, trapped between one tile and another. They live in the mists and cross mountains as if they were fog. If the mosaic is united, they believe they will have bodies again.","Mausoleum of Mists","Colossi","celestial ruins","Stone skin: every hit taken deals 1 less damage.","Fallen angels of stone","The Colossi were angels. When the world shattered, they fell from the sky along with the shards, and when they touched the ground their wings and skin turned to stone. Slow and nearly indestructible giants, they want to rejoin the mosaic to raise the stairway back home.","Fallen Throne","Gathering","Harvest fruit in fields (+1 pop).","Hunting","Hunt animals in the forest (+1 pop).","Sailing","Enter shallow water and fish (+1 pop).","Climbing","Climb mountains (defense ×1.5).","Smithing","Train Spearman (defense 3).","Riding","Train Rider (move 2, attacks and retreats).","Trade","Build Market (+1 ✦ per turn).","Lumencraft","Raise Lumen Bridges over shallow water (they last 8 turns).","Farming","Build Farm in fields (+2 pop).","Archery","Train Slinger (range 2).","Open Sea","Sail the ocean.","Mining","Build Mine on ore (+2 pop).","Siege","Train Ram (attack 4).","Diplomacy","Propose truce pacts.","Pathfinding","Expand any city's territory to radius 2 (6 ✦), without waiting for level 4.","Engineering","Raise your clan's Great Work in the capital (30 ✦, one per game).","Urban Planning","Build a Plaza in each city (8 ✦: +3 pop, +40 points).","Cartography","Reveals the whole map instantly.","Tactics","All your units get +1 attack.","Fortification","Buy a Wall in any city (6 ✦).","Forestry","Build a Sawmill in the forest (+2 pop) and hunting yields +1 extra pop.","Architecture","Farms, mines and sawmills give +1 pop (including those already built), each market yields +1 ✦ and bridges become permanent.","Alliance","Truces last 10 turns and the tribute is halved.","Eternal Forge","Great Lighthouse","Each waterside city yields +1 ✦ per turn.","Mother Tree","All your cities gain +2 population now.","Ice Palace","Your cities of level 3 or higher get a Wall now.","Grand Bazaar","Each city yields +1 ✦ per turn.","Tower of Winds","Reveals the whole map and all your cities gain +1 population.","Pack Totem","All your units heal and gain +5 max health.","Solar Prism","The capital now yields +3 ✦ per turn.","Assembly Line","Each city you have now yields +1 ✦ per turn.","Mothership","Reveals the whole map and brings +10 ✦ now.","Eternal Veil","Your units fully heal and each city gains +1 population.","Stairway to Heaven","All your units get +1 defense.","Scout","Spearman","Slinger","Rider","Ram","Guardian","Pyromancer","Hurls fire 2 tiles away with attack 3.","Harpooner","Attack 3 and defense 2: the spearman of the reefs.","Druid","At the start of the turn, heals 3 health of adjacent allies.","Bear Rider","Heavy mount: 16 health and attack 3.","Caravan","Moves 2 tiles and yields +1 ✦ per turn while alive (up to 2 caravans count).","Falconer","The falcon attacks from 3 tiles away.","Pack Wolf","Cheap and fast: moves 2 tiles, attacks and retreats.","Crystal Sentinel","Crystal shield: defense 4.","Mecha","Giant robot with 20 health and attack 4. Requires a level 3 city.","Flying Saucer","Flies over water, forest and mountains, 2 tiles per turn.","Haunt","Attacks without taking a counterattack.","Stone Seraph","Stone wings: crosses forest and mountains without stopping.","Field","Forest","Mountain","Shallow water","Ocean","Fruit","Fish","Ore","Workshop","+1 ✦ per turn in this city","Explorer","An expedition reveals the surrounding map and a Scout is ready to act","Defense ×3 for whoever guards the city","Treasure","+5 ✦ now","Frontier","Territory grows to radius 2","Festival","+3 population","Free super unit","Lumen Garden","+150 points","Trade route","+2 ✦ per turn in this city","Mosaic Lighthouse","Explore 60% of the map","Metropolis","Have a level 5 city","Empire","Have 5 cities","Veterans' Arena","Win 10 battles","Easy","Hard","Spring","rains and full rivers","heat and strong sun","Autumn","gales on the highlands","ice and snow","Glowberries","Resource · fruit","A bush of berries that glow at dusk. Pick them with Gathering.","Moss deer","Resource · game","A gentle deer with antlers of moss. Hunt it with the Hunting technology.","Lanternfish","Resource · fish","A fish that lights up in shallow water. Catch it with Sailing.","Living crystal","Resource · ore","Crystals that grow inside the rock. Build a Mine with Mining.","Farm","Building · +2 pop","Beds of golden wheat. Requires Farming.","Crystal mine","A gallery with rails and a cart of crystals. Requires Mining.","Market","Building · +1 ✦/turn","The city's trading stall. One per city. Requires Trade.","Sawmill","Stacked logs and a Lumen-powered saw. Requires Forestry.","Ancient ruins","Exploration","An arch from a world older than the mosaic. The first unit to arrive wins a reward.","Lumen Shrine","Building · +2 pop · +60 pts","A stone altar with a Lumen crystal. It can be raised on free fields or forest; each new shrine costs 4 ✦ more.","Crossing","Solidified light over shallow water. Any clan can cross while it lasts.","Welcome to Mosaica","Your clan starts with a capital and a Scout. Tap the Scout to see where it can move (white dots). Bring units to neutral villages and end the turn on them to occupy them.","Lumens and cities","Lumens (✦) arrive every turn. Tap the tiles in your territory to harvest resources: the city gains population, levels up, and each level gives a reward.","Technology","In Technology you unlock units and buildings. At tier 2, Engineering unlocks your clan's Great Work, worth 300 points.","Combat","Red circles show who you can attack, with a damage preview. If you moved by mistake, use Undo before attacking (it doesn't work after opening ruins).","How to win","The game lasts 30 turns. Whoever has the most points wins, or whoever conquers all rivals. Conquered cities are unstable for 3 turns, and each city above 5 costs 1 ✦ per turn.","Game board","Scoreboard","Points","Lumens","Turn","Undo the last move (shortcut: Z)","Undo","Actions","Shortcut: space","Shortcut: Enter","Income per turn: a level 1 city yields 2 ✦, +1 per level, and the capital yields +1.","Combat without dice: damage = attack share × Attack × 4. If the defender survives and can reach the attacker, it counterattacks.","Forest, mountains and cities give defense ×1.5. A Wall gives ×3.","Technology costs 4 + tier × number of cities. Growing fast makes research more expensive.","Seasons: every 8 turns, summer (harvests +1 pop) and winter (shallow water freezes into a path) alternate.","Seasons Mode (optional): spring, summer, autumn and winter alternate every {n} turns, and each season gives +{b} attack to its clans.","Lumen Bridges link islands for 3 ✦. Pacts give a 5-turn truce; breaking one costs 150 points.","A conquered city is unstable for 3 turns (no income and no training). Each city above 5 costs 1 ✦ per turn.","Each clan has an exclusive unit (marked with ★ when training), its own capital and a story.","Points: city levels, territory, technologies, units, exploration and monuments.","Got it","defeat","victory",", ","pop"],"es":["Idioma","Partida creada (semilla {s}). Lideras el clan {c}.","Modo Estaciones: primera estación, {s}, que fortalece a {f}.","la tecnología {t}","un Explorador que se unió al clan","un mapa de la región","{c} exploró unas ruinas y encontró {m}.","Ruinas: ¡encontraste {m}!","¡ruinas!","{a} ({ac}) atacó a {d} ({dc}): {n} de daño",", derrotado","; {u} se volvió veterano",", contraataque de {n}",", el atacante cayó","{c} investigó {t}.","Arquitectura: construcciones mejoradas y puentes permanentes.","Cartografía: se reveló todo el mapa.","{c} levantó la Gran Obra {g} en {city}.","Gran Obra: {g} (+300 puntos).","{c} levantó la Gran Obra {g}.","{c} levantó una Plaza en {city}.","{c} amplió el territorio de {city}.","territorio +","{c} amuralló {city}.","Recoger bayas de luz","Cazar ciervo musgo","Pescar pez linterna","Construir mina de cristal","Construir aserradero","Levantar santuario de Lumen","Construir granja","Construir mercado","{c} solidificó lava y creó tierra nueva.","{c} levantó un Puente de Lumen.","{city} ({c}) subió al nivel {n}.","Un explorador de {c} salió de {city} y reveló {n} casillas.","El explor ía para ver qué desbloquea. Brillo dorado: puedes investigarla ahora.","Volver al mapa","Árbol tecnológico en anillos","Cada tecnología cuesta 4 + nivel × número de ciudades ({n}). Crecer encarece la investigación."," La Gran Obra de tu clan se levanta desde el panel de la capital.","Tregua por {n} turnos más. Ningún bando puede atacar.","Romper pacto (−150 puntos)","Tregua de {n} turnos. Los clanes que van detrás de ti en el marcador casi siempre la rechazan. El tributo sube con cada propuesta.","Proponer tregua · {n} ✦","Pactos","Aún no has encontrado otros clanes. Explora el mapa.","{c} propone una tregua","Durante {n} turnos, ninguno de los dos ataca al otro ni toma sus ciudades. Romperla después cuesta 150 puntos.","Aceptar","Tregua de {n} turnos con {c}.","Rechazar","Seguir en guerra.","{city} llegó al nivel {n}","Elige un premio para la ciudad.","Menú","Registro de eventos","últimos 60","treguas con rivales","requiere {t}","Ver los consejos","{n} consejos","Reglas rápidas","y guía del mapa","Ajustes","sonido, vibración, velocidad e idioma","Volver al inicio","la partida queda guardada","Clanes · vas {o}","Tu clan: {c}","Historia de los {c}","{n} unidad","{n} unidades","Propón treguas a los clanes que ya encontraste.","Investiga {t} para proponer pactos.","Cómo jugar","Guía de los elementos del mapa","Récords","Estaciones","Desafío {d}","Termina una partida para registrar tu primer récord.","Borrar récords","Clan especial · {k}","Clan · {e}","Tu capital es la {cap}.","Tu capital es el {cap}.","Solo tu clan entrena {u}:","Los {n} clanes","{e} · empieza con {t}","Exclusivo: {u}.","Capital: {cap} · Gran Obra: {g}","Especial · {k}","Historia","Activado","Desactivado","Efectos de sonido","toques, combate y conquistas","Música","banda sonora suave durante el juego","Vibración","al atacar, conquistar y en los avisos","no disponible en este dispositivo","Velocidad de las animaciones","movimiento de las unidades y turno de los rivales","Rápida","Normal","Repetir la partida guiada","en la próxima partida","Borrar partida guardada","turno {n}","ninguna","{n} registrados","Consejo {a} de {b}","Saltar","Siguiente","Jugar","Une las baldosas del mundo","Nueva partida","Continuar","turno {a} de {b}","Desafío del día","Clásico","Más opciones","Clanes","Exclusivo: {u}","La historia de los {c}","Unidad exclusiva","Cuesta {n} ✦ y requiere {t}.","Capital","Gran Obra: {g}.","El mundo se partió en baldosas flotantes. Los clanes vuelven a unir los pedazos con Lumens (✦), la energía que brota de cada ciudad. En {n} turnos, quien tenga más puntos une el mosaico.","Elige tu clan","Clanes especiales","Dificultad","Modo de juego","Empezar partida","Calendario de las Estaciones","El año tiene 4 estaciones de {n} turnos. En cada una, los clanes de la estación ganan +{b} de ataque en todas sus unidades. El invierno congela el agua poco profunda y las cosechas rinden +1 pob solo en verano.","(tu clan)","Opciones avanzadas","Semilla del mapa","El mismo número genera siempre el mismo mapa. Déjalo así para un mapa aleatorio.","{c} en peligro","es tu última ciudad","puede caer en el próximo turno","Enemigos cerca de {c}","{c} está desprotegida y es tu última ciudad. Deja una unidad dentro o derrota al enemigo de al lado.","{c} está desprotegida. Deja una unidad dentro o derrota al enemigo de al lado.","Este es tu <b>Explorador</b>. Tócalo para ver hasta dónde puede moverse.","Los <b>puntos blancos</b> muestran el alcance. Toca uno para moverte y revelar el mapa.","Toca la <b>casilla destacada</b> de tu territorio y usa la acción dorada que aparece abajo. Cosechar hace crecer la ciudad.","Ahora toca tu <b>capital</b> (la ciudad con el rombo dorado) y entrena una unidad. Una ciudad vacía puede ser tomada.","Abre <b>Tecnología</b> para ver qué puede aprender tu clan. Cada investigación desbloquea unidades o construcciones.","Cuando no quede nada por hacer, toca <b>Terminar turno</b>. Los otros clanes juegan y recibes Lumens (✦).","Hora de crecer: lleva una unidad a la <b>aldea neutral</b> destacada y termina el turno encima de ella para ocuparla.","Hora de crecer: explora con el Explorador hasta encontrar una <b>aldea neutral</b> (tejados grises) y termina el turno encima de ella.","Ya sabes lo esencial. Gana quien tenga más puntos en el turno {n}, o quien conquiste a todos los rivales. Los consejos completos están en el Menú.","¡Veterano!","{u} ganó +5 de vida","¡Aldea ocupada!","¡Ciudad conquistada!","{city} ahora es del clan {c}","Ciudad perdida","{c} tomó {city}","Clan eliminado","{c} salió del mosaico","Gran Obra terminada · +300 puntos","Monumento levantado","{m} · +250 puntos","Último turno","Que cada acción cuente","Quedan 5 turnos para el final de la partida.","{c} está sin defensa","Hay un enemigo que alcanza la ciudad en el próximo turno, y es tu <b>última ciudad</b>: si cae, la partida termina. Deja una unidad dentro o entrena una ahora.","Hay un enemigo que alcanza la ciudad en el próximo turno. Deja una unidad dentro o entrena una ahora.","Terminar de todos modos","Defender la ciudad","Guía cerrada. Los consejos están en el Menú.","Brasa","volcanes y ceniza","Los puentes se vuelven tierra firme (la lava se solidifica) y los Arietes cuestan 5 ✦.","Cuando el mundo se partió, el volcán Ígnea siguió encendido en una sola baldosa. Los Brasa nacieron a su alrededor y juraron no dejar que la primera llama se apagara nunca. Para ellos, solo el fuego vuelve a soldar lo que se rompió.","Forja Volcán","Marea","arrecifes","Puerto: las unidades en el agua tienen +1 de movimiento y pescar cuesta 1 ✦.","El archipiélago de los Marea se hundió en la Gran Ruptura y el pueblo entero pasó una generación en balsas. Aprendieron a leer las corrientes siguiendo a los peces linterna. Hoy buscan, baldosa a baldosa, el arrecife donde todo empezó.","Faro de Coral","Raíz","bosque denso","Las unidades en el bosque tienen +1 de defensa.","Los Raíz descienden de los jardineros del Árbol Madre, cuyas raíces sostuvieron los últimos pedazos de tierra durante la Ruptura. Cada una de sus ciudades nace de una semilla suya. Para los Raíz, unir el mosaico es replantar el bosque original.","Casa Árbol","Escarcha","tundra","Cruza el agua poco profunda sin barco (hielo).","Expulsados de las tierras cálidas, los Escarcha cruzaron a pie un mar congelado y sobrevivieron donde nadie más quiso vivir. Domaron a los osos blancos e hicieron del invierno un aliado. Ahora bajan de la tundra para reclamar el lugar que se les negó.","Iglú de Cristal","Duna","desierto","Oasis: el mercado cuesta 3 ✦ y las Caravanas traen Lumens.","Donde cayeron esquirlas de Lumen en el desierto, brotaron oasis. Los Duna fueron los primeros en encontrarlos y levantaron bazares alrededor de cada uno. Sus caravanas unen las baldosas con el comercio antes de que llegue cualquier ejército.","Palacio del Oasis","Viento","altiplanos","Los Jinetes tienen +1 de movimiento y cuestan 3 ✦.","Nómadas de los altiplanos, los Viento nunca construyeron murallas: su casa es la silla de montar. Dicen que oyeron llegar la Ruptura en el silbido del viento y que por eso sobrevivieron. Cabalgan tras la voz que promete otra vez un mundo entero.","Molino de los Vientos","Fiera","sabanas y matorrales","Manada: cazar cuesta solo 1 ✦.","Niños perdidos en la Ruptura fueron acogidos por una manada de lobos de musgo. Crecieron cazando juntos y volvieron como un clan que reparte todo lo que caza. Para los Fiera, el mosaico es un territorio de caza que necesita una sola manada.","Guarida del Tótem","Lumbre","cañones de cristal","Los Puentes de Lumen cuestan 1 ✦ y duran el doble.","Monjes de los cañones de cristal, los Lumbre descubrieron cómo solidificar la luz e hicieron los primeros Puentes de Lumen. Guardan el secreto en monasterios dorados. Creen que el mundo se reúne con puentes, no con espadas, pero llevan espadas de todos modos.","Obelisco de Lumen","Autómatas","ciudadelas de metal","Blindaje: todas las unidades nacen con +3 de vida.","Ejército de robots humanoides","En el año 2053, los Autómatas libran la Guerra del Futuro contra los Astros y la están perdiendo. La Unidad Cero calculó la única salida: viajar atrás en el tiempo y conquistar el pasado antes de que llegue el enemigo. Un ejército de robots humanoides cruzó el portal y levantó su primer centro de datos en la era del mosaico.","Centro de Datos","Astros","cráter de aterrizaje","Visión orbital: las unidades ven +1 casilla más allá.","Extraterrestres","Los Astros vinieron de las estrellas para dominar el mundo en 2053 y encontraron una resistencia de metal. Cuando interceptaron el plan de los Autómatas, lanzaron una nave por el mismo portal del tiempo. Aterrizaron en el pasado con una misión: cazar a los robots y tomar el mundo antes de que empiece la guerra.","Nave Aterrizada","Espectros","brumas eternas","Niebla: cruzan montañas sin Escalada y tienen +1 de defensa en ellas.","Pueblo de las sombras","Los Espectros son las sombras de quienes desaparecieron en la Gran Ruptura, atrapadas entre una baldosa y otra. Viven en las brumas y cruzan montañas como si fueran niebla. Creen que, si el mosaico se une, volverán a tener cuerpo.","Mausoleo de las Brumas","Colosos","ruinas celestes","Piel de piedra: cada golpe recibido causa 1 de daño menos.","Ángeles caídos de piedra","Los Colosos eran ángeles. Cuando el mundo se partió, cayeron del cielo junto con las esquirlas y, al tocar el suelo, sus alas y su piel se volvieron piedra. Gigantes lentos y casi indestructibles, quieren volver a unir el mosaico para levantar la escalera de regreso a casa.","Trono Caído","Recolección","Recoger frutas en el campo (+1 pob).","Caza","Cazar animales en el bosque (+1 pob).","Navegación","Entrar en agua poco profunda y pescar (+1 pob).","Escalada","Subir montañas (defensa ×1,5).","Forja","Entrenar Lancero (defensa 3).","Equitación","Entrenar Jinete (mueve 2, ataca y se retira).","Comercio","Construir Mercado (+1 ✦ por turno).","Lumenaria","Levantar Puentes de Lumen sobre agua poco profunda (duran 8 turnos).","Agricultura","Construir Granja en el campo (+2 pob).","Arquería","Entrenar Hondero (alcance 2).","Mar Abierto","Navegar por el océano.","Minería","Construir Mina en el mineral (+2 pob).","Asedio","Entrenar Ariete (ataque 4).","Diplomacia","Proponer pactos de tregua.","Exploración de tierras","Ampliar el territorio de cualquier ciudad a radio 2 (6 ✦), sin esperar al nivel 4.","Ingeniería","Levantar la Gran Obra de tu clan en la capital (30 ✦, una por partida).","Urbanismo","Levantar una Plaza en cada ciudad (8 ✦: +3 pob, +40 puntos).","Cartografía","Revela todo el mapa al instante.","Tácticas","Todas tus unidades ganan +1 de ataque.","Fortificación","Comprar Muralla en cualquier ciudad (6 ✦).","Silvicultura","Construir Aserradero en el bosque (+2 pob) y cazar rinde +1 pob más.","Arquitectura","Granjas, minas y aserraderos dan +1 pob (también los ya construidos), cada mercado rinde +1 ✦ y los puentes se vuelven permanentes.","Alianza","Las treguas duran 10 turnos y el tributo baja a la mitad.","Forja Eterna","Gran Faro","Cada ciudad junto al agua rinde +1 ✦ por turno.","Árbol Madre","Todas tus ciudades ganan +2 de población ahora.","Palacio de Hielo","Tus ciudades de nivel 3 o más reciben Muralla ahora.","Gran Bazar","Cada ciudad rinde +1 ✦ por turno.","Torre de los Vientos","Revela todo el mapa y todas tus ciudades ganan +1 de población.","Tótem de la Manada","Todas tus unidades se curan y ganan +5 de vida máxima.","Prisma Solar","La capital pasa a rendir +3 ✦ por turno.","Línea de Montaje","Cada ciudad que tienes ahora rinde +1 ✦ por turno.","Nave Nodriza","Revela todo el mapa y trae +10 ✦ ahora.","Velo Eterno","Tus unidades se curan por completo y cada ciudad gana +1 de población.","Escalera al Cielo","Todas tus unidades ganan +1 de defensa.","Explorador","Lancero","Hondero","Jinete","Ariete","Guardián","Piromante","Lanza fuego a 2 casillas con ataque 3.","Arponero","Ataque 3 y defensa 2: el lancero de los arrecifes.","Druida","Al comienzo del turno, cura 3 de vida a los aliados vecinos.","Jinete de Oso","Montura pesada: 16 de vida y ataque 3.","Caravana","Anda 2 casillas y rinde +1 ✦ por turno mientras viva (cuentan hasta 2 caravanas).","Halconero","El halcón ataca a 3 casillas de distancia.","Lobo de Manada","Barato y veloz: anda 2 casillas, ataca y se retira.","Centinela de Cristal","Escudo de cristal: defensa 4.","Mecha","Robot gigante con 20 de vida y ataque 4. Requiere ciudad de nivel 3.","Platillo Volador","Vuela sobre agua, bosque y montaña, 2 casillas por turno.","Aparición","Ataca sin sufrir contraataque.","Serafín de Piedra","Alas de piedra: cruza bosque y montaña sin detenerse.","Campo","Bosque","Montaña","Agua poco profunda","Océano","Frutas","Peces","Mineral","Taller","+1 ✦ por turno en esta ciudad","Expedición","Una expedición revela el mapa alrededor y un Explorador queda listo para actuar","Defensa ×3 para quien guarde la ciudad","Tesoro","+5 ✦ ahora","Frontera","El territorio crece a radio 2","Festival","+3 de población","Superunidad gratis","Jardín de Lumen","+150 puntos","Ruta comercial","+2 ✦ por turno en esta ciudad","Faro del Mosaico","Explorar el 60% del mapa","Metrópolis","Tener una ciudad de nivel 5","Imperio","Tener 5 ciudades","Arena de los Veteranos","Ganar 10 combates","Fácil","Difícil","Primavera","lluvias y ríos crecidos","calor y sol fuerte","Otoño","vendavales en los altiplanos","hielo y nieve","Bayas de luz","Recurso · frutas","Arbusto de bayas que brillan al atardecer. Recógelas con Recolección.","Ciervo musgo","Recurso · caza","Ciervo manso con astas de musgo. Cázalo con la tecnología Caza.","Pez linterna","Recurso · peces","Pez que enciende una luz en el agua poco profunda. Péscalo con Navegación.","Cristal vivo","Recurso · mineral","Cristales que crecen dentro de la roca. Construye una Mina con Minería.","Granja","Construcción · +2 pob","Bancales de trigo dorado. Requiere Agricultura.","Mina de cristal","Galería con rieles y una vagoneta de cristales. Requiere Minería.","Mercado","Construcción · +1 ✦/turno","Puesto de intercambio de la ciudad. Uno por ciudad. Requiere Comercio.","Aserradero","Troncos apilados y una sierra movida por Lumen. Requiere Silvicultura.","Ruinas antiguas","Exploración","Arco de un mundo anterior al mosaico. La primera unidad que llegue gana un premio.","Santuario de Lumen","Construcción · +2 pob · +60 pts","Altar de piedra con un cristal de Lumen. Se puede levantar en campo o bosque libres; cada nuevo santuario cuesta 4 ✦ más.","Travesía","Luz solidificada sobre el agua poco profunda. Cualquier clan puede cruzarla mientras dure.","Bienvenido a Mosaica","Tu clan empieza con una capital y un Explorador. Toca el Explorador para ver a dónde puede moverse (puntos blancos). Lleva unidades a las aldeas neutrales y termina el turno encima de ellas para ocuparlas.","Lumens y ciudades","Los Lumens (✦) llegan cada turno. Toca las casillas de tu territorio para recolectar recursos: la ciudad gana población, sube de nivel y cada nivel da un premio.","Tecnología","En Tecnología desbloqueas unidades y construcciones. En el nivel 2, la Ingeniería desbloquea la Gran Obra de tu clan, que vale 300 puntos.","Combate","Los círculos rojos muestran a quién puedes atacar, con una vista previa del daño. Si te moviste mal, usa Deshacer antes de atacar (no sirve después de abrir ruinas).","Cómo ganar","La partida dura 30 turnos. Gana quien tenga más puntos, o quien conquiste a todos los rivales. Las ciudades conquistadas quedan inestables durante 3 turnos, y cada ciudad por encima de 5 cuesta 1 ✦ por turno.","Tablero del juego","Marcador","Puntos","Lumens","Turno","Deshacer el último movimiento (atajo: Z)","Deshacer","Acciones","Atajo: espacio","Atajo: Enter","Ingresos por turno: una ciudad de nivel 1 rinde 2 ✦, +1 por nivel, y la capital rinde +1.","Combate sin dados: daño = proporción de ataque × Ataque × 4. Si el defensor sobrevive y alcanza al atacante, contraataca.","Bosque, montaña y ciudades dan defensa ×1,5. La Muralla da ×3.","La tecnología cuesta 4 + nivel × número de ciudades. Crecer rápido encarece la investigación.","Estaciones: cada 8 turnos se alternan verano (cosechas +1 pob) e invierno (el agua poco profunda se congela y se vuelve camino).","Modo Estaciones (opcional): primavera, verano, otoño e invierno se alternan cada {n} turnos, y cada estación da +{b} de ataque a sus clanes.","Los Puentes de Lumen unen islas por 3 ✦. Los pactos dan una tregua de 5 turnos; romperla cuesta 150 puntos.","Una ciudad conquistada queda inestable 3 turnos (sin ingresos y sin entrenar). Cada ciudad por encima de 5 cuesta 1 ✦ por turno.","Cada clan tiene una unidad exclusiva (marcada con ★ al entrenar), una capital propia y una historia.","Puntos: niveles de las ciudades, territorio, tecnologías, unidades, exploración y monumentos.","Entendido","derrota","victoria",", ","pob"],"fr":["Langue","Partie créée (graine {s}). Vous dirigez le clan {c}.","Mode Saisons : première saison, {s}, qui renforce {f}.","la technologie {t}","un Éclaireur qui a rejoint le clan","une carte de la région","{c} a exploré des ruines et trouvé {m}.","Ruines : vous avez trouvé {m} !","ruines !","{a} ({ac}) a attaqué {d} ({dc}) : {n} dégâts",", vaincu"," ; {u} est devenu vétéran",", contre-attaque de {n}",", l'attaquant est tombé","{c} a découvert {t}.","Architecture : bâtiments améliorés et ponts permanents.","Cartographie : toute la carte a été révélée.","{c} a érigé la Grande Œuvre {g} à {city}.","Grande Œuvre : {g} (+300 points).","{c} a érigé la Grande Œuvre {g}.","{c} a construit une Place à {city}.","{c} a agrandi le territoire de {city}.","territoire +","{c} a fortifié {city}.","Cueillir des baies de lumière","Chasser le cerf-mousse","Pêcher le poisson-lanterne","Construire une mine de cristal","Construire une scierie","Ériger un sanctuaire de Lumen","Construire une ferme","Construire un marché","{c} a solidifié la lave et créé une nouvelle terre.","{c} a érigé un Pont de Lumen.","{city} ({c}) est passée au niveau {
