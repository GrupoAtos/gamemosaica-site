  const _train=doTrain;doTrain=function(c,k){const u=_train(c,k);if(u&&c.owner===0&&!quiet()){sfx('train');haptic('light');burst(c.x,c.y,clanOf(0).color);if(S.tut)tutC().train++;}else if(!u&&c.owner===0)sfx('error');return u;};
  const _res=research;research=function(p,k){const r=_res(p,k);if(r&&p.human&&!quiet()){sfx('research');haptic('medium');}return r;};
  const _lv=levelUp;levelUp=function(c){_lv(c);if(c.owner===0&&!quiet()){sfx('levelup');haptic('medium');burst(c.x,c.y,'#ffd36b');}};
  const _great=doGreat;doGreat=function(pid){const r=_great(pid);if(r&&pid===0&&!quiet()){sfx('capture');haptic('success');banner(GREAT[human().clan].n,tr('Grande Obra concluída · +300 pontos'));}return r;};
  const bsnd=(r,mine)=>{if(r&&mine&&!quiet()){sfx('build');haptic('light');}return r;};
  const _pl=doPlaza;doPlaza=function(c){const m=c.owner===0;return bsnd(_pl(c),m);};
  const _ex=doExpand;doExpand=function(c){const m=c.owner===0;return bsnd(_ex(c),m);};
  const _bw=doBuyWall;doBuyWall=function(c){const m=c.owner===0;return bsnd(_bw(c),m);};
  const _br=doBridge;doBridge=function(pid,x,y){return bsnd(_br(pid,x,y),pid===0);};
  const _mon=checkMonuments;checkMonuments=function(pid){const n=pid!=null?P(pid).monuments.length:0;_mon(pid);if(pid===0&&!quiet()&&P(0).monuments.length>n){const k=P(0).monuments[P(0).monuments.length-1];sfx('levelup');banner(tr('Monumento erguido'),tr('{m} · +250 pontos',{m:MONUMENTS[k].n}));}};
  const _ruin=ruinReward;ruinReward=function(u){_ruin(u);if(u.owner===0&&!quiet()){sfx('research');haptic('medium');}};
  const _rest=rest;rest=function(u){_rest(u);if(u.owner===0)sfx('ok');};
  const _season=seasonChange;seasonChange=function(){_season();if(!quiet())sfx('season');};
  const _start=startTurn;startTurn=function(pid){_start(pid);if(pid===0&&!quiet()&&S&&!S.over&&S.turn>1){sfx('turn');dangerAlert();if(S.turn===MAX_TURNS)banner(tr('Último turno'),tr('Faça valer cada ação'),'#ffd36b');else if(S.turn===MAX_TURNS-4)toast(tr('Faltam 5 turnos para o fim da partida.'));}};
  const _over=gameOver;gameOver=function(){const fast=quiet();_over();if(fast)return;ui.danger=[];$('danger').hidden=true;coachUpdate();const rank=[...S.players].sort((a,b)=>b.score-a.score);const won=human().alive&&rank[0].human;sfx(won?'win':'lose');haptic(won?'success':'heavy');};
  const _refresh=refresh;refresh=function(){_refresh();if(!S)return;renderDanger();coachUpdate();};
  const _sel=selectUnit;selectUnit=function(u){const prev=ui.unit;_sel(u);if(u&&u!==prev&&u.owner===0&&!quiet())sfx('select');};
  const _endH=humanEndTurn;humanEndTurn=function(force){if(!myTurn())return;
    if(force!==true&&!S.pendingLv.length&&ui.dangerAck!==S.turn){const hi=calcDanger().filter(d=>d.lvl>1&&!unitAt(d.c.x,d.c.y));
      if(hi.length){const c=hi[0].c,last=playerCities(0).length===1;sfx('danger');
        openModal(`<h2>${tr('{c} está sem defesa',{c:c.name})}</h2><p>${tr(last?'Há um inimigo que alcança a cidade no próximo turno, e ela é a sua <b>última cidade</b>: se cair, a partida acaba. Deixe uma unidade dentro dela ou treine uma agora.':'Há um inimigo que alcança a cidade no próximo turno. Deixe uma unidade dentro dela ou treine uma agora.')}</p><div class="row"><button class="btn" data-a="danger-end">${tr('Encerrar mesmo assim')}</button><button class="btn primary" data-a="danger-fix">${tr('Defender a cidade')}</button></div>`,false);return;}}
    _endH();};
  $('bEnd').onclick=()=>humanEndTurn();
  $('bNext').onclick=()=>{nextUnit();};
  $('danger').onclick=dangerGo;
  document.addEventListener('click',e=>{const b=e.target.closest('button,[data-a],.tn');if(b&&!b.disabled)sfx('tap');
    const a=e.target.closest('[data-a]');if(!a||a.disabled)return;const k=a.dataset.k;
    switch(a.dataset.a){
      case 'cfg':if(k==='speed')CFG.speed=fastUI()?'normal':'rapida';else CFG[k]=!CFG[k];saveCfg();if(k==='vib'&&CFG.vib)haptic('medium');if(CFG.sfx||CFG.music)audioWake();musicSync();if(k==='sfx'&&CFG.sfx)setTimeout(()=>sfx('ok'),60);openSettings();break;
      case 'menu-settings':openSettings();break;
      case 'coach-skip':coachEnd();toast(tr('Guia encerrado. As dicas ficam no Menu.'));break;
      case 'coach-ok':if(S&&S.tut){S.tut.i++;coachUpdate();}break;
      case 'danger-end':closeModal();ui.dangerAck=S.turn;humanEndTurn(true);break;
      case 'danger-fix':{closeModal();ui.dangerAck=S.turn;const d=calcDanger().filter(d=>d.lvl>1)[0];if(d){panTo(d.c.x,d.c.y);ui.sel={x:d.c.x,y:d.c.y};selectUnit(unitAt(d.c.x,d.c.y));refresh();}break;}
    }},true);
}

window.claude?.hot?.snapshot?.(()=>({save:S?JSON.stringify(S):null}));
i18nInit();applyLang();
const boot=d=>{if(d&&d.save){try{loadState(JSON.parse(d.save));return;}catch(e){}}showStart();};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

// Gancho de testes: joga partidas IA contra IA para medir o balanceamento (seção 2.11 do documento).
window.__mosaica={state:()=>S,newGame:o=>{newGame(Object.assign({clan:'raiz',diff:'normal',seed:1},o));},
  autoplay(){S.fast=true;const p=human();p.persona='economica';let guard=0;
    while(!S.over&&guard++<400){if(S.current===0){while(S.pendingLv.length){const lv=S.pendingLv.shift();applyReward(S.cities[lv.city],rewardOptions(lv.level,S.cities[lv.city])[0]);}runAI(0);p.persona='economica';endTurn(0);}else break;}
    return {turn:S.turn,over:S.over,scores:S.players.map(p=>[CLANS[p.clan].n,p.score,playerCities(p.id).length,p.alive])};}};
</script>
