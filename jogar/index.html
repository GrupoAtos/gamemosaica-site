function cityIncome(c){const p=P(c.owner);if(c.unrest>0)return 0;return c.level+1+c.bonus+(c.capital?1:0)+(linked(c)?1:0)+(p.great&&(p.clan==='duna'||(p.clan==='mare'&&coastal(c)))?1:0);}
function upkeep(p){return Math.max(0,playerCities(p.id).length-5);}
function incomeOf(p){let g=playerCities(p.id).reduce((s,c)=>s+cityIncome(c),0)-upkeep(p)+Math.min(2,S.units.reduce((s,u)=>s+(u.owner===p.id?(UNITS[u.type].income||0):0),0));if(!p.human)g+=DIFF[S.diff].inc;return g;}
function techCost(p,k){const t=TECHS[k].tier,n=Math.max(1,playerCities(p.id).length);let c=3+2*t+Math.ceil((n-1)*(t+1)/2);if(p.school)c=Math.ceil(c/2);return c;}
function canResearch(p,k){const t=TECHS[k];return !has(p,k)&&(!t.req||has(p,t.req));}
function research(p,k){const c=techCost(p,k);if(p.gold<c||!canResearch(p,k))return false;p.gold-=c;p.techs.push(k);if(p.school)p.school--;addLog(tr('{c} pesquisou {t}.',{c:CLANS[p.clan].n,t:TECHS[k].n}));
  if(k==='arquitetura'){S.tiles.forEach((t,i)=>{if(ownerOf(t)!==p.id)return;if(t.bridge>0)t.bridge=999;if(t.imp==='fazenda'||t.imp==='mina'||t.imp==='serraria')addPop(S.cities[t.cityOf],1);});playerCities(p.id).forEach(c=>{if(c.market)c.bonus+=1;});if(p.human)toast(tr('Arquitetura: construções melhoradas e pontes permanentes.'));}
  if(k==='cartografia'){revealAll(p.id);if(p.human)toast(tr('Cartografia: o mapa inteiro foi revelado.'));}return true;}
function revealAll(pid){P(pid).explored.fill(1);checkMonuments(pid);}
function truceLen(pid){return has(P(pid),'alianca')?10:5;}
function setTruce(a,b,n){S.truces[Math.min(a,b)+'-'+Math.max(a,b)]=n;}
// ---- Grande Obra, Praça, Muralha comprada ----
function capitalOf(pid){return S.cities.find(c=>c.owner===pid&&c.capital)||null;}
function canGreat(pid){const p=P(pid);return has(p,'engenharia')&&!p.great&&!!capitalOf(pid);}
function doGreat(pid){const p=P(pid),cap=capitalOf(pid);if(!canGreat(pid)||p.gold<GREAT_COST)return false;p.gold-=GREAT_COST;p.great=true;cap.great=true;p.bonusScore+=300;
  const G=GREAT[p.clan];
  if(p.clan==='raiz')playerCities(pid).forEach(c=>addPop(c,2));
  if(p.clan==='geada')playerCities(pid).forEach(c=>{if(c.level>=3)c.wall=true;});
  if(p.clan==='vento'){revealAll(pid);playerCities(pid).forEach(c=>addPop(c,1));}
  if(p.clan==='fera')S.units.forEach(u=>{if(u.owner===pid){u.maxHp+=5;u.hp=u.maxHp;}});
  if(p.clan==='lume')cap.bonus+=3;
  if(p.clan==='automato')playerCities(pid).forEach(c=>{c.bonus+=1;});
  if(p.clan==='astro'){revealAll(pid);p.gold+=10;}
  if(p.clan==='espectro'){S.units.forEach(u=>{if(u.owner===pid)u.hp=u.maxHp;});playerCities(pid).forEach(c=>addPop(c,1));}
  addLog(tr('{c} ergueu a Grande Obra {g} em {city}.',{c:CLANS[p.clan].n,g:G.n,city:cap.name}));
  if(p.human)toast(tr('Grande Obra: {g} (+300 pontos).',{g:G.n}));else if(human().explored[I(cap.x,cap.y)])toast(tr('{c} ergueu a Grande Obra {g}.',{c:CLANS[p.clan].n,g:G.n}));
  return true;}
const fairCost=c=>4+2*c.level;
function canFair(c){return c.owner!=null&&c.plaza&&c.fair!==S.turn&&!(c.unrest>0);}
function doFair(c){const p=P(c.owner),fc=fairCost(c);if(!canFair(c)||p.gold<fc)return false;p.gold-=fc;c.fair=S.turn;addLog(tr('{c} fez uma Feira em {city}.',{c:CLANS[p.clan].n,city:c.name}));floatText(c.x,c.y,'+2 '+tr('pop'),'#9ee6a8');addPop(c,2);return true;}
function canPlaza(c){return c.owner!=null&&has(P(c.owner),'urbanismo')&&!c.plaza;}
function doPlaza(c){const p=P(c.owner);if(!canPlaza(c)||p.gold<PLAZA_COST)return false;p.gold-=PLAZA_COST;c.plaza=true;p.bonusScore+=40;addLog(tr('{c} ergueu uma Praça em {city}.',{c:CLANS[p.clan].n,city:c.name}));floatText(c.x,c.y,'+3 '+tr('pop'),'#9ee6a8');addPop(c,3);return true;}
const EXPAND_COST=6;
function canExpand(c){return c.owner!=null&&has(P(c.owner),'desbravamento')&&c.radius<2;}
function doExpand(c){const p=P(c.owner);if(!canExpand(c)||p.gold<EXPAND_COST)return false;p.gold-=EXPAND_COST;c.radius=2;claim(c);reveal(c.owner,c.x,c.y,3);addLog(tr('{c} ampliou o território de {city}.',{c:CLANS[p.clan].n,city:c.name}));floatText(c.x,c.y,tr('território +'),'#e08ad0');checkMonuments(c.owner);return true;}
function canBuyWall(c){return c.owner!=null&&has(P(c.owner),'fortificacao')&&!c.wall;}
function doBuyWall(c){const p=P(c.owner);if(!canBuyWall(c)||p.gold<WALL_COST)return false;p.gold-=WALL_COST;c.wall=true;addLog(tr('{c} murou {city}.',{c:CLANS[p.clan].n,city:c.name}));return true;}
function truceCost(){const c=5+3*(human().truces||0);return has(human(),'alianca')?Math.ceil(c/2):c;}
function unitCost(p,k){let c=UNITS[k].cost;if(p.clan==='brasa'&&k==='ariete')c=5;if(p.clan==='vento'&&k==='cavaleiro')c=3;return c;}
function unitCap(c){return c.level+1+(c.capital?1:0)+(c.barracks?2:0);}
function homeCount(c){return S.units.filter(u=>u.home===c.id&&u.owner===c.owner).length;}
function trainable(c){const p=P(c.owner);return Object.keys(UNITS).filter(k=>{const U=UNITS[k];if(U.clan&&U.clan!==p.clan)return false;if(U.tech&&!has(p,U.tech))return false;if(U.minLevel&&c.level<U.minLevel)return false;if(k==='guardiao'&&hasGuard(c))return false;return true;});}
function doTrain(c,k){const p=P(c.owner),U=UNITS[k],cost=unitCost(p,k);if(p.gold<cost||unitAt(c.x,c.y)||homeCount(c)>=unitCap(c)||c.unrest>0)return null;
  const u=spawn(k,c.owner,c.x,c.y,c.id,false);if(!u)return null;if(u.x!==c.x||u.y!==c.y){killUnit(u);return null;}p.gold-=cost;return u;}
function resoN(x,y,kind){let n=0;for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&T(nx,ny).imp===kind)n++;}return Math.min(2,n);}
function mineAdj(x,y){let n=0;for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&T(nx,ny).imp==='mina')n++;}return Math.min(3,n);}
function harvestOptions(pid,x,y){const t=T(x,y),p=P(pid),out=[],X=ecoX(pid);
  if(ownerOf(t)!==pid||t.city!=null)return out;
  const sb=harvestSeason()&&t.cityOf!=null&&S.cities[t.cityOf].sbSeason!==seasonIdx()?1:0;
  if(t.res==='frutas'&&has(p,'coleta'))out.push({kind:'colher',label:tr(X?X.h.frutas:'Colher bagas-de-luz'),cost:2,sb,pop:1+sb,vis:'frutas'});
  if(t.res==='caca'&&has(p,'caca'))out.push({kind:'colher',label:tr(X?X.h.caca:'Caçar cervo-musgo'),cost:p.clan==='fera'?1:2,sb,pop:1+sb+(has(p,'silvicultura')?1:0),vis:'caca'});
  if(t.res==='peixe'&&has(p,'navegacao'))out.push({kind:'colher',label:tr(X?X.h.peixe:'Pescar peixe-lanterna'),cost:p.clan==='mare'?1:2,sb,pop:1+sb,vis:'peixe'});
  if(t.res==='baleia'&&has(p,'maraberto'))out.push({kind:'colher',label:tr('Caçar baleia-de-luz'),cost:p.clan==='mare'?2:4,sb,pop:2+sb,vis:'baleia'});
  if(t.t==='raso'&&!t.res&&!t.imp&&!t.ruin&&!(t.bridge>0)&&has(p,'navegacao')&&!S.cities[t.cityOf].port)out.push({kind:'porto',label:tr('Construir porto de Lumen'),cost:5,pop:1,vis:'porto'});
  if(t.res==='minerio'&&has(p,'mineracao'))out.push({kind:'mina',label:tr('Construir mina de cristal'),cost:p.clan==='brasa'?3:5,pop:2+(has(p,'arquitetura')?1:0)+resoN(x,y,'mina'),vis:'mina'});
  if(t.t==='floresta'&&!t.res&&!t.imp&&!t.ruin&&has(p,'silvicultura'))out.push({kind:'serraria',label:tr(X?X.b.serraria:'Construir serraria'),cost:5,pop:2+(has(p,'arquitetura')?1:0)+resoN(x,y,'serraria'),vis:vk('serraria',pid)});
  if((t.t==='campo'||t.t==='floresta')&&!t.res&&!t.imp&&!t.ruin){const sc=8+4*(p.shrines||0);out.push({kind:'santuario',label:tr('Erguer santuário de Lumen'),cost:sc,pop:2,vis:'santuario'});}
  if(t.t==='floresta'&&!t.res&&!t.imp&&!t.ruin){if(has(p,'lavoura'))out.push({kind:'clareira',label:tr('Abrir clareira (vira campo)'),cost:2,pop:0,vis:'fazenda'});if(p.clan==='brasa')out.push({kind:'queimada',label:tr('Queimada fértil (campo com bagas)'),cost:3,pop:1,vis:'frutas'});}
  if(t.t==='campo'&&!t.res&&!t.imp&&!t.ruin&&p.clan==='raiz')out.push({kind:'plantio',label:tr('Plantar bosque (floresta com caça)'),cost:3,pop:1,vis:'caca'});
  if(t.t==='campo'&&!t.res&&!t.imp&&!t.ruin){
    if(has(p,'lavoura'))out.push({kind:'fazenda',label:tr(X?X.b.fazenda:'Construir fazenda'),cost:5,pop:2+(has(p,'arquitetura')?1:0)+resoN(x,y,'fazenda'),vis:vk('fazenda',pid)});
    if(has(p,'mineracao')&&mineAdj(x,y)>0)out.push({kind:'atelie',label:tr('Construir ateliê de cristal'),cost:6,pop:1,gold:mineAdj(x,y),vis:'atelie'});
    if(has(p,'comercio')&&!S.cities[t.cityOf].market)out.push({kind:'mercado',label:tr('Construir mercado'),cost:p.clan==='duna'?3:4,pop:1,vis:'mercado'});}
  return out;}
const REGROW=8;
function doHarvest(pid,x,y,kind){const o=harvestOptions(pid,x,y).find(o=>o.kind===kind);const p=P(pid);if(!o||p.gold<o.cost)return false;
  const t=T(x,y),c=S.cities[t.cityOf];p.gold-=o.cost;
  if(kind==='colher'){t.rres=t.res;t.regrow=S.turn+REGROW;t.res=null;if(o.sb)c.sbSeason=seasonIdx();}else if(kind==='mina'){t.res=null;t.imp='mina';for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const a=T(nx,ny);if(a.imp==='atelie'&&a.cityOf!=null&&(a.atN||0)<3){a.atN=(a.atN||0)+1;S.cities[a.cityOf].bonus+=1;}}}else if(kind==='atelie'){t.imp='atelie';t.atN=o.gold;c.bonus+=o.gold;}else if(kind==='fazenda')t.imp='fazenda';else if(kind==='porto'){t.imp='porto';c.port=true;}else if(kind==='clareira')t.t='campo';else if(kind==='queimada'){t.t='campo';t.res='frutas';}else if(kind==='plantio'){t.t='floresta';t.res='caca';}else if(kind==='serraria')t.imp='serraria';else if(kind==='mercado'){t.imp='mercado';c.market=true;c.bonus+=has(p,'arquitetura')?2:1;}else if(kind==='santuario'){t.imp='santuario';t.shT=S.turn;p.shrines=(p.shrines||0)+1;p.bonusScore+=60;}
  if(human().explored[I(x,y)]){if(kind==='colher')ui.fx.push({kind:o.vis,x,y,tx:c.x,ty:c.y,t0:performance.now()});else t.builtT=performance.now();ui.fx.push({burst:true,x,y,col:ITEMS[kind==='colher'||!ITEMS[kind]?o.vis:kind].col,t0:performance.now()});}
  if(o.pop){floatText(x,y,'+'+o.pop+' '+tr('pop'),'#9ee6a8');addPop(c,o.pop);}else checkMonuments(c.owner);return true;}
function canBridge(pid,x,y){const t=T(x,y),p=P(pid);if(!has(p,'lumenaria')||t.t!=='raso'||t.bridge>0||t.imp||unitAt(x,y))return false;
  return ownerOf(t)===pid||S.units.some(u=>u.owner===pid&&cheb(u.x,u.y,x,y)===1);}
function bridgeCost(p){return p.clan==='lume'?1:3;}
function doBridge(pid,x,y){const p=P(pid),bc=bridgeCost(p);if(!canBridge(pid,x,y)||p.gold<bc)return false;p.gold-=bc;const t=T(x,y);
  if(p.clan==='brasa'){t.t='campo';t.res=null;addLog(tr('{c} solidificou lava e criou terra nova.',{c:CLANS[p.clan].n}));}else{t.bridge=has(p,'arquitetura')?999:SEASON_LEN*(p.clan==='lume'?2:1);addLog(tr('{c} ergueu uma Ponte de Lumen.',{c:CLANS[p.clan].n}));}return true;}
function popNeed(c){return 2*c.level+1;}
const seasonIdx=()=>Math.floor((S.turn-1)/(seasonsMode()?SEASON4_LEN:SEASON_LEN));
function addPop(c,n){c.pop+=n;while(c.pop>=popNeed(c)){c.pop-=popNeed(c);c.level++;levelUp(c);}checkMonuments(c.owner);}
function hasGuard(c){return S.units.some(u=>u.type==='guardiao'&&u.home===c.id&&u.owner===c.owner);}
function rewardOptions(lv,c){if(lv===2)return['oficina','batedor'];if(lv===3)return['muralha','escola'];if(lv===4)return c&&c.radius>=2?['quartel','prospera']:['fronteira','quartel'];if(lv===5&&!(c&&hasGuard(c)))return['guardiao','coro'];return['prospera','coro'];}
function levelUp(c){const p=P(c.owner);if(!S.fast&&human()&&human().explored[I(c.x,c.y)]){(ui.lvfx=ui.lvfx||[]).push({id:c.id,x:c.x,y:c.y,t0:performance.now(),col:CLANS[p.clan].color});floatText(c.x,c.y,tr('Nível {n}',{n:c.level})+'!','#ffd36b');}addLog(tr('{city} ({c}) subiu para o nível {n}.',{city:c.name,c:CLANS[p.clan].n,n:c.level}));
  if(p.human){S.pendingLv.push({city:c.id,level:c.level});}
  else{const o=rewardOptions(c.level,c),k=PERSONAS[p.persona].pick[Math.min(5,c.level)];applyReward(c,o.includes(k)?k:o[PERSONAS[p.persona].eco>.6?0:1]);}}
function applyReward(c,k){const p=P(c.owner);
  switch(k){case 'oficina':c.bonus+=1;break;case 'batedor':explore(c);break;case 'muralha':c.wall=true;break;
    case 'escola':p.school=(p.school||0)+2;break;case 'quartel':c.barracks=true;break;case 'fronteira':c.radius=2;claim(c);reveal(c.owner,c.x,c.y,3);break;
    case 'guardiao':spawn('guardiao',c.owner,c.x,c.y,c.id,false);break;case 'coro':p.bonusScore+=100;playerCities(c.owner).forEach(o=>{if(o!==c)addPop(o,1);});break;case 'prospera':c.bonus+=2;break;}}
function explore(c){const pid=c.owner,p=P(pid),before=p.explored.reduce((a,b)=>a+b,0);
  const ok=(x,y)=>inb(x,y)&&T(x,y).t!=='oceano';const seen=new Set([c.x+','+c.y]);const path=[[c.x,c.y]];let x=c.x,y=c.y;
  for(let i=0;i<16;i++){let best=null,bv=-1;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!ok(nx,ny)||seen.has(nx+','+ny))continue;
      let v=Math.random()*.5;for(let ry=-2;ry<=2;ry++)for(let rx=-2;rx<=2;rx++)if(inb(nx+rx,ny+ry)&&!p.explored[I(nx+rx,ny+ry)])v++;
      if(v>bv){bv=v;best=[nx,ny];}}
    if(!best)break;[x,y]=best;seen.add(x+','+y);path.push(best);reveal(pid,x,y,T(x,y).t==='montanha'?2:1);}
  const u=spawn('batedor',pid,c.x,c.y,null,true);
  const n=p.explored.reduce((a,b)=>a+b,0)-before;
  addLog(tr('Um explorador de {c} saiu de {city} e revelou {n} casas.',{c:CLANS[p.clan].n,city:c.name,n}));
  if(p.human){ui.fx.push({explorer:true,path,clan:p.clan,t0:performance.now()});toast(tr(u?'O explorador revelou {n} casas do mapa e um Batedor está pronto para agir.':'O explorador revelou {n} casas do mapa.',{n}));}
  checkMonuments(pid);}
function captureCity(c,pid){const old=c.owner,p=P(pid);if(old==null){const cn=clanName(p.clan,c.x*7+c.y*13+c.id*3,S.cities.map(o=>o.name));if(cn){c.name=cn.name;c.nm=cn.m;}}
  c.owner=pid;c.pop=0;if(old!=null){c.capital=false;c.unrest=3;}claim(c);reveal(pid,c.x,c.y,2);
  S.units.forEach(u=>{if(u.home===c.id&&u.owner!==pid)u.home=null;});
  addLog(tr(old==null?'{c} fundou {city}.':'{c} conquistou {city}.',{c:CLANS[p.clan].n,city:c.name}));
  if(p.human)toast(tr(old==null?'Você ocupou {city}!':'Você conquistou {city}!',{city:c.name}));
  else if(old===0)toast(tr('{c} tomou a sua cidade {city}.',{c:CLANS[p.clan].n,city:c.name}));
  if(old!=null&&playerCities(old).length===0)eliminate(old);
  checkMonuments(pid);}
function eliminate(pid){const p=P(pid);p.alive=false;S.units=S.units.filter(u=>u.owner!==pid);addLog(tr('O clã {c} foi eliminado.',{c:CLANS[p.clan].n}));toast(tr('O clã {c} foi eliminado.',{c:CLANS[p.clan].n}));}
function exploredPct(p){return p.explored.reduce((a,b)=>a+b,0)/(N*N);}
function checkMonuments(pid){if(pid==null)return;const p=P(pid);if(!p.alive)return;
  const give=k=>{if(p.monuments.includes(k))return;p.monuments.push(k);addLog(tr('{c} ergueu o monumento {m}.',{c:CLANS[p.clan].n,m:MONUMENTS[k].n}));if(p.human)toast(tr('Monumento: {m} (+250 pontos)',{m:MONUMENTS[k].n}));};
  if(exploredPct(p)>=.6)give('farol');const cs=playerCities(pid);if(cs.some(c=>c.level>=5))give('metropole');if(cs.length>=5)give('imperio');if(p.kills>=10)give('veterano');if(S.turn>=12&&S.turn-(p.lastAtk||0)>=8)give('calma');if(p.gold>=60)give('cofre');if(Object.keys(TECHS).every(k=>has(p,k)))give('biblioteca');if((p.frags||0)>=3)give('mosaico');}
function shrineGrow(t){return t.imp==='santuario'&&t.shT!=null?Math.min(120,Math.floor((S.turn-t.shT)/3)*10):0;}
function calcScore(p){if(!p.alive)return 0;const cs=playerCities(p.id);let terr=0,shr=0;S.tiles.forEach(t=>{if(ownerOf(t)===p.id){terr++;shr+=shrineGrow(t);}});
  const units=S.units.filter(u=>u.owner===p.id).reduce((s,u)=>s+UNITS[u.type].cost,0);
  const caps=cs.filter(c=>isCap0(c)&&c.id!==p.id).length*150;
  return caps+cs.reduce((s,c)=>s+c.level*70,0)+terr*8+p.techs.length*25+units*3+Math.round(exploredPct(p)*100)+p.monuments.length*250+p.bonusScore+shr-p.penalty;}
function updateScores(){S.players.forEach(p=>p.score=calcScore(p));}

// ======================= FLUXO DE TURNOS =======================
function startTurn(pid){
  const p=P(pid);S.current=pid;
  S.units.forEach(u=>{if(u.owner===pid){u.moved=false;u.attacked=false;u.chg=false;if(u.root){u.moved=true;u.root=0;}if(u.frost){u.attacked=true;u.frost=0;}if(u.burn>0){u.hp=Math.max(1,u.hp-1);u.burn--;if(!S.fast)floatText(u.x,u.y,'−1','#ff8f4a');}}});
  S.units.forEach(hl=>{const hv=UNITS[hl.type].heal;if(hl.owner!==pid||!hv)return;S.units.forEach(o=>{if(o.owner===pid&&o!==hl&&cheb(o.x,o.y,hl.x,hl.y)===1&&o.hp<o.maxHp){const b0=o.hp;o.hp=Math.min(o.maxHp,o.hp+hv);if(!S.fast)floatText(o.x,o.y,'+'+(o.hp-b0),'#9ee6a8');}});});
  if(S.turn>1){const g=incomeOf(p);p.gold+=g;if(p.human&&g)toast(tr('Renda do turno: +{n} ✦',{n:g}));}
  checkMonuments(pid);
  if(p.human){ui.busy=false;saveGame();updateScores();refresh();showNextLevelUp();}
  else{runAI(pid);if(S.fast)endTurn(pid);else setTimeout(()=>endTurn(pid),aiDelay());}
}
function endTurn(pid){
  if(S.over)return;
  for(const u of S.units.slice())if(u.owner===pid){const c=cityAt(u.x,u.y);if(c&&c.owner!==pid&&!(c.owner!=null&&inTruce(pid,c.owner)))captureCity(c,pid);}
  updateScores();
  if(!human().alive){return gameOver();}
  if(S.players.filter(p=>p.alive).length===1){return gameOver();}
  if(S.win==='corrida'&&P(pid).alive&&P(pid).score>=raceGoal()){S.winner=pid;return gameOver();}

    if(canBuyWall(c)&&p.gold>=WALL_COST+res&&(c.capital||enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=3)))doBuyWall(c);

function aiTrain(p,W,goals){const cs=playerCities(p.id);const neutral=goals.some(g=>{const c=cityAt(g.x,g.y);return c&&c.owner==null;});
  const myUnits=S.units.filter(u=>u.owner===p.id).length;
  for(const c of cs){if(unitAt(c.x,c.y)||homeCount(c)>=unitCap(c))continue;
    const threat=enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=3);const av=trainable(c);
    const X=CLAN_UNIT[p.clan];let order;if(threat)order=['guardiao','guarda','lanceiro',X,'fundeiro','ariete','cavaleiro','batedor'];
    else if(neutral&&myUnits<cs.length*2)order=UNITS[X].mov>=2&&!UNITS[X].income?[X,'cavaleiro','batedor']:['cavaleiro','batedor'];
    else{const cnt=t=>S.units.filter(u=>u.owner===p.id&&u.type===t).length;
      const hard=S.cities.some(o=>o.owner!=null&&o.owner!==p.id&&!inTruce(p.id,o.owner)&&p.explored[I(o.x,o.y)]&&(o.wall||hasGuard(o)||o.level>=4));
      const want={ariete:hard?1.5:.5,balista:hard?1:.5,fundeiro:1.2,cavaleiro:1,lanceiro:.8,guarda:1,sombra:.3,cantor:.3};want[X]=UNITS[X].income?.8:1.6;
      order=Object.keys(want).sort((a,b)=>cnt(a)/want[a]-cnt(b)/want[b]);}
    const keep=threat?0:(W.eco>.6?3:1);
    for(const k of order){if(!av.includes(k))continue;if(p.gold-unitCost(p,k)<keep)continue;if(doTrain(c,k))break;}}}

  mare:{skin:'#8d5a3b',hair:'#1f2b3a',hat:'shell'},
  raiz:{skin:'#e2b48c',hair:'#4a3420',hat:'leaf'},
  geada:{skin:'#f3dccb',hair:'#dfe6f2',hat:'fur'},
  duna:{skin:'#a8714a',hair:'#2a1a10',hat:'wrap'},
  vento:{skin:'#d9a37c',hair:'#5a2e4a',hat:'feather'},
  fera:{skin:'#c9905e',hair:'#5a3a22',hat:'wolf'},
  lume:{skin:'#f1cfa8',hair:'#e9c46a',hat:'halo'},
  automato:{skin:'#c3ccd8',hair:'#5f6a7a',hat:'robot'},
  astro:{skin:'#9be36b',hair:'#4f9a46',hat:'alien'},
  espectro:{skin:'#e4ddff',hair:'#b4a6ee',hat:'hood'},
  colosso:{skin:'#c9c4da',hair:'#8e86a6',hat:'stone'},
};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function line(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function drawHead(c,hx,hy,clan,col,blink){const L=CLAN_LOOK[clan];
  if(L.hat==='fur'){c.fillStyle='#f4f6fb';c.beginPath();c.arc(hx,hy,7.2,0,7);c.fill();c.strokeStyle=col;c.lineWidth=1.2;c.beginPath();c.arc(hx,hy,7.2,Math.PI*.75,Math.PI*2.25);c.stroke();}
  c.fillStyle=L.hair;c.beginPath();c.arc(hx-.6,hy-.6,5.6,0,7);c.fill();
  c.fillStyle=L.skin;c.beginPath();c.arc(hx+.6,hy+.5,5,0,7);c.fill();
  c.fillStyle='#2a1e2e';
  if(blink){c.fillRect(hx+1.2,hy+.1,1.7,.7);c.fillRect(hx+3.5,hy+.1,1.5,.7);}
  else{c.beginPath();c.arc(hx+2,hy+.3,.9,0,7);c.arc(hx+4.3,hy+.3,.8,0,7);c.fill();}
  c.fillStyle='rgba(255,110,110,.35)';c.beginPath();c.arc(hx+3.8,hy+2.3,1.1,0,7);c.fill();
  switch(L.hat){
    case 'flame':c.fillStyle=col;c.beginPath();c.moveTo(hx-5,hy-2.5);c.quadraticCurveTo(hx-5,hy-11,hx-1.5,hy-8);c.quadraticCurveTo(hx-.5,hy-14,hx+2,hy-7.5);c.quadraticCurveTo(hx+5.5,hy-10,hx+5.2,hy-2.5);c.closePath();c.fill();
      c.fillStyle='#ffd36b';c.beginPath();c.moveTo(hx-2,hy-4);c.quadraticCurveTo(hx-.5,hy-9.5,hx+2,hy-4);c.closePath();c.fill();break;
    case 'shell':c.fillStyle=col;c.fillRect(hx-5,hy-3.4,11,2);c.fillStyle='#ffe3d1';c.beginPath();c.moveTo(hx-3,hy-2.5);c.arc(hx-3,hy-2.5,4.2,Math.PI*1.05,Math.PI*1.95);c.closePath();c.fill();
      c.strokeStyle='rgba(180,120,100,.7)';c.lineWidth=.6;for(let i=0;i<4;i++){const a=Math.PI*(1.15+i*.23);c.beginPath();c.moveTo(hx-3,hy-2.5);c.lineTo(hx-3+Math.cos(a)*4,hy-2.5+Math.sin(a)*4);c.stroke();}break;
    case 'leaf':c.fillStyle=col;c.beginPath();c.arc(hx,hy-.3,6.4,Math.PI*.95,Math.PI*2.02);c.lineTo(hx-5.6,hy+3.5);c.closePath();c.fill();
      c.fillStyle='#4f9a4a';c.save();c.translate(hx+1,hy-7.5);c.rotate(-.6);c.beginPath();c.ellipse(0,0,3.4,1.5,0,0,7);c.fill();c.restore();
      line(c,hx,hy-6,hx+.5,hy-8,.8,'#3d7a3a');break;
    case 'fur':break;
    case 'wrap':c.fillStyle='#f3e7cf';c.beginPath();c.ellipse(hx,hy-4,6.3,3.7,0,0,7);c.fill();c.fillRect(hx-6.5,hy-3,2,7);
      c.strokeStyle='rgba(160,130,90,.6)';c.lineWidth=.6;c.beginPath();c.moveTo(hx-5,hy-5);c.quadraticCurveTo(hx,hy-2.5,hx+5.5,hy-5);c.stroke();
      c.fillStyle=col;c.beginPath();c.arc(hx+4,hy-4.2,1.4,0,7);c.fill();break;
    case 'feather':c.fillStyle=col;c.fillRect(hx-5,hy-3.6,11,1.8);c.fillStyle='#ffd36b';c.save();c.translate(hx-6,hy-8);c.rotate(-.9);c.beginPath();c.ellipse(0,0,1.9,5.2,0,0,7);c.fill();c.restore();
      line(c,hx-3.2,hy-3.5,hx-5.6,hy-13,.6,'#c9b79a');break;
    case 'wolf':c.fillStyle=col;[[-4.5,-3,-6.5,-11,-0.5,-5],[1,-5.5,3.5,-12.5,5.5,-3.5]].forEach(([a,b,cx,cy,d,e])=>{c.beginPath();c.moveTo(hx+a,hy+b);c.lineTo(hx+cx,hy+cy);c.lineTo(hx+d,hy+e);c.closePath();c.fill();});
      c.fillStyle='#f3e6cf';c.beginPath();c.moveTo(hx-4.3,hy-4.5);c.lineTo(hx-5.6,hy-9);c.lineTo(hx-2,hy-5.5);c.closePath();c.fill();break;
    case 'halo':c.strokeStyle='#ffd36b';c.lineWidth=1.4;c.beginPath();c.ellipse(hx,hy-8.5,5,1.7,0,0,7);c.stroke();
      c.fillStyle='rgba(255,211,107,.35)';c.beginPath();c.ellipse(hx,hy-8.5,6.5,2.6,0,0,7);c.fill();break;
    case 'robot':c.fillStyle=L.skin;rr(c,hx-5.4,hy-5.4,11.4,11,2.6);c.fill();c.fillStyle='#8a95a6';c.fillRect(hx-5.4,hy+3.2,11.4,1.6);
      c.fillStyle='#252a36';rr(c,hx-1.2,hy-1.6,7.4,3.4,1.4);c.fill();c.fillStyle=blink?'#5a6474':'#7ff0ff';c.fillRect(hx+.3,hy-.6,1.9,1.4);c.fillRect(hx+3.2,hy-.6,1.9,1.4);
      line(c,hx,hy-5.4,hx,hy-9.5,1,'#5f6a7a');c.fillStyle=col;c.beginPath();c.arc(hx,hy-10.2,1.6,0,7);c.fill();break;
    case 'alien':line(c,hx-2,hy-4.5,hx-4.5,hy-11,.9,L.hair);line(c,hx+2,hy-4.5,hx+4.5,hy-11.5,.9,L.hair);
      c.fillStyle=col;c.beginPath();c.arc(hx-4.5,hy-11.5,1.5,0,7);c.arc(hx+4.5,hy-12,1.5,0,7);c.fill();
      c.fillStyle='#14102a';c.beginPath();c.ellipse(hx+1.8,hy+.1,1.4,2.1,-.2,0,7);c.fill();c.beginPath();c.ellipse(hx+4.6,hy+.1,1.3,2,.2,0,7);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(hx+1.4,hy-.8,.45,0,7);c.arc(hx+4.2,hy-.8,.45,0,7);c.fill();break;
    case 'hood':c.fillStyle=shade(col,.8);c.beginPath();c.arc(hx,hy-.2,6.8,Math.PI*.92,Math.PI*2.08);c.lineTo(hx+6.4,hy+5);c.lineTo(hx+4.6,hy+1.6);c.arc(hx+.6,hy+.5,4.6,0,Math.PI,true);c.lineTo(hx-6.2,hy+5);c.closePath();c.fill();
      c.fillStyle='rgba(190,170,255,.9)';c.beginPath();c.arc(hx+2,hy+.3,1,0,7);c.arc(hx+4.3,hy+.3,.9,0,7);c.fill();break;
    case 'stone':c.fillStyle='#8e86a6';c.beginPath();c.moveTo(hx-5.8,hy-2.3);c.lineTo(hx-4.6,hy-7.6);c.lineTo(hx-1.6,hy-5.4);c.lineTo(hx+.4,hy-9);c.lineTo(hx+3,hy-5.5);c.lineTo(hx+5.4,hy-7.2);c.lineTo(hx+6,hy-2.3);c.closePath();c.fill();
      c.strokeStyle='rgba(60,50,90,.55)';c.lineWidth=.7;c.beginPath();c.moveTo(hx-2.4,hy-2);c.lineTo(hx-1,hy+1);c.lineTo(hx-2.2,hy+3.6);c.stroke();
      c.fillStyle=blink?'#8e86a6':col;c.beginPath();c.arc(hx+2,hy+.3,1.1,0,7);c.arc(hx+4.3,hy+.3,1,0,7);c.fill();
      c.strokeStyle='rgba(255,211,107,.85)';c.lineWidth=1.1;c.beginPath();c.ellipse(hx,hy-11,4.6,1.5,-.25,Math.PI*.85,Math.PI*2.05);c.stroke();break;
  }
}
function humanoid(c,col,clan,bob,stride,frontArm){const L=CLAN_LOOK[clan];
  const lg=stride*2;
  c.fillStyle='#3b3350';rr(c,-4,-6+Math.max(0,lg),3,6-Math.max(0,lg),1);c.fill();rr(c,1,-6+Math.max(0,-lg),3,6-Math.max(0,-lg),1);c.fill();
  line(c,-3.5,-13+bob,-6,-8+bob,2.4,shade(L.skin,.85));
  c.fillStyle=col;rr(c,-5.5,-15.5+bob,11,10.5,3.6);c.fill();
  c.fillStyle='rgba(255,255,255,.18)';rr(c,-4.5,-14.5+bob,3,7,1.5);c.fill();
  c.fillStyle=shade(col,.58);c.fillRect(-5.5,-8.6+bob,11,1.7);
  c.fillStyle='#ffd36b';c.fillRect(-.8,-8.8+bob,1.8,2.1);
  if(frontArm)frontArm(L);
}
// Montarias e feras das unidades exclusivas (urso da Geada, lobo dos Fera, camelo dos Duna).
function beast(c,kind,col,t,seed,moving){const B={bear:{b:'#f4f6fb',d:'#cfd6e6',L:12,H:6.4,leg:6,w:3},wolf:{b:'#9a94a6',d:'#6f6980',L:10,H:4.4,leg:7,w:2},camel:{b:'#d9b77c',d:'#b8935a',L:10.5,H:5,leg:9,w:2}}[kind];
  const g1=Math.sin(t*.03)*(moving?2.5:0),mb=Math.sin(t*.004+seed)*.5,by=-B.leg-B.H+2+mb;
  [[-7,g1],[-3,-g1],[4,g1],[8,-g1]].forEach(([lx,o])=>line(c,lx,by+2,lx+o*.6,0,B.w,B.d));
  if(kind==='wolf')line(c,-9,by-1,-14.5,by-6+Math.sin(t*.008+seed)*1.5,2.8,B.b);
  if(kind==='camel')line(c,-10,by,-12,by+5,1.3,B.d);
  c.fillStyle=B.b;c.beginPath();c.ellipse(0,by,B.L,B.H,0,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-3,by-B.H*.45,B.L*.45,B.H*.3,0,0,7);c.fill();
  if(kind==='bear'){c.fillStyle=B.b;c.beginPath();c.arc(8.6,by-7,1.9,0,7);c.arc(13.2,by-7,1.9,0,7);c.fill();c.beginPath();c.arc(11,by-2.5,5.2,0,7);c.fill();
    c.fillStyle=B.d;c.beginPath();c.ellipse(15,by-1.2,2.8,2.1,0,0,7);c.fill();c.fillStyle='#2a1e2e';c.beginPath();c.arc(17,by-1.8,.95,0,7);c.arc(12.4,by-3.6,.8,0,7);c.fill();
    c.fillStyle=col;rr(c,-6,by-B.H-.5,11,3.4,1.6);c.fill();}
  else if(kind==='wolf'){c.fillStyle=B.b;c.beginPath();c.ellipse(10.5,by-3,4.2,3.2,0,0,7);c.fill();c.beginPath();c.moveTo(12.5,by-5);c.lineTo(18,by-1.8);c.lineTo(12.5,by-.5);c.closePath();c.fill();
    c.beginPath();c.moveTo(7.6,by-5);c.lineTo(8.2,by-10.5);c.lineTo(10.4,by-5.6);c.closePath();c.fill();c.beginPath();c.moveTo(10.6,by-5.6);c.lineTo(12,by-10.5);c.lineTo(13.2,by-5);c.closePath();c.fill();
    c.fillStyle='#2a1e2e';c.beginPath();c.arc(18,by-1.9,.9,0,7);c.fill();c.fillStyle='#ffd36b';c.beginPath();c.arc(12.6,by-3.6,.9,0,7);c.fill();
    line(c,7,by-5.4,7,by+1.2,1.8,col);c.fillStyle='#f3efff';c.beginPath();c.moveTo(14.5,by-.9);c.lineTo(15.4,by+1);c.lineTo(16.2,by-.9);c.fill();}
  else{c.fillStyle=B.b;c.beginPath();c.ellipse(-1,by-5,5.2,4.2,0,0,7);c.fill();line(c,8,by-1,11.5,by-11,3.4,B.b);
    c.beginPath();c.ellipse(13.2,by-12,3.5,2.4,.2,0,7);c.fill();c.fillStyle=B.d;c.beginPath();c.moveTo(10.6,by-13.6);c.lineTo(11,by-16.6);c.lineTo(12.4,by-13.8);c.fill();
    c.fillStyle='#2a1e2e';c.beginPath();c.arc(14,by-12.6,.75,0,7);c.fill();
    c.fillStyle=col;rr(c,-8.5,by-3,6,7,1.6);c.fill();rr(c,.5,by-3,6,7,1.6);c.fill();c.fillStyle=shade(col,.7);c.fillRect(-8.5,by-.5,6,1.2);c.fillRect(.5,by-.5,6,1.2);
    c.fillStyle='#f3e7cf';rr(c,-5,by-11.5,8,4,1.6);c.fill();c.fillStyle='#ffd36b';c.beginPath();c.arc(-5.5,by+1.6,1.3,0,7);c.arc(3.5,by+1.6,1.3,0,7);c.fill();
    line(c,-2,by-11,-2,by-22,1,'#8a5a36');c.fillStyle=col;c.beginPath();c.moveTo(-2,by-22);c.lineTo(5+Math.sin(t*.01)*1,by-20);c.lineTo(-2,by-17.5);c.closePath();c.fill();}
  return by-B.H;}
function riderOn(c,col,clan,ry,bob,blink,skin){line(c,-3,ry+3+bob,-4.5,ry+7+bob,2.2,shade(skin,.85));c.fillStyle=col;rr(c,-4.5,ry+bob,9,9,3.2);c.fill();c.fillStyle='rgba(255,255,255,.18)';rr(c,-3.6,ry+1+bob,2.6,6,1.2);c.fill();
  line(c,3,ry+3+bob,5.5,ry+5+bob,2.2,skin);drawHead(c,0,ry-4.5+bob,clan,col,blink);}
function drawChar(c,type,clan,col,x,y,face,t,seed,moving,scale=1){
  c.save();c.translate(x,y);c.scale(face*scale,scale);
  const bob=Math.sin(t*.004+seed)*.7, blink=((t*.001+seed*1.7)%4)<.12, stride=moving?Math.sin(t*.03):0;
  const skin=CLAN_LOOK[clan].skin;
  switch(type){
    case 'batedor':
      humanoid(c,col,clan,bob,stride,()=>{line(c,3.5,-13+bob,7,-11+bob,2.4,skin);line(c,7,-10+bob,10.5,-21+bob,2.3,'#8a5a36');c.fillStyle='#a06a40';c.beginPath();c.arc(10.8,-22+bob,2.4,0,7);c.fill();});

      line(c,7.5,1,7.5,-29+bob,1.6,'#8a5a36');c.fillStyle='#e3e9f3';c.beginPath();c.moveTo(7.5,-34+bob);c.lineTo(9.6,-28.5+bob);c.lineTo(5.4,-28.5+bob);c.closePath();c.fill();
      c.fillStyle=col;c.beginPath();c.moveTo(7.5,-27+bob);c.lineTo(3,-25.5+bob);c.lineTo(7.5,-24+bob);c.fill();
      humanoid(c,col,clan,bob,stride,()=>{line(c,3.5,-13+bob,7,-14+bob,2.4,skin);});
      drawHead(c,0,-20.5+bob,clan,col,blink);
      c.fillStyle=shade(col,.72);c.beginPath();c.ellipse(-3.5,-10.5+bob,5,6.6,0,0,7);c.fill();c.strokeStyle='#f3efff';c.lineWidth=1;c.stroke();
      c.fillStyle='#ffd36b';c.beginPath();c.moveTo(-3.5,-14+bob);c.lineTo(-1.5,-10.5+bob);c.lineTo(-3.5,-7+bob);c.lineTo(-5.5,-10.5+bob);c.closePath();c.fill();break;
    case 'fundeiro':{
      c.fillStyle='#8a5a36';rr(c,-7,-11+bob,3,5,1);c.fill();
      humanoid(c,col,clan,bob,stride,()=>{line(c,3.5,-14+bob,6.5,-20.5+bob,2.4,skin);
        const a=t*.009+seed;const sx=6.5+Math.cos(a)*6,sy=-20.5+bob+Math.sin(a)*3.5;line(c,6.5,-20.5+bob,sx,sy,.8,'#d8c3a5');c.fillStyle='#8f88a3';c.beginPath();c.arc(sx,sy,1.6,0,7);c.fill();});
      drawHead(c,0,-20.5+bob,clan,col,blink);break;}
    case 'cavaleiro':{
      const g1=Math.sin(t*.03)*(moving?2.5:0);const mb=Math.sin(t*.004+seed)*.5;
      [[-7,g1],[-3,-g1],[4,g1],[8,-g1]].forEach(([lx,o])=>line(c,lx,-7+mb,lx+o*.6,0,2,'#b9a68a'));
      c.fillStyle='#ece0cb';c.beginPath();c.ellipse(0,-10+mb,10.5,5.3,0,0,7);c.fill();
      c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-4,-12+mb,4,1.6,0,0,7);c.fill();
      line(c,7,-12+mb,10.5,-21+mb,4.2,'#ece0cb');
      c.fillStyle='#ece0cb';c.beginPath();c.ellipse(12,-22+mb,3.4,2.5,.2,0,7);c.fill();
      c.fillStyle='#d9c8ad';c.beginPath();c.moveTo(9.5,-24+mb);c.lineTo(10.5,-28+mb);c.lineTo(11.6,-24+mb);c.fill();
      c.fillStyle='#2a1e2e';c.beginPath();c.arc(12.8,-22.6+mb,.75,0,7);c.fill();
      line(c,-10,-11+mb,-12.5,-6+mb,1.6,'#d9c8ad');
      c.fillStyle=col;rr(c,-6,-15.5+mb,11,4.5,2);c.fill();c.fillStyle='#ffd36b';c.fillRect(-6,-12.2+mb,11,1);
      line(c,4,-17+bob,13,-36+bob,1.4,'#8a5a36');c.fillStyle=col;c.beginPath();c.moveTo(13,-36+bob);c.lineTo(5.5+Math.sin(t*.01)*1,-33.5+bob);c.lineTo(12,-31.5+bob);c.closePath();c.fill();
      line(c,-3,-21+bob,-4.5,-17+bob,2.2,shade(skin,.85));
      c.fillStyle=col;rr(c,-4.5,-24+bob,9,9,3.2);c.fill();c.fillStyle='rgba(255,255,255,.18)';rr(c,-3.6,-23+bob,2.6,6,1.2);c.fill();
      line(c,3,-21+bob,5.5,-19+bob,2.2,skin);
      drawHead(c,0,-28.5+bob,clan,col,blink);break;}
    case 'guarda':
      line(c,8,-12+bob,12.5,-29+bob,1.7,'#e3e9f3');line(c,5.5,-13.5+bob,10.5,-11+bob,1.5,'#ffd36b');
      humanoid(c,col,clan,bob,stride,()=>{line(c,3.5,-13+bob,7.5,-13+bob,2.4,skin);});
      drawHead(c,0,-20.5+bob,clan,col,blink);
      c.fillStyle='rgba(127,224,210,.88)';c.beginPath();c.moveTo(-4,-19+bob);c.lineTo(2,-15+bob);c.lineTo(1,-5+bob);c.lineTo(-4,-1+bob);c.lineTo(-9,-5+bob);c.lineTo(-10,-15+bob);c.closePath();c.fill();c.strokeStyle='#e6fffb';c.lineWidth=1;c.stroke();
      c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.moveTo(-4,-17+bob);c.lineTo(-2,-13+bob);c.lineTo(-4,-6+bob);c.lineTo(-6.5,-13+bob);c.closePath();c.fill();break;
    case 'cantor':{
      humanoid(c,col,clan,bob,stride,()=>{line(c,3.5,-14+bob,7.5,-21+bob,2.4,skin);});
      drawHead(c,0,-20.5+bob,clan,col,blink);
      const gl=.5+.3*Math.sin(t*.006+seed);c.fillStyle=`rgba(255,211,107,${gl*.55})`;c.beginPath();c.arc(9,-25+bob,5.5,0,7);c.fill();c.fillStyle='#ffe9a8';c.beginPath();c.arc(9,-25+bob,2.6,0,7);c.fill();
      for(let i=0;i<3;i++){const k=((t*.0006+i*.33+seed)%1);const nx=-8-k*4+i*2,ny=-22-k*12+bob;c.fillStyle=`rgba(255,240,190,${1-k})`;c.beginPath();c.ellipse(nx,ny,1.5,1.1,-.4,0,7);c.fill();line(c,nx+1.3,ny,nx+1.3,ny-4,.7,`rgba(255,240,190,${1-k})`);}
      c.fillStyle=shade(col,.7);rr(c,-5.5,-7.2+bob,11,6.5,2);c.fill();break;}
    case 'sombra':{
      c.fillStyle='rgba(28,22,50,.92)';c.beginPath();c.moveTo(0,-31+bob);c.quadraticCurveTo(10,-22+bob,8,0);c.lineTo(-8,0);c.quadraticCurveTo(-10,-22+bob,0,-31+bob);c.closePath();c.fill();

  up('primeira_partida');up('veterano',st.games*10);if(r.won)up('primeira_vitoria');if(dom)up('dominacao');if(conq)up('conquista');if(r.won&&!dom&&!conq)up('pontos');
