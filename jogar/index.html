ivé","Désactivé","Effets sonores","touches, combats et conquêtes","Musique","bande-son douce pendant le jeu","Vibration","lors des attaques, des conquêtes et des alertes","indisponible sur cet appareil","Vitesse des animations","déplacement des unités et tour des rivaux","Rapide","Normale","Refaire la partie guidée","à la prochaine partie","Effacer la partie sauvegardée","tour {n}","aucune","{n} enregistrés","Astuce {a} sur {b}","Passer","Suivante","Jouer","Unissez les tuiles du monde","Nouvelle partie","Continuer","tour {a} sur {b}","Défi du jour","Classique","Plus d'options","Clans","Exclusif : {u}","L'histoire des {c}","Unité exclusive","Coûte {n} ✦ et requiert {t}.","Capitale","Grande Œuvre : {g}.","Le monde s'est brisé en tuiles flottantes. Les clans recollent les morceaux grâce aux Lumens (✦), l'énergie qui jaillit de chaque ville. En {n} tours, celui qui a le plus de points unit la mosaïque.","Choisissez votre clan","Clans spéciaux","Difficulté","Mode de jeu","Lancer la partie","Calendrier des Saisons","L'année compte 4 saisons de {n} tours. Pendant chacune, les clans de la saison gagnent +{b} en attaque sur toutes leurs unités. L'hiver gèle l'eau peu profonde et les récoltes rapportent +1 pop seulement en été.","(votre clan)","Options avancées","Graine de la carte","Le même nombre génère toujours la même carte. Laissez-le tel quel pour une carte aléatoire.","{c} en danger","c'est votre dernière ville","peut tomber au prochain tour","Ennemis près de {c}","{c} n'est pas protégée et c'est votre dernière ville. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","{c} n'est pas protégée. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","Voici votre <b>Éclaireur</b>. Touchez-le pour voir jusqu'où il peut aller.","Les <b>points blancs</b> montrent sa portée. Touchez-en un pour vous déplacer et révéler la carte.","Touchez la <b>case en surbrillance</b> de votre territoire et utilisez l'action dorée qui apparaît en bas. Récolter fait grandir la ville.","Touchez maintenant votre <b>capitale</b> (la ville au losange doré) et recrutez une unité. Une ville vide peut être prise.","Ouvrez <b>Technologie</b> pour voir ce que votre clan peut apprendre. Chaque recherche débloque des unités ou des bâtiments.","Quand il n'y a plus rien à faire, touchez <b>Fin du tour</b>. Les autres clans jouent et vous recevez des Lumens (✦).","L'heure de grandir : amenez une unité jusqu'au <b>village neutre</b> en surbrillance et terminez le tour dessus pour l'occuper.","L'heure de grandir : explorez avec l'Éclaireur jusqu'à trouver un <b>village neutre</b> (toits gris) et terminez le tour dessus.","Vous connaissez l'essentiel. Gagne celui qui a le plus de points au tour {n}, ou celui qui conquiert tous ses rivaux. Toutes les astuces sont dans le Menu.","Vétéran !","{u} a gagné +5 de vie","Village occupé !","Ville conquise !","{city} appartient désormais au clan {c}","Ville perdue","{c} a pris {city}","Clan éliminé","{c} a quitté la mosaïque","Grande Œuvre achevée · +300 points","Monument érigé","{m} · +250 points","Dernier tour","Faites compter chaque action","Plus que 5 tours avant la fin de la partie.","{c} est sans défense","Un ennemi peut atteindre la ville au prochain tour, et c'est votre <b>dernière ville</b> : si elle tombe, la partie est finie. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Un ennemi peut atteindre la ville au prochain tour. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Terminer quand même","Défendre la ville","Guide fermé. Les astuces sont dans le Menu.","Braise","volcans et cendres","Les ponts deviennent terre ferme (la lave se solidifie) et les Béliers coûtent 5 ✦.","Quand le monde s'est brisé, le volcan Ignéa est resté allumé sur une seule tuile. Les Braise sont nés autour de lui et ont juré de ne jamais laisser s'éteindre la première flamme. Pour eux, seul le feu peut ressouder ce qui a été brisé.","Forge-Volcan","Marée","récifs","Port : les unités sur l'eau ont +1 de déplacement et pêcher coûte 1 ✦.","L'archipel des Marée a sombré lors de la Grande Fracture et tout le peuple a passé une génération sur des radeaux. Ils ont appris à lire les courants en suivant les poissons-lanternes. Aujourd'hui, ils cherchent, tuile après tuile, le récif où tout a commencé.","Phare de Corail","Racine","forêt dense","Les unités en forêt ont +1 de défense.","Les Racine descendent des jardiniers de l'Arbre-Mère, dont les racines ont retenu les derniers morceaux de terre pendant la Fracture. Chacune de leurs villes naît d'une de ses graines. Pour les Racine, unir la mosaïque, c'est replanter la forêt originelle.","Maison-Arbre","Givre","toundra","Traverse l'eau peu profonde sans bateau (glace).","Chassés des terres chaudes, les Givre ont traversé à pied une mer gelée et survécu là où personne d'autre ne voulait vivre. Ils ont dompté les ours blancs et fait de l'hiver un allié. Ils descendent aujourd'hui de la toundra pour réclamer la place qu'on leur a refusée.","Igloo de Cristal","Dune","désert","Oasis : le marché coûte 3 ✦ et les Caravanes rapportent des Lumens.","Là où des éclats de Lumen sont tombés dans le désert, des oasis ont jailli. Les Dune ont été les premiers à les trouver et ont bâti des bazars autour de chacune. Leurs caravanes relient les tuiles par le commerce avant qu'aucune armée n'arrive.","Palais de l'Oasis","Vent","hauts plateaux","Les Cavaliers ont +1 de déplacement et coûtent 3 ✦.","Nomades des hauts plateaux, les Vent n'ont jamais bâti de murailles : leur maison, c'est la selle. On dit qu'ils ont entendu venir la Fracture dans le sifflement du vent et qu'ils ont survécu grâce à cela. Ils chevauchent derrière la voix qui promet de nouveau un monde entier.","Moulin des Vents","Fauve","savanes et bois","Meute : chasser ne coûte que 1 ✦.","Des enfants perdus lors de la Fracture ont été recueillis par une meute de loups-mousse. Ils ont grandi en chassant ensemble et sont revenus en clan qui partage tout ce qu'il abat. Pour les Fauve, la mosaïque est un territoire de chasse qui n'a besoin que d'une seule meute.","Tanière du Totem","Lueur","canyons de cristal","Les Ponts de Lumen coûtent 1 ✦ et durent deux fois plus longtemps.","Moines des canyons de cristal, les Lueur ont découvert comment solidifier la lumière et ont bâti les premiers Ponts de Lumen. Ils gardent le secret dans des monastères dorés. Ils croient que le monde se réunit avec des ponts, pas avec des épées, mais ils portent quand même des épées.","Obélisque de Lumen","Automates","citadelles de métal","Blindage : toutes les unités naissent avec +3 de vie.","Armée de robots humanoïdes","En 2053, les Automates mènent la Guerre du Futur contre les Astres et sont en train de la perdre. L'Unité Zéro a calculé la seule issue : remonter le temps et conquérir le passé avant l'arrivée de l'ennemi. Une armée de robots humanoïdes a franchi le portail et bâti son premier centre de données à l'ère de la mosaïque.","Centre de Données","Astres","cratère d'atterrissage","Vision orbitale : les unités voient +1 case plus loin.","Extraterrestres","Les Astres sont venus des étoiles pour dominer le monde en 2053 et ont trouvé une résistance de métal. En interceptant le plan des Automates, ils ont lancé un vaisseau par le même portail temporel. Ils ont atterri dans le passé avec une mission : traquer les robots et prendre le monde avant que la guerre ne commence.","Vaisseau Posé","Spectres","brumes éternelles","Brume : ils traversent les montagnes sans Escalade et y ont +1 de défense.","Peuple des ombres","Les Spectres sont les ombres de ceux qui ont disparu lors de la Grande Fracture, prisonnières entre une tuile et une autre. Ils vivent dans les brumes et traversent les montagnes comme du brouillard. Ils croient que, si la mosaïque est unie, ils retrouveront un corps.","Mausolée des Brumes","Colosses","ruines célestes","Peau de pierre : chaque coup reçu inflige 1 dégât de moins.","Anges déchus de pierre","Les Colosses étaient des anges. Quand le monde s'est brisé, ils sont tombés du ciel avec les éclats et, en touchant le sol, leurs ailes et leur peau sont devenues pierre. Géants lents et presque indestructibles, ils veulent réunir la mosaïque pour ériger l'escalier qui les ramènera chez eux.","Trône Déchu","Cueillette","Récolter des fruits dans les champs (+1 pop).","Chasse","Chasser les animaux en forêt (+1 pop).","Navigation","Entrer en eau peu profonde et pêcher (+1 pop).","Escalade","Gravir les montagnes (défense ×1,5).","Forge","Recruter un Lancier (défense 3).","Équitation","Recruter un Cavalier (déplacement 2, attaque et recule).","Commerce","Construire un Marché (+1 ✦ par tour).","Lumenerie","Ériger des Ponts de Lumen sur l'eau peu profonde (ils durent 8 tours).","Agriculture","Construire une Ferme dans les champs (+2 pop).","Tir","Recruter un Frondeur (portée 2).","Haute Mer","Naviguer sur l'océan.","Exploitation minière","Construire une Mine sur le minerai (+2 pop).","Siège","Recruter un Bélier (attaque 4).","Diplomatie","Proposer des pactes de trêve.","Défrichement","Agrandir le territoire de n'importe quelle ville au rayon 2 (6 ✦), sans attendre le niveau 4.","Ingénierie","Ériger la Grande Œuvre de votre clan dans la capitale (30 ✦, une par partie).","Urbanisme","Construire une Place dans chaque ville (8 ✦ : +3 pop, +40 points).","Cartographie","Révèle toute la carte immédiatement.","Tactique","Toutes vos unités gagnent +1 en attaque.","Fortification","Acheter une Muraille dans n'importe quelle ville (6 ✦).","Sylviculture","Construire une Scierie en forêt (+2 pop) et la chasse rapporte +1 pop de plus.","Architecture","Fermes, mines et scieries donnent +1 pop (y compris celles déjà construites), chaque marché rapporte +1 ✦ et les ponts deviennent permanents.","Alliance","Les trêves durent 10 tours et le tribut est divisé par deux.","Forge Éternelle","Grand Phare","Chaque ville au bord de l'eau rapporte +1 ✦ par tour.","Arbre-Mère","Toutes vos villes gagnent +2 de population maintenant.","Palais de Glace","Vos villes de niveau 3 ou plus reçoivent une Muraille maintenant.","Grand Bazar","Chaque ville rapporte +1 ✦ par tour.","Tour des Vents","Révèle toute la carte et toutes vos villes gagnent +1 de population.","Totem de la Meute","Toutes vos unités se soignent et gagnent +5 de vie maximale.","Prisme Solaire","La capitale rapporte désormais +3 ✦ par tour.","Chaîne de Montage","Chaque ville que vous possédez maintenant rapporte +1 ✦ par tour.","Vaisseau-Mère","Révèle toute la carte et rapporte +10 ✦ maintenant.","Voile Éternel","Vos unités se soignent entièrement et chaque ville gagne +1 de population.","Escalier du Ciel","Toutes vos unités gagnent +1 en défense.","Éclaireur","Lancier","Frondeur","Cavalier","Bélier","Gardien","Pyromancien","Lance du feu à 2 cases avec une attaque de 3.","Harponneur","Attaque 3 et défense 2 : le lancier des récifs.","Druide","Au début du tour, soigne 3 de vie aux alliés voisins.","Cavalier d'Ours","Monture lourde : 16 de vie et attaque 3.","Caravane","Se déplace de 2 cases et rapporte +1 ✦ par tour tant qu'elle vit (jusqu'à 2 caravanes comptent).","Fauconnier","Le faucon attaque à 3 cases de distance.","Loup de Meute","Bon marché et rapide : se déplace de 2 cases, attaque et recule.","Sentinelle de Cristal","Bouclier de cristal : défense 4.","Mecha","Robot géant avec 20 de vie et une attaque de 4. Requiert une ville de niveau 3.","Soucoupe Volante","Vole au-dessus de l'eau, des forêts et des montagnes, 2 cases par tour.","Revenant","Attaque sans subir de contre-attaque.","Séraphin de Pierre","Ailes de pierre : traverse forêts et montagnes sans s'arrêter.","Plaine","Forêt","Montagne","Eau peu profonde","Océan","Fruits","Poissons","Minerai","Atelier","+1 ✦ par tour dans cette ville","Expédition","Une expédition révèle la carte alentour et un Éclaireur est prêt à agir","Défense ×3 pour qui garde la ville","Trésor","+5 ✦ maintenant","Frontière","Le territoire s'étend au rayon 2","Festival","+3 de population","Super-unité gratuite","Jardin de Lumen","+150 points","Route commerciale","+2 ✦ par tour dans cette ville","Phare de la Mosaïque","Explorer 60 % de la carte","Métropole","Avoir une ville de niveau 5","Empire","Avoir 5 villes","Arène des Vétérans","Gagner 10 combats","Facile","Difficile","Printemps","pluies et rivières en crue","chaleur et soleil ardent","Automne","bourrasques sur les hauts plateaux","glace et neige","Baies de lumière","Ressource · fruits","Buisson de baies qui brillent au crépuscule. Cueillez-les avec Cueillette.","Cerf-mousse","Ressource · gibier","Cerf paisible aux bois de mousse. Chassez-le avec la technologie Chasse.","Poisson-lanterne","Ressource · poissons","Poisson qui allume une lumière dans l'eau peu profonde. Pêchez-le avec Navigation.","Cristal vivant","Ressource · minerai","Cristaux qui poussent à l'intérieur de la roche. Construisez une Mine avec Exploitation minière.","Ferme","Bâtiment · +2 pop","Parcelles de blé doré. Requiert Agriculture.","Mine de cristal","Galerie avec des rails et un wagonnet de cristaux. Requiert Exploitation minière.","Marché","Bâtiment · +1 ✦/tour","L'étal d'échanges de la ville. Un par ville. Requiert Commerce.","Scierie","Rondins empilés et une scie actionnée par le Lumen. Requiert Sylviculture.","Ruines anciennes","Exploration","Arche d'un monde antérieur à la mosaïque. La première unité qui arrive gagne une récompense.","Sanctuaire de Lumen","Bâtiment · +2 pop · +60 pts","Autel de pierre avec un cristal de Lumen. Il peut être érigé sur une plaine ou une forêt libres ; chaque nouveau sanctuaire coûte 4 ✦ de plus.","Passage","Lumière solidifiée au-dessus de l'eau peu profonde. N'importe quel clan peut la traverser tant qu'elle dure.","Bienvenue dans Mosaica","Votre clan commence avec une capitale et un Éclaireur. Touchez l'Éclaireur pour voir où il peut aller (points blancs). Amenez des unités jusqu'aux villages neutres et terminez le tour dessus pour les occuper.","Lumens et villes","Les Lumens (✦) arrivent à chaque tour. Touchez les cases de votre territoire pour récolter des ressources : la ville gagne de la population, monte de niveau et chaque niveau donne une récompense.","Technologie","Dans Technologie, vous débloquez des unités et des bâtiments. Au niveau 2, l'Ingénierie débloque la Grande Œuvre de votre clan, qui vaut 300 points.","Combat","Les cercles rouges montrent qui vous pouvez attaquer, avec un aperçu des dégâts. Si vous vous êtes trompé de déplacement, utilisez Annuler avant d'attaquer (impossible après avoir ouvert des ruines).","Comment gagner","La partie dure 30 tours. Gagne celui qui a le plus de points, ou celui qui conquiert tous ses rivaux. Les villes conquises restent instables pendant 3 tours, et chaque ville au-delà de 5 coûte 1 ✦ par tour.","Plateau de jeu","Tableau des scores","Points","Lumens","Tour","Annuler le dernier déplacement (raccourci : Z)","Annuler","Actions","Raccourci : espace","Raccourci : Entrée","Revenu par tour : une ville de niveau 1 rapporte 2 ✦, +1 par niveau, et la capitale rapporte +1.","Combat sans dés : dégâts = part d'attaque × Attaque × 4. Si le défenseur survit et peut atteindre l'attaquant, il contre-attaque.","Forêts, montagnes et villes donnent une défense ×1,5. Une Muraille donne ×3.","La technologie coûte 4 + niveau × nombre de villes. Grandir vite rend la recherche plus chère.","Saisons : tous les 8 tours, l'été (récoltes +1 pop) et l'hiver (l'eau peu profonde gèle et devient un chemin) alternent.","Mode Saisons (facultatif) : printemps, été, automne et hiver alternent tous les {n} tours, et chaque saison donne +{b} en attaque à ses clans.","Les Ponts de Lumen relient les îles pour 3 ✦. Les pactes donnent une trêve de 5 tours ; la rompre coûte 150 points.","Une ville conquise reste instable pendant 3 tours (pas de revenu ni de recrutement). Chaque ville au-delà de 5 coûte 1 ✦ par tour.","Chaque clan possède une unité exclusive (marquée d'une ★ au recrutement), sa propre capitale et une histoire.","Points : niveaux des villes, territoir iv: {u}","Die Geschichte der {c}","Exklusive Einheit","Kostet {n} ✦ und benötigt {t}.","Hauptstadt","Großes Werk: {g}.","Die Welt ist in schwebende Kacheln zerbrochen. Die Clans fügen die Stücke mit Lumen (✦) wieder zusammen, der Energie, die aus jeder Stadt strömt. Wer nach {n} Runden die meisten Punkte hat, vereint das Mosaik.","Wähle deinen Clan","Sonder-Clans","Schwierigkeit","Spielmodus","Partie starten","Kalender der Jahreszeiten","Das Jahr hat 4 Jahreszeiten zu je {n} Runden. In jeder erhalten die Clans dieser Jahreszeit +{b} Angriff für alle Einheiten. Der Winter lässt das Flachwasser gefrieren, und Ernten bringen nur im Sommer +1 Bev.","(dein Clan)","Erweiterte Optionen","Karten-Seed","Dieselbe Zahl erzeugt immer dieselbe Karte. Lass sie, wie sie ist, für eine Zufallskarte.","{c} in Gefahr","es ist deine letzte Stadt","könnte nächste Runde fallen","Feinde nahe {c}","{c} ist ungeschützt und deine letzte Stadt. Lass eine Einheit darin oder besiege den Feind daneben.","{c} ist ungeschützt. Lass eine Einheit darin oder besiege den Feind daneben.","Das ist dein <b>Späher</b>. Tippe ihn an, um zu sehen, wie weit er ziehen kann.","Die <b>weißen Punkte</b> zeigen die Reichweite. Tippe auf einen, um zu ziehen und die Karte aufzudecken.","Tippe auf das <b>hervorgehobene Feld</b> in deinem Gebiet und nutze die goldene Aktion unten. Ernten lässt die Stadt wachsen.","Tippe jetzt auf deine <b>Hauptstadt</b> (die Stadt mit der goldenen Raute) und bilde eine Einheit aus. Eine leere Stadt kann eingenommen werden.","Öffne <b>Technologie</b>, um zu sehen, was dein Clan lernen kann. Jede Forschung schaltet Einheiten oder Gebäude frei.","Wenn es nichts mehr zu tun gibt, tippe auf <b>Runde beenden</b>. Die anderen Clans spielen und du erhältst Lumen (✦).","Zeit zu wachsen: Bring eine Einheit zum hervorgehobenen <b>neutralen Dorf</b> und beende die Runde darauf, um es zu besetzen.","Zeit zu wachsen: Erkunde mit dem Späher, bis du ein <b>neutrales Dorf</b> (graue Dächer) findest, und beende die Runde darauf.","Du kennst jetzt das Wichtigste. Es gewinnt, wer in Runde {n} die meisten Punkte hat oder alle Rivalen erobert. Alle Tipps findest du im Menü.","Veteran!","{u} erhielt +5 Leben","Dorf besetzt!","Stadt erobert!","{city} gehört jetzt dem Clan {c}","Stadt verloren","{c} hat {city} eingenommen","Clan ausgelöscht","{c} hat das Mosaik verlassen","Großes Werk vollendet · +300 Punkte","Monument errichtet","{m} · +250 Punkte","Letzte Runde","Lass jede Aktion zählen","Noch 5 Runden bis zum Ende der Partie.","{c} ist ohne Verteidigung","Ein Feind kann die Stadt nächste Runde erreichen, und sie ist deine <b>letzte Stadt</b>: Fällt sie, ist die Partie vorbei. Lass eine Einheit darin oder bilde jetzt eine aus.","Ein Feind kann die Stadt nächste Runde erreichen. Lass eine Einheit darin oder bilde jetzt eine aus.","Trotzdem beenden","Stadt verteidigen","Anleitung beendet. Die Tipps findest du im Menü.","Glut","Vulkane und Asche","Brücken werden zu festem Boden (die Lava erstarrt) und Rammböcke kosten 5 ✦.","Als die Welt zerbrach, brannte der Vulkan Ignea auf einer einzigen Kachel weiter. Die Glut wurden um ihn herum geboren und schworen, die erste Flamme nie erlöschen zu lassen. Für sie kann nur Feuer wieder zusammenschweißen, was zerbrochen ist.","Vulkanschmiede","Flut","Riffe","Hafen: Einheiten auf dem Wasser haben +1 Bewegung und Fischen kostet 1 ✦.","Der Archipel der Flut versank im Großen Bruch, und das ganze Volk verbrachte eine Generation auf Flößen. Sie lernten, die Strömungen zu lesen, indem sie den Laternenfischen folgten. Heute suchen sie Kachel für Kachel das Riff, an dem alles begann.","Korallen-Leuchtturm","Wurzel","dichter Wald","Einheiten im Wald haben +1 Verteidigung.","Die Wurzel stammen von den Gärtnern des Mutterbaums ab, dessen Wurzeln während des Bruchs die letzten Stücke Land zusammenhielten. Jede ihrer Städte wächst aus einem seiner Samen. Das Mosaik zu vereinen heißt für die Wurzel, den ursprünglichen Wald neu zu pflanzen.","Baumhaus","Frost","Tundra","Überquert Flachwasser ohne Boot (Eis).","Aus den warmen Ländern vertrieben, überquerten die Frost zu Fuß ein gefrorenes Meer und überlebten, wo sonst niemand leben wollte. Sie zähmten die weißen Bären und machten den Winter zu ihrem Verbündeten. Jetzt steigen sie aus der Tundra herab, um den Platz einzufordern, der ihnen verwehrt wurde.","Kristall-Iglu","Düne","Wüste","Oase: Der Markt kostet 3 ✦ und Karawanen bringen Lumen.","Wo Lumensplitter in die Wüste fielen, entsprangen Oasen. Die Düne fanden sie als Erste und errichteten um jede einen Basar. Ihre Karawanen verbinden die Kacheln durch Handel, bevor irgendeine Armee eintrifft.","Oasenpalast","Wind","Hochebenen","Reiter haben +1 Bewegung und kosten 3 ✦.","Nomaden der Hochebenen, die Wind bauten nie Mauern: Ihr Zuhause ist der Sattel. Man sagt, sie hörten den Bruch im Pfeifen des Windes kommen und überlebten deshalb. Sie reiten der Stimme nach, die wieder eine ganze Welt verspricht.","Windmühle","Bestie","Savannen und Wälder","Rudel: Jagen kostet nur 1 ✦.","Im Bruch verlorene Kinder wurden von einem Rudel Mooswölfe aufgenommen. Sie wuchsen gemeinsam jagend auf und kehrten als Clan zurück, der alles teilt, was er erlegt. Für die Bestie ist das Mosaik ein Jagdrevier, das nur ein einziges Rudel braucht.","Totembau","Schein","Kristallschluchten","Lumenbrücken kosten 1 ✦ und halten doppelt so lange.","Mönche der Kristallschluchten, die Schein entdeckten, wie man Licht verfestigt, und bauten die ersten Lumenbrücken. Sie hüten das Geheimnis in goldenen Klöstern. Sie glauben, die Welt finde mit Brücken wieder zusammen, nicht mit Schwertern, tragen aber trotzdem Schwerter.","Lumen-Obelisk","Automaten","Metallzitadellen","Panzerung: Alle Einheiten starten mit +3 Leben.","Armee humanoider Roboter","Im Jahr 2053 führen die Automaten den Krieg der Zukunft gegen die Astrale und verlieren ihn. Einheit Null berechnete den einzigen Ausweg: in der Zeit zurückreisen und die Vergangenheit erobern, bevor der Feind ankommt. Eine Armee humanoider Roboter durchquerte das Portal und errichtete ihr erstes Rechenzentrum im Zeitalter des Mosaiks.","Rechenzentrum","Astrale","Landekrater","Orbitalsicht: Einheiten sehen 1 Feld weiter.","Außerirdische","Die Astrale kamen aus den Sternen, um 2053 die Welt zu beherrschen, und stießen auf einen Widerstand aus Metall. Als sie den Plan der Automaten abfingen, schickten sie ein Schiff durch dasselbe Zeitportal. Sie landeten in der Vergangenheit mit einer Mission: die Roboter jagen und die Welt einnehmen, bevor der Krieg beginnt.","Gelandetes Schiff","Gespenster","ewige Nebel","Nebel: Sie überqueren Berge ohne Klettern und haben dort +1 Verteidigung.","Volk der Schatten","Die Gespenster sind die Schatten derer, die im Großen Bruch verschwanden, gefangen zwischen einer Kachel und der nächsten. Sie leben in den Nebeln und überqueren Berge, als wären sie Dunst. Sie glauben, dass sie wieder einen Körper bekommen, wenn das Mosaik vereint ist.","Nebelmausoleum","Kolosse","himmlische Ruinen","Steinhaut: Jeder erlittene Treffer verursacht 1 Schaden weniger.","Gefallene Engel aus Stein","Die Kolosse waren Engel. Als die Welt zerbrach, fielen sie mit den Splittern vom Himmel, und als sie den Boden berührten, wurden Flügel und Haut zu Stein. Langsame, fast unzerstörbare Riesen, wollen sie das Mosaik wieder vereinen, um die Treppe nach Hause zu errichten.","Gefallener Thron","Sammeln","Früchte auf dem Feld ernten (+1 Bev).","Jagd","Tiere im Wald jagen (+1 Bev).","Seefahrt","Flachwasser befahren und fischen (+1 Bev).","Klettern","Berge besteigen (Verteidigung ×1,5).","Schmieden","Speerträger ausbilden (Verteidigung 3).","Reiten","Reiter ausbilden (Bewegung 2, greift an und zieht sich zurück).","Handel","Markt bauen (+1 ✦ pro Runde).","Lumenkunde","Lumenbrücken über Flachwasser errichten (halten 8 Runden).","Ackerbau","Bauernhof auf dem Feld bauen (+2 Bev).","Schießkunst","Schleuderer ausbilden (Reichweite 2).","Hochsee","Auf dem Ozean segeln.","Bergbau","Mine auf Erz bauen (+2 Bev).","Belagerung","Rammbock ausbilden (Angriff 4).","Diplomatie","Waffenstillstände anbieten.","Erschließung","Das Gebiet jeder Stadt auf Radius 2 erweitern (6 ✦), ohne auf Stufe 4 zu warten.","Ingenieurwesen","Das Große Werk deines Clans in der Hauptstadt errichten (30 ✦, eines pro Partie).","Städtebau","In jeder Stadt einen Platz errichten (8 ✦: +3 Bev, +40 Punkte).","Kartografie","Deckt sofort die ganze Karte auf.","Taktik","Alle deine Einheiten erhalten +1 Angriff.","Befestigung","In jeder Stadt eine Mauer kaufen (6 ✦).","Forstwirtschaft","Sägewerk im Wald bauen (+2 Bev) und Jagen bringt +1 Bev zusätzlich.","Architektur","Bauernhöfe, Minen und Sägewerke geben +1 Bev (auch bereits gebaute), jeder Markt bringt +1 ✦ und Brücken werden dauerhaft.","Allianz","Waffenstillstände dauern 10 Runden und der Tribut halbiert sich.","Ewige Schmiede","Großer Leuchtturm","Jede Stadt am Wasser bringt +1 ✦ pro Runde.","Mutterbaum","Alle deine Städte erhalten jetzt +2 Bevölkerung.","Eispalast","Deine Städte ab Stufe 3 erhalten jetzt eine Mauer.","Großer Basar","Jede Stadt bringt +1 ✦ pro Runde.","Turm der Winde","Deckt die ganze Karte auf und alle deine Städte erhalten +1 Bevölkerung.","Rudeltotem","Alle deine Einheiten heilen sich und erhalten +5 maximales Leben.","Sonnenprisma","Die Hauptstadt bringt nun +3 ✦ pro Runde.","Fließband","Jede Stadt, die du jetzt besitzt, bringt +1 ✦ pro Runde.","Mutterschiff","Deckt die ganze Karte auf und bringt jetzt +10 ✦.","Ewiger Schleier","Deine Einheiten heilen sich vollständig und jede Stadt erhält +1 Bevölkerung.","Himmelstreppe","Alle deine Einheiten erhalten +1 Verteidigung.","Späher","Speerträger","Schleuderer","Reiter","Rammbock","Wächter","Pyromant","Schleudert Feuer 2 Felder weit mit Angriff 3.","Harpunier","Angriff 3 und Verteidigung 2: der Speerträger der Riffe.","Druide","Heilt zu Beginn der Runde benachbarte Verbündete um 3 Leben.","Bärenreiter","Schweres Reittier: 16 Leben und Angriff 3.","Karawane","Zieht 2 Felder und bringt +1 ✦ pro Runde, solange sie lebt (bis zu 2 Karawanen zählen).","Falkner","Der Falke greift aus 3 Feldern Entfernung an.","Rudelwolf","Billig und schnell: zieht 2 Felder, greift an und zieht sich zurück.","Kristallwächter","Kristallschild: Verteidigung 4.","Mecha","Riesenroboter mit 20 Leben und Angriff 4. Benötigt eine Stadt der Stufe 3.","Fliegende Untertasse","Fliegt über Wasser, Wald und Berge, 2 Felder pro Runde.","Spuk","Greift an, ohne einen Gegenangriff zu erleiden.","Steinseraph","Steinflügel: überquert Wald und Berge ohne Halt.","Feld","Wald","Berg","Flachwasser","Ozean","Früchte","Fische","Erz","Werkstatt","+1 ✦ pro Runde in dieser Stadt","Expedition","Eine Expedition deckt die Umgebung auf und ein Späher ist bereit","Verteidigung ×3 für den Wächter der Stadt","Schatz","+5 ✦ sofort","Grenze","Das Gebiet wächst auf Radius 2","Fest","+3 Bevölkerung","Gratis-Supereinheit","Lumengarten","+150 Punkte","Handelsroute","+2 ✦ pro Runde in dieser Stadt","Mosaik-Leuchtturm","60 % der Karte erkunden","Metropole","Eine Stadt der Stufe 5 besitzen","Imperium","5 Städte besitzen","Arena der Veteranen","10 Kämpfe gewinnen","Leicht","Schwer","Frühling","Regen und volle Flüsse","Hitze und starke Sonne","Herbst","Stürme auf den Hochebenen","Eis und Schnee","Leuchtbeeren","Ressource · Früchte","Ein Strauch mit Beeren, die in der Dämmerung leuchten. Pflücke sie mit Sammeln.","Mooshirsch","Ressource · Wild","Ein zahmer Hirsch mit einem Geweih aus Moos. Jage ihn mit der Technologie Jagd.","Laternenfisch","Ressource · Fische","Ein Fisch, der im Flachwasser ein Licht entzündet. Fange ihn mit Seefahrt.","Lebender Kristall","Ressource · Erz","Kristalle, die im Gestein wachsen. Baue mit Bergbau eine Mine.","Bauernhof","Gebäude · +2 Bev","Beete mit goldenem Weizen. Benötigt Ackerbau.","Kristallmine","Ein Stollen mit Schienen und einem Kristallwagen. Benötigt Bergbau.","Markt","Gebäude · +1 ✦/Runde","Der Handelsstand der Stadt. Einer pro Stadt. Benötigt Handel.","Sägewerk","Gestapelte Stämme und eine lumenbetriebene Säge. Benötigt Forstwirtschaft.","Alte Ruinen","Erkundung","Ein Bogen aus einer Welt vor dem Mosaik. Die erste Einheit, die ankommt, erhält eine Belohnung.","Lumen-Schrein","Gebäude · +2 Bev · +60 Pkt.","Ein Steinaltar mit einem Lumenkristall. Er kann auf freiem Feld oder Wald errichtet werden; jeder neue Schrein kostet 4 ✦ mehr.","Übergang","Verfestigtes Licht über dem Flachwasser. Jeder Clan kann es überqueren, solange es hält.","Willkommen in Mosaica","Dein Clan beginnt mit einer Hauptstadt und einem Späher. Tippe den Späher an, um zu sehen, wohin er ziehen kann (weiße Punkte). Bring Einheiten zu neutralen Dörfern und beende die Runde darauf, um sie zu besetzen.","Lumen und Städte","Lumen (✦) kommen jede Runde. Tippe auf Felder in deinem Gebiet, um Ressourcen zu ernten: Die Stadt gewinnt Bevölkerung, steigt auf und jede Stufe bringt eine Belohnung.","Technologie","Unter Technologie schaltest du Einheiten und Gebäude frei. Auf Stufe 2 schaltet Ingenieurwesen das Große Werk deines Clans frei, das 300 Punkte wert ist.","Kampf","Rote Kreise zeigen, wen du angreifen kannst, mit einer Schadensvorschau. Falls du falsch gezogen bist, nutze Rückgängig vor dem Angriff (nicht mehr nach dem Öffnen von Ruinen).","So gewinnst du","Die Partie dauert 30 Runden. Es gewinnt, wer die meisten Punkte hat oder alle Rivalen erobert. Eroberte Städte sind 3 Runden lang instabil, und jede Stadt über 5 kostet 1 ✦ pro Runde.","Spielbrett","Punktestand","Punkte","Lumen","Runde","Letzten Zug rückgängig machen (Kürzel: Z)","Rückgängig","Aktionen","Kürzel: Leertaste","Kürzel: Enter","Einnahmen pro Runde: Eine Stadt der Stufe 1 bringt 2 ✦, +1 pro Stufe, und die Hauptstadt bringt +1.","Kampf ohne Würfel: Schaden = Angriffsanteil × Angriff × 4. Überlebt der Verteidiger und erreicht er den Angreifer, schlägt er zurück.","Wald, Berge und Städte geben Verteidigung ×1,5. Eine Mauer gibt ×3.","Technologie kostet 4 + Stufe × Anzahl der Städte. Schnelles Wachstum verteuert die Forschung.","Jahreszeiten: Alle 8 Runden wechseln Sommer (Ernten +1 Bev) und Winter (Flachwasser gefriert und wird begehbar).","Jahreszeiten-Modus (optional): Frühling, Sommer, Herbst und Winter wechseln alle {n} Runden, und jede Jahreszeit gibt ihren Clans +{b} Angriff.","Lumenbrücken verbinden Inseln für 3 ✦. Pakte bringen 5 Runden Waffenstillstand; ein Bruch kostet 150 Punkte.","Eine eroberte Stadt ist 3 Runden lang instabil (keine Einnahmen, kein Ausbilden). Jede Stadt über 5 kostet 1 ✦ pro Runde.","Jeder Clan hat eine exklusive Einheit (beim Ausbilden mit ★ markiert), eine eigene Hauptstadt und eine Geschichte.","Punkte: Stadtstufen, Gebiet, Technologien, Einheiten, Erkundung und Monumente.","Verstanden","Niederlage","Sieg",", ","Bev"],"it":["Lingua","Partita creata (seme {s}). Guidi il clan {c}.","Modalità Stagioni: prima stagione, {s}, che rafforza {f}.","la tecnologia {t}","un Esploratore che si è unito al clan","una mappa della regione","{c} ha esplorato delle rovine e ha trovato {m}.","Rovine: hai trovato {m}!","rovine!","{a} ({ac}) ha attaccato {d} ({dc}): {n} danni",", sconfitto","; {u} è diventato veterano",", contrattacco di {n}",", l'attaccante è caduto","{c} ha ricercato {t}.","Architettura: costruzioni migliorate e ponti permanenti.","Cartografia: l'intera mappa è stata rivelata.","{c} ha eretto la Grande Opera {g} a {city}.","Grande Opera: {g} (+300 punti).","{c} ha eretto la Grande Opera {g}.","{c} ha eretto una Piazza a {city}.","{c} ha ampliato il territorio di {city}.","territorio +","{c} ha cinto di mura {city}.","Raccogli bacche di luce","Caccia il cervo muschiato","Pesca il pesce lanterna","Costruisci miniera di cristallo","Costruisci segheria","Erigi santuario di Lumen","Costruisci fattoria","Costruisci mercato","{c} ha solidificato la lava e creato nuova terra.","{c} ha eretto un Ponte di Lumen.","{city} ({c}) è salita al livello {n}.","Un esploratore di {c} è partito da {city} e ha rivelato {n} caselle.","L'  avvisi","non disponibile su questo dispositivo","Velocità delle animazioni","movimento delle unità e turno dei rivali","Veloce","Normale","Rifai la partita guidata","nella prossima partita","Cancella la partita salvata","turno {n}","nessuna","{n} registrati","Consiglio {a} di {b}","Salta","Avanti","Gioca","Unisci le tessere del mondo","Nuova partita","Continua","turno {a} di {b}","Sfida del giorno","Classica","Altre opzioni","Clan","Esclusiva: {u}","La storia dei {c}","Unità esclusiva","Costa {n} ✦ e richiede {t}.","Capitale","Grande Opera: {g}.","Il mondo si è spezzato in tessere fluttuanti. I clan ricuciono i pezzi con i Lumen (✦), l'energia che sgorga da ogni città. In {n} turni, chi ha più punti unisce il mosaico.","Scegli il tuo clan","Clan speciali","Difficoltà","Modalità di gioco","Inizia la partita","Calendario delle Stagioni","L'anno ha 4 stagioni di {n} turni. In ognuna, i clan della stagione ottengono +{b} di attacco su tutte le unità. L'inverno gela l'acqua bassa e i raccolti rendono +1 pop solo in estate.","(il tuo clan)","Opzioni avanzate","Seme della mappa","Lo stesso numero genera sempre la stessa mappa. Lascialo così per una mappa casuale.","{c} in pericolo","è la tua ultima città","può cadere al prossimo turno","Nemici vicino a {c}","{c} è indifesa ed è la tua ultima città. Lascia un'unità dentro o sconfiggi il nemico accanto.","{c} è indifesa. Lascia un'unità dentro o sconfiggi il nemico accanto.","Questo è il tuo <b>Esploratore</b>. Toccalo per vedere fin dove può muoversi.","I <b>punti bianchi</b> mostrano la portata. Toccane uno per muoverti e rivelare la mappa.","Tocca la <b>casella evidenziata</b> del tuo territorio e usa l'azione dorata che appare in basso. Raccogliere fa crescere la città.","Ora tocca la tua <b>capitale</b> (la città con il rombo dorato) e addestra un'unità. Una città vuota può essere presa.","Apri <b>Tecnologia</b> per vedere cosa può imparare il tuo clan. Ogni ricerca sblocca unità o costruzioni.","Quando non c'è più niente da fare, tocca <b>Fine turno</b>. Gli altri clan giocano e tu ricevi Lumen (✦).","È ora di crescere: porta un'unità al <b>villaggio neutrale</b> evidenziato e termina il turno sopra di esso per occuparlo.","È ora di crescere: esplora con l'Esploratore finché non trovi un <b>villaggio neutrale</b> (tetti grigi) e termina il turno sopra di esso.","Ora conosci l'essenziale. Vince chi ha più punti al turno {n}, o chi conquista tutti i rivali. Tutti i consigli sono nel Menu.","Veterano!","{u} ha ottenuto +5 di vita","Villaggio occupato!","Città conquistata!","{city} ora appartiene al clan {c}","Città perduta","{c} ha preso {city}","Clan eliminato","{c} è uscito dal mosaico","Grande Opera completata · +300 punti","Monumento eretto","{m} · +250 punti","Ultimo turno","Fai contare ogni azione","Mancano 5 turni alla fine della partita.","{c} è senza difesa","Un nemico può raggiungere la città al prossimo turno, ed è la tua <b>ultima città</b>: se cade, la partita finisce. Lascia un'unità dentro o addestrane una ora.","Un nemico può raggiungere la città al prossimo turno. Lascia un'unità dentro o addestrane una ora.","Termina comunque","Difendi la città","Guida chiusa. I consigli sono nel Menu.","Brace","vulcani e cenere","I ponti diventano terraferma (la lava si solidifica) e gli Arieti costano 5 ✦.","Quando il mondo si spezzò, il vulcano Ignea rimase acceso su un'unica tessera. I Brace nacquero intorno a esso e giurarono di non lasciar mai spegnere la prima fiamma. Per loro, solo il fuoco può risaldare ciò che si è rotto.","Forgia-Vulcano","Marea","scogliere coralline","Porto: le unità in acqua hanno +1 di movimento e pescare costa 1 ✦.","L'arcipelago dei Marea affondò nella Grande Frattura e l'intero popolo passò una generazione sulle zattere. Impararono a leggere le correnti seguendo i pesci lanterna. Oggi cercano, tessera dopo tessera, la scogliera dove tutto ebbe inizio.","Faro di Corallo","Radice","foresta fitta","Le unità nella foresta hanno +1 di difesa.","I Radice discendono dai giardinieri dell'Albero Madre, le cui radici tennero insieme gli ultimi pezzi di terra durante la Frattura. Ogni loro città nasce da un suo seme. Per i Radice, unire il mosaico significa ripiantare la foresta originaria.","Casa sull'Albero","Brina","tundra","Attraversa l'acqua bassa senza barca (ghiaccio).","Cacciati dalle terre calde, i Brina attraversarono a piedi un mare gelato e sopravvissero dove nessun altro volle vivere. Domarono gli orsi bianchi e fecero dell'inverno un alleato. Ora scendono dalla tundra per reclamare il posto che fu loro negato.","Igloo di Cristallo","Duna","deserto","Oasi: il mercato costa 3 ✦ e le Carovane portano Lumen.","Dove caddero schegge di Lumen nel deserto, sbocciarono oasi. I Duna furono i primi a trovarle ed eressero bazar intorno a ciascuna. Le loro carovane uniscono le tessere con il commercio prima che arrivi qualsiasi esercito.","Palazzo dell'Oasi","Vento","altipiani","I Cavalieri hanno +1 di movimento e costano 3 ✦.","Nomadi degli altipiani, i Vento non costruirono mai mura: la loro casa è la sella. Si dice che sentirono arrivare la Frattura nel fischio del vento e per questo sopravvissero. Cavalcano dietro la voce che promette di nuovo un mondo intero.","Mulino dei Venti","Fiera","savane e boschi","Branco: cacciare costa solo 1 ✦.","Bambini perduti nella Frattura furono accolti da un branco di lupi muschiati. Crebbero cacciando insieme e tornarono come un clan che divide tutto ciò che abbatte. Per i Fiera, il mosaico è un territorio di caccia che ha bisogno di un solo branco.","Tana del Totem","Lume","canyon di cristallo","I Ponti di Lumen costano 1 ✦ e durano il doppio.","Monaci dei canyon di cristallo, i Lume scoprirono come solidificare la luce e costruirono i primi Ponti di Lumen. Custodiscono il segreto in monasteri dorati. Credono che il mondo si riunisca con i ponti, non con le spade, ma portano comunque le spade.","Obelisco di Lumen","Automi","cittadelle di metallo","Corazza: tutte le unità nascono con +3 di vita.","Esercito di robot umanoidi","Nel 2053, gli Automi combattono la Guerra del Futuro contro gli Astri e la stanno perdendo. L'Unità Zero ha calcolato l'unica via d'uscita: tornare indietro nel tempo e conquistare il passato prima che arrivi il nemico. Un esercito di robot umanoidi ha attraversato il portale e ha eretto il suo primo data center nell'era del mosaico.","Data Center","Astri","cratere d'atterraggio","Vista orbitale: le unità vedono 1 casella più avanti.","Extraterrestri","Gli Astri vennero dalle stelle per dominare il mondo nel 2053 e trovarono una resistenza di metallo. Quando intercettarono il piano degli Automi, lanciarono una nave attraverso lo stesso portale del tempo. Atterrarono nel passato con una missione: dare la caccia ai robot e prendere il mondo prima che la guerra cominci.","Nave Atterrata","Spettri","nebbie eterne","Foschia: attraversano le montagne senza Scalata e vi hanno +1 di difesa.","Popolo delle ombre","Gli Spettri sono le ombre di chi scomparve nella Grande Frattura, intrappolate tra una tessera e l'altra. Vivono nelle nebbie e attraversano le montagne come se fossero foschia. Credono che, se il mosaico verrà unito, torneranno ad avere un corpo.","Mausoleo delle Nebbie","Colossi","rovine celesti","Pelle di pietra: ogni colpo subito infligge 1 danno in meno.","Angeli caduti di pietra","I Colossi erano angeli. Quando il mondo si spezzò, caddero dal cielo insieme alle schegge e, toccando il suolo, ali e pelle divennero pietra. Giganti lenti e quasi indistruttibili, vogliono riunire il mosaico per erigere la scala che li riporterà a casa.","Trono Caduto","Raccolta","Raccogliere frutti nei campi (+1 pop).","Caccia","Cacciare animali nella foresta (+1 pop).","Navigazione","Entrare in acqua bassa e pescare (+1 pop).","Scalata","Salire sulle montagne (difesa ×1,5).","Forgiatura","Addestrare Lanciere (difesa 3).","Equitazione","Addestrare Cavaliere (movimento 2, attacca e si ritira).","Commercio","Costruire Mercato (+1 ✦ per turno).","Lumenaria","Erigere Ponti di Lumen sull'acqua bassa (durano 8 turni).","Agricoltura","Costruire Fattoria nei campi (+2 pop).","Tiro","Addestrare Frombolieri (gittata 2).","Mare Aperto","Navigare nell'oceano.","Estrazione","Costruire Miniera sul minerale (+2 pop).","Assedio","Addestrare Ariete (attacco 4).","Diplomazia","Proporre patti di tregua.","Pionierismo","Ampliare il territorio di qualsiasi città a raggio 2 (6 ✦), senza aspettare il livello 4.","Ingegneria","Erigere la Grande Opera del tuo clan nella capitale (30 ✦, una per partita).","Urbanistica","Erigere una Piazza in ogni città (8 ✦: +3 pop, +40 punti).","Cartografia","Rivela subito l'intera mappa.","Tattiche","Tutte le tue unità ottengono +1 di attacco.","Fortificazione","Comprare Mura in qualsiasi città (6 ✦).","Silvicoltura","Costruire Segheria nella foresta (+2 pop) e la caccia rende +1 pop in più.","Architettura","Fattorie, miniere e segherie danno +1 pop (anche quelle già costruite), ogni mercato rende +1 ✦ e i ponti diventano permanenti.","Alleanza","Le tregue durano 10 turni e il tributo si dimezza.","Forgia Eterna","Grande Faro","Ogni città in riva all'acqua rende +1 ✦ per turno.","Albero Madre","Tutte le tue città ottengono +2 di popolazione ora.","Palazzo di Ghiaccio","Le tue città di livello 3 o superiore ottengono le Mura ora.","Gran Bazar","Ogni città rende +1 ✦ per turno.","Torre dei Venti","Rivela l'intera mappa e tutte le tue città ottengono +1 di popolazione.","Totem del Branco","Tutte le tue unità guariscono e ottengono +5 di vita massima.","Prisma Solare","La capitale passa a rendere +3 ✦ per turno.","Catena di Montaggio","Ogni città che possiedi ora rende +1 ✦ per turno.","Nave Madre","Rivela l'intera mappa e porta +10 ✦ ora.","Velo Eterno","Le tue unità guariscono del tutto e ogni città ottiene +1 di popolazione.","Scala del Cielo","Tutte le tue unità ottengono +1 di difesa.","Esploratore","Lanciere","Frombolieri","Cavaliere","Ariete","Guardiano","Piromante","Scaglia fuoco a 2 caselle con attacco 3.","Arpioniere","Attacco 3 e difesa 2: il lanciere delle scogliere.","Druido","All'inizio del turno, cura 3 di vita agli alleati vicini.","Cavaliere d'Orso","Cavalcatura pesante: 16 di vita e attacco 3.","Carovana","Si muove di 2 caselle e rende +1 ✦ per turno finché vive (contano fino a 2 carovane).","Falconiere","Il falco attacca a 3 caselle di distanza.","Lupo del Branco","Economico e veloce: si muove di 2 caselle, attacca e si ritira.","Sentinella di Cristallo","Scudo di cristallo: difesa 4.","Mecha","Robot gigante con 20 di vita e attacco 4. Richiede una città di livello 3.","Disco Volante","Vola sopra acqua, foresta e montagna, 2 caselle per turno.","Spirito","Attacca senza subire contrattacco.","Serafino di Pietra","Ali di pietra: attraversa foreste e montagne senza fermarsi.","Prato","Foresta","Montagna","Acqua bassa","Oceano","Frutti","Pesci","Minerale","Officina","+1 ✦ per turno in questa città","Spedizione","Una spedizione rivela la mappa intorno e un Esploratore è pronto ad agire","Difesa ×3 per chi presidia la città","Tesoro","+5 ✦ subito","Frontiera","Il territorio cresce a raggio 2","Festa","+3 di popolazione","Super-unità gratuita","Giardino di Lumen","+150 punti","Rotta commerciale","+2 ✦ per turno in questa città","Faro del Mosaico","Esplorare il 60% della mappa","Metropoli","Avere una città di livello 5","Impero","Avere 5 città","Arena dei Veterani","Vincere 10 battaglie","Facile","Difficile","Primavera","piogge e fiumi in piena","caldo e sole forte","Autunno","raffiche sugli altipiani","ghiaccio e neve","Bacche di luce","Risorsa · frutti","Arbusto di bacche che brillano al tramonto. Raccoglile con Raccolta.","Cervo muschiato","Risorsa · selvaggina","Cervo mansueto con palchi di muschio. Caccialo con la tecnologia Caccia.","Pesce lanterna","Risorsa · pesci","Pesce che accende una luce nell'acqua bassa. Pescalo con Navigazione.","Cristallo vivo","Risorsa · minerale","Cristalli che crescono dentro la roccia. Costruisci una Miniera con Estrazione.","Fattoria","Costruzione · +2 pop","Campi di grano dorato. Richiede Agricoltura.","Miniera di cristallo","Galleria con binari e un carrello di cristalli. Richiede Estrazione.","Mercato","Costruzione · +1 ✦/turno","La bancarella di scambi della città. Uno per città. Richiede Commercio.","Segheria","Tronchi impilati e una sega mossa dal Lumen. Richiede Silvicoltura.","Rovine antiche","Esplorazione","Arco di un mondo anteriore al mosaico. La prima unità che arriva vince un premio.","Santuario di Lumen","Costruzione · +2 pop · +60 pt","Altare di pietra con un cristallo di Lumen. Si può erigere su prato o foresta liberi; ogni nuovo santuario costa 4 ✦ in più.","Attraversamento","Luce solidificata sopra l'acqua bassa. Qualsiasi clan può attraversarla finché dura.","Benvenuto in Mosaica","Il tuo clan inizia con una capitale e un Esploratore. Tocca l'Esploratore per vedere dove può muoversi (punti bianchi). Porta le unità ai villaggi neutrali e termina il turno sopra di essi per occuparli.","Lumen e città","I Lumen (✦) arrivano a ogni turno. Tocca le caselle del tuo territorio per raccogliere risorse: la città guadagna popolazione, sale di livello e ogni livello dà un premio.","Tecnologia","In Tecnologia sblocchi unità e costruzioni. Al livello 2, l'Ingegneria sblocca la Grande Opera del tuo clan, che vale 300 punti.","Combattimento","I cerchi rossi mostrano chi puoi attaccare, con un'anteprima del danno. Se ti sei mosso male, usa Annulla prima di attaccare (non vale dopo aver aperto delle rovine).","Come vincere","La partita dura 30 turni. Vince chi ha più punti, o chi conquista tutti i rivali. Le città conquistate restano instabili per 3 turni, e ogni città oltre la quinta costa 1 ✦ per turno.","Tabellone di gioco","Punteggio","Punti","Lumen","Turno","Annulla l'ultima mossa (scorciatoia: Z)","Annulla","Azioni","Scorciatoia: spazio","Scorciatoia: Invio","Rendita per turno: una città di livello 1 rende 2 ✦, +1 per livello, e la capitale rende +1.","Co <script>
"use strict";
// ======================= IDIOMAS =======================
// Textos em português são a chave; as traduções ficam em window.MOSAICA_L10N (script acima).
const LANGS={pt:'Português',en:'English',es:'Español',fr:'Français',de:'Deutsch',it:'Italiano',ja:'日本語',zh:'简体中文'};
const LOCALES={pt:'pt-BR',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',ja:'ja-JP',zh:'zh-CN'};
const LANG_KEY='mosaica-idioma';
function detectLang(){try{const s=localStorage.getItem(LANG_KEY);if(s&&LANGS[s])return s;}catch(e){}
  const list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'pt'];
  for(const l of list){const b=String(l).toLowerCase().split(/[-_]/)[0];if(LANGS[b])return b;}return 'en';}
let LANG=detectLang();
const L10N=(()=>{const R=window.MOSAICA_L10N||{},o={};if(R.keys)for(const l in R){if(l==='keys')continue;o[l]={};R.keys.forEach((k,i)=>{if(R[l][i]!=null)o[l][k]=R[l][i];});}return o;})();
let TRLAST='';
function tr(s,v){TRLAST=s;let o=s;if(LANG!=='pt'){const d=L10N[LANG];if(d&&d[s]!=null)o=d[s];}
  if(v)o=o.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m);return o;}
function trp(n,one,other,v){return tr(n===1?one:other,Object.assign({n},v||{}));}
const LOC=()=>LOCALES[LANG]||'pt-BR';
function ord(n){switch(LANG){case 'en':{const s=(n%100>=11&&n%100<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return n+s;}
  case 'fr':return n===1?'1er':n+'e';case 'de':return n+'.';case 'ja':return n+'位';case 'zh':return '第'+n+'名';default:return n+'º';}}
const I18N_SNAP=[];
function i18nSnap(obj,keys){for(const k of keys)if(obj&&typeof obj[k]==='string')I18N_SNAP.push([obj,k,obj[k]]);}
function i18nInit(){
  for(const k in CLANS){i18nSnap(CLANS[k],['n','env','trait','kind','lore','cap']);CLANS[k].capPt=CLANS[k].cap;}
  for(const k in TECHS)i18nSnap(TECHS[k],['n','d']);for(const k in GREAT)i18nSnap(GREAT[k],['n','d']);
  for(const k in UNITS)i18nSnap(UNITS[k],['n','note']);i18nSnap(TERR,Object.keys(TERR));i18nSnap(RES,Object.keys(RES));
  for(const k in REWARDS)i18nSnap(REWARDS[k],['n','d']);for(const k in MONUMENTS)i18nSnap(MONUMENTS[k],['n','d']);
  for(const k in DIFF)i18nSnap(DIFF[k],['n']);SEASONS4.forEach(s=>i18nSnap(s,['n','d']));
  for(const k in ITEMS)i18nSnap(ITEMS[k],['n','tag','d']);TUT.forEach(t=>i18nSnap(t,[0,1]));
  // textos fixos do HTML (rótulos, títulos e aria-label)
  const walk=el=>{for(const a of ['title','aria-label'])if(el.hasAttribute&&el.hasAttribute(a)&&/[A-Za-zÀ-ú]/.test(el.getAttribute(a)))I18N_SNAP.push([el,'@'+a,el.getAttribute(a)]);
    for(const n of el.childNodes){if(n.nodeType===3){if(/[A-Za-zÀ-ú]{2}/.test(n.data))I18N_SNAP.push([n,'data',n.data.trim()]);}else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='STYLE')walk(n);}};
  walk(document.body);}
function applyLang(){for(const [o,k,v] of I18N_SNAP){const t=tr(v);if(k[0]==='@')o.setAttribute(k.slice(1),t);else o[k]=t;}
  document.documentElement.lang=LOC();TRLAST='';}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function valueNoise(rand,cells){
  const g=[];for(let i=0;i<=cells;i++){g[i]=[];for(let j=0;j<=cells;j++)g[i][j]=rand();}
  const s=t=>t*t*(3-2*t);
  return (x,y)=>{const fx=x/(N-1)*cells,fy=y/(N-1)*cells;const i=Math.min(cells-1,Math.floor(fx)),j=Math.min(cells-1,Math.floor(fy));
    const u=s(fx-i),v=s(fy-j),a=g[i][j],b=g[i+1][j],c=g[i][j+1],d=g[i+1][j+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};
}

function newGame(opts){
  const rand = mulberry(opts.seed);
  const others = Object.keys(CLANS).filter(c=>c!==opts.clan);
  for(let i=others.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  const clans=[opts.clan,...others.slice(0,3)];
  const n1=valueNoise(rand,3),n2=valueNoise(rand,6),m1=valueNoise(rand,4);
  const elev=[],c=(N-1)/2;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(x-c)/c,dy=(y-c)/c;elev.push(n1(x,y)*.65+n2(x,y)*.35-(dx*dx+dy*dy)*.32);}
  const sorted=[...elev].sort((a,b)=>a-b);
  const seaLvl=sorted[Math.floor(N*N*.38)], mtnLvl=sorted[Math.floor(N*N*.9)];
  const tiles=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const e=elev[I(x,y)];let t;
    if(e<seaLvl)t='agua';else if(e>=mtnLvl)t='montanha';else if(m1(x,y)>.56)t='floresta';else t='campo';
    tiles.push({t,res:null,imp:null,city:null,cityOf:null,ruin:false,bridge:0});
  }
  const land=(x,y)=>inb(x,y)&&tiles[I(x,y)].t!=='agua';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tiles[I(x,y)];if(t.t!=='agua')continue;
    t.t=DIRS.some(([dx,dy])=>land(x+dx,y+dy))?'raso':'oceano';}
  const resFor=t=>t==='campo'?'frutas':t==='floresta'?'caca':t==='raso'?'peixe':t==='montanha'?'minerio':null;
  const resP={campo:.2,floresta:.32,raso:.22,montanha:.4,oceano:0};
  tiles.forEach(t=>{if(rand()<resP[t.t])t.res=resFor(t.t);});
  // capitais: maximiza a menor distância entre elas
  const cand=[];for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++){const t=tiles[I(x,y)];if(t.t==='campo'||t.t==='floresta')cand.push([x,y]);}
  let best=null,bd=-1;
  for(let k=0;k<400;k++){const set=[];for(let i=0;i<4;i++)set.push(cand[Math.floor(rand()*cand.length)]);
    let md=99;for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)md=Math.min(md,cheb(set[i][0],set[i][1],set[j][0],set[j][1]));
    if(md>bd){bd=md;best=set;}}
  const cities=[];
  const mkName=()=>SYL1[Math.floor(rand()*SYL1.length)]+SYL2[Math.floor(rand()*SYL2.length)];
  best.forEach(([x,y],pid)=>{
    const clan=clans[pid], fav=CLANS[clan].fav;
    for(const [dx,dy] of DIRS.concat([[-2,0],[2,0],[0,-2],[0,2]])){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const t=tiles[I(nx,ny)];
      if(t.t==='oceano')continue;
      if(rand()<.35){ if(fav==='agua'){if(Math.abs(dx)+Math.abs(dy)===2&&dx&&dy){t.t='raso';}} else if(t.t!=='raso'){t.t=fav;} }

    if(CLANS[clan].tech==='coleta'){let n=0;for(const [dx,dy] of DIRS){const t=tiles[I(x+dx,y+dy)];if(t.res==='frutas')n++;}for(const [dx,dy] of DIRS){if(n>=2)break;const t=tiles[I(x+dx,y+dy)];if(t.t==='campo'||t.t==='floresta'){if(t.res==='frutas')continue;t.t='campo';t.res='frutas';n++;}}}
    for(const [dx,dy] of DIRS.concat([[-2,0],[2,0],[0,-2],[0,2]])){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const t=tiles[I(nx,ny)];if(t.res&&t.res!==resFor(t.t))t.res=resFor(t.t);}
    if(fav==='agua'&&!DIRS.some(([dx,dy])=>inb(x+dx,y+dy)&&tiles[I(x+dx,y+dy)].t==='raso')){const t=tiles[I(x+1,y+1)];t.t='raso';t.res='peixe';}
    const t=tiles[I(x,y)];t.t='campo';t.res=null;t.city=cities.length;
    cities.push({id:cities.length,x,y,owner:pid,level:1,pop:0,capital:true,wall:false,radius:1,bonus:0,market:false,name:mkName()});
  });
  // aldeias neutras
  const shuffled=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)shuffled.push([x,y]);
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
  for(const [x,y] of shuffled){if(cities.length>=16)break;const t=tiles[I(x,y)];if(t.t!=='campo'&&t.t!=='floresta')continue;
    if(cities.some(c=>cheb(c.x,c.y,x,y)<(c.capital?3:2)))continue;if(cities.filter(c=>cheb(c.x,c.y,x,y)<3).length>=2)continue;t.city=cities.length;t.res=null;
    cities.push({id:cities.length,x,y,owner:null,level:1,pop:0,capital:false,wall:false,radius:1,bonus:0,market:false,name:mkName()});}
  let ruins=0;
  for(const [x,y] of shuffled){if(ruins>=5)break;const t=tiles[I(x,y)];if(t.t==='oceano'||t.city!=null)continue;
    if(cities.some(c=>cheb(c.x,c.y,x,y)<2))continue;if(tiles.some((o,i)=>o.ruin&&cheb(i%N,Math.floor(i/N),x,y)<3))continue;t.ruin=true;t.res=null;ruins++;}
  const personas=Object.keys(PERSONAS);

  S={seed:opts.seed,diff:opts.diff,mode:opts.mode==='estacoes'?'estacoes':'classico',turn:1,current:0,tiles,cities,units:[],players,truces:{},log:[],nextId:1,over:false,pendingLv:[],offers:[],feed:[],hits:0,winner:null};
  cities.forEach(c=>{if(c.owner!=null)claim(c);});
  players.forEach((p,i)=>{const c=cities[i];spawn('batedor',i,c.x,c.y,c.id,true);reveal(i,c.x,c.y,2);});
  addLog(tr('Partida criada (semente {s}). Você lidera o clã {c}.',{s:opts.seed,c:CLANS[opts.clan].n}));
  if(seasonsMode())addLog(tr('Modo Estações: começa a {s}, que fortalece {f}.',{s:season4().n,f:favNames(season4())}));
  startTurn(0);
}

function addLog(msg){const fk=TRLAST+' '+msg;TRLAST='';if(S.current!==0&&!S.fast&&/conquistou|tomou|eliminado|Grande Obra|trégua|monumento|murou/.test(fk)){if(!S.feed)S.feed=[];S.feed.push(msg);}S.log.push(`T${S.turn} · ${msg}`);if(S.log.length>200)S.log.shift();if(ui.logOpen)renderLog();}
function claim(c){for(let dy=-c.radius;dy<=c.radius;dy++)for(let dx=-c.radius;dx<=c.radius;dx++){const x=c.x+dx,y=c.y+dy;if(!inb(x,y))continue;const t=T(x,y);if(t.cityOf==null||t.cityOf===c.id)t.cityOf=c.id;}}
function reveal(pid,x,y,r){const p=P(pid);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(inb(x+dx,y+dy))p.explored[I(x+dx,y+dy)]=1;}
function visionR(u){return (T(u.x,u.y).t==='montanha'?2:1)+(u.type==='batedor'?1:0)+(P(u.owner).clan==='astro'?1:0);}
function canEnter(pid,t){const p=P(pid);
  switch(t.t){case 'campo':case 'floresta':return true;case 'montanha':return has(p,'escalada')||p.clan==='espectro';
    case 'raso':return t.bridge>0||isWinter()||p.clan==='geada'||has(p,'navegacao');case 'oceano':return has(p,'maraberto');}return false;}
function canEnterU(u,t){return !!UNITS[u.type].fly||canEnter(u.owner,t);}
function isWaterFor(pid,t){if(t.t==='oceano')return true;if(t.t==='raso')return !(t.bridge>0||isWinter()||P(pid).clan==='geada');return false;}
function unitMov(u){let m=UNITS[u.type].mov;const p=P(u.owner);if(u.type==='cavaleiro'&&p.clan==='vento')m++;if(p.clan==='mare'&&!UNITS[u.type].fly&&isWaterFor(u.owner,T(u.x,u.y)))m++;return m;}
function enemyAdj(pid,x,y){return S.units.some(e=>e.owner!==pid&&cheb(e.x,e.y,x,y)===1);}
function reachable(u){
  const out=new Map(),best={},start=u.x+','+u.y;best[start]=unitMov(u);
  const q=[{x:u.x,y:u.y,mp:best[start]}];
  while(q.length){const c=q.shift();if(c.mp<=0)continue;
    for(const [dx,dy] of DIRS){const nx=c.x+dx,ny=c.y+dy;if(!inb(nx,ny))continue;const t=T(nx,ny);
      if(!canEnterU(u,t)||unitAt(nx,ny))continue;
      let mp=c.mp-1;const UU=UNITS[u.type],fw=!UU.fly&&isWaterFor(u.owner,T(c.x,c.y)),tw=!UU.fly&&isWaterFor(u.owner,t);
      if(fw!==tw)mp=0;if(!tw&&!UU.fly&&!UU.glide&&(t.t==='floresta'||t.t==='montanha'))mp=0;if(enemyAdj(u.owner,nx,ny))mp=0;
      const k=nx+','+ny;if(k===start)continue;
      if(best[k]===undefined||best[k]<mp){best[k]=mp;out.set(k,{x:nx,y:ny});q.push({x:nx,y:ny,mp});}}}
  return [...out.values()];
}
function defBonus(d,a){const c=cityAt(d.x,d.y);if(c&&c.owner===d.owner){if(a&&a.type==='ariete')return 1;const b=c.wall?3:1.5;return d.type==='guardiao'?Math.min(b,1.5):b;}const t=T(d.x,d.y).t;return (t==='floresta'||t==='montanha')?1.5:1;}
function atkVal(u){const p=P(u.owner);let v=UNITS[u.type].atk;if(seasonFav(u.owner))v+=SEASON_BONUS;if(has(p,'taticas'))v++;if(p.great&&p.clan==='brasa')v++;return v;}
function defVal(d){let v=UNITS[d.type].def;if(P(d.owner).clan==='raiz'&&T(d.x,d.y).t==='floresta')v+=1;if(P(d.owner).clan==='espectro'&&T(d.x,d.y).t==='montanha')v+=1;if(P(d.owner).great&&P(d.owner).clan==='colosso')v+=1;return v;}
function preview(a,d,fx=a.x,fy=a.y){
  const aF=atkVal(a)*(a.hp/a.maxHp),dv=defVal(d),dF=dv*(d.hp/d.maxHp)*defBonus(d,a),tot=aF+dF;
  let dmg=Math.round(aF/tot*atkVal(a)*K);if(P(d.owner).clan==='colosso')dmg=Math.max(1,dmg-1);const survive=d.hp-dmg>0;let counter=0;

function doMove(u,x,y){const sdx=(x-y)-(u.x-u.y);if(sdx)u.face=sdx>0?1:-1;u.x=x;u.y=y;u.moved=true;reveal(u.owner,x,y,visionR(u));

function doAttack(a,d){

  const r=preview(a,d);{const sx=(d.x-d.y)-(a.x-a.y),sy=(d.x+d.y)-(a.x+a.y),L=Math.hypot(sx,sy)||1,now=performance.now();if(sx)a.face=sx>0?1:-1;a.lunge={t0:now,dx:sx/L*(UNITS[a.type].rng>1?.3:1),dy:sy/L*(UNITS[a.type].rng>1?.3:1)};d.hitT=now+120;}d.hp-=r.dmg;floatText(d.x,d.y,'−'+r.dmg,'#ff8a7a');

function doHarvest(pid,x,y,kind){const o=harvestOptions(pid,x,y).find(o=>o.kind===kind);const p=P(pid);if(!o||p.gold<o.cost)return false;
  const t=T(x,y),c=S.cities[t.cityOf];p.gold-=o.cost;
  if(kind==='colher'){t.res=null;if(o.sb)c.sbSeason=seasonIdx();}else if(kind==='mina'){t.res=null;t.imp='mina';}else if(kind==='fazenda')t.imp='fazenda';else if(kind==='serraria')t.imp='serraria';else if(kind==='mercado'){t.imp='mercado';c.market=true;c.bonus+=has(p,'arquitetura')?2:1;}else if(kind==='santuario'){t.imp='santuario';p.shrines=(p.shrines||0)+1;p.bonusScore+=60;}
  if(human().explored[I(x,y)]){if(kind==='colher')ui.fx.push({kind:o.vis,x,y,tx:c.x,ty:c.y,t0:performance.now()});else t.builtT=performance.now();ui.fx.push({burst:true,x,y,col:ITEMS[kind==='colher'?o.vis:kind].col,t0:performance.now()});}
  floatText(x,y,'+'+o.pop+' '+tr('pop'),'#9ee6a8');addPop(c,o.pop);return true;}
function canBridge(pid,x,y){const t=T(x,y),p=P(pid);if(!has(p,'lumenaria')||t.t!=='raso'||t.bridge>0||unitAt(x,y))return false;
  return ownerOf(t)===pid||S.units.some(u=>u.owner===pid&&cheb(u.x,u.y,x,y)===1);}
function bridgeCost(p){return p.clan==='lume'?1:3;}
function doBridge(pid,x,y){const p=P(pid),bc=bridgeCost(p);if(!canBridge(pid,x,y)||p.gold<bc)return false;p.gold-=bc;const t=T(x,y);
  if(p.clan==='brasa'){t.t='campo';t.res=null;addLog(tr('{c} solidificou lava e criou terra nova.',{c:CLANS[p.clan].n}));}else{t.bridge=has(p,'arquitetura')?999:SEASON_LEN*(p.clan==='lume'?2:1);addLog(tr('{c} ergueu uma Ponte de Lumen.',{c:CLANS[p.clan].n}));}return true;}
function popNeed(c){return 2*c.level+1;}
const seasonIdx=()=>Math.floor((S.turn-1)/(seasonsMode()?SEASON4_LEN:SEASON_LEN));
function addPop(c,n){c.pop+=n;while(c.pop>=popNeed(c)){c.pop-=popNeed(c);c.level++;levelUp(c);}checkMonuments(c.owner);}
function hasGuard(c){return S.units.some(u=>u.type==='guardiao'&&u.home===c.id&&u.owner===c.owner);}
function rewardOptions(lv,c){if(lv===2)return['oficina','batedor'];if(lv===3)return['muralha','tesouro'];if(lv===4)return c&&c.radius>=2?['festa','prospera']:['fronteira','festa'];if(lv===5&&!(c&&hasGuard(c)))return['guardiao','jardim'];return['prospera','jardim'];}
function levelUp(c){const p=P(c.owner);addLog(tr('{city} ({c}) subiu para o nível {n}.',{city:c.name,c:CLANS[p.clan].n,n:c.level}));
  if(p.human){S.pendingLv.push({city:c.id,level:c.level});}
  else{const o=rewardOptions(c.level,c),k=PERSONAS[p.persona].pick[Math.min(5,c.level)];applyReward(c,o.includes(k)?k:o[PERSONAS[p.persona].eco>.6?0:1]);}}
function applyReward(c,k){const p=P(c.owner);
  switch(k){case 'oficina':c.bonus+=1;break;case 'batedor':explore(c);break;case 'muralha':c.wall=true;break;
    case 'tesouro':p.gold+=5;break;case 'fronteira':c.radius=2;claim(c);reveal(c.owner,c.x,c.y,3);break;case 'festa':addPop(c,3);break;
    case 'guardiao':spawn('guardiao',c.owner,c.x,c.y,c.id,false);break;case 'jardim':p.bonusScore+=150;break;case 'prospera':c.bonus+=2;break;}}
function explore(c){const pid=c.owner,p=P(pid),before=p.explored.reduce((a,b)=>a+b,0);
  const ok=(x,y)=>inb(x,y)&&T(x,y).t!=='oceano';const seen=new Set([c.x+','+c.y]);const path=[[c.x,c.y]];let x=c.x,y=c.y;
  for(let i=0;i<16;i++){let best=null,bv=-1;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(!ok(nx,ny)||seen.has(nx+','+ny))continue;
      let v=Math.random()*.5;for(let ry=-2;ry<=2;ry++)for(let rx=-2;rx<=2;rx++)if(inb(nx+rx,ny+ry)&&!p.explored[I(nx+rx,ny+ry)])v++;
      if(v>bv){bv=v;best=[nx,ny];}}
    if(!best)break;[x,y]=best;seen.add(x+','+y);path.push(best);reveal(pid,x,y,T(x,y).t==='montanha'?2:1);}
  const u=spawn('batedor',pid,c.x,c.y,null,true);
  const n=p.explored.reduce((a,b)=>a+b,0)-before;
  addLog(tr('Um explorador de {c} saiu de {city} e revelou {n} casas.',{c:CLANS[p.clan].n,city:c.name,n}));
  if(p.human){ui.fx.push({explorer:true,path,clan:p.clan,t0:performance.now()});toast(tr(u?'O explorador revelou {n} casas do mapa e um Batedor está pronto para agir.':'O explorador revelou {n} casas do mapa.',{n}));}
  checkMonuments(pid);}
function captureCity(c,pid){const old=c.owner,p=P(pid);
  c.owner=pid;c.pop=0;if(old!=null){c.capital=false;c.unrest=3;}claim(c);reveal(pid,c.x,c.y,2);
  S.units.forEach(u=>{if(u.home===c.id&&u.owner!==pid)u.home=null;});
  addLog(tr(old==null?'{c} fundou {city}.':'{c} conquistou {city}.',{c:CLANS[p.clan].n,city:c.name}));
  if(p.human)toast(tr(old==null?'Você ocupou {city}!':'Você conquistou {city}!',{city:c.name}));
  else if(old===0)toast(tr('{c} tomou a sua cidade {city}.',{c:CLANS[p.clan].n,city:c.name}));
  if(old!=null&&playerCities(old).length===0)eliminate(old);
  checkMonuments(pid);}
function eliminate(pid){const p=P(pid);p.alive=false;S.units=S.units.filter(u=>u.owner!==pid);addLog(tr('O clã {c} foi eliminado.',{c:CLANS[p.clan].n}));toast(tr('O clã {c} foi eliminado.',{c:CLANS[p.clan].n}));}
function exploredPct(p){return p.explored.reduce((a,b)=>a+b,0)/(N*N);}
function checkMonuments(pid){if(pid==null)return;const p=P(pid);if(!p.alive)return;
  const give=k=>{if(p.monuments.includes(k))return;p.monuments.push(k);addLog(tr('{c} ergueu o monumento {m}.',{c:CLANS[p.clan].n,m:MONUMENTS[k].n}));if(p.human)toast(tr('Monumento: {m} (+250 pontos)',{m:MONUMENTS[k].n}));};
  if(exploredPct(p)>=.6)give('farol');const cs=playerCities(pid);if(cs.some(c=>c.level>=5))give('metropole');if(cs.length>=5)give('imperio');if(p.kills>=10)give('veterano');}
function calcScore(p){if(!p.alive)return 0;const cs=playerCities(p.id);let terr=0;S.tiles.forEach(t=>{if(ownerOf(t)===p.id)terr++;});
  const units=S.units.filter(u=>u.owner===p.id).reduce((s,u)=>s+UNITS[u.type].cost,0);
  return cs.reduce((s,c)=>s+c.level*60,0)+terr*8+p.techs.length*40+units*3+Math.round(exploredPct(p)*100)+p.monuments.length*250+p.bonusScore-p.penalty;}
function updateScores(){S.players.forEach(p=>p.score=calcScore(p));}

function startTurn(pid){
  const p=P(pid);S.current=pid;
  S.units.forEach(u=>{if(u.owner===pid){u.moved=false;u.attacked=false;}});
  S.units.forEach(hl=>{const hv=UNITS[hl.type].heal;if(hl.owner!==pid||!hv)return;S.units.forEach(o=>{if(o.owner===pid&&o!==hl&&cheb(o.x,o.y,hl.x,hl.y)===1&&o.hp<o.maxHp){const b0=o.hp;o.hp=Math.min(o.maxHp,o.hp+hv);if(!S.fast)floatText(o.x,o.y,'+'+(o.hp-b0),'#9ee6a8');}});});
  if(S.turn>1){const g=incomeOf(p);p.gold+=g;if(p.human&&g)toast(tr('Renda do turno: +{n} ✦',{n:g}));}
  if(p.human){ui.busy=false;saveGame();updateScores();refresh();showNextLevelUp();}
  else{runAI(pid);if(S.fast)endTurn(pid);else setTimeout(()=>endTurn(pid),aiDelay());}
}
function endTurn(pid){
  if(S.over)return;
  for(const u of S.units.slice())if(u.owner===pid){const c=cityAt(u.x,u.y);if(c&&c.owner!==pid&&!(c.owner!=null&&inTruce(pid,c.owner)))captureCity(c,pid);}
  updateScores();
  if(!human().alive){return gameOver();}
  if(S.players.filter(p=>p.alive).length===1){return gameOver();}
  let next=pid+1;
  while(next<S.players.length&&!P(next).alive)next++;
  if(next>=S.players.length){
    if(S.turn>=MAX_TURNS)return gameOver();
    const prevSeason=seasonKey();S.turn++;
    S.tiles.forEach(t=>{if(t.bridge>0&&t.bridge<900)t.bridge--;});
    for(const k in S.truces)if(S.truces[k]>0)S.truces[k]--;
    S.cities.forEach(c=>{if(c.unrest>0)c.unrest--;});
    if(prevSeason!==seasonKey())seasonChange();
    next=0;
  }
  ui.unit=null;ui.moves=[];ui.attacks=[];
  refresh();
  startTurn(next);
}
function favNames(se){const a=se.fav.map(k=>CLANS[k].n);return a.length>1?tr('{a} e {b}',{a:a.slice(0,-1).join(tr(', ')),b:a[a.length-1]}):a.join('');}
function seasonChange(){
  if(seasonsMode()){const se=season4(),inGame=se.fav.filter(k=>S.players.some(p=>p.alive&&p.clan===k));
    const fx=se.k==='inverno'?tr(' A água rasa congelou e virou caminho.'):se.k==='verao'?tr(' Colheitas rendem +1 pop.'):se.k==='primavera'?tr(' O gelo derreteu.'):'';
    const who=trp(se.fav.length,'{f} ganha +{b} de ataque','{f} ganham +{b} de ataque',{f:favNames(se),b:SEASON_BONUS});
    addLog(tr('Chegou a {s}: {w}.',{s:se.n,w:who})+fx);
    if(!S.fast){toast(se.ic+' '+tr(inGame.length?'{s}: {w}.':'{s}: {w} (fora desta partida).',{s:se.n,w:who})+fx);if(human().alive&&se.fav.includes(human().clan))toast(tr('É a sua estação! Hora de atacar.'));}
    if(se.k==='inverno')return;}
  else{
  if(isWinter()){addLog(tr('Chegou o inverno: a água rasa congelou e virou caminho.'));toast(tr('Inverno: a água rasa congelou e virou caminho.'));return;}
  addLog(tr('Chegou o verão: o gelo derreteu e as colheitas rendem +1 pop.'));toast(tr('Verão: o gelo derreteu. Colheitas rendem +1 pop.'));}
  for(const u of S.units.slice()){const t=T(u.x,u.y);if(canEnterU(u,t))continue;
    let spot=null;for(let r=1;r<4&&!spot;r++)for(let dy=-r;dy<=r&&!spot;dy++)for(let dx=-r;dx<=r&&!spot;dx++){const x=u.x+dx,y=u.y+dy;if(inb(x,y)&&!unitAt(x,y)&&canEnter(u.owner,T(x,y))&&!isWaterFor(u.owner,T(x,y)))spot=[x,y];}
    if(spot){u.x=spot[0];u.y=spot[1];}else{killUnit(u);addLog(tr('Um {u} de {c} afundou no degelo.',{u:UNITS[u.type].n,c:CLANS[P(u.owner).clan].n}));}}
}
function gameOver(){S.over=true;updateScores();const alive=S.players.filter(p=>p.alive);
  const rank=[...S.players].sort((a,b)=>b.score-a.score);
  let title,sub;
  if(!human().alive){title=tr('Seu clã caiu');sub=tr('Todas as suas cidades foram tomadas.');}
  else if(alive.length===1){title=tr('Vitória por dominação');sub=tr('Você uniu o mosaico inteiro.');}
  else if(rank[0].human){title=tr('Vitória por pontos');sub=tr('Fim dos {n} turnos. O seu clã ficou em primeiro.',{n:MAX_TURNS});}
  else{title=tr('{c} venceu',{c:CLANS[rank[0].clan].n});sub=tr('Fim dos {n} turnos. Você ficou em {o} lugar.',{n:MAX_TURNS,o:ord(rank.findIndex(p=>p.human)+1)});}
  addLog(title+'.');clearSave();refresh();closeTech();
  const hp=human(),pos=rank.findIndex(q=>q.human)+1,won=hp.alive&&(alive.length===1||rank[0].human);
  const prevBest=readRecords().reduce((m,r)=>Math.max(m,r.score||0),0);
  if(!S.recorded&&!S.fast){S.recorded=true;addRecord({score:hp.score,clan:hp.clan,diff:S.diff,mode:S.mode,daily:S.daily||null,res:!hp.alive?'derrota':rank[0].human?'vitória':pos+'º lugar',date:Date.now()});}
  const newBest=hp.score>0&&hp.score>prevBest;
  const cities=playerCities(0).length,techs=hp.techs.length,expl=Math.round(exploredPct(hp)*100),turns=Math.min(S.turn,MAX_TURNS),kills=hp.kills||0;
  S.result={title,score:Math.round(hp.score),pos,won,cities,kills,techs,expl,turns,clan:hp.clan,rank:rank.map(q=>q.clan),daily:S.daily||null,mode:S.mode,diff:S.diff};
  const best=newBest?`<div class="newbest">${tr('Novo recorde pessoal!')}</div>`:prevBest>0?`<span class="hint">${tr('Seu recorde: {n} pts',{n:Math.round(prevBest).toLocaleString(LOC())})}</span>`:'';
  const chips=`<div class="chips endstats"><span class="chip">${Math.round(hp.score).toLocaleString(LOC())} pts</span><span class="chip">${trp(cities,'{n} cidade','{n} cidades')}</span><span class="chip">${trp(kills,'{n} vitória em combate','{n} vitórias em combate')}</span><span class="chip">${trp(techs,'{n} tecnologia','{n} tecnologias')}</span><span class="chip">${tr('{n}% explorado',{n:expl})}</span><span class="chip">${trp(turns,'{n} turno','{n} turnos')}</span></div>`;
  const share=S.daily?`<button class="btn" data-a="share">${tr('Compartilhar')}</button>`:'';
  openModal(`<h2>${title}</h2><p>${sub}</p>${best}${chips}${scoreTable(rank)}<div class="row endrow"><button class="btn" data-a="newgame">${tr('Início')}</button><span style="flex:1"></span>${share}<button class="btn" data-a="samemap">${tr('Mesmo mapa')}</button><button class="btn primary" data-a="again">${tr('Jogar de novo')}</button></div><span class="hint">${tr('Semente do mapa: {n}',{n:S.seed})}</span>`,false);
}
// ---- compartilhar o resultado (Desafio do dia), no estilo dos jogos diários
const SQ={brasa:'🟥',mare:'🟦',raiz:'🟩',geada:'⬜',duna:'🟨',vento:'🟪',fera:'🟫',lume:'🟧',automato:'🤖',astro:'👽',espectro:'👻',colosso:'🗿'};
function resultText(r){if(!r)return '';
  const head=r.daily?'Mosaica · '+tr('Desafio do dia {d}',{d:r.daily}):'Mosaica';
  const res=r.won?`🏆 ${r.title}`:`${tr('{o} lugar',{o:ord(r.pos)})} · ${r.title}`;
  return `${head}\n${res}\n${r.rank.map(c=>SQ[c]||'⬛').join('')}\n✦ ${r.score} pts · 🏙️ ${trp(r.cities,'{n} cidade','{n} cidades')} · ⚔️ ${trp(r.kills,'{n} vitória','{n} vitórias')} · 🧭 ${tr('{n}% explorado',{n:r.expl})}`;}
async function shareResult(r){const text=resultText(r);if(!text)return;const Sh=window.Capacitor?.Plugins?.Share;
  try{if(Sh){await Sh.share({title:'Mosaica',text,dialogTitle:tr('Compartilhar resultado')});return;}
    if(navigator.share){await navigator.share({title:'Mosaica',text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);toast(tr('Resultado copiado. É só colar.'));}catch(e){toast(tr('Não foi possível compartilhar agora.'));}}

// ======================= IA POR UTILIDADE =======================
function enemiesOf(pid){return S.units.filter(u=>u.owner!==pid&&!inTruce(pid,u.owner));}
function runAI(pid){
  const p=P(pid),W0=PERSONAS[p.persona],W=seasonFav(pid)?Object.assign({},W0,{aggr:Math.min(1,W0.aggr+.3)}):W0;
  const goals=aiGoals(p,W);
  const enemies=()=>enemiesOf(pid);
  const my=S.units.filter(u=>u.owner===pid);
  const dist=u=>{let m=99;for(const e of enemies())m=Math.min(m,cheb(e.x,e.y,u.x,u.y));return m;};
  my.sort((a,b)=>dist(a)-dist(b));
  for(const u of my){if(!S.units.includes(u))continue;aiUnit(u,p,W,goals,enemies());}
  aiResearch(p,W);aiEconomy(p,W);aiTrain(p,W,goals);aiDiplomacy(p);
  if(S.fast)S.units.forEach(u=>{u.rx=u.x;u.ry=u.y;});
}
function aiGoals(p,W){const g=[];const army=S.units.filter(u=>u.owner===p.id&&u.type!=='batedor').length;
  const rk=S.players.filter(o=>o.alive).sort((a,b)=>b.score-a.score),leader=rk.length>1&&rk[0].score>rk[1].score*1.3&&rk[0].id!==p.id?rk[0].id:null;
  for(const c of S.cities){if(!p.explored[I(c.x,c.y)])continue;
    if(c.owner==null)g.push({x:c.x,y:c.y,v:6*W.expand});
    else if(c.owner!==p.id&&!inTruce(p.id,c.owner))g.push({x:c.x,y:c.y,v:3+5*W.aggr+(army>=3?6:0)+(c.capital?2:0)+(S.turn>=12?4:0)+(S.turn>=20?4:0)+(c.owner===leader?5:0)});
    else if(c.owner===p.id&&enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=2))g.push({x:c.x,y:c.y,v:6});}
  S.tiles.forEach((t,i)=>{if(t.ruin&&p.explored[i])g.push({x:i%N,y:Math.floor(i/N),v:4});});
  return g;}
function bestAttack(u,fx,fy,enemies,W){const R=UNITS[u.type].rng;let best=null;
  for(const e of enemies){const d=cheb(fx,fy,e.x,e.y);if(d>R||d===0)continue;const r=preview(u,e,fx,fy);
    let s=r.dmg*(.6+W.aggr)+(r.kill?8+UNITS[e.type].cost:0)-r.counter*.9;if(r.die)s-=15;const c=cityAt(e.x,e.y);if(c&&c.owner===u.owner)s+=4;
    if(!best||s>best.score)best={target:e,score:s};}return best;}
function posValue(u,x,y,p,W,goals,enemies){let v=0;const c=cityAt(x,y),t=T(x,y);
  if(c&&c.owner!==p.id&&!(c.owner!=null&&inTruce(p.id,c.owner)))v+=40;
  if(t.ruin)v+=18;
  let g=0;for(const G of goals){const o=unitAt(G.x,G.y);if(o&&o!==u&&o.owner===p.id)continue;g=Math.max(g,G.v*6/(1+cheb(x,y,G.x,G.y)));}v+=g;
  let unk=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(inb(x+dx,y+dy)&&!p.explored[I(x+dx,y+dy)])unk++;v+=unk*.6;
  let danger=0;for(const e of enemies)if(cheb(e.x,e.y,x,y)<=UNITS[e.type].rng+UNITS[e.type].mov)danger+=UNITS[e.type].atk;
  v-=danger*(1.2-W.aggr)*(u.hp<u.maxHp*.6?2:1);
  if(t.t==='floresta'||t.t==='montanha')v+=1;
  if(c&&c.owner===p.id&&enemies.some(e=>cheb(e.x,e.y,x,y)<=3))v+=12;
  return v;}
function aiMove(u,p,W,goals,enemies,withAttack){const opts=reachable(u);opts.push({x:u.x,y:u.y});let best=null,bv=-1e9;
  for(const o of opts){let v=posValue(u,o.x,o.y,p,W,goals,enemies);if(withAttack&&!u.attacked){const a=bestAttack(u,o.x,o.y,enemies,W);if(a&&a.score>0)v+=a.score*1.2;}
    v+=Math.random()*.5;if(v>bv){bv=v;best=o;}}
  if(best&&(best.x!==u.x||best.y!==u.y))doMove(u,best.x,best.y);}
function aiUnit(u,p,W,goals,enemies){
  const onCapture=(()=>{const c=cityAt(u.x,u.y);return c&&c.owner!==p.id;})();
  const near2=enemies.some(e=>cheb(e.x,e.y,u.x,u.y)<=2);
  if(u.hp<u.maxHp*.5&&!near2&&!onCapture){rest(u);return;}
  let a=bestAttack(u,u.x,u.y,enemies,W);
  if(a&&a.score>3){doAttack(u,a.target);if(S.units.includes(u)&&!u.moved&&UNITS[u.type].escape)aiMove(u,p,W,goals,enemiesOf(p.id),false);return;}
  if(!u.moved&&!onCapture)aiMove(u,p,W,goals,enemies,true);
  if(!S.units.includes(u)||u.attacked)return;
  a=bestAttack(u,u.x,u.y,enemiesOf(p.id),W);if(a&&a.score>0)doAttack(u,a.target);
}
function aiDiplomacy(p){if(!has(p,'diplomacia'))return;if((p.lastPact||-99)>S.turn-6)return;
  for(const o of S.players){if(o.id===p.id||!o.alive||inTruce(p.id,o.id))continue;
    const near=S.units.some(u=>u.owner===o.id&&playerCities(p.id).some(c=>cheb(u.x,u.y,c.x,c.y)<=3));
    if(!near||o.score<p.score*1.25)continue;
    if(o.human){if(!S.offers.some(f=>f.from===p.id)){S.offers.push({from:p.id,turns:truceLen(p.id)});p.lastPact=S.turn;addLog(tr('{c} propôs uma trégua a você.',{c:CLANS[p.clan].n}));}return;}

function aroundCounts(p){const k={frutas:0,caca:0,peixe:0,minerio:0,raso:0,oceano:0,montanha:0,campo:0};
  S.tiles.forEach((t,i)=>{const x=i%N,y=Math.floor(i/N);if(!playerCities(p.id).some(c=>cheb(c.x,c.y,x,y)<=2))return;

function aiResearch(p,W){const k=aroundCounts(p),war=enemyNear(p,4),nc=playerCities(p.id).length,weak=p.score<Math.max(...S.players.filter(o=>o.alive).map(o=>o.score))*.7;
  const val={coleta:k.frutas*2.5,caca:k.caca*2.5+(war?2:0),navegacao:k.peixe*2+k.raso*.4,escalada:k.montanha*.8+k.minerio,forja:1+3*W.aggr+(war?2:0),montaria:1+3*W.aggr,

function aiEconomy(p,W){const threatened=playerCities(p.id).some(c=>enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=3));const reserve=threatened?5:2;
  for(let g=0;g<20;g++){let best=null,bv=0;
    S.tiles.forEach((t,i)=>{if(ownerOf(t)!==p.id)return;const x=i%N,y=Math.floor(i/N),c=S.cities[t.cityOf];
      for(const o of harvestOptions(p.id,x,y)){if(o.kind==='santuario'&&p.gold<o.cost+12)continue;const v=o.pop/o.cost*10+(c.pop+o.pop>=popNeed(c)?3:0)+(o.kind==='mercado'?4*W.eco:0);
        if(p.gold-o.cost>=reserve&&v>bv){bv=v;best={x,y,k:o.kind};}}});
    if(!best)break;doHarvest(p.id,best.x,best.y,best.k);}
  const res=threatened?8:3;
  if(canGreat(p.id)&&p.gold>=GREAT_COST+res)doGreat(p.id);
  for(const c of playerCities(p.id)){
    if(canBuyWall(c)&&p.gold>=WALL_COST+res&&(c.capital||enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=3)))doBuyWall(c);
    if(canPlaza(c)&&p.gold>=PLAZA_COST+res)doPlaza(c);

  const myUnits=S.units.filter(u=>u.owner===p.id).length;
  for(const c of cs){if(unitAt(c.x,c.y)||homeCount(c)>=c.level+1)continue;
    const threat=enemiesOf(p.id).some(e=>cheb(e.x,e.y,c.x,c.y)<=3);const av=trainable(c);
    const X=CLAN_UNIT[p.clan];let order;if(threat)order=['guardiao','lanceiro',X,'fundeiro','ariete','cavaleiro','batedor'];
    else if(neutral&&myUnits<cs.length*2)order=UNITS[X].mov>=2&&!UNITS[X].income?[X,'cavaleiro','batedor']:['cavaleiro','batedor'];
    else{const cnt=t=>S.units.filter(u=>u.owner===p.id&&u.type===t).length;
      const hard=S.cities.some(o=>o.owner!=null&&o.owner!==p.id&&!inTruce(p.id,o.owner)&&p.explored[I(o.x,o.y)]&&(o.wall||hasGuard(o)||o.level>=4));

      order=Object.keys(want).sort((a,b)=>cnt(a)/want[a]-cnt(b)/want[b]);}
    const keep=threat?0:(W.eco>.6?3:1);
    for(const k of order){if(!av.includes(k))continue;if(p.gold-unitCost(p,k)<keep)continue;if(doTrain(c,k))break;}}}

function isleArt(){const cols=[['#7ccf6a','#4e9a46','#3a7536'],['#3f9d5a','#2c7442','#215832'],['#e9c77b','#c49a4f','#9a763a'],['#4fb7d8','#2f87a8','#22677f'],['#dfe6ff','#a9b4dc','#8490bb'],['#b9a2e6','#8a72bd','#6a5698']];
  const W=72,H=36,D=26;let out='';const tiles=[[-5,1,0,0],[-4,1,0,1],[-4,2,1,0],[-3,2,0,2],[-2,1,3,0],[-1,1,3,0],[0,2,0,0],[1,1,1,0],[1,2,0,1],[2,1,2,0],[3,2,2,1],[4,1,4,2],[5,1,4,0],[0,1,5,3],[-1,2,0,0],[2,2,3,0],[-3,1,1,1],[4,2,0,0]];
  const groups={};tiles.forEach(t=>{const g=Math.floor((t[0]+6)/3);(groups[g]=groups[g]||[]).push(t);});
  for(const g in groups){out+='<g class="fl">';groups[g].sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])).forEach(([gx,gy,c,lift])=>{const cx=360+(gx-gy)*W/2+gy*W*.6,cy=150+(gx+gy)*H/2*.35+gy*28-lift*10,[top,l,r]=cols[c];
    out+=`<polygon points="${cx},${cy-H/2} ${cx+W/2},${cy} ${cx},${cy+H/2} ${cx-W/2},${cy}" fill="${top}"/><polygon points="${cx-W/2},${cy} ${cx},${cy+H/2} ${cx},${cy+H/2+D} ${cx-W/2},${cy+D}" fill="${l}"/><polygon points="${cx+W/2},${cy} ${cx},${cy+H/2} ${cx},${cy+H/2+D} ${cx+W/2},${cy+D}" fill="${r}"/>`;
    if(c===1)out+=`<polygon points="${cx-8},${cy+2} ${cx},${cy-22} ${cx+8},${cy+2}" fill="#2a6b3c"/><polygon points="${cx+6},${cy+6} ${cx+13},${cy-12} ${cx+20},${cy+6}" fill="#348a4a"/>`;
    if(c===4)out+=`<polygon points="${cx-14},${cy+4} ${cx},${cy-26} ${cx+14},${cy+4}" fill="#f4f7ff"/><polygon points="${cx},${cy-26} ${cx+14},${cy+4} ${cx+4},${cy+4}" fill="#c7cff0"/>`;
    if(c===5)out+=`<polygon points="${cx-6},${cy} ${cx},${cy-16} ${cx+6},${cy} ${cx},${cy+6}" fill="#ffd36b"/>`;});out+='</g>';}
