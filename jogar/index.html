ivé","Désactivé","Effets sonores","touches, combats et conquêtes","Musique","bande-son douce pendant le jeu","Vibration","lors des attaques, des conquêtes et des alertes","indisponible sur cet appareil","Vitesse des animations","déplacement des unités et tour des rivaux","Rapide","Normale","Refaire la partie guidée","à la prochaine partie","Effacer la partie sauvegardée","tour {n}","aucune","{n} enregistrés","Astuce {a} sur {b}","Passer","Suivante","Jouer","Unissez les tuiles du monde","Nouvelle partie","Continuer","tour {a} sur {b}","Défi du jour","Classique","Plus d'options","Clans","Exclusif : {u}","L'histoire des {c}","Unité exclusive","Coûte {n} ✦ et requiert {t}.","Capitale","Grande Œuvre : {g}.","Le monde s'est brisé en tuiles flottantes. Les clans recollent les morceaux grâce aux Lumens (✦), l'énergie qui jaillit de chaque ville. En {n} tours, celui qui a le plus de points unit la mosaïque.","Choisissez votre clan","Clans spéciaux","Difficulté","Mode de jeu","Lancer la partie","Calendrier des Saisons","L'année compte 4 saisons de {n} tours. Pendant chacune, les clans de la saison gagnent +{b} en attaque sur toutes leurs unités. L'hiver gèle l'eau peu profonde et les récoltes rapportent +1 pop seulement en été.","(votre clan)","Options avancées","Graine de la carte","Le même nombre génère toujours la même carte. Laissez-le tel quel pour une carte aléatoire.","{c} en danger","c'est votre dernière ville","peut tomber au prochain tour","Ennemis près de {c}","{c} n'est pas protégée et c'est votre dernière ville. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","{c} n'est pas protégée. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","Voici votre <b>Éclaireur</b>. Touchez-le pour voir jusqu'où il peut aller.","Les <b>points blancs</b> montrent sa portée. Touchez-en un pour vous déplacer et révéler la carte.","Touchez la <b>case en surbrillance</b> de votre territoire et utilisez l'action dorée qui apparaît en bas. Récolter fait grandir la ville.","Touchez maintenant votre <b>capitale</b> (la ville au losange doré) et recrutez une unité. Une ville vide peut être prise.","Ouvrez <b>Technologie</b> pour voir ce que votre clan peut apprendre. Chaque recherche débloque des unités ou des bâtiments.","Quand il n'y a plus rien à faire, touchez <b>Fin du tour</b>. Les autres clans jouent et vous recevez des Lumens (✦).","L'heure de grandir : amenez une unité jusqu'au <b>village neutre</b> en surbrillance et terminez le tour dessus pour l'occuper.","L'heure de grandir : explorez avec l'Éclaireur jusqu'à trouver un <b>village neutre</b> (toits gris) et terminez le tour dessus.","Vous connaissez l'essentiel. Gagne celui qui a le plus de points au tour {n}, ou celui qui conquiert tous ses rivaux. Toutes les astuces sont dans le Menu.","Vétéran !","{u} a gagné +5 de vie","Village occupé !","Ville conquise !","{city} appartient désormais au clan {c}","Ville perdue","{c} a pris {city}","Clan éliminé","{c} a quitté la mosaïque","Grande Œuvre achevée · +300 points","Monument érigé","{m} · +250 points","Dernier tour","Faites compter chaque action","Plus que 5 tours avant la fin de la partie.","{c} est sans défense","Un ennemi peut atteindre la ville au prochain tour, et c'est votre <b>dernière ville</b> : si elle tombe, la partie est finie. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Un ennemi peut atteindre la ville au prochain tour. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Terminer quand même","Défendre la ville","Guide fermé. Les astuces sont dans le Menu.","Braise","volcans et cendres","Les ponts deviennent terre ferme (la lave se solidifie) et les Béliers coûtent 5 ✦.","Quand le monde s'est brisé, le volcan Ignéa est resté allumé sur une seule tuile. Les Braise sont nés autour de lui et ont juré de ne jamais laisser s'éteindre la première flamme. Pour eux, seul le feu peut ressouder ce qui a été brisé.","Forge-Volcan","Marée","récifs","Port : les unités sur l'eau ont +1 de déplacement et pêcher coûte 1 ✦.","L'archipel des Marée a sombré lors de la Grande Fracture et tout le peuple a passé une génération sur des radeaux. Ils ont appris à lire les courants en suivant les poissons-lanternes. Aujourd'hui, ils cherchent, tuile après tuile, le récif où tout a commencé.","Phare de Corail","Racine","forêt dense","Les unités en forêt ont +1 de défense.","Les Racine descendent des jardiniers de l'Arbre-Mère, dont les racines ont retenu les derniers morceaux de terre pendant la Fracture. Chacune de leurs villes naît d'une de ses graines. Pour les Racine, unir la mosaïque, c'est replanter la forêt originelle.","Maison-Arbre","Givre","toundra","Traverse l'eau peu profonde sans bateau (glace).","Chassés des terres chaudes, les Givre ont traversé à pied une mer gelée et survécu là où personne d'autre ne voulait vivre. Ils ont dompté les ours blancs et fait de l'hiver un allié. Ils descendent aujourd'hui de la toundra pour réclamer la place qu'on leur a refusée.","Igloo de Cristal","Dune","désert","Oasis : le marché coûte 3 ✦ et les Caravanes rapportent des Lumens.","Là où des éclats de Lumen sont tombés dans le désert, des oasis ont jailli. Les Dune ont été les premiers à les trouver et ont bâti des bazars autour de chacune. Leurs caravanes relient les tuiles par le commerce avant qu'aucune armée n'arrive.","Palais de l'Oasis","Vent","hauts plateaux","Les Cavaliers ont +1 de déplacement et coûtent 3 ✦.","Nomades des hauts plateaux, les Vent n'ont jamais bâti de murailles : leur maison, c'est la selle. On dit qu'ils ont entendu venir la Fracture dans le sifflement du vent et qu'ils ont survécu grâce à cela. Ils chevauchent derrière la voix qui promet de nouveau un monde entier.","Moulin des Vents","Fauve","savanes et bois","Meute : chasser ne coûte que 1 ✦.","Des enfants perdus lors de la Fracture ont été recueillis par une meute de loups-mousse. Ils ont grandi en chassant ensemble et sont revenus en clan qui partage tout ce qu'il abat. Pour les Fauve, la mosaïque est un territoire de chasse qui n'a besoin que d'une seule meute.","Tanière du Totem","Lueur","canyons de cristal","Les Ponts de Lumen coûtent 1 ✦ et durent deux fois plus longtemps.","Moines des canyons de cristal, les Lueur ont découvert comment solidifier la lumière et ont bâti les premiers Ponts de Lumen. Ils gardent le secret dans des monastères dorés. Ils croient que le monde se réunit avec des ponts, pas avec des épées, mais ils portent quand même des épées.","Obélisque de Lumen","Automates","citadelles de métal","Blindage : toutes les unités naissent avec +3 de vie.","Armée de robots humanoïdes","En 2053, les Automates mènent la Guerre du Futur contre les Astres et sont en train de la perdre. L'Unité Zéro a calculé la seule issue : remonter le temps et conquérir le passé avant l'arrivée de l'ennemi. Une armée de robots humanoïdes a franchi le portail et bâti son premier centre de données à l'ère de la mosaïque.","Centre de Données","Astres","cratère d'atterrissage","Vision orbitale : les unités voient +1 case plus loin.","Extraterrestres","Les Astres sont venus des étoiles pour dominer le monde en 2053 et ont trouvé une résistance de métal. En interceptant le plan des Automates, ils ont lancé un vaisseau par le même portail temporel. Ils ont atterri dans le passé avec une mission : traquer les robots et prendre le monde avant que la guerre ne commence.","Vaisseau Posé","Spectres","brumes éternelles","Brume : ils traversent les montagnes sans Escalade et y ont +1 de défense.","Peuple des ombres","Les Spectres sont les ombres de ceux qui ont disparu lors de la Grande Fracture, prisonnières entre une tuile et une autre. Ils vivent dans les brumes et traversent les montagnes comme du brouillard. Ils croient que, si la mosaïque est unie, ils retrouveront un corps.","Mausolée des Brumes","Colosses","ruines célestes","Peau de pierre : chaque coup reçu inflige 1 dégât de moins.","Anges déchus de pierre","Les Colosses étaient des anges. Quand le monde s'est brisé, ils sont tombés du ciel avec les éclats et, en touchant le sol, leurs ailes et leur peau sont devenues pierre. Géants lents et presque indestructibles, ils veulent réunir la mosaïque pour ériger l'escalier qui les ramènera chez eux.","Trône Déchu","Cueillette","Récolter des fruits dans les champs (+1 pop).","Chasse","Chasser les animaux en forêt (+1 pop).","Navigation","Entrer en eau peu profonde et pêcher (+1 pop).","Escalade","Gravir les montagnes (défense ×1,5).","Forge","Recruter un Lancier (défense 3).","Équitation","Recruter un Cavalier (déplacement 2, attaque et recule).","Commerce","Construire un Marché (+1 ✦ par tour).","Lumenerie","Ériger des Ponts de Lumen sur l'eau peu profonde (ils durent 8 tours).","Agriculture","Construire une Ferme dans les champs (+2 pop).","Tir","Recruter un Frondeur (portée 2).","Haute Mer","Naviguer sur l'océan.","Exploitation minière","Construire une Mine sur le minerai (+2 pop).","Siège","Recruter un Bélier (attaque 4).","Diplomatie","Proposer des pactes de trêve.","Défrichement","Agrandir le territoire de n'importe quelle ville au rayon 2 (6 ✦), sans attendre le niveau 4.","Ingénierie","Ériger la Grande Œuvre de votre clan dans la capitale (30 ✦, une par partie).","Urbanisme","Construire une Place dans chaque ville (8 ✦ : +3 pop, +40 points).","Cartographie","Révèle toute la carte immédiatement.","Tactique","Toutes vos unités gagnent +1 en attaque.","Fortification","Acheter une Muraille dans n'importe quelle ville (6 ✦).","Sylviculture","Construire une Scierie en forêt (+2 pop) et la chasse rapporte +1 pop de plus.","Architecture","Fermes, mines et scieries donnent +1 pop (y compris celles déjà construites), chaque marché rapporte +1 ✦ et les ponts deviennent permanents.","Alliance","Les trêves durent 10 tours et le tribut est divisé par deux.","Forge Éternelle","Grand Phare","Chaque ville au bord de l'eau rapporte +1 ✦ par tour.","Arbre-Mère","Toutes vos villes gagnent +2 de population maintenant.","Palais de Glace","Vos villes de niveau 3 ou plus reçoivent une Muraille maintenant.","Grand Bazar","Chaque ville rapporte +1 ✦ par tour.","Tour des Vents","Révèle toute la carte et toutes vos villes gagnent +1 de population.","Totem de la Meute","Toutes vos unités se soignent et gagnent +5 de vie maximale.","Prisme Solaire","La capitale rapporte désormais +3 ✦ par tour.","Chaîne de Montage","Chaque ville que vous possédez maintenant rapporte +1 ✦ par tour.","Vaisseau-Mère","Révèle toute la carte et rapporte +10 ✦ maintenant.","Voile Éternel","Vos unités se soignent entièrement et chaque ville gagne +1 de population.","Escalier du Ciel","Toutes vos unités gagnent +1 en défense.","Éclaireur","Lancier","Frondeur","Cavalier","Bélier","Gardien","Pyromancien","Lance du feu à 2 cases avec une attaque de 3.","Harponneur","Attaque 3 et défense 2 : le lancier des récifs.","Druide","Au début du tour, soigne 3 de vie aux alliés voisins.","Cavalier d'Ours","Monture lourde : 16 de vie et attaque 3.","Caravane","Se déplace de 2 cases et rapporte +1 ✦ par tour tant qu'elle vit (jusqu'à 2 caravanes comptent).","Fauconnier","Le faucon attaque à 3 cases de distance.","Loup de Meute","Bon marché et rapide : se déplace de 2 cases, attaque et recule.","Sentinelle de Cristal","Bouclier de cristal : défense 4.","Mecha","Robot géant avec 20 de vie et une attaque de 4. Requiert une ville de niveau 3.","Soucoupe Volante","Vole au-dessus de l'eau, des forêts et des montagnes, 2 cases par tour.","Revenant","Attaque sans subir de contre-attaque.","Séraphin de Pierre","Ailes de pierre : traverse forêts et montagnes sans s'arrêter.","Plaine","Forêt","Montagne","Eau peu profonde","Océan","Fruits","Poissons","Minerai","Atelier","+1 ✦ par tour dans cette ville","Expédition","Une expédition révèle la carte alentour et un Éclaireur est prêt à agir","Défense ×3 pour qui garde la ville","Trésor","+5 ✦ maintenant","Frontière","Le territoire s'étend au rayon 2","Festival","+3 de population","Super-unité gratuite","Jardin de Lumen","+150 points","Route commerciale","+2 ✦ par tour dans cette ville","Phare de la Mosaïque","Explorer 60 % de la carte","Métropole","Avoir une ville de niveau 5","Empire","Avoir 5 villes","Arène des Vétérans","Gagner 10 combats","Facile","Difficile","Printemps","pluies et rivières en crue","chaleur et soleil ardent","Automne","bourrasques sur les hauts plateaux","glace et neige","Baies de lumière","Ressource · fruits","Buisson de baies qui brillent au crépuscule. Cueillez-les avec Cueillette.","Cerf-mousse","Ressource · gibier","Cerf paisible aux bois de mousse. Chassez-le avec la technologie Chasse.","Poisson-lanterne","Ressource · poissons","Poisson qui allume une lumière dans l'eau peu profonde. Pêchez-le avec Navigation.","Cristal vivant","Ressource · minerai","Cristaux qui poussent à l'intérieur de la roche. Construisez une Mine avec Exploitation minière.","Ferme","Bâtiment · +2 pop","Parcelles de blé doré. Requiert Agriculture.","Mine de cristal","Galerie avec des rails et un wagonnet de cristaux. Requiert Exploitation minière.","Marché","Bâtiment · +1 ✦/tour","L'étal d'échanges de la ville. Un par ville. Requiert Commerce.","Scierie","Rondins empilés et une scie actionnée par le Lumen. Requiert Sylviculture.","Ruines anciennes","Exploration","Arche d'un monde antérieur à la mosaïque. La première unité qui arrive gagne une récompense.","Sanctuaire de Lumen","Bâtiment · +2 pop · +60 pts","Autel de pierre avec un cristal de Lumen. Il peut être érigé sur une plaine ou une forêt libres ; chaque nouveau sanctuaire coûte 4 ✦ de plus.","Passage","Lumière solidifiée au-dessus de l'eau peu profonde. N'importe quel clan peut la traverser tant qu'elle dure.","Bienvenue dans Mosaica","Votre clan commence avec une capitale et un Éclaireur. Touchez l'Éclaireur pour voir où il peut aller (points blancs). Amenez des unités jusqu'aux villages neutres et terminez le tour dessus pour les occuper.","Lumens et villes","Les Lumens (✦) arrivent à chaque tour. Touchez les cases de votre territoire pour récolter des ressources : la ville gagne de la population, monte de niveau et chaque niveau donne une récompense.","Technologie","Dans Technologie, vous débloquez des unités et des bâtiments. Au niveau 2, l'Ingénierie débloque la Grande Œuvre de votre clan, qui vaut 300 points.","Combat","Les cercles rouges montrent qui vous pouvez attaquer, avec un aperçu des dégâts. Si vous vous êtes trompé de déplacement, utilisez Annuler avant d'attaquer (impossible après avoir ouvert des ruines).","Comment gagner","La partie dure 30 tours. Gagne celui qui a le plus de points, ou celui qui conquiert tous ses rivaux. Les villes conquises restent instables pendant 3 tours, et chaque ville au-delà de 5 coûte 1 ✦ par tour.","Plateau de jeu","Tableau des scores","Points","Lumens","Tour","Annuler le dernier déplacement (raccourci : Z)","Annuler","Actions","Raccourci : espace","Raccourci : Entrée","Revenu par tour : une ville de niveau 1 rapporte 2 ✦, +1 par niveau, et la capitale rapporte +1.","Combat sans dés : dégâts = part d'attaque × Attaque × 4. Si le défenseur survit et peut atteindre l'attaquant, il contre-attaque.","Forêts, montagnes et villes donnent une défense ×1,5. Une Muraille donne ×3.","La technologie coûte 4 + niveau × nombre de villes. Grandir vite rend la recherche plus chère.","Saisons : tous les 8 tours, l'été (récoltes +1 pop) et l'hiver (l'eau peu profonde gèle et devient un chemin) alternent.","Mode Saisons (facultatif) : printemps, été, automne et hiver alternent tous les {n} tours, et chaque saison donne +{b} en attaque à ses clans.","Les Ponts de Lumen relient les îles pour 3 ✦. Les pactes donnent une trêve de 5 tours ; la rompre coûte 150 points.","Une ville conquise reste instable pendant 3 tours (pas de revenu ni de recrutement). Chaque ville au-delà de 5 coûte 1 ✦ par tour.","Chaque clan possède une unité exclusive (marquée d'une ★ au recrutement), sa propre capitale et une histoire.","Points : niveaux des villes, territoir iv: {u}","Die Geschichte der {c}","Exklusive Einheit","Kostet {n} ✦ und benötigt {t}.","Hauptstadt","Großes Werk: {g}.","Die Welt ist in schwebende Kacheln zerbrochen. Die Clans fügen die Stücke mit Lumen (✦) wieder zusammen, der Energie, die aus jeder Stadt strömt. Wer nach {n} Runden die meisten Punkte hat, vereint das Mosaik.","Wähle deinen Clan","Sonder-Clans","Schwierigkeit","Spielmodus","Partie starten","Kalender der Jahreszeiten","Das Jahr hat 4 Jahreszeiten zu je {n} Runden. In jeder erhalten die Clans dieser Jahreszeit +{b} Angriff für alle Einheiten. Der Winter lässt das Flachwasser gefrieren, und Ernten bringen nur im Sommer +1 Bev.","(dein Clan)","Erweiterte Optionen","Karten-Seed","Dieselbe Zahl erzeugt immer dieselbe Karte. Lass sie, wie sie ist, für eine Zufallskarte.","{c} in Gefahr","es ist deine letzte Stadt","könnte nächste Runde fallen","Feinde nahe {c}","{c} ist ungeschützt und deine letzte Stadt. Lass eine Einheit darin oder besiege den Feind daneben.","{c} ist ungeschützt. Lass eine Einheit darin oder besiege den Feind daneben.","Das ist dein <b>Späher</b>. Tippe ihn an, um zu sehen, wie weit er ziehen kann.","Die <b>weißen Punkte</b> zeigen die Reichweite. Tippe auf einen, um zu ziehen und die Karte aufzudecken.","Tippe auf das <b>hervorgehobene Feld</b> in deinem Gebiet und nutze die goldene Aktion unten. Ernten lässt die Stadt wachsen.","Tippe jetzt auf deine <b>Hauptstadt</b> (die Stadt mit der goldenen Raute) und bilde eine Einheit aus. Eine leere Stadt kann eingenommen werden.","Öffne <b>Technologie</b>, um zu sehen, was dein Clan lernen kann. Jede Forschung schaltet Einheiten oder Gebäude frei.","Wenn es nichts mehr zu tun gibt, tippe auf <b>Runde beenden</b>. Die anderen Clans spielen und du erhältst Lumen (✦).","Zeit zu wachsen: Bring eine Einheit zum hervorgehobenen <b>neutralen Dorf</b> und beende die Runde darauf, um es zu besetzen.","Zeit zu wachsen: Erkunde mit dem Späher, bis du ein <b>neutrales Dorf</b> (graue Dächer) findest, und beende die Runde darauf.","Du kennst jetzt das Wichtigste. Es gewinnt, wer in Runde {n} die meisten Punkte hat oder alle Rivalen erobert. Alle Tipps findest du im Menü.","Veteran!","{u} erhielt +5 Leben","Dorf besetzt!","Stadt erobert!","{city} gehört jetzt dem Clan {c}","Stadt verloren","{c} hat {city} eingenommen","Clan ausgelöscht","{c} hat das Mosaik verlassen","Großes Werk vollendet · +300 Punkte","Monument errichtet","{m} · +250 Punkte","Letzte Runde","Lass jede Aktion zählen","Noch 5 Runden bis zum Ende der Partie.","{c} ist ohne Verteidigung","Ein Feind kann die Stadt nächste Runde erreichen, und sie ist deine <b>letzte Stadt</b>: Fällt sie, ist die Partie vorbei. Lass eine Einheit darin oder bilde jetzt eine aus.","Ein Feind kann die Stadt nächste Runde erreichen. Lass eine Einheit darin oder bilde jetzt eine aus.","Trotzdem beenden","Stadt verteidigen","Anleitung beendet. Die Tipps findest du im Menü.","Glut","Vulkane und Asche","Brücken werden zu festem Boden (die Lava erstarrt) und Rammböcke kosten 5 ✦.","Als die Welt zerbrach, brannte der Vulkan Ignea auf einer einzigen Kachel weiter. Die Glut wurden um ihn herum geboren und schworen, die erste Flamme nie erlöschen zu lassen. Für sie kann nur Feuer wieder zusammenschweißen, was zerbrochen ist.","Vulkanschmiede","Flut","Riffe","Hafen: Einheiten auf dem Wasser haben +1 Bewegung und Fischen kostet 1 ✦.","Der Archipel der Flut versank im Großen Bruch, und das ganze Volk verbrachte eine Generation auf Flößen. Sie lernten, die Strömungen zu lesen, indem sie den Laternenfischen folgten. Heute suchen sie Kachel für Kachel das Riff, an dem alles begann.","Korallen-Leuchtturm","Wurzel","dichter Wald","Einheiten im Wald haben +1 Verteidigung.","Die Wurzel stammen von den Gärtnern des Mutterbaums ab, dessen Wurzeln während des Bruchs die letzten Stücke Land zusammenhielten. Jede ihrer Städte wächst aus einem seiner Samen. Das Mosaik zu vereinen heißt für die Wurzel, den ursprünglichen Wald neu zu pflanzen.","Baumhaus","Frost","Tundra","Überquert Flachwasser ohne Boot (Eis).","Aus den warmen Ländern vertrieben, überquerten die Frost zu Fuß ein gefrorenes Meer und überlebten, wo sonst niemand leben wollte. Sie zähmten die weißen Bären und machten den Winter zu ihrem Verbündeten. Jetzt steigen sie aus der Tundra herab, um den Platz einzufordern, der ihnen verwehrt wurde.","Kristall-Iglu","Düne","Wüste","Oase: Der Markt kostet 3 ✦ und Karawanen bringen Lumen.","Wo Lumensplitter in die Wüste fielen, entsprangen Oasen. Die Düne fanden sie als Erste und errichteten um jede einen Basar. Ihre Karawanen verbinden die Kacheln durch Handel, bevor irgendeine Armee eintrifft.","Oasenpalast","Wind","Hochebenen","Reiter haben +1 Bewegung und kosten 3 ✦.","Nomaden der Hochebenen, die Wind bauten nie Mauern: Ihr Zuhause ist der Sattel. Man sagt, sie hörten den Bruch im Pfeifen des Windes kommen und überlebten deshalb. Sie reiten der Stimme nach, die wieder eine ganze Welt verspricht.","Windmühle","Bestie","Savannen und Wälder","Rudel: Jagen kostet nur 1 ✦.","Im Bruch verlorene Kinder wurden von einem Rudel Mooswölfe aufgenommen. Sie wuchsen gemeinsam jagend auf und kehrten als Clan zurück, der alles teilt, was er erlegt. Für die Bestie ist das Mosaik ein Jagdrevier, das nur ein einziges Rudel braucht.","Totembau","Schein","Kristallschluchten","Lumenbrücken kosten 1 ✦ und halten doppelt so lange.","Mönche der Kristallschluchten, die Schein entdeckten, wie man Licht verfestigt, und bauten die ersten Lumenbrücken. Sie hüten das Geheimnis in goldenen Klöstern. Sie glauben, die Welt finde mit Brücken wieder zusammen, nicht mit Schwertern, tragen aber trotzdem Schwerter.","Lumen-Obelisk","Automaten","Metallzitadellen","Panzerung: Alle Einheiten starten mit +3 Leben.","Armee humanoider Roboter","Im Jahr 2053 führen die Automaten den Krieg der Zukunft gegen die Astrale und verlieren ihn. Einheit Null berechnete den einzigen Ausweg: in der Zeit zurückreisen und die Vergangenheit erobern, bevor der Feind ankommt. Eine Armee humanoider Roboter durchquerte das Portal und errichtete ihr erstes Rechenzentrum im Zeitalter des Mosaiks.","Rechenzentrum","Astrale","Landekrater","Orbitalsicht: Einheiten sehen 1 Feld weiter.","Außerirdische","Die Astrale kamen aus den Sternen, um 2053 die Welt zu beherrschen, und stießen auf einen Widerstand aus Metall. Als sie den Plan der Automaten abfingen, schickten sie ein Schiff durch dasselbe Zeitportal. Sie landeten in der Vergangenheit mit einer Mission: die Roboter jagen und die Welt einnehmen, bevor der Krieg beginnt.","Gelandetes Schiff","Gespenster","ewige Nebel","Nebel: Sie überqueren Berge ohne Klettern und haben dort +1 Verteidigung.","Volk der Schatten","Die Gespenster sind die Schatten derer, die im Großen Bruch verschwanden, gefangen zwischen einer Kachel und der nächsten. Sie leben in den Nebeln und überqueren Berge, als wären sie Dunst. Sie glauben, dass sie wieder einen Körper bekommen, wenn das Mosaik vereint ist.","Nebelmausoleum","Kolosse","himmlische Ruinen","Steinhaut: Jeder erlittene Treffer verursacht 1 Schaden weniger.","Gefallene Engel aus Stein","Die Kolosse waren Engel. Als die Welt zerbrach, fielen sie mit den Splittern vom Himmel, und als sie den Boden berührten, wurden Flügel und Haut zu Stein. Langsame, fast unzerstörbare Riesen, wollen sie das Mosaik wieder vereinen, um die Treppe nach Hause zu errichten.","Gefallener Thron","Sammeln","Früchte auf dem Feld ernten (+1 Bev).","Jagd","Tiere im Wald jagen (+1 Bev).","Seefahrt","Flachwasser befahren und fischen (+1 Bev).","Klettern","Berge besteigen (Verteidigung ×1,5).","Schmieden","Speerträger ausbilden (Verteidigung 3).","Reiten","Reiter ausbilden (Bewegung 2, greift an und zieht sich zurück).","Handel","Markt bauen (+1 ✦ pro Runde).","Lumenkunde","Lumenbrücken über Flachwasser errichten (halten 8 Runden).","Ackerbau","Bauernhof auf dem Feld bauen (+2 Bev).","Schießkunst","Schleuderer ausbilden (Reichweite 2).","Hochsee","Auf dem Ozean segeln.","Bergbau","Mine auf Erz bauen (+2 Bev).","Belagerung","Rammbock ausbilden (Angriff 4).","Diplomatie","Waffenstillstände anbieten.","Erschließung","Das Gebiet jeder Stadt auf Radius 2 erweitern (6 ✦), ohne auf Stufe 4 zu warten.","Ingenieurwesen","Das Große Werk deines Clans in der Hauptstadt errichten (30 ✦, eines pro Partie).","Städtebau","In jeder Stadt einen Platz errichten (8 ✦: +3 Bev, +40 Punkte).","Kartografie","Deckt sofort die ganze Karte auf.","Taktik","Alle deine Einheiten erhalten +1 Angriff.","Befestigung","In jeder Stadt eine Mauer kaufen (6 ✦).","Forstwirtschaft","Sägewerk im Wald bauen (+2 Bev) und Jagen bringt +1 Bev zusätzlich.","Architektur","Bauernhöfe, Minen und Sägewerke geben +1 Bev (auch bereits gebaute), jeder Markt bringt +1 ✦ und Brücken werden dauerhaft.","Allianz","Waffenstillstände dauern 10 Runden und der Tribut halbiert sich.","Ewige Schmiede","Großer Leuchtturm","Jede Stadt am Wasser bringt +1 ✦ pro Runde.","Mutterbaum","Alle deine Städte erhalten jetzt +2 Bevölkerung.","Eispalast","Deine Städte ab Stufe 3 erhalten jetzt eine Mauer.","Großer Basar","Jede Stadt bringt +1 ✦ pro Runde.","Turm der Winde","Deckt die ganze Karte auf und alle deine Städte erhalten +1 Bevölkerung.","Rudeltotem","Alle deine Einheiten heilen sich und erhalten +5 maximales Leben.","Sonnenprisma","Die Hauptstadt bringt nun +3 ✦ pro Runde.","Fließband","Jede Stadt, die du jetzt besitzt, bringt +1 ✦ pro Runde.","Mutterschiff","Deckt die ganze Karte auf und bringt jetzt +10 ✦.","Ewiger Schleier","Deine Einheiten heilen sich vollständig und jede Stadt erhält +1 Bevölkerung.","Himmelstreppe","Alle deine Einheiten erhalten +1 Verteidigung.","Späher","Speerträger","Schleuderer","Reiter","Rammbock","Wächter","Pyromant","Schleudert Feuer 2 Felder weit mit Angriff 3.","Harpunier","Angriff 3 und Verteidigung 2: der Speerträger der Riffe.","Druide","Heilt zu Beginn der Runde benachbarte Verbündete um 3 Leben.","Bärenreiter","Schweres Reittier: 16 Leben und Angriff 3.","Karawane","Zieht 2 Felder und bringt +1 ✦ pro Runde, solange sie lebt (bis zu 2 Karawanen zählen).","Falkner","Der Falke greift aus 3 Feldern Entfernung an.","Rudelwolf","Billig und schnell: zieht 2 Felder, greift an und zieht sich zurück.","Kristallwächter","Kristallschild: Verteidigung 4.","Mecha","Riesenroboter mit 20 Leben und Angriff 4. Benötigt eine Stadt der Stufe 3.","Fliegende Untertasse","Fliegt über Wasser, Wald und Berge, 2 Felder pro Runde.","Spuk","Greift an, ohne einen Gegenangriff zu erleiden.","Steinseraph","Steinflügel: überquert Wald und Berge ohne Halt.","Feld","Wald","Berg","Flachwasser","Ozean","Früchte","Fische","Erz","Werkstatt","+1 ✦ pro Runde in dieser Stadt","Expedition","Eine Expedition deckt die Umgebung auf und ein Späher ist bereit","Verteidigung ×3 für den Wächter der Stadt","Schatz","+5 ✦ sofort","Grenze","Das Gebiet wächst auf Radius 2","Fest","+3 Bevölkerung","Gratis-Supereinheit","Lumengarten","+150 Punkte","Handelsroute","+2 ✦ pro Runde in dieser Stadt","Mosaik-Leuchtturm","60 % der Karte erkunden","Metropole","Eine Stadt der Stufe 5 besitzen","Imperium","5 Städte besitzen","Arena der Veteranen","10 Kämpfe gewinnen","Leicht","Schwer","Frühling","Regen und volle Flüsse","Hitze und starke Sonne","Herbst","Stürme auf den Hochebenen","Eis und Schnee","Leuchtbeeren","Ressource · Früchte","Ein Strauch mit Beeren, die in der Dämmerung leuchten. Pflücke sie mit Sammeln.","Mooshirsch","Ressource · Wild","Ein zahmer Hirsch mit einem Geweih aus Moos. Jage ihn mit der Technologie Jagd.","Laternenfisch","Ressource · Fische","Ein Fisch, der im Flachwasser ein Licht entzündet. Fange ihn mit Seefahrt.","Lebender Kristall","Ressource · Erz","Kristalle, die im Gestein wachsen. Baue mit Bergbau eine Mine.","Bauernhof","Gebäude · +2 Bev","Beete mit goldenem Weizen. Benötigt Ackerbau.","Kristallmine","Ein Stollen mit Schienen und einem Kristallwagen. Benötigt Bergbau.","Markt","Gebäude · +1 ✦/Runde","Der Handelsstand der Stadt. Einer pro Stadt. Benötigt Handel.","Sägewerk","Gestapelte Stämme und eine lumenbetriebene Säge. Benötigt Forstwirtschaft.","Alte Ruinen","Erkundung","Ein Bogen aus einer Welt vor dem Mosaik. Die erste Einheit, die ankommt, erhält eine Belohnung.","Lumen-Schrein","Gebäude · +2 Bev · +60 Pkt.","Ein Steinaltar mit einem Lumenkristall. Er kann auf freiem Feld oder Wald errichtet werden; jeder neue Schrein kostet 4 ✦ mehr.","Übergang","Verfestigtes Licht über dem Flachwasser. Jeder Clan kann es überqueren, solange es hält.","Willkommen in Mosaica","Dein Clan beginnt mit einer Hauptstadt und einem Späher. Tippe den Späher an, um zu sehen, wohin er ziehen kann (weiße Punkte). Bring Einheiten zu neutralen Dörfern und beende die Runde darauf, um sie zu besetzen.","Lumen und Städte","Lumen (✦) kommen jede Runde. Tippe auf Felder in deinem Gebiet, um Ressourcen zu ernten: Die Stadt gewinnt Bevölkerung, steigt auf und jede Stufe bringt eine Belohnung.","Technologie","Unter Technologie schaltest du Einheiten und Gebäude frei. Auf Stufe 2 schaltet Ingenieurwesen das Große Werk deines Clans frei, das 300 Punkte wert ist.","Kampf","Rote Kreise zeigen, wen du angreifen kannst, mit einer Schadensvorschau. Falls du falsch gezogen bist, nutze Rückgängig vor dem Angriff (nicht mehr nach dem Öffnen von Ruinen).","So gewinnst du","Die Partie dauert 30 Runden. Es gewinnt, wer die meisten Punkte hat oder alle Rivalen erobert. Eroberte Städte sind 3 Runden lang instabil, und jede Stadt über 5 kostet 1 ✦ pro Runde.","Spielbrett","Punktestand","Punkte","Lumen","Runde","Letzten Zug rückgängig machen (Kürzel: Z)","Rückgängig","Aktionen","Kürzel: Leertaste","Kürzel: Enter","Einnahmen pro Runde: Eine Stadt der Stufe 1 bringt 2 ✦, +1 pro Stufe, und die Hauptstadt bringt +1.","Kampf ohne Würfel: Schaden = Angriffsanteil × Angriff × 4. Überlebt der Verteidiger und erreicht er den Angreifer, schlägt er zurück.","Wald, Berge und Städte geben Verteidigung ×1,5. Eine Mauer gibt ×3.","Technologie kostet 4 + Stufe × Anzahl der Städte. Schnelles Wachstum verteuert die Forschung.","Jahreszeiten: Alle 8 Runden wechseln Sommer (Ernten +1 Bev) und Winter (Flachwasser gefriert und wird begehbar).","Jahreszeiten-Modus (optional): Frühling, Sommer, Herbst und Winter wechseln alle {n} Runden, und jede Jahreszeit gibt ihren Clans +{b} Angriff.","Lumenbrücken verbinden Inseln für 3 ✦. Pakte bringen 5 Runden Waffenstillstand; ein Bruch kostet 150 Punkte.","Eine eroberte Stadt ist 3 Runden lang instabil (keine Einnahmen, kein Ausbilden). Jede Stadt über 5 kostet 1 ✦ pro Runde.","Jeder Clan hat eine exklusive Einheit (beim Ausbilden mit ★ markiert), eine eigene Hauptstadt und eine Geschichte.","Punkte: Stadtstufen, Gebiet, Technologien, Einheiten, Erkundung und Monumente.","Verstanden","Niederlage","Sieg",", ","Bev"],"it":["Lingua","Partita creata (seme {s}). Guidi il clan {c}.","Modalità Stagioni: prima stagione, {s}, che rafforza {f}.","la tecnologia {t}","un Esploratore che si è unito al clan","una mappa della regione","{c} ha esplorato delle rovine e ha trovato {m}.","Rovine: hai trovato {m}!","rovine!","{a} ({ac}) ha attaccato {d} ({dc}): {n} danni",", sconfitto","; {u} è diventato veterano",", contrattacco di {n}",", l'attaccante è caduto","{c} ha ricercato {t}.","Architettura: costruzioni migliorate e ponti permanenti.","Cartografia: l'intera mappa è stata rivelata.","{c} ha eretto la Grande Opera {g} a {city}.","Grande Opera: {g} (+300 punti).","{c} ha eretto la Grande Opera {g}.","{c} ha eretto una Piazza a {city}.","{c} ha ampliato il territorio di {city}.","territorio +","{c} ha cinto di mura {city}.","Raccogli bacche di luce","Caccia il cervo muschiato","Pesca il pesce lanterna","Costruisci miniera di cristallo","Costruisci segheria","Erigi santuario di Lumen","Costruisci fattoria","Costruisci mercato","{c} ha solidificato la lava e creato nuova terra.","{c} ha eretto un Ponte di Lumen.","{city} ({c}) è salita al livello {n}.","Un esploratore di {c} è partito da {city} e ha rivelato {n} caselle.","L'  avvisi","non disponibile su questo dispositivo","Velocità delle animazioni","movimento delle unità e turno dei rivali","Veloce","Normale","Rifai la partita guidata","nella prossima partita","Cancella la partita salvata","turno {n}","nessuna","{n} registrati","Consiglio {a} di {b}","Salta","Avanti","Gioca","Unisci le tessere del mondo","Nuova partita","Continua","turno {a} di {b}","Sfida del giorno","Classica","Altre opzioni","Clan","Esclusiva: {u}","La storia dei {c}","Unità esclusiva","Costa {n} ✦ e richiede {t}.","Capitale","Grande Opera: {g}.","Il mondo si è spezzato in tessere fluttuanti. I clan ricuciono i pezzi con i Lumen (✦), l'energia che sgorga da ogni città. In {n} turni, chi ha più punti unisce il mosaico.","Scegli il tuo clan","Clan speciali","Difficoltà","Modalità di gioco","Inizia la partita","Calendario delle Stagioni","L'anno ha 4 stagioni di {n} turni. In ognuna, i clan della stagione ottengono +{b} di attacco su tutte le unità. L'inverno gela l'acqua bassa e i raccolti rendono +1 pop solo in estate.","(il tuo clan)","Opzioni avanzate","Seme della mappa","Lo stesso numero genera sempre la stessa mappa. Lascialo così per una mappa casuale.","{c} in pericolo","è la tua ultima città","può cadere al prossimo turno","Nemici vicino a {c}","{c} è indifesa ed è la tua ultima città. Lascia un'unità dentro o sconfiggi il nemico accanto.","{c} è indifesa. Lascia un'unità dentro o sconfiggi il nemico accanto.","Questo è il tuo <b>Esploratore</b>. Toccalo per vedere fin dove può muoversi.","I <b>punti bianchi</b> mostrano la portata. Toccane uno per muoverti e rivelare la mappa.","Tocca la <b>casella evidenziata</b> del tuo territorio e usa l'azione dorata che appare in basso. Raccogliere fa crescere la città.","Ora tocca la tua <b>capitale</b> (la città con il rombo dorato) e addestra un'unità. Una città vuota può essere presa.","Apri <b>Tecnologia</b> per vedere cosa può imparare il tuo clan. Ogni ricerca sblocca unità o costruzioni.","Quando non c'è più niente da fare, tocca <b>Fine turno</b>. Gli altri clan giocano e tu ricevi Lumen (✦).","È ora di crescere: porta un'unità al <b>villaggio neutrale</b> evidenziato e termina il turno sopra di esso per occuparlo.","È ora di crescere: esplora con l'Esploratore finché non trovi un <b>villaggio neutrale</b> (tetti grigi) e termina il turno sopra di esso.","Ora conosci l'essenziale. Vince chi ha più punti al turno {n}, o chi conquista tutti i rivali. Tutti i consigli sono nel Menu.","Veterano!","{u} ha ottenuto +5 di vita","Villaggio occupato!","Città conquistata!","{city} ora appartiene al clan {c}","Città perduta","{c} ha preso {city}","Clan eliminato","{c} è uscito dal mosaico","Grande Opera completata · +300 punti","Monumento eretto","{m} · +250 punti","Ultimo turno","Fai contare ogni azione","Mancano 5 turni alla fine della partita.","{c} è senza difesa","Un nemico può raggiungere la città al prossimo turno, ed è la tua <b>ultima città</b>: se cade, la partita finisce. Lascia un'unità dentro o addestrane una ora.","Un nemico può raggiungere la città al prossimo turno. Lascia un'unità dentro o addestrane una ora.","Termina comunque","Difendi la città","Guida chiusa. I consigli sono nel Menu.","Brace","vulcani e cenere","I ponti diventano terraferma (la lava si solidifica) e gli Arieti costano 5 ✦.","Quando il mondo si spezzò, il vulcano Ignea rimase acceso su un'unica tessera. I Brace nacquero intorno a esso e giurarono di non lasciar mai spegnere la prima fiamma. Per loro, solo il fuoco può risaldare ciò che si è rotto.","Forgia-Vulcano","Marea","scogliere coralline","Porto: le unità in acqua hanno +1 di movimento e pescare costa 1 ✦.","L'arcipelago dei Marea affondò nella Grande Frattura e l'intero popolo passò una generazione sulle zattere. Impararono a leggere le correnti seguendo i pesci lanterna. Oggi cercano, tessera dopo tessera, la scogliera dove tutto ebbe inizio.","Faro di Corallo","Radice","foresta fitta","Le unità nella foresta hanno +1 di difesa.","I Radice discendono dai giardinieri dell'Albero Madre, le cui radici tennero insieme gli ultimi pezzi di terra durante la Frattura. Ogni loro città nasce da un suo seme. Per i Radice, unire il mosaico significa ripiantare la foresta originaria.","Casa sull'Albero","Brina","tundra","Attraversa l'acqua bassa senza barca (ghiaccio).","Cacciati dalle terre calde, i Brina attraversarono a piedi un mare gelato e sopravvissero dove nessun altro volle vivere. Domarono gli orsi bianchi e fecero dell'inverno un alleato. Ora scendono dalla tundra per reclamare il posto che fu loro negato.","Igloo di Cristallo","Duna","deserto","Oasi: il mercato costa 3 ✦ e le Carovane portano Lumen.","Dove caddero schegge di Lumen nel deserto, sbocciarono oasi. I Duna furono i primi a trovarle ed eressero bazar intorno a ciascuna. Le loro carovane uniscono le tessere con il commercio prima che arrivi qualsiasi esercito.","Palazzo dell'Oasi","Vento","altipiani","I Cavalieri hanno +1 di movimento e costano 3 ✦.","Nomadi degli altipiani, i Vento non costruirono mai mura: la loro casa è la sella. Si dice che sentirono arrivare la Frattura nel fischio del vento e per questo sopravvissero. Cavalcano dietro la voce che promette di nuovo un mondo intero.","Mulino dei Venti","Fiera","savane e boschi","Branco: cacciare costa solo 1 ✦.","Bambini perduti nella Frattura furono accolti da un branco di lupi muschiati. Crebbero cacciando insieme e tornarono come un clan che divide tutto ciò che abbatte. Per i Fiera, il mosaico è un territorio di caccia che ha bisogno di un solo branco.","Tana del Totem","Lume","canyon di cristallo","I Ponti di Lumen costano 1 ✦ e durano il doppio.","Monaci dei canyon di cristallo, i Lume scoprirono come solidificare la luce e costruirono i primi Ponti di Lumen. Custodiscono il segreto in monasteri dorati. Credono che il mondo si riunisca con i ponti, non con le spade, ma portano comunque le spade.","Obelisco di Lumen","Automi","cittadelle di metallo","Corazza: tutte le unità nascono con +3 di vita.","Esercito di robot umanoidi","Nel 2053, gli Automi combattono la Guerra del Futuro contro gli Astri e la stanno perdendo. L'Unità Zero ha calcolato l'unica via d'uscita: tornare indietro nel tempo e conquistare il passato prima che arrivi il nemico. Un esercito di robot umanoidi ha attraversato il portale e ha eretto il suo primo data center nell'era del mosaico.","Data Center","Astri","cratere d'atterraggio","Vista orbitale: le unità vedono 1 casella più avanti.","Extraterrestri","Gli Astri vennero dalle stelle per dominare il mondo nel 2053 e trovarono una resistenza di metallo. Quando intercettarono il piano degli Automi, lanciarono una nave attraverso lo stesso portale del tempo. Atterrarono nel passato con una missione: dare la caccia ai robot e prendere il mondo prima che la guerra cominci.","Nave Atterrata","Spettri","nebbie eterne","Foschia: attraversano le montagne senza Scalata e vi hanno +1 di difesa.","Popolo delle ombre","Gli Spettri sono le ombre di chi scomparve nella Grande Frattura, intrappolate tra una tessera e l'altra. Vivono nelle nebbie e attraversano le montagne come se fossero foschia. Credono che, se il mosaico verrà unito, torneranno ad avere un corpo.","Mausoleo delle Nebbie","Colossi","rovine celesti","Pelle di pietra: ogni colpo subito infligge 1 danno in meno.","Angeli caduti di pietra","I Colossi erano angeli. Quando il mondo si spezzò, caddero dal cielo insieme alle schegge e, toccando il suolo, ali e pelle divennero pietra. Giganti lenti e quasi indistruttibili, vogliono riunire il mosaico per erigere la scala che li riporterà a casa.","Trono Caduto","Raccolta","Raccogliere frutti nei campi (+1 pop).","Caccia","Cacciare animali nella foresta (+1 pop).","Navigazione","Entrare in acqua bassa e pescare (+1 pop).","Scalata","Salire sulle montagne (difesa ×1,5).","Forgiatura","Addestrare Lanciere (difesa 3).","Equitazione","Addestrare Cavaliere (movimento 2, attacca e si ritira).","Commercio","Costruire Mercato (+1 ✦ per turno).","Lumenaria","Erigere Ponti di Lumen sull'acqua bassa (durano 8 turni).","Agricoltura","Costruire Fattoria nei campi (+2 pop).","Tiro","Addestrare Frombolieri (gittata 2).","Mare Aperto","Navigare nell'oceano.","Estrazione","Costruire Miniera sul minerale (+2 pop).","Assedio","Addestrare Ariete (attacco 4).","Diplomazia","Proporre patti di tregua.","Pionierismo","Ampliare il territorio di qualsiasi città a raggio 2 (6 ✦), senza aspettare il livello 4.","Ingegneria","Erigere la Grande Opera del tuo clan nella capitale (30 ✦, una per partita).","Urbanistica","Erigere una Piazza in ogni città (8 ✦: +3 pop, +40 punti).","Cartografia","Rivela subito l'intera mappa.","Tattiche","Tutte le tue unità ottengono +1 di attacco.","Fortificazione","Comprare Mura in qualsiasi città (6 ✦).","Silvicoltura","Costruire Segheria nella foresta (+2 pop) e la caccia rende +1 pop in più.","Architettura","Fattorie, miniere e segherie danno +1 pop (anche quelle già costruite), ogni mercato rende +1 ✦ e i ponti diventano permanenti.","Alleanza","Le tregue durano 10 turni e il tributo si dimezza.","Forgia Eterna","Grande Faro","Ogni città in riva all'acqua rende +1 ✦ per turno.","Albero Madre","Tutte le tue città ottengono +2 di popolazione ora.","Palazzo di Ghiaccio","Le tue città di livello 3 o superiore ottengono le Mura ora.","Gran Bazar","Ogni città rende +1 ✦ per turno.","Torre dei Venti","Rivela l'intera mappa e tutte le tue città ottengono +1 di popolazione.","Totem del Branco","Tutte le tue unità guariscono e ottengono +5 di vita massima.","Prisma Solare","La capitale passa a rendere +3 ✦ per turno.","Catena di Montaggio","Ogni città che possiedi ora rende +1 ✦ per turno.","Nave Madre","Rivela l'intera mappa e porta +10 ✦ ora.","Velo Eterno","Le tue unità guariscono del tutto e ogni città ottiene +1 di popolazione.","Scala del Cielo","Tutte le tue unità ottengono +1 di difesa.","Esploratore","Lanciere","Frombolieri","Cavaliere","Ariete","Guardiano","Piromante","Scaglia fuoco a 2 caselle con attacco 3.","Arpioniere","Attacco 3 e difesa 2: il lanciere delle scogliere.","Druido","All'inizio del turno, cura 3 di vita agli alleati vicini.","Cavaliere d'Orso","Cavalcatura pesante: 16 di vita e attacco 3.","Carovana","Si muove di 2 caselle e rende +1 ✦ per turno finché vive (contano fino a 2 carovane).","Falconiere","Il falco attacca a 3 caselle di distanza.","Lupo del Branco","Economico e veloce: si muove di 2 caselle, attacca e si ritira.","Sentinella di Cristallo","Scudo di cristallo: difesa 4.","Mecha","Robot gigante con 20 di vita e attacco 4. Richiede una città di livello 3.","Disco Volante","Vola sopra acqua, foresta e montagna, 2 caselle per turno.","Spirito","Attacca senza subire contrattacco.","Serafino di Pietra","Ali di pietra: attraversa foreste e montagne senza fermarsi.","Prato","Foresta","Montagna","Acqua bassa","Oceano","Frutti","Pesci","Minerale","Officina","+1 ✦ per turno in questa città","Spedizione","Una spedizione rivela la mappa intorno e un Esploratore è pronto ad agire","Difesa ×3 per chi presidia la città","Tesoro","+5 ✦ subito","Frontiera","Il territorio cresce a raggio 2","Festa","+3 di popolazione","Super-unità gratuita","Giardino di Lumen","+150 punti","Rotta commerciale","+2 ✦ per turno in questa città","Faro del Mosaico","Esplorare il 60% della mappa","Metropoli","Avere una città di livello 5","Impero","Avere 5 città","Arena dei Veterani","Vincere 10 battaglie","Facile","Difficile","Primavera","piogge e fiumi in piena","caldo e sole forte","Autunno","raffiche sugli altipiani","ghiaccio e neve","Bacche di luce","Risorsa · frutti","Arbusto di bacche che brillano al tramonto. Raccoglile con Raccolta.","Cervo muschiato","Risorsa · selvaggina","Cervo mansueto con palchi di muschio. Caccialo con la tecnologia Caccia.","Pesce lanterna","Risorsa · pesci","Pesce che accende una luce nell'acqua bassa. Pescalo con Navigazione.","Cristallo vivo","Risorsa · minerale","Cristalli che crescono dentro la roccia. Costruisci una Miniera con Estrazione.","Fattoria","Costruzione · +2 pop","Campi di grano dorato. Richiede Agricoltura.","Miniera di cristallo","Galleria con binari e un carrello di cristalli. Richiede Estrazione.","Mercato","Costruzione · +1 ✦/turno","La bancarella di scambi della città. Uno per città. Richiede Commercio.","Segheria","Tronchi impilati e una sega mossa dal Lumen. Richiede Silvicoltura.","Rovine antiche","Esplorazione","Arco di un mondo anteriore al mosaico. La prima unità che arriva vince un premio.","Santuario di Lumen","Costruzione · +2 pop · +60 pt","Altare di pietra con un cristallo di Lumen. Si può erigere su prato o foresta liberi; ogni nuovo santuario costa 4 ✦ in più.","Attraversamento","Luce solidificata sopra l'acqua bassa. Qualsiasi clan può attraversarla finché dura.","Benvenuto in Mosaica","Il tuo clan inizia con una capitale e un Esploratore. Tocca l'Esploratore per vedere dove può muoversi (punti bianchi). Porta le unità ai villaggi neutrali e termina il turno sopra di essi per occuparli.","Lumen e città","I Lumen (✦) arrivano a ogni turno. Tocca le caselle del tuo territorio per raccogliere risorse: la città guadagna popolazione, sale di livello e ogni livello dà un premio.","Tecnologia","In Tecnologia sblocchi unità e costruzioni. Al livello 2, l'Ingegneria sblocca la Grande Opera del tuo clan, che vale 300 punti.","Combattimento","I cerchi rossi mostrano chi puoi attaccare, con un'anteprima del danno. Se ti sei mosso male, usa Annulla prima di attaccare (non vale dopo aver aperto delle rovine).","Come vincere","La partita dura 30 turni. Vince chi ha più punti, o chi conquista tutti i rivali. Le città conquistate restano instabili per 3 turni, e ogni città oltre la quinta costa 1 ✦ per turno.","Tabellone di gioco","Punteggio","Punti","Lumen","Turno","Annulla l'ultima mossa (scorciatoia: Z)","Annulla","Azioni","Scorciatoia: spazio","Scorciatoia: Invio","Rendita per turno: una città di livello 1 rende 2 ✦, +1 per livello, e la capitale rende +1.","Co ","沙漠","绿洲:市场花费3 ✦,商队会带来流明。","流明碎片落入沙漠之处,涌出了绿洲。沙丘族最先发现了它们,并在每片绿洲周围建起集市。在任何军队到来之前,他们的商队就已用贸易将各个地块连接起来。","绿洲宫殿","疾风","高原","骑兵移动+1,花费3 ✦。","疾风族是高原上的游牧民,从不修筑城墙:马鞍就是他们的家。据说他们从风的呼啸中听见了碎裂的到来,因此得以幸存。他们追随着那个承诺再次完整世界的声音一路驰骋。","风车","野兽","草原与林地","兽群:狩猎只需1 ✦。","在碎裂中走失的孩子们被一群苔狼收留。他们一同狩猎长大,回来时已成为一个分享一切猎物的氏族。对野兽族来说,马赛克是一片只需要一个兽群的猎场。","图腾巢穴","微光","水晶峡谷","流明桥只需1 ✦,持续时间翻倍。","微光族是水晶峡谷中的僧侣,他们发现了凝固光的方法,建起了最初的流明桥。他们在金色修道院中守护着这个秘密。他们相信世界要靠桥梁而非刀剑重新相连,但还是会随身带着刀剑。","流明方尖碑","自动机","金属要塞","装甲:所有单位出生时生命+3。","人形机器人军团","2053年,自动机正与星族进行未来战争,并且节节败退。零号单位算出了唯一的出路:回到过去,在敌人到来之前征服过去。一支人形机器人军团穿过传送门,在马赛克时代建起了第一座数据中心。","数据中心","星族","着陆陨坑","轨道视野:单位视野+1格。","外星人","星族在2053年从群星而来,想要统治世界,却遭遇了一支金属抵抗军。截获自动机的计划后,他们让一艘飞船穿过同一道时间之门。他们降落在过去,只有一个任务:在战争开始前猎杀机器人,夺取世界。","着陆飞船","幽灵","永恒迷雾","迷雾:无需攀登即可越过山脉,在山上防御+1。","暗影之民","幽灵族是在大碎裂中消失之人的影子,被困在地块与地块之间。他们生活在迷雾中,像雾气一样越过山脉。他们相信,只要马赛克重新统一,自己就能重获身体。","迷雾陵墓","巨像","天空遗迹","石肤:每次受到的攻击伤害减1。","石之堕天使","巨像曾是天使。世界碎裂时,他们随碎片一同从天而降,一触及地面,翅膀与皮肤便化为岩石。这些行动缓慢、几乎不可摧毁的巨人,想要重新拼合马赛克,筑起回家的天梯。","陨落王座","采集","在田野采摘果实(人口+1)。","狩猎","在森林中狩猎动物(人口+1)。","航海","进入浅水并捕鱼(人口+1)。","攀登","登上山地(防御×1.5)。","锻造","训练长枪兵(防御3)。","骑术","训练骑兵(移动2,攻击后撤退)。","贸易","建造市场(每回合+1 ✦)。","流明术","在浅水上架起流明桥(持续8回合)。","农耕","在田野建造农场(人口+2)。","射术","训练投石兵(射程2)。","远洋","在海洋中航行。","采矿","在矿石上建造矿场(人口+2)。","攻城","训练攻城锤(攻击4)。","外交","提议休战协定。","拓荒","将任意城市的领土扩展到半径2(6 ✦),无需等到4级。","工程学","在首都建造你氏族的伟业(30 ✦,每局一次)。","城市规划","在每座城市建造广场(8 ✦:人口+3,+40分)。","制图学","立即揭示整张地图。","战术","你的所有单位攻击+1。","筑城","可在任意城市购买城墙(6 ✦)。","林业","在森林中建造锯木厂(人口+2),狩猎额外+1人口。","建筑学","农场、矿场和锯木厂人口+1(已建成的也算),每个市场+1 ✦,桥梁变为永久。","同盟","休战持续10回合,贡金减半。","永恒熔炉","大灯塔","每座水边城市每回合+1 ✦。","母树","你所有城市立即人口+2。","冰之宫殿","你3级及以上的城市立即获得城墙。","大集市","每座城市每回合+1 ✦。","风之塔","揭示整张地图,你所有城市人口+1。","兽群图腾","你所有单位恢复生命,最大生命+5。","太阳棱镜","首都每回合改为+3 ✦。","装配线","你现有的每座城市每回合+1 ✦。","母舰","揭示整张地图,并立即获得+10 ✦。","永恒帷幕","你的单位完全恢复,每座城市人口+1。","天梯","你的所有单位防御+1。","斥候","长枪兵","投石兵","骑兵","攻城锤","守护者","火术士","以攻击3向2格外喷射火焰。","鱼叉手","攻击3、防御2:珊瑚礁的长枪兵。","德鲁伊","回合开始时,为相邻友军恢复3点生命。","熊骑兵","重型坐骑:生命16,攻击3。","商队","移动2格,存活期间每回合+1 ✦(最多计算2支商队)。","驯鹰人","猎鹰可从3格外发起攻击。","群狼","便宜又 const V29_I18N={"Prepara a Grande Obra do seu clã. Ela é liberada na capital com todas as tecnologias pesquisadas e o mapa inteiro revelado (120 ✦, uma por partida).":["Prepares your clan's Great Work. It unlocks in the capital once every technology is researched and the whole map is revealed (120 ✦, once per match).","Prepara la Gran Obra de tu clan. Se desbloquea en la capital con todas las tecnologías investigadas y el mapa entero revelado (120 ✦, una por partida).","Prépare la Grande Œuvre de votre clan. Elle se débloque dans la capitale quand toutes les technologies sont recherchées et la carte entière révélée (120 ✦, une par partie).","Bereitet das Große Werk deines Clans vor. Es wird in der Hauptstadt freigeschaltet, sobald alle Technologien erforscht sind und die ganze Karte aufgedeckt ist (120 ✦, einmal pro Partie).","Prepara la Grande Opera del tuo clan. Si sblocca nella capitale quando tutte le tecnologie sono ricercate e l'intera mappa è rivelata (120 ✦, una per partita).","氏族の大事業の準備をする。すべての技術を研究し、マップ全体を明らかにすると首都で建てられる（120 ✦、1試合に1回）。","为本氏族的伟业做准备。研究全部科技并揭开整张地图后，即可在首都建造（120 ✦，每局一次）。"],"Em Tecnologia você libera unidades e construções. Com todas as tecnologias e o mapa inteiro revelado, a capital libera a Grande Obra do seu clã, que vale 300 pontos.":["In Technology you unlock units and buildings. With every technology and the whole map revealed, your capital unlocks your clan's Great Work, worth 300 points.","En Tecnología desbloqueas unidades y construcciones. Con todas las tecnologías y el mapa entero revelado, la capital desbloquea la Gran Obra de tu clan, que vale 300 puntos.","Dans Technologie, vous débloquez des unités et des constructions. Avec toutes les technologies et la carte entière révélée, la capitale débloque la Grande Œuvre de votre clan, qui vaut 300 points.","Unter Technologie schaltest du Einheiten und Gebäude frei. Mit allen Technologien und der ganzen aufgedeckten Karte schaltet die Hauptstadt das Große Werk deines Clans frei, das 300 Punkte wert ist.","In Tecnologia sblocchi unità e costruzioni. Con tutte le tecnologie e l'intera mappa rivelata, la capitale sblocca la Grande Opera del tuo clan, che vale 300 punti.","技術ではユニットや建物を解放できます。すべての技術を研究し、マップ全体を明らかにすると、首都で氏族の大事業（300ポイント）を建てられます。","在科技中可以解锁单位和建筑。研究全部科技并揭开整张地图后，首都即可建造本氏族的伟业，价值300分。"]," A Grande Obra do seu clã já pode ser erguida no painel da capital.":[" Your clan's Great Work can now be built from the capital panel."," La Gran Obra de tu clan ya se puede construir en el panel de la capital."," La Grande Œuvre de votre clan peut maintenant être érigée depuis le panneau de la capitale."," Das Große Werk deines Clans kann jetzt im Hauptstadt-Menü errichtet werden."," La Grande Opera del tuo clan ora si può costruire dal pannello della capitale."," 氏族の大事業を首都のパネルから建てられるようになりました。"," 现在可以在首都面板中建造本氏族的伟业了。"],"Grande Obra ({g}): pesquise todas as tecnologias ({a}/{b}) e revele o mapa inteiro ({p}%).":["Great Work ({g}): research every technology ({a}/{b}) and reveal the whole map ({p}%).","Gran Obra ({g}): investiga todas las tecnologías ({a}/{b}) y revela el mapa entero ({p}%).","Grande Œuvre ({g}) : recherchez toutes les technologies ({a}/{b}) et révélez toute la carte ({p} %).","Großes Werk ({g}): Erforsche alle Technologien ({a}/{b}) und decke die ganze Karte auf ({p} %).","Grande Opera ({g}): ricerca tutte le tecnologie ({a}/{b}) e rivela l'intera mappa ({p}%).","大事業（{g}）：すべての技術を研究し（{a}/{b}）、マップ全体を明らかにする（{p}%）。","伟业（{g}）：研究全部科技（{a}/{b}）并揭开整张地图（{p}%）。"],"No 3º turno depois de pronta, ela rende +{n} ✦.":["On the 3rd turn after it's built, it yields +{n} ✦.","En el 3.er turno tras construirla, rinde +{n} ✦.","Au 3e tour après sa construction, elle rapporte +{n} ✦.","In der 3. Runde nach dem Bau bringt es +{n} ✦.","Al 3° turno dopo la costruzione, rende +{n} ✦.","完成から3ターン目に +{n} ✦ をもたらす。","建成后的第3回合，获得 +{n} ✦。"],"{g}: bônus de +{n} ✦.":["{g}: +{n} ✦ bonus.","{g}: bonificación de +{n} ✦.","{g} : bonus de +{n} ✦.","{g}: Bonus von +{n} ✦.","{g}: bonus di +{n} ✦.","{g}：ボーナス +{n} ✦。","{g}：奖励 +{n} ✦。"],"Construa a Grande Obra {g} com {c} e chegue ao fim da partida.":["Build the Great Work {g} with {c} and reach the end of the match.","Construye la Gran Obra {g} con {c} y llega al final de la partida.","Construisez la Grande Œuvre {g} avec {c} et allez jusqu'au bout de la partie.","Baue das Große Werk {g} mit {c} und spiele die Partie bis zum Ende.","Costruisci la Grande Opera {g} con {c} e arriva alla fine della partita.","{c}で大事業「{g}」を建て、対戦を最後までプレイする。","使用{c}建造伟业{g}，并坚持到对局结束。"],"Numa mesma partida com {c}, construa a Grande Obra {g}, {a} e chegue ao fim da partida.":["In a single match with {c}, build the {g}, {a} and reach the end of the match.","En una misma partida con {c}, construye {g}, {a} y llega al final de la partida.","Dans une même partie avec {c}, construisez {g}, {a} et allez jusqu'au bout de la partie.","Baue in derselben Partie mit {c} {g}, {a} und spiele die Partie bis zum Ende.","In una stessa partita con {c}, costruisci {g}, {a} e arriva alla fine della partita.","{c}で同じ対戦中に{g}を建て、さらに{a}。そのうえで対戦を最後までプレイする。","在同一场对局中使用{c}建造{g}，{a}，并坚持到对局结束。"]};

 du Feu","Der Schwur des Feuers","Il Giuramento del Fuoco","炎の誓い","火之誓言"],"Diante da primeira chama, os Brasa fizeram uma promessa: enquanto restasse uma centelha, haveria esperança de reconstrução. Seus filhos herdariam não apenas o fogo, mas o dever de guardá-lo.":["Before the first flame, the Ember made a promise: as long as a single spark remained, there would be hope of rebuilding. Their children would inherit not only the fire, but the duty to guard it.","Ante la primera llama, los Brasa hicieron una promesa: mientras quedara una chispa, habría esperanza de reconstrucción. Sus hijos heredarían no solo el fuego, sino el deber de custodiarlo.","Devant la première flamme, les Braise firent une promesse : tant qu'il resterait une étincelle, il y aurait l'espoir de reconstruire. Leurs enfants hériteraient non seulement du feu, mais du devoir de le garder.","Vor der ersten Flamme legte die Glut ein Versprechen ab: Solange ein einziger Funke bliebe, gäbe es Hoffnung auf einen Neuanfang. Ihre Kinder würden nicht nur das Feuer erben, sondern auch die Pflicht, es zu hüten.","Davanti alla prima fiamma, i Brace fecero una promessa: finché fosse rimasta una sola scintilla, ci sarebbe stata speranza di ricostruire. I loro figli avrebbero ereditato non solo il fuoco, ma anche il dovere di custodirlo.","最初の炎を前に、熾火の民はひとつの約束を交わした。火花がひとつでも残る限り、再建の希望はある。子どもたちは火だけでなく、それを守る務めも受け継ぐのだと。","面对第一簇火焰，余烬族立下誓言：只要还剩一点火星，重建的希望就不会熄灭。他们的子孙继承的不只是火，还有守护它的责任。"],"Recuperado em {d}":["Recovered on {d}","Recuperado el {d}","Retrouvé le {d}","Wiedergefunden am {d}","Recuperato il {d}","{d}に回収","于{d}找回"],"Grande Obra":["Great Work","Gran Obra","Grande Œuvre","Großes Werk","Grande Opera","大事業","伟业"],"O Martelo do Primeiro Ferreiro":["The Hammer of the First Smith","El Martillo del Primer Herrero","Le Marteau du Premier Forgeron","Der Hammer des Ersten Schmieds","Il Martello del Primo Fabbro","最初の鍛冶師の槌","第一位铁匠的锤子"],"Das cinzas nasceram ferramentas, das ferramentas surgiram forjas e das forjas, cidades. Os Brasa aprenderam que a mesma chama que destrói também pode unir.":["From the ashes came tools, from the tools came forges, and from the forges, cities. The Ember learned that the same flame that destroys can also unite.","De las cenizas nacieron herramientas, de las herramientas surgieron forjas y de las forjas, ciudades. Los Brasa aprendieron que la misma llama que destruye también puede unir.","Des cendres naquirent des outils, des outils surgirent des forges et des forges, des cités. Les Braise apprirent que la flamme qui détruit peut aussi unir.","Aus der Asche entstanden Werkzeuge, aus den Werkzeugen Schmieden und aus den Schmieden Städte. Die Glut lernte, dass dieselbe Flamme, die zerstört, auch vereinen kann.","Dalle ceneri nacquero gli attrezzi, dagli attrezzi le fucine e dalle fucine le città. I Brace impararono che la stessa fiamma che distrugge può anche unire.","灰から道具が生まれ、道具から鍛冶場が、鍛冶場から都市が生まれた。熾火の民は、破壊する炎が結びつける炎にもなりうることを学んだ。","灰烬中诞生了工具，工具造就了熔炉，熔炉孕育了城市。余烬族明白了：能毁灭的火焰，同样能够联结。"],"Superação":["Triumph","Superación","Dépassement","Triumph","Superamento","克服","超越"],"A Pedra Fria":["The Cold Stone","La Piedra Fría","La Pierre Froide","Der Kalte Stein","La Pietra Fredda","冷たい石","冰冷之石"],"Vença com {c} no Difícil ou na Lendária.":["Win with {c} on Hard or Legendary.","Gana con {c} en Difícil o en Legendaria.","Gagnez avec {c} en Difficile ou en Légendaire.","Gewinne mit {c} auf Schwer oder Legendär.","Vinci con {c} a Difficile o Leggendaria.","{c}で「むずかしい」または「伝説」で勝利する。","使用{c}在困难或传奇难度下获胜。"],"Legado":["Legacy","Legado","Héritage","Vermächtnis","Eredità","遺産","传承"],"O Coração de Ígnea":["The Heart of Ignea","El Corazón de Ígnea","Le Cœur d'Ignéa","Das Herz von Ignea","Il Cuore di Ignea","イグネアの心臓","伊格尼亚之心"],"Quando a Forja Eterna brilhou, a pedra negra respondeu com uma luz silenciosa. O fogo não parecia chamá-la. Algo muito mais profundo, escondido no coração do mundo, parecia despertar.":["When the Eternal Forge blazed, the black stone answered with a silent light. The fire did not seem to call it. Something far deeper, hidden in the heart of the world, seemed to awaken.","Cuando la Forja Eterna brilló, la piedra negra respondió con una luz silenciosa. El fuego no parecía llamarla. Algo mucho más profundo, escondido en el corazón del mundo, parecía despertar.","Quand la Forge Éternelle flamboya, la pierre noire répondit par une lumière silencieuse. Le feu ne semblait pas l'appeler. Quelque chose de bien plus profond, caché au cœur du monde, semblait s'éveiller.","Als die Ewige Schmiede aufloderte, antwortete der schwarze Stein mit einem stillen Licht. Das Feuer schien ihn nicht zu rufen. Etwas viel Tieferes, verborgen im Herzen der Welt, schien zu erwachen.","Quando la Forgia Eterna divampò, la pietra nera rispose con una luce silenziosa. Non sembrava che il fuoco la chiamasse. Qualcosa di molto più profondo, nascosto nel cuore del mondo, sembrava risvegliarsi.","永遠の鍛冶場が燃え上がったとき、黒い石は静かな光で応えた。火がそれを呼んだようには見えなかった。もっと深い何か、世界の中心に隠れた何かが目覚めようとしているようだった。","当永恒熔炉燃起时，黑色的石头以一道无声的光回应。那并不像是火焰在召唤它。似乎有某种更深的东西，藏在世界的中心，正在苏醒。"],"Recupere as 5 memórias para abrir o capítulo dos {c}.":["Recover the 5 memories to open the {c} chapter.","Recupera las 5 memorias para abrir el capítulo de los {c}.","Retrouvez les 5 mémoires pour ouvrir le chapitre des {c}.","Finde die 5 Erinnerungen wieder, um das Kapitel von {c} zu öffnen.","Recupera le 5 memorie per aprire il capitolo dei {c}.","5つの記憶を取り戻して、{c}の章を開こう。","找回全部5段记忆，开启{c}的篇章。"],"Clã anterior":["Previous clan","Clan anterior","Clan précédent","Vorheriger Clan","Clan precedente","前の氏族","上一个氏族"],"Arquivo":["Archive","Archivo","Archives","Archiv","Archivio","書庫","档案馆"],"Próximo clã":["Next clan","Clan siguiente","Clan suivant","Nächster Clan","Clan successivo","次の氏族","下一个氏族"],"A Primeira Jangada":["The First Raft","La Primera Balsa","Le Premier Radeau","Das Erste Floß","La Prima Zattera","最初の筏","第一只木筏"],"O arquipélago afundou, e a terra tornou-se lembrança. Por uma geração, os Maré viveram sobre jangadas, aprendendo a chamar de lar aquilo que flutuava.":["The archipelago sank, and the land became a memory. For a generation, the Tide lived on rafts, learning to call home whatever stayed afloat.","El archipiélago se hundió y la tierra se volvió recuerdo. Durante una generación, los Marea vivieron sobre balsas, aprendiendo a llamar hogar a lo que flotaba.","L'archipel sombra, et la terre devint un souvenir. Pendant une génération, les Marée vécurent sur des radeaux, apprenant à appeler foyer ce qui flottait.","Der Archipel versank, und das Land wurde zur Erinnerung. Eine Generation lang lebte die Flut auf Flößen und lernte, das Zuhause zu nennen, was sich über Wasser hielt.","L'arcipelago sprofondò e la terra divenne un ricordo. Per una generazione i Marea vissero su zattere, imparando a chiamare casa ciò che restava a galla.","群島は沈み、大地は思い出になった。ひと世代のあいだ、潮の民は筏の上で暮らし、浮かんでいるものを我が家と呼ぶことを覚えた。","群岛沉没，陆地成了回忆。整整一代人，潮汐族生活在木筏上，学会把一切漂浮之物称作家。"],"A Escama-Lanterna":["The Lantern Scale","La Escama-Linterna","L'Écaille-Lanterne","Die Laternenschuppe","La Scaglia-Lanterna","ランタンの鱗","灯笼鳞片"],"Vença com {c} no Normal ou mais difícil.":["Win with {c} on Normal or harder.","Gana con {c} en Normal o más difícil.","Gagnez avec {c} en Normal ou plus difficile.","Gewinne mit {c} auf Normal oder schwerer.","Vinci con {c} a Normale o superiore.","{c}で「ふつう」以上の難易度で勝利する。","使用{c}在正常或更高难度下获胜。"],"O Mapa dos Recifes":["The Map of the Reefs","El Mapa de los Arrecifes","La Carte des Récifs","Die Karte der Riffe","La Mappa delle Barriere","珊瑚礁の地図","珊瑚礁地图"],"Os navegadores desenharam rotas entre águas separadas. Em todos os mapas, uma região permanecia vazia: o recife onde o povo acreditava ter começado.":["The navigators drew routes between separated waters. On every map, one region stayed empty: the reef where the people believed they had begun.","Los navegantes trazaron rutas entre aguas separadas. En todos los mapas, una región quedaba vacía: el arrecife donde el pueblo creía haber comenzado.","Les navigateurs tracèrent des routes entre des eaux séparées. Sur toutes les cartes, une région restait vide : le récif où le peuple croyait être né.","Die Seefahrer zeichneten Routen zwischen getrennten Gewässern. Auf jeder Karte blieb eine Region leer: das Riff, an dem das Volk seinen Ursprung vermutete.","I navigatori tracciarono rotte tra acque separate. Su ogni mappa una regione restava vuota: la barriera corallina dove il popolo credeva di aver avuto origine.","航海者たちは隔てられた海のあいだに航路を描いた。どの地図にも空白の場所がひとつあった。民が始まりの地と信じた珊瑚礁だ。","航海者在分隔的水域之间绘出航线。每张地图上都有一片空白：族人相信自己起源之地的那片珊瑚礁。"],"A Pérola das Profundezas":["The Pearl of the Depths","La Perla de las Profundidades","La Perle des Profondeurs","Die Perle der Tiefe","La Perla degli Abissi","深淵の真珠","深渊珍珠"],"Sob as correntes, mergulhadores encontraram uma pérola que emitia luz sem Lumen aparente. Quando a seguravam, ouviam o som distante de um oceano inteiro.":["Beneath the currents, divers found a pearl that gave off light with no Lumen in sight. Whoever held it heard the distant sound of an entire ocean.","Bajo las corrientes, unos buceadores encontraron una perla que emitía luz sin Lumen aparente. Al sostenerla, oían el sonido lejano de un océano entero.","Sous les courants, des plongeurs trouvèrent une perle qui émettait de la lumière sans Lumen apparent. En la tenant, on entendait le bruit lointain d'un océan entier.","Unter den Strömungen fanden Taucher eine Perle, die ohne sichtbares Lumen leuchtete. Wer sie hielt, hörte das ferne Rauschen eines ganzen Ozeans.","Sotto le correnti, i tuffatori trovarono una perla che emetteva luce senza alcun Lumen in vista. Chi la stringeva sentiva il suono lontano di un intero oceano.","潮流の下で、潜り手たちはルーメンもないのに光を放つ真珠を見つけた。それを握った者には、遠い海の音がまるごと聞こえた。","潜水者在洋流之下发现了一颗珍珠，周围不见流明，它却在发光。握住它的人，能听见整片大洋遥远的声音。"],"A Lente do Grande Farol":["The Lens of the Great Lighthouse","La Lente del Gran Faro","La Lentille du Grand Phare","Die Linse des Großen Leuchtturms","La Lente del Grande Faro","大灯台のレンズ","大灯塔之镜"],"pesque um peixe":["catch a fish","pesca un pez","pêchez un poisson","fange einen Fisch","pesca un pesce","魚を釣る","钓一条鱼"],"Numa mesma partida com {c}, construa a Grande Obra {g} e {a}.":["In a single match with {c}, build the {g} and {a}.","En una misma partida con {c}, construye {g} y {a}.","Dans une même partie avec {c}, construisez {g} et {a}.","Baue in derselben Partie mit {c} {g} und {a}.","In una stessa partita con {c}, costruisci {g} e {a}.","{c}で同じ対戦中に{g}を建て、さらに{a}。","在同一场对局中使用{c}建造{g}，并{a}。"],"A Primeira Semente":["The First Seed","La Primera Semilla","La Première Graine","Der Erste Same","Il Primo Seme","最初の種","第一颗种子"],"Quando a terra cedeu, as raízes da Árvore-Mãe seguraram o que puderam. Seus jardineiros recolheram sementes e levaram a vida aos fragmentos sobreviventes.":["When the ground gave way, the roots of the Mother Tree held on to what they could. Its gardeners gathered seeds and carried life to the surviving fragments.","Cuando la tierra cedió, las raíces del Árbol Madre sostuvieron lo que pudieron. Sus jardineros recogieron semillas y llevaron la vida a los fragmentos supervivientes.","Quand la terre céda, les racines de l'Arbre-Mère retinrent ce qu'elles purent. Ses jardiniers recueillirent des graines et portèrent la vie aux fragments survivants.","Als der Boden nachgab, hielten die Wurzeln des Mutterbaums fest, was sie konnten. Seine Gärtner sammelten Samen und trugen das Leben zu den übrig gebliebenen Bruchstücken.","Quando il terreno cedette, le radici dell'Albero Madre trattennero ciò che poterono. I suoi giardinieri raccolsero semi e portarono la vita ai frammenti sopravvissuti.","大地が崩れたとき、母なる木の根はつかめるものをつかんで離さなかった。庭師たちは種を集め、生き残った欠片へ命を運んだ。","大地崩塌时，母树的根尽力抓住了一切。园丁们收集种子，把生命带往幸存的碎片。"],"A Casca Ancestral":["The Ancestral Bark","La Corteza Ancestral","L'Écorce Ancestrale","Die Ahnenrinde","La Corteccia Ancestrale","祖先の樹皮","先祖之皮"],"Na casca da árvore, os antigos gravaram nomes dos que se perderam. Nenhuma cidade dos Raiz nasce sem lembrar aqueles que não puderam ser salvos.":["On the tree's bark, the ancients carved the names of those who were lost. No Root city is born without remembering those who could not be saved.","En la corteza del árbol, los antiguos grabaron los nombres de los que se perdieron. Ninguna ciudad de los Raíz nace sin recordar a quienes no pudieron salvarse.","Sur l'écorce de l'arbre, les anciens gravèrent les noms des disparus. Aucune cité des Racine ne naît sans se souvenir de ceux qui n'ont pas pu être sauvés.","In die Rinde des Baumes ritzten die Alten die Namen der Verlorenen. Keine Stadt der Wurzel entsteht, ohne derer zu gedenken, die nicht gerettet werden konnten.","Sulla corteccia dell'albero gli antichi incisero i nomi di chi era andato perduto. Nessuna città dei Radice nasce senza ricordare chi non poté essere salvato.","木の樹皮に、古の人々は失われた者たちの名を刻んだ。根の民の都市はどれも、救えなかった者たちを偲ぶことから生まれる。","古人在树皮上刻下逝者的名字。根须族的每一座城市诞生时，都会铭记那些未能得救的人。"],"O Cajado do Primeiro Druida":["The Staff of the First Druid","El Báculo del Primer Druida","Le Bâton du Premier Druide","Der Stab des Ersten Druiden","Il Bastone del Primo Druido","最初のドルイドの杖","第一位德鲁伊的法杖"],"Construa a Grande Obra {g} com {c}.":["Build the Great Work {g} with {c}.","Construye la Gran Obra {g} con {c}.","Construisez la Grande Œuvre {g} avec {c}.","Baue das Große Werk {g} mit {c}.","Costruisci la Grande Opera {g} con {c}.","{c}で大事業「{g}」を建てる。","使用{c}建造伟业{g}。"],"A Raiz Suspensa":["The Suspended Root","La Raíz Suspendida","La Racine Suspendue","Die Schwebende Wurzel","La Radice Sospesa","宙に浮く根","悬空之根"],"Uma raiz antiga cresceu para fora de um ladrilho e desapareceu no vazio. Não caiu. Continuou crescendo, como se houvesse solo invisível do outro lado.":["An ancient root grew out past the edge of a tile and vanished into the void. It did not fall. It kept growing, as if there were invisible soil on the other side.","Una raíz antigua creció más allá de una baldosa y desapareció en el vacío. No cayó. Siguió creciendo, como si hubiera suelo invisible al otro lado.","Une racine ancienne poussa hors d'une tuile et disparut dans le vide. Elle ne tomba pas. Elle continua de pousser, comme s'il y avait un sol invisible de l'autre côté.","Eine uralte Wurzel wuchs über den Rand einer Kachel hinaus und verschwand im Nichts. Sie fiel nicht. Sie wuchs weiter, als gäbe es auf der anderen Seite unsichtbaren Boden.","Un'antica radice crebbe oltre il bordo di una tessera e svanì nel vuoto. Non cadde. Continuò a crescere, come se dall'altra parte ci fosse un terreno invisibile.","古い根がタイルの縁を越えて伸び、虚空へと消えた。落ちはしなかった。向こう側に見えない土があるかのように、伸び続けた。","一条古老的根越过地块边缘生长，消失在虚空之中。它没有坠落，而是继续生长，仿佛另一边有看不见的土壤。"],"A Semente do Coração":["The Heart Seed","La Semilla del Corazón","La Graine du Cœur","Der Herzsame","Il Seme del Cuore","心臓の種","心之种"],"As sementes mais antigas vibram quando se aproximam de grandes concentrações de Lumen. Os Druidas suspeitam que a Árvore-Mãe ainda esteja ligada a algo que nenhum deles consegue ver.":["The oldest seeds tremble when they come near great concentrations of Lumen. The Druids suspect the Mother Tree is still connected to something none of them can see.","Las semillas más antiguas vibran cuando se acercan a grandes concentraciones de Lumen. Los Druidas sospechan que el Árbol Madre aún está unido a algo que ninguno de ellos puede ver.","Les graines les plus anciennes vibrent à l'approche de grandes concentrations de Lumen. Les Druides soupçonnent que l'Arbre-Mère est encore lié à quelque chose qu'aucun d'eux ne peut voir.","Die ältesten Samen zittern, wenn sie großen Mengen Lumen nahekommen. Die Druiden vermuten, dass der Mutterbaum noch mit etwas verbunden ist, das keiner von ihnen sehen kann.","I semi più antichi vibrano quando si avvicinano a grandi concentrazioni di Lumen. I Druidi sospettano che l'Albero Madre sia ancora legato a qualcosa che nessuno di loro riesce a vedere.","最も古い種は、大量のルーメンに近づくと震える。ドルイドたちは、母なる木が今も誰にも見えない何かとつながっているのではと考えている。","最古老的种子在靠近大量流明时会颤动。德鲁伊们怀疑，母树仍与某种谁也看不见的东西相连。"],"A Marca do Exílio":["The Mark of Exile","La Marca del Exilio","La Marque de l'Exil","Das Mal des Exils","Il Marchio dell'Esilio","追放の印","放逐之印"],"A Bússola Congelada":["The Frozen Compass","La Brújula Congelada","La Boussole Gelée","Der Gefrorene Kompass","La Bussola Ghiacciata","凍てついた羅針盤","冰封罗盘"],"Atravessaram um mar de gelo guiados por uma bússola que às vezes apontava para cima. Mesmo sem compreendê-la, continuaram caminhando.":["They crossed a sea of ice guided by a compass that sometimes pointed upward. Even without understanding it, they kept walking.","Atravesaron un mar de hielo guiados por una brújula que a veces apuntaba hacia arriba. Aun sin comprenderla, siguieron caminando.","Ils traversèrent une mer de glace guidés par une boussole qui pointait parfois vers le haut. Sans la comprendre, ils continuèrent d'avancer.","Sie überquerten ein Eismeer, geführt von einem Kompass, der manchmal nach oben zeigte. Auch ohne ihn zu verstehen, gingen sie weiter.","Attraversarono un mare di ghiaccio guidati da una bussola che a volte puntava verso l'alto. Pur senza capirla, continuarono a camminare.","彼らは、ときおり上を指す羅針盤に導かれて氷の海を渡った。理由はわからなくても、歩き続けた。","他们跟随一只有时指向天空的罗盘，穿越冰海。即使无法理解，他们仍一路前行。"],"A Presa do Urso Branco":["The Fang of the White Bear","El Colmillo del Oso Blanco","Le Croc de l'Ours Blanc","Der Zahn des Weißen Bären","La Zanna dell'Orso Bianco","白熊の牙","白熊之牙"],"Os grandes ursos não se curvaram à força. A aliança nasceu da sobrevivência compartilhada. Desde então, cavaleiro e montaria enfrentam o inverno juntos.":["The great bears did not bow to force. The alliance was born of shared survival. Ever since, rider and mount have faced the winter together.","Los grandes osos no se doblegaron ante la fuerza. La alianza nació de la supervivencia compartida. Desde entonces, jinete y montura enfrentan juntos el invierno.","Les grands ours ne plièrent pas devant la force. L'alliance naquit de la survie partagée. Depuis, cavalier et monture affrontent l'hiver ensemble.","Die großen Bären beugten sich keiner Gewalt. Das Bündnis entstand aus gemeinsamem Überleben. Seitdem stellen sich Reiter und Tier gemeinsam dem Winter.","I grandi orsi non si piegarono alla forza. L'alleanza nacque dalla sopravvivenza condivisa. Da allora cavaliere e cavalcatura affrontano l'inverno insieme.","大熊たちは力には屈しなかった。同盟は、ともに生き延びることから生まれた。それ以来、乗り手と相棒はともに冬に立ち向かってきた。","巨熊从不屈服于武力。联盟诞生于共同求生。从那以后，骑手与坐骑一同迎战寒冬。"],"O Cristal Sepultado":["The Buried Crystal","El Cristal Sepultado","Le Cristal Enseveli","Der Begrabene Kristall","Il Cristallo Sepolto","埋もれた水晶","深埋的水晶"],"A Coroa do Inverno":["The Crown of Winter","La Corona del Invierno","La Couronne de l'Hiver","Die Krone des Winters","La Corona dell'Inverno","冬の王冠","寒冬之冠"],"Os corredores subterrâneos não apontavam para o centro da terra. Todos conduziam, de algum modo, para o céu. Os Geada passaram a perguntar quem os construíra.":["The underground corridors did not lead toward the center of the earth. Somehow, every one of them led toward the sky. The Frost began to ask who had built them.","Los pasillos subterráneos no apuntaban al centro de la tierra. Todos llevaban, de algún modo, hacia el cielo. Los Escarcha empezaron a preguntarse quién los había construido.","Les couloirs souterrains ne menaient pas vers le centre de la terre. Tous conduisaient, d'une manière ou d'une autre, vers le ciel. Les Givre se demandèrent qui les avait construits.","Die unterirdischen Gänge führten nicht zum Mittelpunkt der Erde. Auf seltsame Weise führten sie alle zum Himmel. Der Frost begann sich zu fragen, wer sie gebaut hatte.","I corridoi sotterranei non portavano verso il centro della terra. In qualche modo, conducevano tutti verso il cielo. I Brina cominciarono a chiedersi chi li avesse costruiti.","地下の回廊は大地の中心へは向かっていなかった。なぜか、すべてが空へと続いていた。霜の民は、誰がそれを築いたのかと考え始めた。","地下的回廊并不通向大地中心。不知为何，它们全都通向天空。霜冻族开始追问：是谁建造了它们？"],"O Primeiro Estilhaço":["The First Shard","El Primer Fragmento","Le Premier Éclat","Der Erste Splitter","La Prima Scheggia","最初の欠片","第一块碎片"],"Um fragmento brilhante caiu no deserto. Onde tocou a areia, nasceu água. Ao redor daquele oásis, os Duna construíram sua primeira morada.":["A shining fragment fell into the desert. Where it touched the sand, water sprang up. Around that oasis, the Dune built their first home.","Un fragmento brillante cayó en el desierto. Donde tocó la arena, nació agua. Alrededor de aquel oasis, los Duna construyeron su primera morada.","Un fragment brillant tomba dans le désert. Là où il toucha le sable, l'eau jaillit. Autour de cette oasis, les Dune bâtirent leur première demeure.","Ein leuchtendes Bruchstück fiel in die Wüste. Wo es den Sand berührte, sprudelte Wasser hervor. Um diese Oase errichtete die Düne ihre erste Heimat.","Un frammento lucente cadde nel deserto. Dove toccò la sabbia sgorgò l'acqua. Attorno a quell'oasi, i Duna costruirono la loro prima casa.","輝く欠片が砂漠に落ちた。砂に触れた場所から水が湧き出た。そのオアシスのまわりに、砂丘の民は最初の住まいを築いた。","一块闪亮的碎片坠入沙漠。它触碰沙地的地方涌出了水。沙丘族在那片绿洲周围建起了第一个家园。"],"A Ânfora da Água Viva":["The Amphora of Living Water","El Ánfora del Agua Viva","L'Amphore de l'Eau Vive","Die Amphore des Lebendigen Wassers","L'Anfora dell'Acqua Viva","生命の水の壺","活水之瓮"],"A Moeda Sem Reino":["The Coin Without a Kingdom","La Moneda Sin Reino","La Pièce Sans Royaume","Die Münze ohne Königreich","La Moneta Senza Regno","王国なき硬貨","无国之币"],"Uma moeda antiga circulava entre caravanas. Não trazia rosto de rei, apenas um círculo formado por peças encaixadas.":["An ancient coin passed between caravans. It bore no king's face, only a circle made of interlocking pieces.","Una moneda antigua circulaba entre caravanas. No llevaba rostro de rey, solo un círculo formado por piezas encajadas.","Une pièce ancienne circulait entre les caravanes. Elle ne portait aucun visage de roi, seulement un cercle formé de pièces emboîtées.","Eine alte Münze ging von Karawane zu Karawane. Sie trug kein Königsgesicht, nur einen Kreis aus ineinandergreifenden Teilen.","Un'antica moneta passava di carovana in carovana. Non recava il volto di un re, solo un cerchio fatto di pezzi incastrati.","古い硬貨がキャラバンからキャラバンへと渡っていった。王の顔はなく、組み合わさった欠片でできた円だけが刻まれていた。","一枚古老的硬币在商队之间流转。上面没有国王的面孔，只有一个由相互嵌合的碎片组成的圆。"],"O Livro das Caravanas":["The Book of Caravans","El Libro de las Caravanas","Le Livre des Caravanes","Das Buch der Karawanen","Il Libro delle Carovane","キャラバンの書","商队之书"],"Rotas comerciais revelaram que povos distantes contavam versões diferentes da mesma catástrofe. Nenhuma história era completa; todas guardavam um detalhe.":["Trade routes revealed that distant peoples told different versions of the same catastrophe. No story was complete; each one kept a detail.","Las rutas comerciales revelaron que pueblos lejanos contaban versiones distintas de la misma catástrofe. Ninguna historia estaba completa; todas guardaban un detalle.","Les routes commerciales révélèrent que des peuples lointains racontaient des versions différentes de la même catastrophe. Aucune histoire n'était complète ; chacune gardait un détail.","Handelswege zeigten, dass ferne Völker verschiedene Fassungen derselben Katastrophe erzählten. Keine Geschichte war vollständig; jede bewahrte ein Detail.","Le rotte commerciali rivelarono che popoli lontani raccontavano versioni diverse della stessa catastrofe. Nessuna storia era completa; ognuna custodiva un dettaglio.","交易路をたどると、遠く離れた民が同じ災厄を違う形で語っていることがわかった。完全な物語はひとつもなく、どれもが細部をひとつずつ守っていた。","贸易路线揭示，相隔遥远的民族讲述着同一场灾难的不同版本。没有哪个故事是完整的，每一个都保存了一处细节。"],"O Selo do Grande Bazar":["The Seal of the Grand Bazaar","El Sello del Gran Bazar","Le Sceau du Grand Bazar","Das Siegel des Großen Basars","Il Sigillo del Gran Bazar","大バザールの印章","大集市之印"],"receba Lumens de uma Caravana":["receive Lumens from a Caravan","recibe Lumens de una Caravana","recevez des Lumens d'une Caravane","erhalte Lumen von einer Karawane","ricevi Lumen da una Carovana","キャラバンからルーメンを受け取る","从商队获得流明"],"O Assobio da Quebra":["The Whistle of the Shattering","El Silbido de la Ruptura","Le Sifflement de la Fracture","Das Pfeifen des Bruchs","Il Fischio della Frattura","崩壊の口笛","碎裂之哨"],"Antes do primeiro tremor, um assobio atravessou os planaltos. Os nômades o ouviram e partiram. Outros permaneceram e jamais voltaram.":["Before the first tremor, a whistle swept across the highlands. The nomads heard it and left. Others stayed and never returned.","Antes del primer temblor, un silbido atravesó las mesetas. Los nómadas lo oyeron y partieron. Otros se quedaron y jamás volvieron.","Avant la première secousse, un sifflement traversa les hauts plateaux. Les nomades l'entendirent et partirent. D'autres restèrent et ne revinrent jamais.","Vor dem ersten Beben fegte ein Pfeifen über das Hochland. Die Nomaden hörten es und zogen fort. Andere blieben und kehrten nie zurück.","Prima della prima scossa, un fischio attraversò gli altipiani. I nomadi lo sentirono e partirono. Altri restarono e non tornarono più.","最初の揺れの前に、口笛のような音が高原を吹き抜けた。遊牧民はそれを聞いて旅立った。残った者たちは二度と戻らなかった。","第一次震动之前，一阵哨声掠过高原。游牧民听见后便离开了。留下的人再也没有回来。"],"A Primeira Sela":["The First Saddle","La Primera Silla de Montar","La Première Selle","Der Erste Sattel","La Prima Sella","最初の鞍","第一副马鞍"],"Os Vento não carregaram muralhas nem palácios. Levaram seus filhos, suas montarias e o conhecimento dos caminhos.":["The Wind carried no walls or palaces. They took their children, their mounts and their knowledge of the paths.","Los Viento no cargaron murallas ni palacios. Se llevaron a sus hijos, sus monturas y el conocimiento de los caminos.","Les Vent n'emportèrent ni murailles ni palais. Ils prirent leurs enfants, leurs montures et la connaissance des chemins.","Der Wind trug weder Mauern noch Paläste mit sich. Sie nahmen ihre Kinder, ihre Reittiere und ihr Wissen über die Pfade mit.","I Vento non portarono con sé mura né palazzi. Presero i figli, le cavalcature e la loro conoscenza dei sentieri.","風の民は城壁も宮殿も持たなかった。連れて行ったのは子どもたち、乗騎、そして道の知恵だった。","疾风族没有带走城墙或宫殿。他们带走了孩子、坐骑，以及关于道路的知识。"],"A Pena do Falcão":["The Falcon Feather","La Pluma del Halcón","La Plume du Faucon","Die Fa
