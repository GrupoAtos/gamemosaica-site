ivé","Désactivé","Effets sonores","touches, combats et conquêtes","Musique","bande-son douce pendant le jeu","Vibration","lors des attaques, des conquêtes et des alertes","indisponible sur cet appareil","Vitesse des animations","déplacement des unités et tour des rivaux","Rapide","Normale","Refaire la partie guidée","à la prochaine partie","Effacer la partie sauvegardée","tour {n}","aucune","{n} enregistrés","Astuce {a} sur {b}","Passer","Suivante","Jouer","Unissez les tuiles du monde","Nouvelle partie","Continuer","tour {a} sur {b}","Défi du jour","Classique","Plus d'options","Clans","Exclusif : {u}","L'histoire des {c}","Unité exclusive","Coûte {n} ✦ et requiert {t}.","Capitale","Grande Œuvre : {g}.","Le monde s'est brisé en tuiles flottantes. Les clans recollent les morceaux grâce aux Lumens (✦), l'énergie qui jaillit de chaque ville. En {n} tours, celui qui a le plus de points unit la mosaïque.","Choisissez votre clan","Clans spéciaux","Difficulté","Mode de jeu","Lancer la partie","Calendrier des Saisons","L'année compte 4 saisons de {n} tours. Pendant chacune, les clans de la saison gagnent +{b} en attaque sur toutes leurs unités. L'hiver gèle l'eau peu profonde et les récoltes rapportent +1 pop seulement en été.","(votre clan)","Options avancées","Graine de la carte","Le même nombre génère toujours la même carte. Laissez-le tel quel pour une carte aléatoire.","{c} en danger","c'est votre dernière ville","peut tomber au prochain tour","Ennemis près de {c}","{c} n'est pas protégée et c'est votre dernière ville. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","{c} n'est pas protégée. Laissez une unité à l'intérieur ou battez l'ennemi voisin.","Voici votre <b>Éclaireur</b>. Touchez-le pour voir jusqu'où il peut aller.","Les <b>points blancs</b> montrent sa portée. Touchez-en un pour vous déplacer et révéler la carte.","Touchez la <b>case en surbrillance</b> de votre territoire et utilisez l'action dorée qui apparaît en bas. Récolter fait grandir la ville.","Touchez maintenant votre <b>capitale</b> (la ville au losange doré) et recrutez une unité. Une ville vide peut être prise.","Ouvrez <b>Technologie</b> pour voir ce que votre clan peut apprendre. Chaque recherche débloque des unités ou des bâtiments.","Quand il n'y a plus rien à faire, touchez <b>Fin du tour</b>. Les autres clans jouent et vous recevez des Lumens (✦).","L'heure de grandir : amenez une unité jusqu'au <b>village neutre</b> en surbrillance et terminez le tour dessus pour l'occuper.","L'heure de grandir : explorez avec l'Éclaireur jusqu'à trouver un <b>village neutre</b> (toits gris) et terminez le tour dessus.","Vous connaissez l'essentiel. Gagne celui qui a le plus de points au tour {n}, ou celui qui conquiert tous ses rivaux. Toutes les astuces sont dans le Menu.","Vétéran !","{u} a gagné +5 de vie","Village occupé !","Ville conquise !","{city} appartient désormais au clan {c}","Ville perdue","{c} a pris {city}","Clan éliminé","{c} a quitté la mosaïque","Grande Œuvre achevée · +300 points","Monument érigé","{m} · +250 points","Dernier tour","Faites compter chaque action","Plus que 5 tours avant la fin de la partie.","{c} est sans défense","Un ennemi peut atteindre la ville au prochain tour, et c'est votre <b>dernière ville</b> : si elle tombe, la partie est finie. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Un ennemi peut atteindre la ville au prochain tour. Laissez une unité à l'intérieur ou recrutez-en une maintenant.","Terminer quand même","Défendre la ville","Guide fermé. Les astuces sont dans le Menu.","Braise","volcans et cendres","Les ponts deviennent terre ferme (la lave se solidifie) et les Béliers coûtent 5 ✦.","Quand le monde s'est brisé, le volcan Ignéa est resté allumé sur une seule tuile. Les Braise sont nés autour de lui et ont juré de ne jamais laisser s'éteindre la première flamme. Pour eux, seul le feu peut ressouder ce qui a été brisé.","Forge-Volcan","Marée","récifs","Port : les unités sur l'eau ont +1 de déplacement et pêcher coûte 1 ✦.","L'archipel des Marée a sombré lors de la Grande Fracture et tout le peuple a passé une génération sur des radeaux. Ils ont appris à lire les courants en suivant les poissons-lanternes. Aujourd'hui, ils cherchent, tuile après tuile, le récif où tout a commencé.","Phare de Corail","Racine","forêt dense","Les unités en forêt ont +1 de défense.","Les Racine descendent des jardiniers de l'Arbre-Mère, dont les racines ont retenu les derniers morceaux de terre pendant la Fracture. Chacune de leurs villes naît d'une de ses graines. Pour les Racine, unir la mosaïque, c'est replanter la forêt originelle.","Maison-Arbre","Givre","toundra","Traverse l'eau peu profonde sans bateau (glace).","Chassés des terres chaudes, les Givre ont traversé à pied une mer gelée et survécu là où personne d'autre ne voulait vivre. Ils ont dompté les ours blancs et fait de l'hiver un allié. Ils descendent aujourd'hui de la toundra pour réclamer la place qu'on leur a refusée.","Igloo de Cristal","Dune","désert","Oasis : le marché coûte 3 ✦ et les Caravanes rapportent des Lumens.","Là où des éclats de Lumen sont tombés dans le désert, des oasis ont jailli. Les Dune ont été les premiers à les trouver et ont bâti des bazars autour de chacune. Leurs caravanes relient les tuiles par le commerce avant qu'aucune armée n'arrive.","Palais de l'Oasis","Vent","hauts plateaux","Les Cavaliers ont +1 de déplacement et coûtent 3 ✦.","Nomades des hauts plateaux, les Vent n'ont jamais bâti de murailles : leur maison, c'est la selle. On dit qu'ils ont entendu venir la Fracture dans le sifflement du vent et qu'ils ont survécu grâce à cela. Ils chevauchent derrière la voix qui promet de nouveau un monde entier.","Moulin des Vents","Fauve","savanes et bois","Meute : chasser ne coûte que 1 ✦.","Des enfants perdus lors de la Fracture ont été recueillis par une meute de loups-mousse. Ils ont grandi en chassant ensemble et sont revenus en clan qui partage tout ce qu'il abat. Pour les Fauve, la mosaïque est un territoire de chasse qui n'a besoin que d'une seule meute.","Tanière du Totem","Lueur","canyons de cristal","Les Ponts de Lumen coûtent 1 ✦ et durent deux fois plus longtemps.","Moines des canyons de cristal, les Lueur ont découvert comment solidifier la lumière et ont bâti les premiers Ponts de Lumen. Ils gardent le secret dans des monastères dorés. Ils croient que le monde se réunit avec des ponts, pas avec des épées, mais ils portent quand même des épées.","Obélisque de Lumen","Automates","citadelles de métal","Blindage : toutes les unités naissent avec +3 de vie.","Armée de robots humanoïdes","En 2053, les Automates mènent la Guerre du Futur contre les Astres et sont en train de la perdre. L'Unité Zéro a calculé la seule issue : remonter le temps et conquérir le passé avant l'arrivée de l'ennemi. Une armée de robots humanoïdes a franchi le portail et bâti son premier centre de données à l'ère de la mosaïque.","Centre de Données","Astres","cratère d'atterrissage","Vision orbitale : les unités voient +1 case plus loin.","Extraterrestres","Les Astres sont venus des étoiles pour dominer le monde en 2053 et ont trouvé une résistance de métal. En interceptant le plan des Automates, ils ont lancé un vaisseau par le même portail temporel. Ils ont atterri dans le passé avec une mission : traquer les robots et prendre le monde avant que la guerre ne commence.","Vaisseau Posé","Spectres","brumes éternelles","Brume : ils traversent les montagnes sans Escalade et y ont +1 de défense.","Peuple des ombres","Les Spectres sont les ombres de ceux qui ont disparu lors de la Grande Fracture, prisonnières entre une tuile et une autre. Ils vivent dans les brumes et traversent les montagnes comme du brouillard. Ils croient que, si la mosaïque est unie, ils retrouveront un corps.","Mausolée des Brumes","Colosses","ruines célestes","Peau de pierre : chaque coup reçu inflige 1 dégât de moins.","Anges déchus de pierre","Les Colosses étaient des anges. Quand le monde s'est brisé, ils sont tombés du ciel avec les éclats et, en touchant le sol, leurs ailes et leur peau sont devenues pierre. Géants lents et presque indestructibles, ils veulent réunir la mosaïque pour ériger l'escalier qui les ramènera chez eux.","Trône Déchu","Cueillette","Récolter des fruits dans les champs (+1 pop).","Chasse","Chasser les animaux en forêt (+1 pop).","Navigation","Entrer en eau peu profonde et pêcher (+1 pop).","Escalade","Gravir les montagnes (défense ×1,5).","Forge","Recruter un Lancier (défense 3).","Équitation","Recruter un Cavalier (déplacement 2, attaque et recule).","Commerce","Construire un Marché (+1 ✦ par tour).","Lumenerie","Ériger des Ponts de Lumen sur l'eau peu profonde (ils durent 8 tours).","Agriculture","Construire une Ferme dans les champs (+2 pop).","Tir","Recruter un Frondeur (portée 2).","Haute Mer","Naviguer sur l'océan.","Exploitation minière","Construire une Mine sur le minerai (+2 pop).","Siège","Recruter un Bélier (attaque 4).","Diplomatie","Proposer des pactes de trêve.","Défrichement","Agrandir le territoire de n'importe quelle ville au rayon 2 (6 ✦), sans attendre le niveau 4.","Ingénierie","Ériger la Grande Œuvre de votre clan dans la capitale (30 ✦, une par partie).","Urbanisme","Construire une Place dans chaque ville (8 ✦ : +3 pop, +40 points).","Cartographie","Révèle toute la carte immédiatement.","Tactique","Toutes vos unités gagnent +1 en attaque.","Fortification","Acheter une Muraille dans n'importe quelle ville (6 ✦).","Sylviculture","Construire une Scierie en forêt (+2 pop) et la chasse rapporte +1 pop de plus.","Architecture","Fermes, mines et scieries donnent +1 pop (y compris celles déjà construites), chaque marché rapporte +1 ✦ et les ponts deviennent permanents.","Alliance","Les trêves durent 10 tours et le tribut est divisé par deux.","Forge Éternelle","Grand Phare","Chaque ville au bord de l'eau rapporte +1 ✦ par tour.","Arbre-Mère","Toutes vos villes gagnent +2 de population maintenant.","Palais de Glace","Vos villes de niveau 3 ou plus reçoivent une Muraille maintenant.","Grand Bazar","Chaque ville rapporte +1 ✦ par tour.","Tour des Vents","Révèle toute la carte et toutes vos villes gagnent +1 de population.","Totem de la Meute","Toutes vos unités se soignent et gagnent +5 de vie maximale.","Prisme Solaire","La capitale rapporte désormais +3 ✦ par tour.","Chaîne de Montage","Chaque ville que vous possédez maintenant rapporte +1 ✦ par tour.","Vaisseau-Mère","Révèle toute la carte et rapporte +10 ✦ maintenant.","Voile Éternel","Vos unités se soignent entièrement et chaque ville gagne +1 de population.","Escalier du Ciel","Toutes vos unités gagnent +1 en défense.","Éclaireur","Lancier","Frondeur","Cavalier","Bélier","Gardien","Pyromancien","Lance du feu à 2 cases avec une attaque de 3.","Harponneur","Attaque 3 et défense 2 : le lancier des récifs.","Druide","Au début du tour, soigne 3 de vie aux alliés voisins.","Cavalier d'Ours","Monture lourde : 16 de vie et attaque 3.","Caravane","Se déplace de 2 cases et rapporte +1 ✦ par tour tant qu'elle vit (jusqu'à 2 caravanes comptent).","Fauconnier","Le faucon attaque à 3 cases de distance.","Loup de Meute","Bon marché et rapide : se déplace de 2 cases, attaque et recule.","Sentinelle de Cristal","Bouclier de cristal : défense 4.","Mecha","Robot géant avec 20 de vie et une attaque de 4. Requiert une ville de niveau 3.","Soucoupe Volante","Vole au-dessus de l'eau, des forêts et des montagnes, 2 cases par tour.","Revenant","Attaque sans subir de contre-attaque.","Séraphin de Pierre","Ailes de pierre : traverse forêts et montagnes sans s'arrêter.","Plaine","Forêt","Montagne","Eau peu profonde","Océan","Fruits","Poissons","Minerai","Atelier","+1 ✦ par tour dans cette ville","Expédition","Une expédition révèle la carte alentour et un Éclaireur est prêt à agir","Défense ×3 pour qui garde la ville","Trésor","+5 ✦ maintenant","Frontière","Le territoire s'étend au rayon 2","Festival","+3 de population","Super-unité gratuite","Jardin de Lumen","+150 points","Route commerciale","+2 ✦ par tour dans cette ville","Phare de la Mosaïque","Explorer 60 % de la carte","Métropole","Avoir une ville de niveau 5","Empire","Avoir 5 villes","Arène des Vétérans","Gagner 10 combats","Facile","Difficile","Printemps","pluies et rivières en crue","chaleur et soleil ardent","Automne","bourrasques sur les hauts plateaux","glace et neige","Baies de lumière","Ressource · fruits","Buisson de baies qui brillent au crépuscule. Cueillez-les avec Cueillette.","Cerf-mousse","Ressource · gibier","Cerf paisible aux bois de mousse. Chassez-le avec la technologie Chasse.","Poisson-lanterne","Ressource · poissons","Poisson qui allume une lumière dans l'eau peu profonde. Pêchez-le avec Navigation.","Cristal vivant","Ressource · minerai","Cristaux qui poussent à l'intérieur de la roche. Construisez une Mine avec Exploitation minière.","Ferme","Bâtiment · +2 pop","Parcelles de blé doré. Requiert Agriculture.","Mine de cristal","Galerie avec des rails et un wagonnet de cristaux. Requiert Exploitation minière.","Marché","Bâtiment · +1 ✦/tour","L'étal d'échanges de la ville. Un par ville. Requiert Commerce.","Scierie","Rondins empilés et une scie actionnée par le Lumen. Requiert Sylviculture.","Ruines anciennes","Exploration","Arche d'un monde antérieur à la mosaïque. La première unité qui arrive gagne une récompense.","Sanctuaire de Lumen","Bâtiment · +2 pop · +60 pts","Autel de pierre avec un cristal de Lumen. Il peut être érigé sur une plaine ou une forêt libres ; chaque nouveau sanctuaire coûte 4 ✦ de plus.","Passage","Lumière solidifiée au-dessus de l'eau peu profonde. N'importe quel clan peut la traverser tant qu'elle dure.","Bienvenue dans Mosaica","Votre clan commence avec une capitale et un Éclaireur. Touchez l'Éclaireur pour voir où il peut aller (points blancs). Amenez des unités jusqu'aux villages neutres et terminez le tour dessus pour les occuper.","Lumens et villes","Les Lumens (✦) arrivent à chaque tour. Touchez les cases de votre territoire pour récolter des ressources : la ville gagne de la population, monte de niveau et chaque niveau donne une récompense.","Technologie","Dans Technologie, vous débloquez des unités et des bâtiments. Au niveau 2, l'Ingénierie débloque la Grande Œuvre de votre clan, qui vaut 300 points.","Combat","Les cercles rouges montrent qui vous pouvez attaquer, avec un aperçu des dégâts. Si vous vous êtes trompé de déplacement, utilisez Annuler avant d'attaquer (impossible après avoir ouvert des ruines).","Comment gagner","La partie dure 30 tours. Gagne celui qui a le plus de points, ou celui qui conquiert tous ses rivaux. Les villes conquises restent instables pendant 3 tours, et chaque ville au-delà de 5 coûte 1 ✦ par tour.","Plateau de jeu","Tableau des scores","Points","Lumens","Tour","Annuler le dernier déplacement (raccourci : Z)","Annuler","Actions","Raccourci : espace","Raccourci : Entrée","Revenu par tour : une ville de niveau 1 rapporte 2 ✦, +1 par niveau, et la capitale rapporte +1.","Combat sans dés : dégâts = part d'attaque × Attaque × 4. Si le défenseur survit et peut atteindre l'attaquant, il contre-attaque.","Forêts, montagnes et villes donnent une défense ×1,5. Une Muraille donne ×3.","La technologie coûte 4 + niveau × nombre de villes. Grandir vite rend la recherche plus chère.","Saisons : tous les 8 tours, l'été (récoltes +1 pop) et l'hiver (l'eau peu profonde gèle et devient un chemin) alternent.","Mode Saisons (facultatif) : printemps, été, automne et hiver alternent tous les {n} tours, et chaque saison donne +{b} en attaque à ses clans.","Les Ponts de Lumen relient les îles pour 3 ✦. Les pactes donnent une trêve de 5 tours ; la rompre coûte 150 points.","Une ville conquise reste instable pendant 3 tours (pas de revenu ni de recrutement). Chaque ville au-delà de 5 coûte 1 ✦ par tour.","Chaque clan possède une unité exclusive (marquée d'une ★ au recrutement), sa propre capitale et une histoire.","Points : niveaux des villes, territoir iv: {u}","Die Geschichte der {c}","Exklusive Einheit","Kostet {n} ✦ und benötigt {t}.","Hauptstadt","Großes Werk: {g}.","Die Welt ist in schwebende Kacheln zerbrochen. Die Clans fügen die Stücke mit Lumen (✦) wieder zusammen, der Energie, die aus jeder Stadt strömt. Wer nach {n} Runden die meisten Punkte hat, vereint das Mosaik.","Wähle deinen Clan","Sonder-Clans","Schwierigkeit","Spielmodus","Partie starten","Kalender der Jahreszeiten","Das Jahr hat 4 Jahreszeiten zu je {n} Runden. In jeder erhalten die Clans dieser Jahreszeit +{b} Angriff für alle Einheiten. Der Winter lässt das Flachwasser gefrieren, und Ernten bringen nur im Sommer +1 Bev.","(dein Clan)","Erweiterte Optionen","Karten-Seed","Dieselbe Zahl erzeugt immer dieselbe Karte. Lass sie, wie sie ist, für eine Zufallskarte.","{c} in Gefahr","es ist deine letzte Stadt","könnte nächste Runde fallen","Feinde nahe {c}","{c} ist ungeschützt und deine letzte Stadt. Lass eine Einheit darin oder besiege den Feind daneben.","{c} ist ungeschützt. Lass eine Einheit darin oder besiege den Feind daneben.","Das ist dein <b>Späher</b>. Tippe ihn an, um zu sehen, wie weit er ziehen kann.","Die <b>weißen Punkte</b> zeigen die Reichweite. Tippe auf einen, um zu ziehen und die Karte aufzudecken.","Tippe auf das <b>hervorgehobene Feld</b> in deinem Gebiet und nutze die goldene Aktion unten. Ernten lässt die Stadt wachsen.","Tippe jetzt auf deine <b>Hauptstadt</b> (die Stadt mit der goldenen Raute) und bilde eine Einheit aus. Eine leere Stadt kann eingenommen werden.","Öffne <b>Technologie</b>, um zu sehen, was dein Clan lernen kann. Jede Forschung schaltet Einheiten oder Gebäude frei.","Wenn es nichts mehr zu tun gibt, tippe auf <b>Runde beenden</b>. Die anderen Clans spielen und du erhältst Lumen (✦).","Zeit zu wachsen: Bring eine Einheit zum hervorgehobenen <b>neutralen Dorf</b> und beende die Runde darauf, um es zu besetzen.","Zeit zu wachsen: Erkunde mit dem Späher, bis du ein <b>neutrales Dorf</b> (graue Dächer) findest, und beende die Runde darauf.","Du kennst jetzt das Wichtigste. Es gewinnt, wer in Runde {n} die meisten Punkte hat oder alle Rivalen erobert. Alle Tipps findest du im Menü.","Veteran!","{u} erhielt +5 Leben","Dorf besetzt!","Stadt erobert!","{city} gehört jetzt dem Clan {c}","Stadt verloren","{c} hat {city} eingenommen","Clan ausgelöscht","{c} hat das Mosaik verlassen","Großes Werk vollendet · +300 Punkte","Monument errichtet","{m} · +250 Punkte","Letzte Runde","Lass jede Aktion zählen","Noch 5 Runden bis zum Ende der Partie.","{c} ist ohne Verteidigung","Ein Feind kann die Stadt nächste Runde erreichen, und sie ist deine <b>letzte Stadt</b>: Fällt sie, ist die Partie vorbei. Lass eine Einheit darin oder bilde jetzt eine aus.","Ein Feind kann die Stadt nächste Runde erreichen. Lass eine Einheit darin oder bilde jetzt eine aus.","Trotzdem beenden","Stadt verteidigen","Anleitung beendet. Die Tipps findest du im Menü.","Glut","Vulkane und Asche","Brücken werden zu festem Boden (die Lava erstarrt) und Rammböcke kosten 5 ✦.","Als die Welt zerbrach, brannte der Vulkan Ignea auf einer einzigen Kachel weiter. Die Glut wurden um ihn herum geboren und schworen, die erste Flamme nie erlöschen zu lassen. Für sie kann nur Feuer wieder zusammenschweißen, was zerbrochen ist.","Vulkanschmiede","Flut","Riffe","Hafen: Einheiten auf dem Wasser haben +1 Bewegung und Fischen kostet 1 ✦.","Der Archipel der Flut versank im Großen Bruch, und das ganze Volk verbrachte eine Generation auf Flößen. Sie lernten, die Strömungen zu lesen, indem sie den Laternenfischen folgten. Heute suchen sie Kachel für Kachel das Riff, an dem alles begann.","Korallen-Leuchtturm","Wurzel","dichter Wald","Einheiten im Wald haben +1 Verteidigung.","Die Wurzel stammen von den Gärtnern des Mutterbaums ab, dessen Wurzeln während des Bruchs die letzten Stücke Land zusammenhielten. Jede ihrer Städte wächst aus einem seiner Samen. Das Mosaik zu vereinen heißt für die Wurzel, den ursprünglichen Wald neu zu pflanzen.","Baumhaus","Frost","Tundra","Überquert Flachwasser ohne Boot (Eis).","Aus den warmen Ländern vertrieben, überquerten die Frost zu Fuß ein gefrorenes Meer und überlebten, wo sonst niemand leben wollte. Sie zähmten die weißen Bären und machten den Winter zu ihrem Verbündeten. Jetzt steigen sie aus der Tundra herab, um den Platz einzufordern, der ihnen verwehrt wurde.","Kristall-Iglu","Düne","Wüste","Oase: Der Markt kostet 3 ✦ und Karawanen bringen Lumen.","Wo Lumensplitter in die Wüste fielen, entsprangen Oasen. Die Düne fanden sie als Erste und errichteten um jede einen Basar. Ihre Karawanen verbinden die Kacheln durch Handel, bevor irgendeine Armee eintrifft.","Oasenpalast","Wind","Hochebenen","Reiter haben +1 Bewegung und kosten 3 ✦.","Nomaden der Hochebenen, die Wind bauten nie Mauern: Ihr Zuhause ist der Sattel. Man sagt, sie hörten den Bruch im Pfeifen des Windes kommen und überlebten deshalb. Sie reiten der Stimme nach, die wieder eine ganze Welt verspricht.","Windmühle","Bestie","Savannen und Wälder","Rudel: Jagen kostet nur 1 ✦.","Im Bruch verlorene Kinder wurden von einem Rudel Mooswölfe aufgenommen. Sie wuchsen gemeinsam jagend auf und kehrten als Clan zurück, der alles teilt, was er erlegt. Für die Bestie ist das Mosaik ein Jagdrevier, das nur ein einziges Rudel braucht.","Totembau","Schein","Kristallschluchten","Lumenbrücken kosten 1 ✦ und halten doppelt so lange.","Mönche der Kristallschluchten, die Schein entdeckten, wie man Licht verfestigt, und bauten die ersten Lumenbrücken. Sie hüten das Geheimnis in goldenen Klöstern. Sie glauben, die Welt finde mit Brücken wieder zusammen, nicht mit Schwertern, tragen aber trotzdem Schwerter.","Lumen-Obelisk","Automaten","Metallzitadellen","Panzerung: Alle Einheiten starten mit +3 Leben.","Armee humanoider Roboter","Im Jahr 2053 führen die Automaten den Krieg der Zukunft gegen die Astrale und verlieren ihn. Einheit Null berechnete den einzigen Ausweg: in der Zeit zurückreisen und die Vergangenheit erobern, bevor der Feind ankommt. Eine Armee humanoider Roboter durchquerte das Portal und errichtete ihr erstes Rechenzentrum im Zeitalter des Mosaiks.","Rechenzentrum","Astrale","Landekrater","Orbitalsicht: Einheiten sehen 1 Feld weiter.","Außerirdische","Die Astrale kamen aus den Sternen, um 2053 die Welt zu beherrschen, und stießen auf einen Widerstand aus Metall. Als sie den Plan der Automaten abfingen, schickten sie ein Schiff durch dasselbe Zeitportal. Sie landeten in der Vergangenheit mit einer Mission: die Roboter jagen und die Welt einnehmen, bevor der Krieg beginnt.","Gelandetes Schiff","Gespenster","ewige Nebel","Nebel: Sie überqueren Berge ohne Klettern und haben dort +1 Verteidigung.","Volk der Schatten","Die Gespenster sind die Schatten derer, die im Großen Bruch verschwanden, gefangen zwischen einer Kachel und der nächsten. Sie leben in den Nebeln und überqueren Berge, als wären sie Dunst. Sie glauben, dass sie wieder einen Körper bekommen, wenn das Mosaik vereint ist.","Nebelmausoleum","Kolosse","himmlische Ruinen","Steinhaut: Jeder erlittene Treffer verursacht 1 Schaden weniger.","Gefallene Engel aus Stein","Die Kolosse waren Engel. Als die Welt zerbrach, fielen sie mit den Splittern vom Himmel, und als sie den Boden berührten, wurden Flügel und Haut zu Stein. Langsame, fast unzerstörbare Riesen, wollen sie das Mosaik wieder vereinen, um die Treppe nach Hause zu errichten.","Gefallener Thron","Sammeln","Früchte auf dem Feld ernten (+1 Bev).","Jagd","Tiere im Wald jagen (+1 Bev).","Seefahrt","Flachwasser befahren und fischen (+1 Bev).","Klettern","Berge besteigen (Verteidigung ×1,5).","Schmieden","Speerträger ausbilden (Verteidigung 3).","Reiten","Reiter ausbilden (Bewegung 2, greift an und zieht sich zurück).","Handel","Markt bauen (+1 ✦ pro Runde).","Lumenkunde","Lumenbrücken über Flachwasser errichten (halten 8 Runden).","Ackerbau","Bauernhof auf dem Feld bauen (+2 Bev).","Schießkunst","Schleuderer ausbilden (Reichweite 2).","Hochsee","Auf dem Ozean segeln.","Bergbau","Mine auf Erz bauen (+2 Bev).","Belagerung","Rammbock ausbilden (Angriff 4).","Diplomatie","Waffenstillstände anbieten.","Erschließung","Das Gebiet jeder Stadt auf Radius 2 erweitern (6 ✦), ohne auf Stufe 4 zu warten.","Ingenieurwesen","Das Große Werk deines Clans in der Hauptstadt errichten (30 ✦, eines pro Partie).","Städtebau","In jeder Stadt einen Platz errichten (8 ✦: +3 Bev, +40 Punkte).","Kartografie","Deckt sofort die ganze Karte auf.","Taktik","Alle deine Einheiten erhalten +1 Angriff.","Befestigung","In jeder Stadt eine Mauer kaufen (6 ✦).","Forstwirtschaft","Sägewerk im Wald bauen (+2 Bev) und Jagen bringt +1 Bev zusätzlich.","Architektur","Bauernhöfe, Minen und Sägewerke geben +1 Bev (auch bereits gebaute), jeder Markt bringt +1 ✦ und Brücken werden dauerhaft.","Allianz","Waffenstillstände dauern 10 Runden und der Tribut halbiert sich.","Ewige Schmiede","Großer Leuchtturm","Jede Stadt am Wasser bringt +1 ✦ pro Runde.","Mutterbaum","Alle deine Städte erhalten jetzt +2 Bevölkerung.","Eispalast","Deine Städte ab Stufe 3 erhalten jetzt eine Mauer.","Großer Basar","Jede Stadt bringt +1 ✦ pro Runde.","Turm der Winde","Deckt die ganze Karte auf und alle deine Städte erhalten +1 Bevölkerung.","Rudeltotem","Alle deine Einheiten heilen sich und erhalten +5 maximales Leben.","Sonnenprisma","Die Hauptstadt bringt nun +3 ✦ pro Runde.","Fließband","Jede Stadt, die du jetzt besitzt, bringt +1 ✦ pro Runde.","Mutterschiff","Deckt die ganze Karte auf und bringt jetzt +10 ✦.","Ewiger Schleier","Deine Einheiten heilen sich vollständig und jede Stadt erhält +1 Bevölkerung.","Himmelstreppe","Alle deine Einheiten erhalten +1 Verteidigung.","Späher","Speerträger","Schleuderer","Reiter","Rammbock","Wächter","Pyromant","Schleudert Feuer 2 Felder weit mit Angriff 3.","Harpunier","Angriff 3 und Verteidigung 2: der Speerträger der Riffe.","Druide","Heilt zu Beginn der Runde benachbarte Verbündete um 3 Leben.","Bärenreiter","Schweres Reittier: 16 Leben und Angriff 3.","Karawane","Zieht 2 Felder und bringt +1 ✦ pro Runde, solange sie lebt (bis zu 2 Karawanen zählen).","Falkner","Der Falke greift aus 3 Feldern Entfernung an.","Rudelwolf","Billig und schnell: zieht 2 Felder, greift an und zieht sich zurück.","Kristallwächter","Kristallschild: Verteidigung 4.","Mecha","Riesenroboter mit 20 Leben und Angriff 4. Benötigt eine Stadt der Stufe 3.","Fliegende Untertasse","Fliegt über Wasser, Wald und Berge, 2 Felder pro Runde.","Spuk","Greift an, ohne einen Gegenangriff zu erleiden.","Steinseraph","Steinflügel: überquert Wald und Berge ohne Halt.","Feld","Wald","Berg","Flachwasser","Ozean","Früchte","Fische","Erz","Werkstatt","+1 ✦ pro Runde in dieser Stadt","Expedition","Eine Expedition deckt die Umgebung auf und ein Späher ist bereit","Verteidigung ×3 für den Wächter der Stadt","Schatz","+5 ✦ sofort","Grenze","Das Gebiet wächst auf Radius 2","Fest","+3 Bevölkerung","Gratis-Supereinheit","Lumengarten","+150 Punkte","Handelsroute","+2 ✦ pro Runde in dieser Stadt","Mosaik-Leuchtturm","60 % der Karte erkunden","Metropole","Eine Stadt der Stufe 5 besitzen","Imperium","5 Städte besitzen","Arena der Veteranen","10 Kämpfe gewinnen","Leicht","Schwer","Frühling","Regen und volle Flüsse","Hitze und starke Sonne","Herbst","Stürme auf den Hochebenen","Eis und Schnee","Leuchtbeeren","Ressource · Früchte","Ein Strauch mit Beeren, die in der Dämmerung leuchten. Pflücke sie mit Sammeln.","Mooshirsch","Ressource · Wild","Ein zahmer Hirsch mit einem Geweih aus Moos. Jage ihn mit der Technologie Jagd.","Laternenfisch","Ressource · Fische","Ein Fisch, der im Flachwasser ein Licht entzündet. Fange ihn mit Seefahrt.","Lebender Kristall","Ressource · Erz","Kristalle, die im Gestein wachsen. Baue mit Bergbau eine Mine.","Bauernhof","Gebäude · +2 Bev","Beete mit goldenem Weizen. Benötigt Ackerbau.","Kristallmine","Ein Stollen mit Schienen und einem Kristallwagen. Benötigt Bergbau.","Markt","Gebäude · +1 ✦/Runde","Der Handelsstand der Stadt. Einer pro Stadt. Benötigt Handel.","Sägewerk","Gestapelte Stämme und eine lumenbetriebene Säge. Benötigt Forstwirtschaft.","Alte Ruinen","Erkundung","Ein Bogen aus einer Welt vor dem Mosaik. Die erste Einheit, die ankommt, erhält eine Belohnung.","Lumen-Schrein","Gebäude · +2 Bev · +60 Pkt.","Ein Steinaltar mit einem Lumenkristall. Er kann auf freiem Feld oder Wald errichtet werden; jeder neue Schrein kostet 4 ✦ mehr.","Übergang","Verfestigtes Licht über dem Flachwasser. Jeder Clan kann es überqueren, solange es hält.","Willkommen in Mosaica","Dein Clan beginnt mit einer Hauptstadt und einem Späher. Tippe den Späher an, um zu sehen, wohin er ziehen kann (weiße Punkte). Bring Einheiten zu neutralen Dörfern und beende die Runde darauf, um sie zu besetzen.","Lumen und Städte","Lumen (✦) kommen jede Runde. Tippe auf Felder in deinem Gebiet, um Ressourcen zu ernten: Die Stadt gewinnt Bevölkerung, steigt auf und jede Stufe bringt eine Belohnung.","Technologie","Unter Technologie schaltest du Einheiten und Gebäude frei. Auf Stufe 2 schaltet Ingenieurwesen das Große Werk deines Clans frei, das 300 Punkte wert ist.","Kampf","Rote Kreise zeigen, wen du angreifen kannst, mit einer Schadensvorschau. Falls du falsch gezogen bist, nutze Rückgängig vor dem Angriff (nicht mehr nach dem Öffnen von Ruinen).","So gewinnst du","Die Partie dauert 30 Runden. Es gewinnt, wer die meisten Punkte hat oder alle Rivalen erobert. Eroberte Städte sind 3 Runden lang instabil, und jede Stadt über 5 kostet 1 ✦ pro Runde.","Spielbrett","Punktestand","Punkte","Lumen","Runde","Letzten Zug rückgängig machen (Kürzel: Z)","Rückgängig","Aktionen","Kürzel: Leertaste","Kürzel: Enter","Einnahmen pro Runde: Eine Stadt der Stufe 1 bringt 2 ✦, +1 pro Stufe, und die Hauptstadt bringt +1.","Kampf ohne Würfel: Schaden = Angriffsanteil × Angriff × 4. Überlebt der Verteidiger und erreicht er den Angreifer, schlägt er zurück.","Wald, Berge und Städte geben Verteidigung ×1,5. Eine Mauer gibt ×3.","Technologie kostet 4 + Stufe × Anzahl der Städte. Schnelles Wachstum verteuert die Forschung.","Jahreszeiten: Alle 8 Runden wechseln Sommer (Ernten +1 Bev) und Winter (Flachwasser gefriert und wird begehbar).","Jahreszeiten-Modus (optional): Frühling, Sommer, Herbst und Winter wechseln alle {n} Runden, und jede Jahreszeit gibt ihren Clans +{b} Angriff.","Lumenbrücken verbinden Inseln für 3 ✦. Pakte bringen 5 Runden Waffenstillstand; ein Bruch kostet 150 Punkte.","Eine eroberte Stadt ist 3 Runden lang instabil (keine Einnahmen, kein Ausbilden). Jede Stadt über 5 kostet 1 ✦ pro Runde.","Jeder Clan hat eine exklusive Einheit (beim Ausbilden mit ★ markiert), eine eigene Hauptstadt und eine Geschichte.","Punkte: Stadtstufen, Gebiet, Technologien, Einheiten, Erkundung und Monumente.","Verstanden","Niederlage","Sieg",", ","Bev"],"it":["Lingua","Partita creata (seme {s}). Guidi il clan {c}.","Modalità Stagioni: prima stagione, {s}, che rafforza {f}.","la tecnologia {t}","un Esploratore che si è unito al clan","una mappa della regione","{c} ha esplorato delle rovine e ha trovato {m}.","Rovine: hai trovato {m}!","rovine!","{a} ({ac}) ha attaccato {d} ({dc}): {n} danni",", sconfitto","; {u} è diventato veterano",", contrattacco di {n}",", l'attaccante è caduto","{c} ha ricercato {t}.","Architettura: costruzioni migliorate e ponti permanenti.","Cartografia: l'intera mappa è stata rivelata.","{c} ha eretto la Grande Opera {g} a {city}.","Grande Opera: {g} (+300 punti).","{c} ha eretto la Grande Opera {g}.","{c} ha eretto una Piazza a {city}.","{c} ha ampliato il territorio di {city}.","territorio +","{c} ha cinto di mura {city}.","Raccogli bacche di luce","Caccia il cervo muschiato","Pesca il pesce lanterna","Costruisci miniera di cristallo","Costruisci segheria","Erigi santuario di Lumen","Costruisci fattoria","Costruisci mercato","{c} ha solidificato la lava e creato nuova terra.","{c} ha eretto un Ponte di Lumen.","{city} ({c}) è salita al livello {n}.","Un esploratore di {c} è partito da {city} e ha rivelato {n} caselle.","L' Tregua con {c}.","Hai rifiutato la tregua di {c}.",", conosciuta",", {n} Lumen",", bloccata","Conosciuta","Ricerca · {n} ✦","Richiede {t}","Clan {c}","Tocca una tecnologia per vedere cosa sblocca. Bagliore dorato: puoi ricercarla ora.","Torna alla mappa","Albero tecnologico ad anelli","Ogni tecnologia costa 4 + livello × numero di città ({n}). Crescere rende la ricerca più cara."," La Grande Opera del tuo clan si erige dal pannello della capitale.","Tregua per altri {n} turni. Nessuna delle parti può attaccare.","Rompi il patto (−150 punti)","Tregua di {n} turni. I clan dietro di te in classifica rifiutano quasi sempre. Il tributo sale a ogni proposta.","Proponi tregua · {n} ✦","Patti","Non hai ancora incontrato altri clan. Esplora la mappa.","{c} propone una tregua","Per {n} turni, nessuno dei due attacca l'altro né prende le sue città. Romperla dopo costa 150 punti.","Accetta","Tregua di {n} turni con {c}.","Rifiuta","Restare in guerra.","{city} è arrivata al livello {n}","Scegli un premio per la città.","Menu","Registro eventi","ultimi 60","tregue con i rivali","richiede {t}","Vedi i consigli","{n} consigli","Regole rapide","e guida della mappa","Impostazioni","suono, vibrazione, velocità e lingua","Torna all'inizio","la partita resta salvata","Clan · sei {o}","Il tuo clan: {c}","Storia dei {c}","{n} unità","{n} unità","Proponi tregue ai clan che hai già incontrato.","Ricerca {t} per proporre patti.","Come si gioca","Guida agli elementi della mappa","Record","Stagioni","Sfida {d}","Termina una partita per registrare il tuo primo record.","Cancella i record","Clan speciale · {k}","Clan · {e}","La tua capitale è {cap}.","La tua capitale è {cap}.","Solo il tuo clan addestra {u}:","I {n} clan","{e} · inizia con {t}","Esclusiva: {u}.","Capitale: {cap} · Grande Opera: {g}","Speciale · {k}","Storia","Attivo","Disattivo","Effetti sonori","tocchi, combattimenti e conquiste","Musica","colonna sonora leggera durante il gioco","Vibrazione","quando attacchi, conquisti e negli avvisi","non disponibile su questo dispositivo","Velocità delle animazioni","movimento delle unità e turno dei rivali","Veloce","Normale","Rifai la partita guidata","nella prossima partita","Cancella la partita salvata","turno {n}","nessuna","{n} registrati","Consiglio {a} di {b}","Salta","Avanti","Gioca","Unisci le tessere del mondo","Nuova partita","Continua","turno {a} di {b}","Sfida del giorno","Classica","Altre opzioni","Clan","Esclusiva: {u}","La storia dei {c}","Unità esclusiva","Costa {n} ✦ e richiede {t}.","Capitale","Grande Opera: {g}.","Il mondo si è spezzato in tessere fluttuanti. I clan ricuciono i pezzi con i Lumen (✦), l'energia che sgorga da ogni città. In {n} turni, chi ha più punti unisce il mosaico.","Scegli il tuo clan","Clan speciali","Difficoltà","Modalità di gioco","Inizia la partita","Calendario delle Stagioni","L'anno ha 4 stagioni di {n} turni. In ognuna, i clan della stagione ottengono +{b} di attacco su tutte le unità. L'inverno gela l'acqua bassa e i raccolti rendono +1 pop solo in estate.","(il tuo clan)","Opzioni avanzate","Seme della mappa","Lo stesso numero genera sempre la stessa mappa. Lascialo così per una mappa casuale.","{c} in pericolo","è la tua ultima città","può cadere al prossimo turno","Nemici vicino a {c}","{c} è indifesa ed è la tua ultima città. Lascia un'unità dentro o sconfiggi il nemico accanto.","{c} è indifesa. Lascia un'unità dentro o sconfiggi il nemico accanto.","Questo è il tuo <b>Esploratore</b>. Toccalo per vedere fin dove può muoversi.","I <b>punti bianchi</b> mostrano la portata. Toccane uno per muoverti e rivelare la mappa.","Tocca la <b>casella evidenziata</b> del tuo territorio e usa l'azione dorata che appare in basso. Raccogliere fa crescere la città.","Ora tocca la tua <b>capitale</b> (la città con il rombo dorato) e addestra un'unità. Una città vuota può essere presa.","Apri <b>Tecnologia</b> per vedere cosa può imparare il tuo clan. Ogni ricerca sblocca unità o costruzioni.","Quando non c'è più niente da fare, tocca <b>Fine turno</b>. Gli altri clan giocano e tu ricevi Lumen (✦).","È ora di crescere: porta un'unità al <b>villaggio neutrale</b> evidenziato e termina il turno sopra di esso per occuparlo.","È ora di crescere: esplora con l'Esploratore finché non trovi un <b>villaggio neutrale</b> (tetti grigi) e termina il turno sopra di esso.","Ora conosci l'essenziale. Vince chi ha più punti al turno {n}, o chi conquista tutti i rivali. Tutti i consigli sono nel Menu.","Veterano!","{u} ha ottenuto +5 di vita","Villaggio occupato!","Città conquistata!","{city} ora appartiene al clan {c}","Città perduta","{c} ha preso {city}","Clan eliminato","{c} è uscito dal mosaico","Grande Opera completata · +300 punti","Monumento eretto","{m} · +250 punti","Ultimo turno","Fai contare ogni azione","Mancano 5 turni alla fine della partita.","{c} è senza difesa","Un nemico può raggiungere la città al prossimo turno, ed è la tua <b>ultima città</b>: se cade, la partita finisce. Lascia un'unità dentro o addestrane una ora.","Un nemico può raggiungere la città al prossimo turno. Lascia un'unità dentro o addestrane una ora.","Termina comunque","Difendi la città","Guida chiusa. I consigli sono nel Menu.","Brace","vulcani e cenere","I ponti diventano terraferma (la lava si solidifica) e gli Arieti costano 5 ✦.","Quando il mondo si spezzò, il vulcano Ignea rimase acceso su un'unica tessera. I Brace nacquero intorno a esso e giurarono di non lasciar mai spegnere la prima fiamma. Per loro, solo il fuoco può risaldare ciò che si è rotto.","Forgia-Vulcano","Marea","scogliere coralline","Porto: le unità in acqua hanno +1 di movimento e pescare costa 1 ✦.","L'arcipelago dei Marea affondò nella Grande Frattura e l'intero popolo passò una generazione sulle zattere. Impararono a leggere le correnti seguendo i pesci lanterna. Oggi cercano, tessera dopo tessera, la scogliera dove tutto ebbe inizio.","Faro di Corallo","Radice","foresta fitta","Le unità nella foresta hanno +1 di difesa.","I Radice discendono dai giardinieri dell'Albero Madre, le cui radici tennero insieme gli ultimi pezzi di terra durante la Frattura. Ogni loro città nasce da un suo seme. Per i Radice, unire il mosaico significa ripiantare la foresta originaria.","Casa sull'Albero","Brina","tundra","Attraversa l'acqua bassa senza barca (ghiaccio).","Cacciati dalle terre calde, i Brina attraversarono a piedi un mare gelato e sopravvissero dove nessun altro volle vivere. Domarono gli orsi bianchi e fecero dell'inverno un alleato. Ora scendono dalla tundra per reclamare il posto che fu loro negato.","Igloo di Cristallo","Duna","deserto","Oasi: il mercato costa 3 ✦ e le Carovane portano Lumen.","Dove caddero schegge di Lumen nel deserto, sbocciarono oasi. I Duna furono i primi a trovarle ed eressero bazar intorno a ciascuna. Le loro carovane uniscono le tessere con il commercio prima che arrivi qualsiasi esercito.","Palazzo dell'Oasi","Vento","altipiani","I Cavalieri hanno +1 di movimento e costano 3 ✦.","Nomadi degli altipiani, i Vento non costruirono mai mura: la loro casa è la sella. Si dice che sentirono arrivare la Frattura nel fischio del vento e per questo sopravvissero. Cavalcano dietro la voce che promette di nuovo un mondo intero.","Mulino dei Venti","Fiera","savane e boschi","Branco: cacciare costa solo 1 ✦.","Bambini perduti nella Frattura furono accolti da un branco di lupi muschiati. Crebbero cacciando insieme e tornarono come un clan che divide tutto ciò che abbatte. Per i Fiera, il mosaico è un territorio di caccia che ha bisogno di un solo branco.","Tana del Totem","Lume","canyon di cristallo","I Ponti di Lumen costano 1 ✦ e durano il doppio.","Monaci dei canyon di cristallo, i Lume scoprirono come solidificare la luce e costruirono i primi Ponti di Lumen. Custodiscono il segreto in monasteri dorati. Credono che il mondo si riunisca con i ponti, non con le spade, ma portano comunque le spade.","Obelisco di Lumen","Automi","cittadelle di metallo","Corazza: tutte le unità nascono con +3 di vita.","Esercito di robot umanoidi","Nel 2053, gli Automi combattono la Guerra del Futuro contro gli Astri e la stanno perdendo. L'Unità Zero ha calcolato l'unica via d'uscita: tornare indietro nel tempo e conquistare il passato prima che arrivi il nemico. Un esercito di robot umanoidi ha attraversato il portale e ha eretto il suo primo data center nell'era del mosaico.","Data Center","Astri","cratere d'atterraggio","Vista orbitale: le unità vedono 1 casella più avanti.","Extraterrestri","Gli Astri vennero dalle stelle per dominare il mondo nel 2053 e trovarono una resistenza di metallo. Quando intercettarono il piano degli Automi, lanciarono una nave attraverso lo stesso portale del tempo. Atterrarono nel passato con una missione: dare la caccia ai robot e prendere il mondo prima che la guerra cominci.","Nave Atterrata","Spettri","nebbie eterne","Foschia: attraversano le montagne senza Scalata e vi hanno +1 di difesa.","Popolo delle ombre","Gli Spettri sono le ombre di chi scomparve nella Grande Frattura, intrappolate tra una tessera e l'altra. Vivono nelle nebbie e attraversano le montagne come se fossero foschia. Credono che, se il mosaico verrà unito, torneranno ad avere un corpo.","Mausoleo delle Nebbie","Colossi","rovine celesti","Pelle di pietra: ogni colpo subito infligge 1 danno in meno.","Angeli caduti di pietra","I Colossi erano angeli. Quando il mondo si spezzò, caddero dal cielo insieme alle schegge e, toccando il suolo, ali e pelle divennero pietra. Giganti lenti e quasi indistruttibili, vogliono riunire il mosaico per erigere la scala che li riporterà a casa.","Trono Caduto","Raccolta","Raccogliere frutti nei campi (+1 pop).","Caccia","Cacciare animali nella foresta (+1 pop).","Navigazione","Entrare in acqua bassa e pescare (+1 pop).","Scalata","Salire sulle montagne (difesa ×1,5).","Forgiatura","Addestrare Lanciere (difesa 3).","Equitazione","Addestrare Cavaliere (movimento 2, attacca e si ritira).","Commercio","Costruire Mercato (+1 ✦ per turno).","Lumenaria","Erigere Ponti di Lumen sull'acqua bassa (durano 8 turni).","Agricoltura","Costruire Fattoria nei campi (+2 pop).","Tiro","Addestrare Frombolieri (gittata 2).","Mare Aperto","Navigare nell'oceano.","Estrazione","Costruire Miniera sul minerale (+2 pop).","Assedio","Addestrare Ariete (attacco 4).","Diplomazia","Proporre patti di tregua.","Pionierismo","Ampliare il territorio di qualsiasi città a raggio 2 (6 ✦), senza aspettare il livello 4.","Ingegneria","Erigere la Grande Opera del tuo clan nella capitale (30 ✦, una per partita).","Urbanistica","Erigere una Piazza in ogni città (8 ✦: +3 pop, +40 punti).","Cartografia","Rivela subito l'intera mappa.","Tattiche","Tutte le tue unità ottengono +1 di attacco.","Fortificazione","Comprare Mura in qualsiasi città (6 ✦).","Silvicoltura","Costruire Segheria nella foresta (+2 pop) e la caccia rende +1 pop in più.","Architettura","Fattorie, miniere e segherie danno +1 pop (anche quelle già costruite), ogni mercato rende +1 ✦ e i ponti diventano permanenti.","Alleanza","Le tregue durano 10 turni e il tributo si dimezza.","Forgia Eterna","Grande Faro","Ogni città in riva all'acqua rende +1 ✦ per turno.","Albero Madre","Tutte le tue città ottengono +2 di popolazione ora.","Palazzo di Ghiaccio","Le tue città di livello 3 o superiore ottengono le Mura ora.","Gran Bazar","Ogni città rende +1 ✦ per turno.","Torre dei Venti","Rivela l'intera mappa e tutte le tue città ottengono +1 di popolazione.","Totem del Branco","Tutte le tue unità guariscono e ottengono +5 di vita massima.","Prisma Solare","La capitale passa a rendere +3 ✦ per turno.","Catena di Montaggio","Ogni città che possiedi ora rende +1 ✦ per turno.","Nave Madre","Rivela l'intera mappa e porta +10 ✦ ora.","Velo Eterno","Le tue unità guariscono del tutto e ogni città ottiene +1 di popolazione.","Scala del Cielo","Tutte le tue unità ottengono +1 di difesa.","Esploratore","Lanciere","Frombolieri","Cavaliere","Ariete","Guardiano","Piromante","Scaglia fuoco ","沙漠","绿洲:市场花费3 ✦,商队会带来流明。","流明碎片落入沙漠之处,涌出了绿洲。沙丘族最先发现了它们,并在每片绿洲周围建起集市。在任何军队到来之前,他们的商队就已用贸易将各个地块连接起来。","绿洲宫殿","疾风","高原","骑兵移动+1,花费3 ✦。","疾风族是高原上的游牧民,从不修筑城墙:马鞍就是他们的家。据说他们从风的呼啸中听见了碎裂的到来,因此得以幸存。他们追随着那个承诺再次完整世界的声音一路驰骋。","风车","野兽","草原与林地","兽群:狩猎只需1 ✦。","在碎裂中走失的孩子们被一群苔狼收留。他们一同狩猎长大,回来时已成为一个分享一切猎物的氏族。对野兽族来说,马赛克是一片只需要一个兽群的猎场。","图腾巢穴","微光","水晶峡谷","流明桥只需1 ✦,持续时间翻倍。","微光族是水晶峡谷中的僧侣,他们发现了凝固光的方法,建起了最初的流明桥。他们在金色修道院中守护着这个秘密。他们相信世界要靠桥梁而非刀剑重新相连,但还是会随身带着刀剑。","流明方尖碑","自动机","金属要塞","装甲:所有单位出生时生命+3。","人形机器人军团","2053年,自动机正与星族进行未来战争,并且节节败退。零号单位算出了唯一的出路:回到过去,在敌人到来之前征服过去。一支人形机器人军团穿过传送门,在马赛克时代建起了第一座数据中心。","数据中心","星族","着陆陨坑","轨道视野:单位视野+1格。","外星人","星族在2053年从群星而来,想要统治世界,却遭遇了一支金属抵抗军。截获自动机的计划后,他们让一艘飞船穿过同一道时间之门。他们降落在过去,只有一个任务:在战争开始前猎杀机器人,夺取世界。","着陆飞船","幽灵","永恒迷雾","迷雾:无需攀登即可越过山脉,在山上防御+1。","暗影之民","幽灵族是在大碎裂中消失之人的影子,被困在地块与地块之间。他们生活在迷雾中,像雾气一样越过山脉。他们相信,只要马赛克重新统一,自己就能重获身体。","迷雾陵墓","巨像","天空遗迹","石肤:每次受到的攻击伤害减1。","石之堕天使","巨像曾是天使。世界碎裂时,他们随碎片一同从天而降,一触及地面,翅膀与皮肤便化为岩石。这些行动缓慢、几乎不可摧毁的巨人,想要重新拼合马赛克,筑起回家的天梯。","陨落王座","采集","在田野采摘果实(人口+1)。","狩猎","在森林中狩猎动物(人口+1)。","航海","进入浅水并捕鱼(人口+1)。","攀登","登上山地(防御×1.5)。","锻造","训练长枪兵(防御3)。","骑术","训练骑兵(移动2,攻击后撤退)。","贸易","建造市场(每回合+1 ✦)。","流明术","在浅水上架起流明桥(持续8回合)。","农耕","在田野建造农场(人口+2)。","射术","训练投石兵(射程2)。","远洋","在海洋中航行。","采矿","在矿石上建造矿场(人口+2)。","攻城","训练攻城锤(攻击4)。","外交","提议休战协定。","拓荒","将任意城市的领土扩展到半径2(6 ✦),无需等到4级。","工程学","在首都建造你氏族的伟业(30 ✦,每局一次)。","城市规划","在每座城市建造广场(8 ✦:人口+3,+40分)。","制图学","立即揭示整张地图。","战术","你的所有单位攻击+1。","筑城","可在任意城市购买城墙(6 ✦)。","林业","在森林中建造锯木厂(人口+2),狩猎额外+1人口。","建筑学","农场、矿场和锯木厂人口+1(已建成的也算),每个市场+1 ✦,桥梁变为永久。","同盟","休战持续10回合,贡金减半。","永恒熔炉","大灯塔","每座水边城市每回合+1 ✦。","母树","你所有城市立即人口+2。","冰之宫殿","你3级及以上的城市立即获得城墙。","大集市","每座城市每回合+1 ✦。","风之塔","揭示整张地图,你所有城市人口+1。","兽群图腾","你所有单位恢复生命,最大生命+5。","太阳棱镜","首都每回合改为+3 ✦。","装配线","你现有的每座城市每回合+1 ✦。","母舰","揭示整张地图,并立即获得+10 ✦。","永恒帷幕","你的单位完全恢复,每座城市人口+1。","天梯","你的所有单位防御+1。","斥候","长枪兵","投石兵","骑兵","攻城锤","守护者","火术士","以攻击3向2格外喷射火焰。","鱼叉手","攻击3、防御2:珊瑚礁的长枪兵。","德鲁伊","回合开始时,为相邻友军恢复3点生命。","熊骑兵","重型坐骑:生命16,攻击3。","商队","移动2格,存活期间每回合+1 ✦(最多计算2支商队)。","驯鹰人","猎鹰可从3格外发起攻击。","群狼","便宜又  the target.", "Arma de asedio que dispara a 3 casillas. Frágil de cerca. Esquirlas: también golpea a los enemigos junto al objetivo.", "Arme de siège qui tire à 3 cases. Fragile de près. Éclats : touche aussi les ennemis à côté de la cible.", "Belagerungswaffe mit 3 Feldern Reichweite. Im Nahkampf zerbrechlich. Splitter: trifft auch Feinde neben dem Ziel.", "Arma d'assedio che spara a 3 caselle. Fragile da vicino. Schegge: colpisce anche i nemici accanto al bersaglio.", "3マス先を撃つ攻城兵器。接近戦に弱い。破片：標的の隣の敵にも当たる。", "射程 3 格的攻城武器，近战脆弱。碎片：同时击中目标旁的敌人。"], "As próximas 2 tecnologias custam metade": ["Your next 2 technologies cost half", "Las próximas 2 tecnologías cuestan la mitad", "Les 2 prochaines technologies coûtent moitié prix", "Die nächsten 2 Technologien kosten die Hälfte", "Le prossime 2 tecnologie costano la metà", "次の2つの技術が半額", "接下来 2 项科技半价"], "Ataca e recua no campo": ["Attacks and retreats on fields", "Ataca y se retira en el campo", "Attaque et recule en plaine", "Greift an und zieht sich auf Feldern zurück", "Attacca e si ritira in campo aperto", "平地では攻撃後に退ける", "在平原上可攻击后撤退"], "Ataca sem sofrer contra-ataque. Bruma: invisível para quem não estiver ao lado.": ["Attacks without counterattack. Mist: invisible to anyone not next to it.", "Ataca sin sufrir contraataque. Bruma: invisible para quien no esté al lado.", "Attaque sans subir de riposte. Brume : invisible pour qui n'est pas à côté.", "Greift ohne Gegenangriff an. Nebel: unsichtbar für alle, die nicht daneben stehen.", "Attacca senza subire contrattacco. Bruma: invisibile a chi non è accanto.", "反撃を受けずに攻撃。霧：隣にいない相手からは見えない。", "攻击时不受反击。迷雾：不在身旁的单位看不见它。"], "Ateliê de Cristal": ["Crystal Workshop", "Taller de Cristal", "Atelier de Cristal", "Kristallwerkstatt", "Laboratorio di Cristallo", "水晶工房", "水晶工坊"], "Barato e veloz: anda 2 casas, ataca e recua. Investida: ao derrotar um inimigo, pode atacar de novo.": ["Cheap and fast: moves 2 tiles, attacks and retreats. Charge: after defeating an enemy, it can attack again.", "Barato y veloz: anda 2 casillas, ataca y se retira. Embestida: al derrotar a un enemigo, puede atacar de nuevo.", "Bon marché et rapide : 2 cases, attaque et recule. Charge : après avoir vaincu un ennemi, il peut attaquer encore.", "Billig und schnell: 2 Felder, greift an und zieht sich zurück. Ansturm: nach einem Sieg darf er erneut angreifen.", "Economico e veloce: 2 caselle, attacca e si ritira. Carica: dopo aver sconfitto un nemico, può attaccare di nuovo.", "安くて速い：2マス移動し、攻撃して退く。突撃：敵を倒すともう一度攻撃できる。", "便宜又迅速：移动 2 格，攻击后撤退。冲锋：击败敌人后可再次攻击。"], "Barco de Guerra": ["Warboat", "Barco de Guerra", "Navire de guerre", "Kriegsboot", "Nave da guerra", "軍船", "战船"], "Barcos de Lumen: construa um Porto na água rasa (Navegação). Uma unidade na água ao lado dele vira Barco de Guerra (alcance 2, exige Mar Aberto) ou Navio-Farol (+1 de movimento e +2 de visão).": ["Lumen Boats: build a Port in shallow water (Navigation). A unit on the water next to it becomes a Warboat (range 2, needs Open Sea) or a Lightship (+1 movement and +2 vision).", "Barcos de Lumen: construye un Puerto en agua poco profunda (Navegación). Una unidad en el agua a su lado se vuelve Barco de Guerra (alcance 2, requiere Mar Abierto) o Barco-Faro (+1 de movimiento y +2 de visión).", "Bateaux de Lumen : construisez un Port en eau peu profonde (Navigation). Une unité sur l'eau à côté devient Navire de guerre (portée 2, exige Haute Mer) ou Bateau-phare (+1 déplacement et +2 vision).", "Lumenboote: Baue einen Hafen im Flachwasser (Navigation). Eine Einheit im Wasser daneben wird zum Kriegsboot (Reichweite 2, braucht Offenes Meer) oder Leuchtschiff (+1 Bewegung, +2 Sicht).", "Barche di Lumen: costruisci un Porto in acqua bassa (Navigazione). Un'unità in acqua accanto diventa Nave da guerra (gittata 2, richiede Mare Aperto) o Nave-faro (+1 movimento e +2 visuale).", "ルーメンの船：浅瀬に港を建てる（航海術）。隣の水上ユニットは軍船（射程2、外洋が必要）か灯台船（移動+1、視界+2）になれる。", "流明之船：在浅水建造港口（航海）。港口旁水上的单位可变为战船（射程 2，需要远洋）或灯船（移动 +1，视野 +2）。"], "Biblioteca de Cristal": ["Crystal Library", "Biblioteca de Cristal", "Bibliothèque de Cristal", "Kristallbibliothek", "Biblioteca di Cristallo", "水晶の図書館", "水晶图书馆"], "Bruma": ["Mist", "Bruma", "Brume", "Nebel", "Bruma", "霧", "迷雾"], "Bruma: invisível para quem não estiver ao lado. Ao entrar numa cidade rival, deixa a cidade instável por 2 turnos e some.": ["Mist: invisible to anyone not next to it. Entering a rival city makes it unstable for 2 turns, then it vanishes.", "Bruma: invisible para quien no esté al lado. Al entrar en una ciudad rival, la deja inestable 2 turnos y desaparece.", "Brume : invisible pour qui n'est pas à côté. En entrant dans une ville rivale, la rend instable 2 tours et disparaît.", "Nebel: unsichtbar für alle, die nicht daneben stehen. Betritt sie eine gegnerische Stadt, wird diese 2 Runden instabil und sie verschwindet.", "Bruma: invisibile a chi non è accanto. Entrando in una città rivale la rende instabile per 2 turni e svanisce.", "霧：隣にいない相手からは見えない。敵の都市に入ると2ターン不安定にして消える。", "迷雾：不在身旁的单位看不见它。进入敌方城市会使其动荡 2 回合，然后消失。"], "Cais de madeira com uma lanterna de Lumen, na água rasa. Um por cidade. Uma unidade na água ao lado do porto pode virar Barco de Guerra (alcance 2) ou Navio-Farol (+1 de movimento e +2 de visão). Exige Navegação.": ["Wooden pier with a Lumen lantern, in shallow water. One per city. A unit on the water next to the port can become a Warboat (range 2) or a Lightship (+1 movement and +2 vision). Needs Navigation.", "Muelle de madera con una linterna de Lumen, en agua poco profunda. Uno por ciudad. Una unidad en el agua junto al puerto puede volverse Barco de Guerra (alcance 2) o Barco-Faro (+1 de movimiento y +2 de visión). Requiere Navegación.", "Quai en bois avec une lanterne de Lumen, en eau peu profonde. Un par ville. Une unité sur l'eau à côté du port peut devenir Navire de guerre (portée 2) ou Bateau-phare (+1 déplacement et +2 vision). Exige Navigation.", "Holzsteg mit Lumenlaterne im Flachwasser. Einer pro Stadt. Eine Einheit im Wasser daneben kann zum Kriegsboot (Reichweite 2) oder Leuchtschiff (+1 Bewegung, +2 Sicht) werden. Braucht Navigation.", "Molo di legno con una lanterna di Lumen, in acqua bassa. Uno per città. Un'unità in acqua accanto al porto può diventare Nave da guerra (gittata 2) o Nave-faro (+1 movimento e +2 visuale). Richiede Navigazione.", "浅瀬に立つルーメンのランタン付きの木の桟橋。都市ごとに1つ。隣の水上ユニットは軍船（射程2）か灯台船（移動+1、視界+2）になれる。航海術が必要。", "浅水中挂着流明灯的木码头。每城一座。港口旁水上的单位可变为战船（射程 2）或灯船（移动 +1，视野 +2）。需要航海。"], "Canta para um inimigo com metade da vida ou menos e o traz para o seu clã.": ["Sings to an enemy at half health or less and brings it to your clan.", "Canta a un enemigo con la mitad de vida o menos y lo trae a tu clan.", "Chante pour un ennemi à moitié de sa vie ou moins et le rallie à votre clan.", "Singt für einen Feind mit halber Lebenskraft oder weniger und holt ihn in deinen Clan.", "Canta a un nemico con metà vita o meno e lo porta nel tuo clan.", "体力が半分以下の敵に歌いかけ、自分の部族に迎え入れる。", "向生命值不足一半的敌人歌唱，将其带入你的部族。"], "Cantor de Lumen": ["Lumen Singer", "Cantor de Lumen", "Chanteur de Lumen", "Lumensänger", "Cantore di Lumen", "ルーメンの歌い手", "流明歌者"], "Cofre de Lumen": ["Lumen Vault", "Cofre de Lumen", "Coffre de Lumen", "Lumentresor", "Forziere di Lumen", "ルーメンの金庫", "流明宝库"], "Comprar Muralha em qualquer cidade (6 ✦) e treinar a Guarda de Cristal (14 de vida, ataque 3, defesa 3).": ["Buy a Wall in any city (6 ✦) and train the Crystal Guard (14 health, attack 3, defense 3).", "Comprar Muralla en cualquier ciudad (6 ✦) y entrenar la Guardia de Cristal (14 de vida, ataque 3, defensa 3).", "Acheter une Muraille dans n'importe quelle ville (6 ✦) et entraîner la Garde de Cristal (14 vie, attaque 3, défense 3).", "Mauer in jeder Stadt kaufen (6 ✦) und die Kristallwache ausbilden (14 Leben, Angriff 3, Verteidigung 3).", "Comprare Mura in qualsiasi città (6 ✦) e addestrare la Guardia di Cristallo (14 vita, attacco 3, difesa 3).", "どの都市でも城壁を購入（6 ✦）、水晶の衛兵を訓練（体力14、攻撃3、防御3）。", "可在任意城市购买城墙（6 ✦），并训练水晶卫士（生命 14，攻击 3，防御 3）。"], "Congela": ["Freezes", "Congela", "Gèle", "Friert ein", "Congela", "凍らせる", "冰冻"], "Construir Mina no minério (+2 pop) e Ateliê de Cristal ao lado das minas (+1 ✦ por mina vizinha).": ["Build a Mine on ore (+2 pop) and a Crystal Workshop next to mines (+1 ✦ per nearby mine).", "Construir Mina en el mineral (+2 pob) y Taller de Cristal junto a las minas (+1 ✦ por mina vecina).", "Construire une Mine sur le minerai (+2 pop) et un Atelier de Cristal près des mines (+1 ✦ par mine voisine).", "Mine auf Erz bauen (+2 Bev.) und Kristallwerkstatt neben Minen (+1 ✦ pro Nachbarmine).", "Costruire Miniera sul minerale (+2 pop) e Laboratorio di Cristallo vicino alle miniere (+1 ✦ per miniera vicina).", "鉱石に鉱山（人口+2）、鉱山の隣に水晶工房（隣の鉱山1つにつき+1 ✦）を建てる。", "在矿石上建矿场（人口 +2），并在矿场旁建水晶工坊（每座相邻矿场 +1 ✦）。"], "Construir ateliê de cristal": ["Build crystal workshop", "Construir taller de cristal", "Construire un atelier de cristal", "Kristallwerkstatt bauen", "Costruire laboratorio di cristallo", "水晶工房を建てる", "建造水晶工坊"], "Construir porto de Lumen": ["Build Lumen port", "Construir puerto de Lumen", "Construire un port de Lumen", "Lumenhafen bauen", "Costruire porto di Lumen", "ルーメンの港を建てる", "建造流明港口"], "Construção · +1 pop": ["Building · +1 pop", "Construcción · +1 pob", "Bâtiment · +1 pop", "Gebäude · +1 Bev.", "Edificio · +1 pop", "建物 · 人口+1", "建筑 · 人口 +1"], "Construção · +1 pop · +1 ✦ por mina vizinha": ["Building · +1 pop · +1 ✦ per nearby mine", "Construcción · +1 pob · +1 ✦ por mina vecina", "Bâtiment · +1 pop · +1 ✦ par mine voisine", "Gebäude · +1 Bev. · +1 ✦ pro Nachbarmine", "Edificio · +1 pop · +1 ✦ per miniera vicina", "建物 · 人口+1 · 隣の鉱山1つにつき+1 ✦", "建筑 · 人口 +1 · 每座相邻矿场 +1 ✦"], "Converte feridos": ["Converts the wounded", "Convierte heridos", "Convertit les blessés", "Bekehrt Verwundete", "Converte i feriti", "負傷者を改宗", "转化伤员"], "Coro de Cristal": ["Crystal Choir", "Coro de Cristal", "Chœur de Cristal", "Kristallchor", "Coro di Cristallo", "水晶の聖歌隊", "水晶合唱团"], "Corrida": ["Race", "Carrera", "Course", "Wettlauf", "Corsa", "レース", "竞速"], "Desconfiado": ["Wary", "Desconfiado", "Méfiant", "Misstrauisch", "Diffidente", "警戒", "戒备"], "Dispensar": ["Dismiss", "Despedir", "Renvoyer", "Entlassen", "Congedare", "解散", "解散"], "Encerrar a partida livre": ["End the free game", "Terminar la partida libre", "Terminer la partie libre", "Freie Partie beenden", "Terminare la partita libera", "フリー対戦を終える", "结束自由对局"], "Enraíza": ["Roots", "Enraíza", "Enracine", "Verwurzelt", "Radica", "根で縛る", "缠根"], "Entrar em água rasa, pescar (+1 pop) e construir Porto de Lumen.": ["Enter shallow water, fish (+1 pop) and build a Lumen Port.", "Entrar en agua poco profunda, pescar (+1 pob) y construir Puerto de Lumen.", "Entrer en eau peu profonde, pêcher (+1 pop) et construire un Port de Lumen.", "Flachwasser betreten, fischen (+1 Bev.) und Lumenhafen bauen.", "Entrare in acqua bassa, pescare (+1 pop) e costruire il Porto di Lumen.", "浅瀬に入り、漁をし（人口+1）、ルーメンの港を建てる。", "进入浅水、捕鱼（人口 +1）并建造流明港口。"], "Escola de Lumen": ["Lumen School", "Escuela de Lumen", "École de Lumen", "Lumenschule", "Scuola di Lumen", "ルーメンの学校", "流明学堂"], "Estilhaço": ["Shards", "Esquirlas", "Éclats", "Splitter", "Schegge", "破片", "碎片"], "Faz tempo que você não os ataca": ["You haven't attacked them in a long time", "Hace tiempo que no los atacas", "Vous ne les avez pas attaqués depuis longtemps", "Du hast sie lange nicht angegriffen", "È da tempo che non li attacchi", "しばらく攻撃していない", "你很久没有攻击他们了"], "Fio de Lumen: ligada à capital por terra do clã (+1 ✦).": ["Lumen Thread: linked to the capital by clan land (+1 ✦).", "Hilo de Lumen: unida a la capital por tierra del clan (+1 ✦).", "Fil de Lumen : reliée à la capitale par les terres du clan (+1 ✦).", "Lumenfaden: über Clanland mit der Hauptstadt verbunden (+1 ✦).", "Filo di Lumen: collegata alla capitale da terre del clan (+1 ✦).", "ルーメンの糸：部族の土地で首都とつながっている（+1 ✦）。", "流明之线：通过部族土地与首都相连（+1 ✦）。"], "Fios de Lumen: cada cidade de nível 2 ou mais ligada à capital por terra do clã (ou ponte) rende +1 ✦ (⟡ no nome). Um inimigo parado no caminho corta o fio.": ["Lumen Threads: each city of level 2 or more linked to the capital by clan land (or bridge) earns +1 ✦ (⟡ by its name). An enemy standing on the path cuts the thread.", "Hilos de Lumen: cada ciudad de nivel 2 o más unida a la capital por tierra del clan (o puente) rinde +1 ✦ (⟡ en el nombre). Un enemigo en el camino corta el hilo.", "Fils de Lumen : chaque ville de niveau 2 ou plus reliée à la capitale par les terres du clan (ou un pont) rapporte +1 ✦ (⟡ dans le nom). Un ennemi sur le chemin coupe le fil.", "Lumenfäden: Jede Stadt ab Stufe 2, die über Clanland (oder Brücke) mit der Hauptstadt verbunden ist, bringt +1 ✦ (⟡ im Namen). Ein Feind auf dem Weg kappt den Faden.", "Fili di Lumen: ogni città di livello 2 o più collegata alla capitale da terre del clan (o ponte) rende +1 ✦ (⟡ nel nome). Un nemico sul percorso taglia il filo.", "ルーメンの糸：部族の土地（または橋）で首都とつながったレベル2以上の都市は+1 ✦（名前に⟡）。途中に敵がいると糸が切れる。", "流明之线：通过部族土地（或桥）与首都相连、等级 2 以上的城市 +1 ✦（名字旁有 ⟡）。路上有敌人会切断丝线。"], "Guarda de Cristal": ["Crystal Guard", "Guardia de Cristal", "Garde de Cristal", "Kristallwache", "Guardia di Cristallo", "水晶の衛兵", "水晶卫士"], "Habilidades: Investida (ataca de novo após derrotar), Estilhaço (atinge os vizinhos do alvo), Bruma (invisível de longe), Enraizar, Congelar e Queimar.": ["Abilities: Charge (attacks again after a win), Shards (hits the target's neighbors), Mist (invisible from afar), Root, Freeze and Burn.", "Habilidades: Embestida (ataca de nuevo tras derrotar), Esquirlas (golpea a los vecinos del objetivo), Bruma (invisible de lejos), Enraizar, Congelar y Quemar.", "Capacités : Charge (attaque encore après une victoire), Éclats (touche les voisins de la cible), Brume (invisible de loin), Enraciner, Geler et Brûler.", "Fähigkeiten: Ansturm (greift nach einem Sieg erneut an), Splitter (trifft die Nachbarn des Ziels), Nebel (aus der Ferne unsichtbar), Verwurzeln, Einfrieren und Verbrennen.", "Abilità: Carica (attacca di nuovo dopo una vittoria), Schegge (colpisce i vicini del bersaglio), Bruma (invisibile da lontano), Radicare, Congelare e Bruciare.", "能力：突撃（倒すと再攻撃）、破片（標的の隣にも命中）、霧（遠くから見えない）、根縛り、凍結、炎上。", "能力：冲锋（击败后再次攻击）、碎片（波及目标周围）、迷雾（远处不可见）、缠根、冰冻与灼烧。"], "Hostil": ["Hostile", "Hostil", "Hostile", "Feindselig", "Ostile", "敵対的", "敌对"], "Humor dos clãs: no painel Pactos, cada rival mostra o que pensa de você. Um clã hostil recusa tréguas e mira as suas cidades.": ["Clan mood: in the Pacts panel, each rival shows what it thinks of you. A hostile clan refuses truces and targets your cities.", "Humor de los clanes: en el panel Pactos, cada rival muestra lo que piensa de ti. Un clan hostil rechaza treguas y apunta a tus ciudades.", "Humeur des clans : dans le panneau Pactes, chaque rival montre ce qu'il pense de vous. Un clan hostile refuse les trêves et vise vos villes.", "Clanstimmung: Im Pakte-Fenster zeigt jeder Rivale, was er von dir hält. Ein feindseliger Clan lehnt Waffenruhen ab und zielt auf deine Städte.", "Umore dei clan: nel pannello Patti ogni rivale mostra cosa pensa di te. Un clan ostile rifiuta le tregue e punta alle tue città.", "部族の気分：協定画面で各ライバルがあなたをどう思っているか表示。敵対的な部族は休戦を断り、あなたの都市を狙う。", "部族情绪：在盟约面板中，每个对手都会显示对你的看法。敌对部族会拒绝休战并瞄准你的城市。"], "Humor: {m}": ["Mood: {m}", "Humor: {m}", "Humeur : {m}", "Stimmung: {m}", "Umore: {m}", "気分：{m}", "情绪：{m}"], "Infantaria pesada: +1 de defesa no território do clã.": ["Heavy infantry: +1 defense in clan territory.", "Infantería pesada: +1 de defensa en el territorio del clan.", "Infanterie lourde : +1 défense sur le territoire du clan.", "Schwere Infanterie: +1 Verteidigung im Clangebiet.", "Fanteria pesante: +1 difesa nel territorio del clan.", "重歩兵：部族の領土で防御+1。", "重步兵：在部族领土内防御 +1。"], "Investida": ["Charge", "Embestida", "Charge", "Ansturm", "Carica", "突撃", "冲锋"], "Juntar 3 Fragmentos do Mosaico nas ruínas": ["Gather 3 Mosaic Fragments from ruins", "Reunir 3 Fragmentos del Mosaico en las ruinas", "Réunir 3 Fragments de la Mosaïque dans les ruines", "3 Mosaikfragmente in Ruinen sammeln", "Raccogliere 3 Frammenti del Mosaico nelle rovine", "遺跡でモザイクのかけらを3つ集める", "在遗迹中收集 3 块马赛克碎片"], "Juntar 60 ✦ de uma vez": ["Hold 60 ✦ at once", "Juntar 60 ✦ a la vez", "Réunir 60 ✦ d'un coup", "60 ✦ auf einmal besitzen", "Accumulare 60 ✦ in una volta", "一度に60 ✦を貯める", "一次存下 60 ✦"], "Lança fogo a 2 casas com ataque 3 e deixa o alvo queimando (1 de dano por 2 turnos).": ["Throws fire 2 tiles away with attack 3 and leaves the target burning (1 damage for 2 turns).", "Lanza fuego a 2 casillas con ataque 3 y deja el objetivo ardiendo (1 de daño por 2 turnos).", "Lance du feu à 2 cases avec attaque 3 et laisse la cible en feu (1 dégât pendant 2 tours).", "Wirft Feuer 2 Felder weit mit Angriff 3 und lässt das Ziel brennen (1 Schaden für 2 Runden).", "Lancia fuoco a 2 caselle con attacco 3 e lascia il bersaglio in fiamme (1 danno per 2 turni).", "2マス先へ攻撃3の炎を放ち、標的を燃やす（2ターンの間1ダメージ）。", "向 2 格外喷火，攻击 3，并使目标燃烧（2 回合内每回合 1 点伤害）。"], "Lendária": ["Legendary", "Legendaria", "Légendaire", "Legendär", "Leggendaria", "伝説", "传奇"], "Livre": ["Free", "Libre", "Libre", "Frei", "Libera", "フリー", "自由"], "Moldar o terreno: com Lavoura dá para abrir clareiras na floresta; os Brasa fazem queimadas férteis e os Raiz plantam bosques.": ["Shape the land: with Farming you can open clearings in forests; the Ember burn fertile clearings and the Root plant groves.", "Moldear el terreno: con Labranza puedes abrir claros en el bosque; los Brasa hacen quemas fértiles y los Raíz plantan bosques.", "Modeler le terrain : avec l'Agriculture, ouvrez des clairières ; les Braise font des brûlis fertiles et les Racine plantent des bosquets.", "Land formen: Mit Ackerbau schlägst du Lichtungen; die Glut brennen fruchtbare Flächen und die Wurzel pflanzen Haine.", "Modellare il terreno: con l'Agricoltura apri radure nella foresta; i Brace fanno roghi fertili e i Radice piantano boschetti.", "地形を変える：農耕で森を切り開ける。ブラサは肥沃な焼き畑を、ライズは林を植えられる。", "塑造地形：掌握农耕后可在森林开辟空地；余烬族能烧出肥沃土地，根系族能种植树林。"], "Montaria pesada: 16 de vida e ataque 3. O golpe congela: o alvo perde o próximo ataque.": ["Heavy mount: 16 health and attack 3. Its blow freezes: the target loses its next attack.", "Montura pesada: 16 de vida y ataque 3. El golpe congela: el objetivo pierde su próximo ataque.", "Monture lourde : 16 vie et attaque 3. Son coup gèle : la cible perd sa prochaine attaque.", "Schweres Reittier: 16 Leben und Angriff 3. Der Schlag friert ein: Das Ziel verliert seinen nächsten Angriff.", "Cavalcatura pesante: 16 vita e attacco 3. Il colpo congela: il bersaglio perde il prossimo attacco.", "重騎乗：体力16、攻撃3。一撃で凍らせ、標的は次の攻撃を失う。", "重型坐骑：生命 16，攻击 3。一击冰冻：目标失去下一次攻击。"], "Mosaico Completo": ["Complete Mosaic", "Mosaico Completo", "Mosaïque Complète", "Vollständiges Mosaik", "Mosaico Completo", "完成したモザイク", "完整马赛克"], "Na água: +1 de movimento e +2 de visão.": ["On water: +1 movement and +2 vision.", "En el agua: +1 de movimiento y +2 de visión.", "Sur l'eau : +1 déplacement et +2 vision.", "Auf dem Wasser: +1 Bewegung und +2 Sicht.", "In acqua: +1 movimento e +2 visuale.", "水上：移動+1、視界+2。", "水上：移动 +1，视野 +2。"], "Na água: alcance 2.": ["On water: range 2.", "En el agua: alcance 2.", "Sur l'eau : portée 2.", "Auf dem Wasser: Reichweite 2.", "In acqua: gittata 2.", "水上：射程2。", "水上：射程 2。"], "Navio-Farol": ["Lightship", "Barco-Faro", "Bateau-phare", "Leuchtschiff", "Nave-faro", "灯台船", "灯船"], "Neutro": ["Neutral", "Neutral", "Neutre", "Neutral", "Neutrale", "中立", "中立"], "No começo do turno, cura 3 de vida dos aliados vizinhos. Seu golpe enraíza: o alvo não anda no turno seguinte.": ["At the start of the turn, heals 3 health of nearby allies. Its blow roots: the target can't move next turn.", "Al comienzo del turno, cura 3 de vida a los aliados vecinos. Su golpe enraíza: el objetivo no anda el turno siguiente.", "Au début du tour, soigne 3 vie des alliés voisins. Son coup enracine : la cible ne bouge pas au tour suivant.", "Heilt zu Rundenbeginn 3 Leben benachbarter Verbündeter. Sein Schlag verwurzelt: Das Ziel kann in der nächsten Runde nicht ziehen.", "All'inizio del turno cura 3 vita agli alleati vicini. Il suo colpo radica: il bersaglio non si muove nel turno seguente.", "ターン開始時、隣の味方の体力を3回復。一撃で根を張らせ、標的は次のターン動けない。", "回合开始时为相邻友军恢复 3 点生命。一击缠根：目标下回合无法移动。"], "Oficina que lapida os cristais das minas ao redor. Rende +1 ✦ por turno para cada mina vizinha (até 3). Exige Mineração e uma mina ao lado.": ["Workshop that cuts the crystals of nearby mines. Earns +1 ✦ per turn for each neighboring mine (up to 3). Needs Mining and a mine next to it.", "Taller que talla los cristales de las minas cercanas. Rinde +1 ✦ por turno por cada mina vecina (hasta 3). Requiere Minería y una mina al lado.", "Atelier qui taille les cristaux des mines voisines. Rapporte +1 ✦ par tour par mine voisine (jusqu'à 3). Exige Exploitation minière et une mine à côté.", "Werkstatt, die die Kristalle der nahen Minen schleift. Bringt +1 ✦ pro Runde je Nachbarmine (bis 3). Braucht Bergbau und eine Mine daneben.", "Laboratorio che taglia i cristalli delle miniere vicine. Rende +1 ✦ a turno per ogni miniera vicina (fino a 3). Richiede Estrazione e una miniera accanto.", "周りの鉱山の水晶を磨く工房。隣の鉱山1つにつき毎ターン+1 ✦（最大3）。採掘と隣の鉱山が必要。", "打磨周围矿场水晶的工坊。每座相邻矿场每回合 +1 ✦（最多 3）。需要采矿且旁边有矿场。"], "Partida livre encerrada no turno {n}.": ["Free game ended on turn {n}.", "Partida libre terminada en el turno {n}.", "Partie libre terminée au tour {n}.", "Freie Partie in Runde {n} beendet.", "Partita libera terminata al turno {n}.", "フリー対戦はターン{n}で終了。", "自由对局于第 {n} 回合结束。"], "Passar 8 turnos seguidos sem atacar (a partir do turno 12)": ["Go 8 turns in a row without attacking (from turn 12)", "Pasar 8 turnos seguidos sin atacar (desde el turno 12)", "Passer 8 tours d'affilée sans attaquer (dès le tour 12)", "8 Runden in Folge nicht angreifen (ab Runde 12)", "Passare 8 turni di fila senza attaccare (dal turno 12)", "8ターン連続で攻撃しない（ターン12以降）", "连续 8 回合不进攻（第 12 回合起）"], "Pesquisar todas as tecnologias": ["Research every technology", "Investigar todas las tecnologías", "Rechercher toutes les technologies", "Alle Technologien erforschen", "Ricercare tutte le tecnologie", "すべての技術を研究する", "研究全部科技"], "Plantar bosque (floresta com caça)": ["Plant a grove (forest with game)", "Plantar bosque (bosque con caza)", "Planter un bosquet (forêt avec gibier)", "Hain pflanzen (Wald mit Wild)", "Piantare un boschetto (foresta con selvaggina)", "林を植える（獲物のいる森）", "种植树林（有猎物的森林）"], "Porto de Lumen": ["Lumen Port", "Puerto de Lumen", "Port de Lumen", "Lumenhafen", "Porto di Lumen", "ルーメンの港", "流明港口"], "Propor pactos de trégua e treinar a Sombra (invisível, sabota cidades rivais).": ["Propose truce pacts and train the Shade (invisible, sabotages rival cities).", "Proponer pactos de tregua y entrenar la Sombra (invisible, sabotea ciudades rivales).", "Proposer des pactes de trêve et entraîner l'Ombre (invisible, sabote les villes rivales).", "Waffenruhen vorschlagen und den Schatten ausbilden (unsichtbar, sabotiert gegnerische Städte).", "Proporre patti di tregua e addestrare l'Ombra (invisibile, sabota le città rivali).", "休戦協定を提案し、影を訓練（見えず、敵の都市を妨害）。", "提议休战盟约并训练暗影（隐形，破坏敌方城市）。"], "Quartel": ["Barracks", "Cuartel", "Caserne", "Kaserne", "Caserma", "兵舎", "兵营"], "Queima": ["Burns", "Quema", "Brûle", "Verbrennt", "Brucia", "燃やす", "灼烧"], "Queimada fértil (campo com bagas)": ["Fertile burn (field with berries)", "Quema fértil (campo con bayas)", "Brûlis fertile (champ avec baies)", "Fruchtbares Abbrennen (Feld mit Beeren)", "Rogo fertile (campo con bacche)", "肥沃な焼き畑（ベリーのある平地）", "肥沃火耕（有浆果的平原）"], "Ressonância: fazenda, mina e serraria ao lado de outra igual rendem +1 pop por vizinha (até +2). O Ateliê de Cristal rende +1 ✦ por mina vizinha.": ["Resonance: a farm, mine or sawmill next to another of the same kind gives +1 pop per neighbor (up to +2). The Crystal Workshop earns +1 ✦ per nearby mine.", "Resonancia: granja, mina y aserradero junto a otro igual rinden +1 pob por vecino (hasta +2). El Taller de Cristal rinde +1 ✦ por mina vecina.", "Résonance : ferme, mine et scierie à côté d'une autre identique donnent +1 pop par voisine (jusqu'à +2). L'Atelier de Cristal rapporte +1 ✦ par mine voisine.", "Resonanz: Hof, Mine und Sägewerk neben einem gleichen bringen +1 Bev. pro Nachbar (bis +2). Die Kristallwerkstatt bringt +1 ✦ pro Nachbarmine.", "Risonanza: fattoria, miniera e segheria accanto a un'altra uguale danno +1 pop per vicina (fino a +2). Il Laboratorio di Cristallo rende +1 ✦ per miniera vicina.", "共鳴：同じ種類の隣にある農場・鉱山・製材所は隣1つにつき人口+1（最大+2）。水晶工房は隣の鉱山1つにつき+1 ✦。", "共鸣：农场、矿场和锯木厂紧邻同类时，每个相邻同类人口 +1（最多 +2）。水晶工坊每座相邻矿场 +1 ✦。"], "Sabota": ["Sabotages", "Sabotea", "Sabote", "Sabotiert", "Sabota", "妨害", "破坏"], "Sem Fio de Lumen: com nível 2 e terra do clã contínua até a capital (ou ponte), a cidade rende +1 ✦.": ["No Lumen Thread: at level 2 and with unbroken clan land to the capital (or a bridge), the city earns +1 ✦.", "Sin Hilo de Lumen: con nivel 2 y tierra del clan continua hasta la capital (o puente), la ciudad rinde +1 ✦.", "Pas de Fil de Lumen : au niveau 2 et avec des terres du clan continues jusqu'à la capitale (ou un pont), la ville rapporte +1 ✦.", "Kein Lumenfaden: Ab Stufe 2 und mit durchgehendem Clanland bis zur Hauptstadt (oder Brücke) bringt die Stadt +1 ✦.", "Senza Filo di Lumen: al livello 2 e con terre del clan continue fino alla capitale (o ponte), la città rende +1 ✦.", "ルーメンの糸なし：レベル2で、首都まで部族の土地（または橋）が続けば+1 ✦。", "无流明之线：等级 2 且部族土地（或桥）连续通往首都时，城市 +1 ✦。"], "Sem limite de turnos. Encerre pelo Menu quando quiser.": ["No turn limit. End it from the Menu whenever you like.", "Sin límite de turnos. Termina desde el Menú cuando quieras.", "Sans limite de tours. Terminez depuis le Menu quand vous voulez.", "Kein Rundenlimit. Beende sie im Menü, wann du willst.", "Senza limite di turni. Termina dal Menu quando vuoi.", "ターン制限なし。好きなときにメニューから終了。", "没有回合限制。可随时从菜单结束。"], "Seu exército está perto das cidades deles": ["Your army is near their cities", "Tu ejército está cerca de sus ciudades", "Votre armée est près de almost always refuse, and their mood weighs on the answer. The tribute rises with each offer.", "Tregua de {n} turnos. Los clanes por detrás de ti en el marcador casi siempre la rechazan, y su humor pesa en la respuesta. El tributo sube con cada propuesta.", "Trêve de {n} tours. Les clans derrière vous au classement refusent presque toujours, et leur humeur pèse dans la réponse. Le tribut augmente à chaque proposition.", "Waffenruhe für {n} Runden. Clans hinter dir in der Wertung lehnen fast immer ab, und ihre Stimmung zählt bei der Antwort. Der Tribut steigt mit jedem Angebot.", "Tregua di {n} turni. I clan dietro di te in classifica rifiutano quasi sempre, e il loro umore pesa sulla risposta. Il tributo sale a ogni proposta.", "{n}ターンの休戦。点数で後ろにいる部族はほぼ断り、相手の気分も返事に影響する。貢ぎ物は提案のたびに上がる。", "休战 {n} 回合。排名在你之后的部族几乎总会拒绝，他们的情绪也会影响答复。每次提议贡品都会上涨。"], "Tréguas duram 10 turnos, o tributo cai pela metade e você pode treinar o Cantor de Lumen (converte inimigos feridos).": ["Truces last 10 turns, the tribute is halved and you can train the Lumen Singer (converts wounded enemies).", "Las treguas duran 10 turnos, el tributo baja a la mitad y puedes entrenar el Cantor de Lumen (convierte enemigos heridos).", "Les trêves durent 10 tours, le tribut est divisé par deux et vous pouvez entraîner le Chanteur de Lumen (convertit les ennemis blessés).", "Waffenruhen dauern 10 Runden, der Tribut halbiert sich und du kannst den Lumensänger ausbilden (bekehrt verwundete Feinde).", "Le tregue durano 10 turni, il tributo si dimezza e puoi addestrare il Cantore di Lumen (converte i nemici feriti).", "休戦は10ターン続き、貢ぎ物は半分になり、ルーメンの歌い手（負傷した敵を改宗）を訓練できる。", "休战持续 10 回合，贡品减半，并可训练流明歌者（转化受伤的敌人）。"], "Uma Sombra de {c} sabotou {city}: 2 turnos de instabilidade.": ["A Shade of {c} sabotaged {city}: 2 turns of unrest.", "Una Sombra de {c} saboteó {city}: 2 turnos de inestabilidad.", "Une Ombre de {c} a saboté {city} : 2 tours d'instabilité.", "Ein Schatten der {c} hat {city} sabotiert: 2 Runden Unruhe.", "Un'Ombra function newGame(opts){
  const sz=setSize(opts.size),nP=Math.max(2,Math.min(sz.max,opts.nclans||4));

  const others = Object.keys(CLANS).filter(c=>c!==opts.clan&&clanShown(c));
  for(let i=others.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[others[i],others[j]]=[others[j],others[i]];}
  const clans=[opts.clan,...others.slice(0,nP-1)];
  const n1=valueNoise(rand,3),n2=valueNoise(rand,6),m1=valueNoise(rand,4),arch=opts.map==='arquipelago',n3=arch?valueNoise(rand,9):null;
  const elev=[],c=(N-1)/2;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(x-c)/c,dy=(y-c)/c;elev.push(arch?n2(x,y)*.45+n3(x,y)*.55-(dx*dx+dy*dy)*.12:n1(x,y)*.65+n2(x,y)*.35-(dx*dx+dy*dy)*.32);}

    const e=elev[I(x,y)];let t;

    t.t=DIRS.some(([dx,dy])=>land(x+dx,y+dy))?'raso':'oceano';}
  const resFor=t=>t==='campo'?'frutas':t==='floresta'?'caca':t==='raso'?'peixe':t==='montanha'?'minerio':t==='oceano'?'baleia':null;
  const resP={campo:.2,floresta:.32,raso:.22,montanha:.4,oceano:0};
  tiles.forEach(t=>{if(rand()<resP[t.t])t.res=resFor(t.t);});

  const cand=[];for(let y=2;y<N-2;y++)for(let x=2;x<N-2;x++){const t=tiles[I(x,y)];if(t.t==='campo'||t.t==='floresta')cand.push([x,y]);}
