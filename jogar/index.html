lkenfeder","La Piuma del Falco","鷹の羽根","鹰之羽"],"A Rosa dos Ventos":["The Compass Rose","La Rosa de los Vientos","La Rose des Vents","Die Windrose","La Rosa dei Venti","風配図","风向玫瑰"],"Os ventos mudaram depois da Quebra. Em certas noites, todas as correntes apontavam para o mesmo ponto vazio.":["The winds changed after the Shattering. On certain nights, every current pointed to the same empty spot.","Los vientos cambiaron después de la Ruptura. Ciertas noches, todas las corrientes apuntaban al mismo punto vacío.","Les vents changèrent après la Fracture. Certaines nuits, tous les courants pointaient vers le même point vide.","Nach dem Bruch änderten sich die Winde. In manchen Nächten zeigte jede Strömung auf denselben leeren Ort.","Dopo la Frattura i venti cambiarono. In certe notti ogni corrente puntava verso lo stesso luogo vuoto.","崩壊のあと、風向きが変わった。ある夜には、すべての風が同じ空っぽの場所を指していた。","碎裂之后，风变了。在某些夜晚，所有气流都指向同一个空无一物的地方。"],"O Sino da Torre":["The Bell of the Tower","La Campana de la Torre","La Cloche de la Tour","Die Glocke des Turms","La Campana della Torre","塔の鐘","塔之钟"],"No alto da Torre dos Ventos, um sino tocou sem ser movido. Seu som era igual ao assobio que precedera a Grande Quebra.":["At the top of the Tower of Winds, a bell rang without being touched. Its sound was the same as the whistle that came before the Great Shattering.","En lo alto de la Torre de los Vientos, una campana sonó sin que nadie la moviera. Su sonido era igual al silbido que precedió a la Gran Ruptura.","Au sommet de la Tour des Vents, une cloche sonna sans qu'on la touche. Son timbre était le même que le sifflement qui avait précédé la Grande Fracture.","Auf der Spitze des Turms der Winde läutete eine Glocke, ohne berührt zu werden. Ihr Klang glich dem Pfeifen, das dem Großen Bruch vorausging.","In cima alla Torre dei Venti, una campana suonò senza che nessuno la toccasse. Il suo suono era uguale al fischio che precedette la Grande Frattura.","風の塔の頂で、誰も触れていない鐘が鳴った。その音は、大崩壊の前に聞こえた口笛と同じだった。","风之塔顶端，一口钟在无人触碰时响起。它的声音与大碎裂之前的哨声一模一样。"],"O Berço de Musgo":["The Moss Cradle","La Cuna de Musgo","Le Berceau de Mousse","Die Mooswiege","La Culla di Muschio","苔のゆりかご","苔藓摇篮"],"A Presa do Primeiro Lobo":["The Fang of the First Wolf","El Colmillo del Primer Lobo","Le Croc du Premier Loup","Der Zahn des Ersten Wolfs","La Zanna del Primo Lupo","最初の狼の牙","头狼之牙"],"O primeiro inverno ensinou uma regra simples: sozinho, ninguém sobreviveria. A matilha tornou-se família.":["The first winter taught a simple rule: alone, no one would survive. The pack became family.","El primer invierno enseñó una regla sencilla: solo, nadie sobreviviría. La manada se convirtió en familia.","Le premier hiver enseigna une règle simple : seul, personne ne survivrait. La meute devint une famille.","Der erste Winter lehrte eine einfache Regel: Allein würde niemand überleben. Das Rudel wurde zur Familie.","Il primo inverno insegnò una regola semplice: da soli, nessuno sarebbe sopravvissuto. Il branco divenne famiglia.","最初の冬はひとつの単純な掟を教えた。ひとりでは誰も生き延びられない。群れは家族になった。","第一个冬天教会了他们一条简单的法则：独自一人，谁都活不下去。狼群成了家人。"],"O Chamado da Floresta":["The Call of the Forest","La Llamada del Bosque","L'Appel de la Forêt","Der Ruf des Waldes","Il Richiamo della Foresta","森の呼び声","森林的呼唤"],"Os Fera aprenderam a reconhecer o medo dos animais, a força das árvores e os sinais que antecedem o perigo.":["The Beast learned to recognize the fear of animals, the strength of trees and the signs that come before danger.","Los Fiera aprendieron a reconocer el miedo de los animales, la fuerza de los árboles y las señales que anuncian el peligro.","Les Fauve apprirent à reconnaître la peur des animaux, la force des arbres et les signes qui annoncent le danger.","Die Bestie lernte, die Angst der Tiere, die Kraft der Bäume und die Zeichen zu erkennen, die einer Gefahr vorausgehen.","I Fiera impararono a riconoscere la paura degli animali, la forza degli alberi e i segni che precedono il pericolo.","獣の民は、動物の恐れ、木々の強さ、そして危険の前ぶれを見分けることを学んだ。","野兽族学会了辨认动物的恐惧、树木的力量，以及危险来临前的征兆。"],"A Marca da Matilha":["The Mark of the Pack","La Marca de la Manada","La Marque de la Meute","Das Zeichen des Rudels","Il Segno del Branco","群れの印","狼群之印"],"O Uivo do Vazio":["The Howl of the Void","El Aullido del Vacío","Le Hurlement du Vide","Das Heulen der Leere","L'Ululato del Vuoto","虚空の遠吠え","虚空之嚎"],"Em noites sem estrelas, os lobos uivam para fora dos ladrilhos. Algo responde de muito longe. Não parece um eco.":["On starless nights, the wolves howl out beyond the tiles. Something answers from very far away. It does not sound like an echo.","En noches sin estrellas, los lobos aúllan hacia fuera de las baldosas. Algo responde desde muy lejos. No parece un eco.","Les nuits sans étoiles, les loups hurlent au-delà des tuiles. Quelque chose répond de très loin. Cela ne ressemble pas à un écho.","In sternlosen Nächten heulen die Wölfe hinaus über die Kacheln. Etwas antwortet aus weiter Ferne. Es klingt nicht wie ein Echo.","Nelle notti senza stelle, i lupi ululano oltre le tessere. Qualcosa risponde da molto lontano. Non sembra un'eco.","星のない夜、狼たちはタイルの外へ向かって遠吠えする。はるか遠くから何かが応える。こだまのようには聞こえない。","在无星之夜，狼群向地块之外嚎叫。远方有什么在回应。那听起来不像回声。"],"O Primeiro Cristal":["The First Crystal","El Primer Cristal","Le Premier Cristal","Der Erste Kristall","Il Primo Cristallo","最初の水晶","第一块水晶"],"Nos cânions, os monges descobriram que a luz podia ganhar forma. O primeiro cristal de Lumen permaneceu sólido mesmo depois de a chama se extinguir.":["In the canyons, the monks discovered that light could take shape. The first Lumen crystal stayed solid even after the flame went out.","En los cañones, los monjes descubrieron que la luz podía tomar forma. El primer cristal de Lumen permaneció sólido incluso después de apagarse la llama.","Dans les canyons, les moines découvrirent que la lumière pouvait prendre forme. Le premier cristal de Lumen resta solide même après l'extinction de la flamme.","In den Schluchten entdeckten die Mönche, dass Licht Gestalt annehmen kann. Der erste Lumenkristall blieb fest, selbst als die Flamme erlosch.","Nei canyon, i monaci scoprirono che la luce poteva prendere forma. Il primo cristallo di Lumen restò solido anche dopo che la fiamma si spense.","峡谷で、僧たちは光が形を持ちうることを発見した。最初のルーメン水晶は、炎が消えたあとも固いままだった。","在峡谷中，僧侣们发现光可以拥有形状。第一块流明水晶在火焰熄灭后依然坚固。"],"O Manuscrito das Pontes":["The Manuscript of Bridges","El Manuscrito de los Puentes","Le Manuscrit des Ponts","Das Manuskript der Brücken","Il Manoscritto dei Ponti","橋の写本","桥之手稿"],"A Espada do Monge":["The Monk's Sword","La Espada del Monje","L'Épée du Moine","Das Schwert des Mönchs","La Spada del Monaco","僧の剣","僧侣之剑"],"Construir uma ponte não garantia que o outro lado viesse em paz. Os Lume aprenderam a proteger os caminhos que abriam.":["Building a bridge did not guarantee that the other side would come in peace. The Glow learned to protect the paths they opened.","Construir un puente no garantizaba que el otro lado viniera en paz. Los Lumbre aprendieron a proteger los caminos que abrían.","Construire un pont ne garantissait pas que l'autre rive viendrait en paix. Les Lueur apprirent à protéger les chemins qu'ils ouvraient.","Eine Brücke zu bauen garantierte nicht, dass die andere Seite in Frieden kam. Der Schein lernte, die Wege zu schützen, die er öffnete.","Costruire un ponte non garantiva che dall'altra parte si arrivasse in pace. I Lume impararono a proteggere i sentieri che aprivano.","橋を架けても、向こう岸から来る者が平和を望むとは限らなかった。灯の民は、自ら開いた道を守ることを学んだ。","架起一座桥，并不能保证对岸的人会和平而来。微光族学会了守护自己开辟的道路。"],"O Espelho de Cristal":["The Crystal Mirror","El Espejo de Cristal","Le Miroir de Cristal","Der Kristallspiegel","Lo Specchio di Cristallo","水晶の鏡","水晶之镜"],"Um cristal antigo mostrou imagens da Grande Quebra. Os monges reconheceram lugares desaparecidos, mas não conseguiram descobrir a causa.":["An ancient crystal showed images of the Great Shattering. The monks recognized places that had vanished, but could not discover the cause.","Un cristal antiguo mostró imágenes de la Gran Ruptura. Los monjes reconocieron lugares desaparecidos, pero no lograron descubrir la causa.","Un cristal ancien montra des images de la Grande Fracture. Les moines reconnurent des lieux disparus, mais ne purent en découvrir la cause.","Ein uralter Kristall zeigte Bilder des Großen Bruchs. Die Mönche erkannten verschwundene Orte, konnten aber die Ursache nicht ergründen.","Un antico cristallo mostrò immagini della Grande Frattura. I monaci riconobbero luoghi scomparsi, ma non riuscirono a scoprirne la causa.","古い水晶が大崩壊の光景を映し出した。僧たちは消えた場所を見分けたが、原因はわからなかった。","一块古老的水晶映出了大碎裂的景象。僧侣们认出了那些消失的地方，却找不到原因。"],"A Memória Impossível":["The Impossible Memory","La Memoria Imposible","La Mémoire Impossible","Die Unmögliche Erinnerung","La Memoria Impossibile","ありえない記憶","不可能的记忆"],"erga uma Ponte de Lumen":["raise a Lumen Bridge","levanta un Puente de Lumen","élevez un Pont de Lumen","errichte eine Lumenbrücke","innalza un Ponte di Lumen","ルーメンの橋を架ける","架起一座流明桥"],"O Núcleo de 2053":["The Core of 2053","El Núcleo de 2053","Le Noyau de 2053","Der Kern von 2053","Il Nucleo del 2053","2053年のコア","2053年的核心"],"No ano de 2053, os Autômatos travavam uma guerra contra os Astros. Seus cálculos indicavam uma derrota iminente.":["In the year 2053, the Automatons were waging a war against the Astrals. Their calculations pointed to an imminent defeat.","En el año 2053, los Autómatas libraban una guerra contra los Astros. Sus cálculos indicaban una derrota inminente.","En l'an 2053, les Automates menaient une guerre contre les Astres. Leurs calculs annonçaient une défaite imminente.","Im Jahr 2053 führten die Automaten Krieg gegen die Astralen. Ihre Berechnungen sagten eine baldige Niederlage voraus.","Nell'anno 2053, gli Automi combattevano una guerra contro gli Astri. I loro calcoli indicavano una sconfitta imminente.","2053年、オートマトンはアストロとの戦争のさなかにあった。計算は、敗北が目前であることを示していた。","2053年，自动机正与星族交战。它们的计算显示，失败近在眼前。"],"A Ordem de Retirada":["The Retreat Order","La Orden de Retirada","L'Ordre de Retraite","Der Rückzugsbefehl","L'Ordine di Ritirata","撤退命令","撤退指令"],"Com suas posições destruídas, os comandantes decidiram abandonar o campo de batalha — e o próprio tempo.":["With their positions destroyed, the commanders decided to abandon the battlefield, and time itself.","Con sus posiciones destruidas, los comandantes decidieron abandonar el campo de batalla y el propio tiempo.","Leurs positions détruites, les commandants décidèrent d'abandonner le champ de bataille, et le temps lui-même.","Als ihre Stellungen zerstört waren, beschlossen die Befehlshaber, das Schlachtfeld zu verlassen, und die Zeit selbst.","Con le loro postazioni distrutte, i comandanti decisero di abbandonare il campo di battaglia, e il tempo stesso.","拠点を破壊された司令官たちは、戦場を、そして時そのものを捨てる決断をした。","阵地被摧毁后，指挥官们决定放弃战场，也放弃时间本身。"],"O Projeto Retorno":["Project Return","El Proyecto Retorno","Le Projet Retour","Projekt Rückkehr","Progetto Ritorno","帰還計画","归来计划"],"O Arquivo Corrompido":["The Corrupted File","El Archivo Corrupto","Le Fichier Corrompu","Die Beschädigte Datei","Il File Corrotto","破損したファイル","损坏的文件"],"Os registros apontavam para uma fonte de energia chamada Lumen. As páginas sobre sua origem estavam danificadas.":["The records pointed to an energy source called Lumen. The pages about its origin were damaged.","Los registros apuntaban a una fuente de energía llamada Lumen. Las páginas sobre su origen estaban dañadas.","Les registres désignaient une source d'énergie appelée Lumen. Les pages sur son origine étaient endommagées.","Die Aufzeichnungen verwiesen auf eine Energiequelle namens Lumen. Die Seiten über ihren Ursprung waren beschädigt.","I registri indicavano una fonte di energia chiamata Lumen. Le pagine sulla sua origine erano danneggiate.","記録はルーメンと呼ばれるエネルギー源を示していた。その起源に関するページは破損していた。","记录指向一种名为流明的能源。关于其起源的页面已经损坏。"],"A Última Instrução":["The Last Instruction","La Última Instrucción","La Dernière Instruction","Die Letzte Anweisung","L'Ultima Istruzione","最後の命令","最后的指令"],"Uma instrução incompleta permaneceu no núcleo: ‘Se o mundo for reunido, o caminho será...’. O restante havia sido apagado.":["An incomplete instruction remained in the core: ‘If the world is reunited, the way will be...’. The rest had been erased.","Una instrucción incompleta permaneció en el núcleo: ‘Si el mundo es reunido, el camino será...’. El resto había sido borrado.","Une instruction incomplète resta dans le noyau : ‘Si le monde est réuni, le chemin sera...’. Le reste avait été effacé.","Im Kern blieb eine unvollständige Anweisung zurück: ‚Wenn die Welt wiedervereint ist, wird der Weg …‘. Der Rest war gelöscht.","Nel nucleo restò un'istruzione incompleta: ‘Se il mondo sarà riunito, la via sarà...’. Il resto era stato cancellato.","コアには不完全な命令が残されていた。「世界がふたたびひとつになれば、道は……」。残りは消去されていた。","核心中残留着一条不完整的指令：“若世界重新合一，道路将会……”其余部分已被抹去。"],"O Sinal Interceptado":["The Intercepted Signal","La Señal Interceptada","Le Signal Intercepté","Das Abgefangene Signal","Il Segnale Intercettato","傍受された信号","截获的信号"],"O Diário da Nave":["The Ship's Log","El Diario de la Nave","Le Journal du Vaisseau","Das Logbuch des Schiffs","Il Diario di Bordo","艦の航海日誌","飞船日志"],"Uma nave atravessou o portal temporal em perseguição aos robôs. A missão era impedir que conquistassem o passado.":["A ship crossed the time portal in pursuit of the robots. The mission was to stop them from conquering the past.","Una nave atravesó el portal temporal persiguiendo a los robots. La misión era impedir que conquistaran el pasado.","Un vaisseau traversa le portail temporel à la poursuite des robots. La mission était de les empêcher de conquérir le passé.","Ein Schiff durchquerte das Zeitportal, um die Roboter zu verfolgen. Die Mission: verhindern, dass sie die Vergangenheit eroberten.","Una nave attraversò il portale temporale all'inseguimento dei robot. La missione era impedire che conquistassero il passato.","一隻の艦がロボットを追って時の門をくぐった。任務は、彼らが過去を征服するのを阻むことだった。","一艘飞船穿过时间之门追击机器人。任务是阻止它们征服过去。"],"O Detector de Lumen":["The Lumen Detector","El Detector de Lumen","Le Détecteur de Lumen","Der Lumendetektor","Il Rilevatore di Lumen","ルーメン探知機","流明探测器"],"Os instrumentos encontraram uma energia desconhecida nas cidades do mundo fragmentado. Ela não se comportava como nenhuma fonte catalogada.":["The instruments found an unknown energy in the cities of the fragmented world. It behaved like no catalogued source.","Los instrumentos encontraron una energía desconocida en las ciudades del mundo fragmentado. No se comportaba como ninguna fuente catalogada.","Les instruments trouvèrent une énergie inconnue dans les cités du monde fragmenté. Elle ne se comportait comme aucune source répertoriée.","Die Instrumente fanden in den Städten der zersplitterten Welt eine unbekannte Energie. Sie verhielt sich wie keine erfasste Quelle.","Gli strumenti trovarono un'energia sconosciuta nelle città del mondo frammentato. Non si comportava come nessuna fonte catalogata.","計器は、分かれた世界の都市に未知のエネルギーを検出した。それは記録にあるどの源とも違うふるまいをした。","仪器在碎裂世界的城市中发现了一种未知能量。它的表现与任何已知能源都不同。"],"O Mapa Estelar":["The Star Map","El Mapa Estelar","La Carte Stellaire","Die Sternenkarte","La Mappa Stellare","星図","星图"],"A Mensagem do Comando":["The Message from Command","El Mensaje del Mando","Le Message du Commandement","Die Nachricht des Kommandos","Il Messaggio del Comando","司令部からのメッセージ","指挥部的讯息"],"A nave recebeu uma mensagem tardia: ‘Não permitam a convergência sem compreender o que será aberto’. Nenhuma explicação acompanhava o aviso.":["The ship received a late message: ‘Do not allow the convergence without understanding what will be opened’. No explanation came with the warning.","La nave recibió un mensaje tardío: ‘No permitan la convergencia sin comprender lo que se abrirá’. Ninguna explicación acompañaba la advertencia.","Le vaisseau reçut un message tardif : ‘Ne permettez pas la convergence sans comprendre ce qui sera ouvert’. Aucune explication n'accompagnait l'avertissement.","Das Schiff empfing eine verspätete Nachricht: ‚Lasst die Konvergenz nicht zu, ohne zu verstehen, was geöffnet wird.‘ Eine Erklärung kam mit der Warnung nicht.","La nave ricevette un messaggio in ritardo: ‘Non permettete la convergenza senza capire cosa verrà aperto’. Nessuna spiegazione accompagnava l'avvertimento.","艦は遅れて届いたメッセージを受信した。「何が開かれるのかを理解せずに、収束を許すな」。警告には説明がなかった。","飞船收到一条迟来的讯息：“在弄清将会开启什么之前，不要让汇聚发生。”警告没有附带任何解释。"],"A Última Lembrança":["The Last Memory","El Último Recuerdo","Le Dernier Souvenir","Die Letzte Erinnerung","L'Ultimo Ricordo","最後の記憶","最后的记忆"],"Houve um clarão. Depois, nenhum chão, nenhum céu, nenhum corpo. Apenas a sensação de estar entre dois lugares.":["There was a flash. Then no ground, no sky, no body. Only the feeling of being between two places.","Hubo un destello. Después, ni suelo, ni cielo, ni cuerpo. Solo la sensación de estar entre dos lugares.","Il y eut un éclair. Puis plus de sol, plus de ciel, plus de corps. Seulement la sensation d'être entre deux lieux.","Da war ein Lichtblitz. Dann kein Boden, kein Himmel, kein Körper. Nur das Gefühl, zwischen zwei Orten zu sein.","Ci fu un lampo. Poi niente terra, niente cielo, niente corpo. Solo la sensazione di trovarsi tra due luoghi.","閃光があった。そのあとは大地も空も体もなかった。ふたつの場所のあいだにいるという感覚だけがあった。","一道闪光。然后，没有大地，没有天空，没有身体。只有身处两地之间的感觉。"],"O Véu Entre Mundos":["The Veil Between Worlds","El Velo Entre Mundos","Le Voile Entre les Mondes","Der Schleier zwischen den Welten","Il Velo tra i Mondi","世界のあいだのヴェール","世界之间的帷幕"],"O Nome Esquecido":["The Forgotten Name","El Nombre Olvidado","Le Nom Oublié","Der Vergessene Name","Il Nome Dimenticato","忘れられた名","被遗忘的名字"],"Com o tempo, muitos perderam o próprio nome. Passaram a guardar lembranças uns dos outros para não desaparecer por completo.":["Over time, many lost their own names. They began to keep memories of one another so as not to disappear completely.","Con el tiempo, muchos perdieron su propio nombre. Empezaron a guardar recuerdos unos de otros para no desaparecer por completo.","Avec le temps, beaucoup perdirent leur propre nom. Ils se mirent à garder les souvenirs les uns des autres pour ne pas disparaître complètement.","Mit der Zeit verloren viele ihren eigenen Namen. Sie begannen, Erinnerungen aneinander zu bewahren, um nicht ganz zu verschwinden.","Col tempo, molti persero il proprio nome. Cominciarono a custodire ricordi gli uni degli altri per non scomparire del tutto.","時が経つにつれ、多くの者が自分の名を失った。完全に消えてしまわないよう、彼らは互いの記憶を守るようになった。","随着时间流逝，许多人失去了自己的名字。他们开始彼此保存记忆，以免彻底消失。"],"O Eco da Quebra":["The Echo of the Shattering","El Eco de la Ruptura","L'Écho de la Fracture","Das Echo des Bruchs","L'Eco della Frattura","崩壊のこだま","碎裂的回响"],"Alguns recordavam um grito. Outros, uma luz. Outros, um silêncio absoluto. As memórias não concordavam.":["Some remembered a scream. Others, a light. Others, absolute silence. The memories did not agree.","Algunos recordaban un grito. Otros, una luz. Otros, un silencio absoluto. Las memorias no coincidían.","Certains se souvenaient d'un cri. D'autres, d'une lumière. D'autres, d'un silence absolu. Les mémoires ne concordaient pas.","Manche erinnerten sich an einen Schrei. Andere an ein Licht. Wieder andere an völlige Stille. Die Erinnerungen stimmten nicht überein.","Alcuni ricordavano un grido. Altri, una luce. Altri ancora, un silenzio assoluto. Le memorie non concordavano.","ある者は叫びを覚えていた。ある者は光を。ある者は完全な静寂を。記憶は食い違っていた。","有人记得一声尖叫。有人记得一道光。还有人记得一片绝对的寂静。这些记忆彼此不一。"],"O Reflexo Perdido":["The Lost Reflection","El Reflejo Perdido","Le Reflet Perdu","Das Verlorene Spiegelbild","Il Riflesso Perduto","失われた映し身","失落的倒影"],"ataque com {u}":["attack with {u}","ataca con {u}","attaquez avec {u}","greife mit {u} an","attacca con {u}","{u}で攻撃する","使用{u}发动攻击"],"A Pena de Pedra":["The Stone Feather","La Pluma de Piedra","La Plume de Pierre","Die Steinfeder","La Piuma di Pietra","石の羽根","石之羽"],"Quando o céu se rompeu, seres angelicais caíram com os estilhaços. Ao tocar a terra, tornaram-se pedra.":["When the sky broke apart, angelic beings fell with the shards. When they touched the ground, they turned to stone.","Cuando el cielo se rompió, seres angelicales cayeron con los fragmentos. Al tocar la tierra, se convirtieron en piedra.","Quand le ciel se brisa, des êtres angéliques tombèrent avec les éclats. En touchant la terre, ils devinrent pierre.","Als der Himmel zerbrach, fielen engelhafte Wesen mit den Splittern herab. Als sie den Boden berührten, wurden sie zu Stein.","Quando il cielo si spezzò, esseri angelici caddero insieme alle schegge. Toccando il suolo, si trasformarono in pietra.","空が砕けたとき、天使のような存在が破片とともに落ちてきた。地に触れると、彼らは石になった。","天空碎裂时，天使般的存在随碎片一同坠落。触及地面时，他们化作了石头。"],"A Ordem Esquecida":["The Forgotten Order","La Orden Olvidada","L'Ordre Oublié","Der Vergessene Befehl","L'Ordine Dimenticato","忘れられた命","被遗忘的命令"],"Entre os fragmentos de memória, restou a certeza de uma ordem: proteger algo. Mas o quê?":["Among the fragments of memory, one certainty remained: an order to protect something. But what?","Entre los fragmentos de memoria quedó la certeza de una orden: proteger algo. Pero ¿qué?","Parmi les fragments de mémoire, il resta la certitude d'un ordre : protéger quelque chose. Mais quoi ?","Unter den Bruchstücken der Erinnerung blieb eine Gewissheit: ein Befehl, etwas zu beschützen. Aber was?","Tra i frammenti di memoria restò una certezza: l'ordine di proteggere qualcosa. Ma cosa?","記憶の欠片のなかに、ひとつだけ確かなことが残っていた。何かを守れという命令。だが、何を？","在记忆的碎片中，只剩一个确定的事实：一道守护某物的命令。但守护的是什么？"],"O Fragmento Celestial":["The Celestial Fragment","El Fragmento Celestial","Le Fragment Céleste","Das Himmlische Fragment","Il Frammento Celeste","天の欠片","天界碎片"],"O Primeiro Despertar":["The First Awakening","El Primer Despertar","Le Premier Éveil","Das Erste Erwachen","Il Primo Risveglio","最初の目覚め","第一次苏醒"],"Os Lumens fizeram a pedra vibrar. Os Colossos abriram os olhos e viram um mundo que já não reconheciam.":["The Lumens made the stone tremble. The Colossi opened their eyes and saw a world they no longer recognized.","Los Lumens hicieron vibrar la piedra. Los Colosos abrieron los ojos y vieron un mundo que ya no reconocían.","Les Lumens firent vibrer la pierre. Les Colosses ouvrirent les yeux et virent un monde qu'ils ne reconnaissaient plus.","Die Lumen ließen den Stein erzittern. Die Kolosse öffneten die Augen und sahen eine Welt, die sie nicht mehr wiedererkannten.","I Lumen fecero tremare la pietra. I Colossi aprirono gli occhi e videro un mondo che non riconoscevano più.","ルーメンが石を震わせた。巨像たちは目を開き、もう見覚えのない世界を目にした。","流明让石头颤动。巨像睁开双眼，看到了一个他们已不再认识的世界。"],"O Degrau do Céu":["The Step to Heaven","El Peldaño del Cielo","La Marche du Ciel","Die Stufe zum Himmel","Il Gradino verso il Cielo","天への階段","通天之阶"],"Os Colossos acreditam que, quando o mundo estiver reunido, poderão construir uma escada para casa. Mas não sabem o que os espera acima.":["The Colossi believe that, when the world is reunited, they will be able to build a stairway home. But they do not know what awaits them above.","Los Colosos creen que, cuando el mundo esté reunido, podrán construir una escalera de vuelta a casa. Pero no saben qué les espera arriba.","Les Colosses croient que, lorsque le monde sera réuni, ils pourront construire un escalier pour rentrer chez eux. Mais ils ne savent pas ce qui les attend là-haut.","Die Kolosse glauben, dass sie eine Treppe nach Hause bauen können, sobald die Welt wiedervereint ist. Doch sie wissen nicht, was sie oben erwartet.","I Colossi credono che, quando il mondo sarà riunito, potranno costruire una scala per tornare a casa. Ma non sanno cosa li attende lassù.","巨像たちは、世界がひとつになれば故郷へ帰る階段を築けると信じている。だが、その上で何が待つのかは知らない。","巨像相信，当世界重新合一，他们就能建起回家的阶梯。但他们不知道上面等待着什么。"],"Quando os continentes se partiram, Ígnea não se apagou. Em um único ladrilho, a montanha permaneceu viva. Ao redor dela, os sobreviventes descobriram que ainda existia calor em um mundo despedaçado.":["When the continents broke apart, Ignea did not go out. On a single tile, the mountain stayed alive. Around it, the survivors discovered there was still warmth in a shattered world.","Cuando los continentes se partieron, Ígnea no se apagó. En una sola baldosa, la montaña siguió viva. A su alrededor, los supervivientes descubrieron que aún había calor en un mundo hecho pedazos.","Quand les continents se brisèrent, Ignéa ne s'éteignit pas. Sur une seule tuile, la montagne resta vivante. Autour d'elle, les survivants découvrirent qu'il restait de la chaleur dans un monde en morceaux.","Als die Kontinente zerbrachen, erlosch Ignea nicht. Auf einer einzigen Kachel blieb der Berg lebendig. Um ihn herum entdeckten die Überlebenden, dass es in einer zerbrochenen Welt noch Wärme gab.","Quando i continenti si spezzarono, Ignea non si spense. Su una sola tessera, la montagna restò viva. Attorno a essa, i sopravvissuti scoprirono che in un mondo infranto c'era ancora calore.","大陸が砕けたとき、イグネアは消えなかった。たったひとつのタイルの上で、山は生き続けた。そのまわりで生存者たちは、砕けた世界にもまだぬくもりがあることを知った。","大陆碎裂时，伊格尼亚没有熄灭。在唯一的一块地块上，火山依然活着。幸存者在它周围发现，破碎的世界里仍有温暖。"],"Nas profundezas de Ígnea, os ferreiros encontraram uma pedra negra. Nenhum fogo conseguiu aquecê-la. Os anciãos disseram que ela caíra antes da Quebra, mas ninguém soube explicar de onde.":["In the depths of Ignea, the smiths found a black stone. No fire could warm it. The elders said it had fallen before the Shattering, but no one could explain from where.","En las profundidades de Ígnea, los herreros encontraron una piedra negra. Ningún fuego logró calentarla. Los ancianos dijeron que había caído antes de la Ruptura, pero nadie supo explicar de dónde.","Dans les profondeurs d'Ignéa, les forgerons trouvèrent une pierre noire. Aucun feu ne parvint à la réchauffer. Les anciens dirent qu'elle était tombée avant la Fracture, mais personne ne sut dire d'où.","In den Tiefen von Ignea fanden die Schmiede einen schwarzen Stein. Kein Feuer konnte ihn erwärmen. Die Alten sagten, er sei vor dem Bruch herabgefallen, doch niemand konnte erklären, woher.","Nelle profondità di Ignea, i fabbri trovarono una pietra nera. Nessun fuoco riusciva a scaldarla. Gli anziani dicevano che fosse caduta prima della Frattura, ma nessuno sapeva spiegare da dove.","イグネアの奥深くで、鍛冶師たちは黒い石を見つけた。どんな火もそれを温められなかった。長老たちは、崩壊の前に落ちてきたものだと言ったが、どこから来たのかは誰にも説明できなかった。","在伊格尼亚深处，铁匠们发现了一块黑色的石头。没有任何火焰能让它变暖。长老们说它在碎裂之前就已坠落，却没人能说清它从何而来。"],"Peixes luminosos surgiram nas noites mais escuras. Segui-los significava encontrar alimento, abrigo e uma rota quando nenhum mapa ainda fazia sentido.":["Glowing fish appeared on the darkest nights. Following them meant finding food, shelter and a route when no map made sense yet.","Peces luminosos aparecieron en las noches más oscuras. Seguirlos significaba encontrar alimento, refugio y una ruta cuando ningún mapa tenía sentido todavía.","Des poissons lumineux apparurent pendant les nuits les plus sombres. Les suivre, c'était trouver nourriture, abri et une route quand aucune carte n'avait encore de sens.","In den dunkelsten Nächten erschienen leuchtende Fische. Ihnen zu folgen hieß Nahrung, Schutz und einen Weg zu finden, als noch keine Karte Sinn ergab.","Pesci luminosi apparvero nelle notti più buie. Seguirli significava trovare cibo, riparo e una rotta quando nessuna mappa aveva ancora senso.","最も暗い夜に、光る魚が現れた。それを追えば、地図がまだ役に立たない頃でも、食べ物と隠れ家と航路が見つかった。","在最黑暗的夜晚，发光的鱼出现了。跟随它们，就能在地图尚无意义时找到食物、庇护所和航线。"],"A lente do Grande Farol reuniu as luzes dos peixes-lanterna em uma única direção. O recife perdido talvez não tivesse desaparecido. Talvez estivesse esperando além do mapa.":["The lens of the Great Lighthouse gathered the lights of the lanternfish into a single direction. Perhaps the lost reef had not vanished. Perhaps it was waiting beyond the map.","La lente del Gran Faro reunió las luces de los peces linterna en una sola dirección. Quizá el arrecife perdido no hubiera desaparecido. Quizá estuviera esperando más allá del mapa.","La lentille du Grand Phare rassembla les lumières des poissons-lanternes en une seule direction. Le récif perdu n'avait peut-être pas disparu. Peut-être attendait-il au-delà de la carte.","Die Linse des Großen Leuchtturms bündelte die Lichter der Laternenfische in eine einzige Richtung. Vielleicht war das verlorene Riff nicht verschwunden. Vielleicht wartete es jenseits der Karte.","La lente del Grande Faro raccolse le luci dei pesci-lanterna in un'unica direzione. Forse la barriera perduta non era scomparsa. Forse attendeva oltre la mappa.","大灯台のレンズは、ランタンフィッシュの光をひとつの方向へ集めた。失われた珊瑚礁は消えたのではないのかもしれない。地図の向こうで待っているのかもしれない。","大灯塔之镜将灯笼鱼的光汇聚到同一个方向。也许失落的珊瑚礁并没有消失。也许它正在地图之外等待。"],"cure um aliado ferido com o Druida":["heal a wounded ally with the Druid","cura a un aliado herido con el Druida","soignez un allié blessé avec le Druide","heile mit dem Druiden einen verwundeten Verbündeten","cura un alleato ferito con il Druido","ドルイドで傷ついた味方を回復する","用德鲁伊治疗一名受伤的盟友"],"O primeiro Druida descobriu que proteger uma vida podia salvar uma aldeia inteira. Seus ensinamentos fizeram da cura uma forma de resistência.":["The first Druid discovered that protecting one life could save an entire village. Their teachings made healing a form of resistance.","El primer Druida descubrió que proteger una vida podía salvar una aldea entera. Sus enseñanzas hicieron de la curación una forma de resistencia.","Le premier Druide découvrit que protéger une vie pouvait sauver un village entier. Ses enseignements firent de la guérison une forme de résistance.","Der erste Druide entdeckte, dass der Schutz eines einzigen Lebens ein ganzes Dorf retten konnte. Seine Lehren machten das Heilen zu einer Form des Widerstands.","Il primo Druido scoprì che proteggere una vita poteva salvare un intero villaggio. I suoi insegnamenti fecero della cura una forma di resistenza.","最初のドルイドは、ひとつの命を守ることが村全体を救いうると知った。その教えによって、癒やしは抵抗のかたちになった。","第一位德鲁伊发现，守护一条生命就能拯救整个村庄。其教诲让治愈成为一种抵抗。"],"Quando os territórios quentes se tornaram escassos, os futuros Geada foram expulsos. O frio não foi uma escolha; foi o último caminho que lhes restou.":["When the warm lands grew scarce, the future Frost were driven out. The cold was not a choice; it was the last path left to them.","Cuando las tierras cálidas escasearon, los futuros Escarcha fueron expulsados. El frío no fue una elección; fue el último camino que les quedó.","Quand les terres chaudes se raréfièrent, les futurs Givre furent chassés. Le froid ne fut pas un choix ; ce fut le dernier chemin qui leur restait.","Als die warmen Länder knapp wurden, wurde der künftige Frost vertrieben. Die Kälte war keine Wahl; sie war der letzte Weg, der ihnen blieb.","Quando le terre calde si fecero scarse, i futuri Brina furono cacciati. Il freddo non fu una scelta; era l'ultima strada rimasta.","暖かな土地が乏しくなると、のちの霜の民は追い出された。寒さは選んだものではなかった。それが残された最後の道だった。","温暖的土地日渐稀少，未来的霜冻族被驱逐出去。寒冷并非他们的选择，而是他们仅剩的道路。"],"ande a pé pela água rasa":["walk on foot through shallow water","camina a pie por el agua poco profunda","marchez à pied dans l'eau peu profonde","gehe zu Fuß durch seichtes Wasser","cammina a piedi nell'acqua bassa","浅瀬を歩いて渡る","徒步涉过浅水"],"Sob o gelo, encontraram corredores feitos de uma substância que parecia luz congelada. Nenhum dos anciãos reconheceu a construção.":["Beneath the ice, they found corridors made of a substance that looked like frozen light. None of the elders recognized the construction.","Bajo el hielo, encontraron pasillos hechos de una sustancia que parecía luz congelada. Ninguno de los ancianos reconoció la construcción.","Sous la glace, ils trouvèrent des couloirs faits d'une substance qui ressemblait à de la lumière gelée. Aucun des anciens ne reconnut la construction.","Unter dem Eis fanden sie Gänge aus einem Stoff, der wie gefrorenes Licht aussah. Keiner der Alten erkannte die Bauweise.","Sotto il ghiaccio trovarono corridoi fatti di una sostanza che sembrava luce congelata. Nessuno degli anziani riconobbe la costruzione.","氷の下で、彼らは凍った光のような物質でできた回廊を見つけた。長老の誰ひとり、その造りに見覚えはなかった。","他们在冰下发现了由一种宛如冻结之光的物质构成的回廊。没有一位长老认得这种建造方式。"],"Os primeiros mercadores entenderam que água compartilhada valia mais do que muralhas. Trocas transformaram acampamentos isolados em cidades.":["The first merchants understood that shared water was worth more than walls. Trade turned isolated camps into cities.","Los primeros mercaderes entendieron que el agua compartida valía más que las murallas. El comercio transformó campamentos aislados en ciudades.","Les premiers marchands comprirent que l'eau partagée valait plus que des murailles. Les échanges transformèrent des campements isolés en cités.","Die ersten Händler verstanden, dass geteiltes Wasser mehr wert war als Mauern. Der Handel machte aus vereinzelten Lagern Städte.","I primi mercanti capirono che l'acqua condivisa valeva più delle mura. Il commercio trasformò accampamenti isolati in città.","最初の商人たちは、分かち合う水が城壁よりも価値があると理解した。交易は孤立した野営地を都市へと変えた。","最早的商人明白，共享的水比城墙更有价值。贸易让孤立的营地变成了城市。"],"O símbolo da moeda surgiu novamente no Grande Bazar. Não representava um império esquecido. Parecia representar um mundo que um dia fora inteiro.":["The coin's symbol appeared again in the Grand Bazaar. It did not represent a forgotten empire. It seemed to represent a world that had once been whole.","El símbolo de la moneda apareció de nuevo en el Gran Bazar. No representaba un imperio olvidado. Parecía representar un mundo que una vez estuvo entero.","Le symbole de la pièce réapparut au Grand Bazar. Il ne représentait pas un empire oublié. Il semblait représenter un monde qui avait été entier.","Das Zeichen der Münze tauchte im Großen Basar wieder auf. Es stand nicht für ein vergessenes Reich. Es schien für eine Welt zu stehen, die einst ganz gewesen war.","Il simbolo della moneta riapparve nel Gran Bazar. Non rappresentava un impero dimenticato. Sembrava rappresentare un mondo che un tempo era stato intero.","硬貨の紋章が大バザールにふたたび現れた。それは忘れられた帝国の印ではなかった。かつてひとつだった世界を表しているようだった。","硬币上的符号再次出现在大集市。它代表的不是一个被遗忘的帝国，而似乎是一个曾经完整的世界。"],"Do alto, os falcões viam passagens que os olhos humanos não alcançavam. Aprender a observá-los foi aprender a sobreviver.":["From above, the falcons saw passages human eyes could not reach. Learning to watch them was learning to survive.","Desde lo alto, los halcones veían pasos que los ojos humanos no alcanzaban. Aprender a observarlos fue aprender a sobrevivir.","D'en haut, les faucons voyaient des passages que les yeux humains n'atteignaient pas. Apprendre à les observer, ce fut apprendre à survivre.","Von oben sahen die Falken Durchgänge, die menschliche Augen nicht erreichten. Sie beobachten zu lernen hieß überleben zu lernen.","Dall'alto, i falchi vedevano passaggi che gli occhi umani non potevano raggiungere. Imparare a osservarli significava imparare a sopravvivere.","空の上から、鷹は人の目が届かない抜け道を見ていた。鷹を見守ることを学ぶのは、生き延びることを学ぶことだった。","在高空中，鹰能看到人眼无法触及的通道。学会观察它们，就是学会生存。"],"Crianças perdidas foram encontradas por lobos-do-musgo. Na floresta fragmentada, a primeira proteção veio de criaturas que não falavam sua língua.":["Lost children were found by moss wolves. In the fragmented forest, the first protection came from creatures that did not speak their language.","Unos niños perdidos fueron encontrados por lobos de musgo. En el bosque fragmentado, la primera protección vino de criaturas que no hablaban su lengua.","Des enfants perdus furent trouvés par des loups-de-mousse. Dans la forêt fragmentée, la première protection vint de créatures qui ne parlaient pas leur langue.","Verlorene Kinder wurden von Mooswölfen gefunden. Im zersplitterten Wald kam der erste Schutz von Geschöpfen, die ihre Sprache nicht sprachen.","Bambini perduti furono trovati dai lupi del muschio. Nella foresta frammentata, la prima protezione venne da creature che non parlavano la loro lingua.","迷子の子どもたちは苔の狼に見つけられた。分かれた森で、最初の守りは言葉の通じない生き物からもたらされた。","迷路的孩子被苔藓狼找到。在破碎的森林里，最初的保护来自不说他们语言的生灵。"],"Quando encontraram outros sobreviventes, ofereceram uma escolha: viver separados ou caçar juntos. Muitos escolheram a matilha.":["When they met other survivors, they offered a choice: live apart or hunt together. Many chose the pack.","Cuando encontraron a otros supervivientes, les ofrecieron una elección: vivir separados o cazar juntos. Muchos eligieron la manada.","Quand ils rencontrèrent d'autres survivants, ils offrirent un choix : vivre séparés ou chasser ensemble. Beaucoup choisirent la meute.","Als sie anderen Überlebenden begegneten, boten sie eine Wahl: getrennt leben oder gemeinsam jagen. Viele wählten das Rudel.","Quando incontrarono altri sopravvissuti, offrirono una scelta: vivere separati o cacciare insieme. Molti scelsero il branco.","ほかの生存者に出会うと、彼らは選択を示した。別々に生きるか、ともに狩るか。多くの者が群れを選んだ。","遇见其他幸存者时，他们给出一个选择：分开生活，或一同狩猎。许多人选择了狼群。"],"Os monges transformaram a descoberta em travessias. Onde antes havia abismo, surgiram Pontes de Lumen.":["The monks turned the discovery into crossings. Where there had been an abyss, Lumen Bridges appeared.","Los monjes convirtieron el descubrimiento en travesías. Donde antes había un abismo, surgieron Puentes de Lumen.","Les moines transformèrent la découverte en traversées. Là où il y avait un abîme surgirent des Ponts de Lumen.","Die Mönche verwandelten die Entdeckung in Übergänge. Wo ein Abgrund gewesen war, erschienen Lumenbrücken.","I monaci trasformarono la scoperta in attraversamenti. Dove prima c'era l'abisso, apparvero i Ponti di Lumen.","僧たちはその発見を渡り道に変えた。かつて深淵があった場所に、ルーメンの橋が現れた。","僧侣们把这一发现变成了通路。曾是深渊的地方，出现了流明桥。"],"Outro cristal mostrou uma porta no céu, cercada por ladrilhos desconhecidos. A imagem parecia uma lembrança — mas ninguém ainda havia vivido aquele dia.":["Another crystal showed a door in the sky, surrounded by unknown tiles. The image looked like a memory, but no one had yet lived that day.","Otro cristal mostró una puerta en el cielo, rodeada de baldosas desconocidas. La imagen parecía un recuerdo, pero nadie había vivido aún aquel día.","Un autre cristal montra une porte dans le ciel, entourée de tuiles inconnues. L'image ressemblait à un souvenir, mais personne n'avait encore vécu ce jour-là.","Ein anderer Kristall zeigte eine Tür im Himmel, umgeben von unbekannten Kacheln. Das Bild wirkte wie eine Erinnerung, doch diesen Tag hatte noch niemand erlebt.","Un altro cristallo mostrò una porta nel cielo, circondata da tessere sconosciute. L'immagine sembrava un ricordo, ma nessuno aveva ancora vissuto quel giorno.","別の水晶は、見知らぬタイルに囲まれた空の扉を映した。その光景は記憶のようだったが、まだ誰もその日を生きてはいなかった。","另一块水晶映出天空中的一扇门，四周是陌生的地块。那景象像是一段记忆，可还没有人经历过那一天。"],"Uma máquina abriu um caminho para o passado. O plano era conquistar recursos antes que a guerra começasse.":["A machine opened a path into the past. The plan was to seize resources before the war began.","Una máquina abrió un camino hacia el pasado. El plan era conquistar recursos antes de que empezara la guerra.","Une machine ouvrit un chemin vers le passé. Le plan était de s'emparer des ressources avant le début de la guerre.","Eine Maschine öffnete einen Weg in die Vergangenheit. Der Plan war, sich Rohstoffe zu sichern, bevor der Krieg begann.","Una macchina aprì una via verso il passato. Il piano era impadronirsi delle risorse prima che la guerra cominciasse.","一台の機械が過去への道を開いた。計画は、戦争が始まる前に資源を手に入れることだった。","一台机器开辟了通往过去的道路。计划是在战争开始前夺取资源。"],"Os Astros descobriram que os Autômatos pretendiam mudar o passado. Uma única alteração poderia transformar toda a guerra.":["The Astrals discovered that the Automatons meant to change the past. A single alteration could transform the entire war.","Los Astros descubrieron que los Autómatas pretendían cambiar el pasado. Una sola alteración podría transformar toda la guerra.","Les Astres découvrirent que les Automates voulaient changer le passé. Une seule modification pouvait transformer toute la guerre.","Die Astralen entdeckten, dass die Automaten die Vergangenheit verändern wollten. Eine einzige Änderung könnte den ganzen Krieg umkehren.","Gli Astri scoprirono che gli Automi volevano cambiare il passato. Una sola modifica poteva trasformare l'intera guerra.","アストロは、オートマトンが過去を変えようとしていることを突き止めた。たったひとつの変化が、戦争のすべてを変えてしまうかもしれない。","星族发现自动机企图改变过去。哪怕一个改动，也可能改变整场战争。"],"Os sensores localizaram uma anomalia no centro de Mosaica. A assinatura lembrava a energia do portal.":["The sensors located an anomaly at the center of Mosaica. Its signature resembled the energy of the portal.","Los sensores localizaron una anomalía en el centro de Mosaica. Su firma recordaba la energía del portal.","Les capteurs localisèrent une anomalie au centre de Mosaica. Sa signature rappelait l'énergie du portail.","Die Sensoren orteten eine Anomalie im Zentrum von Mosaica. Ihre Signatur ähnelte der Energie des Portals.","I sensori individuarono un'anomalia al centro di Mosaica. La sua firma ricordava l'energia del portale.","センサーはモザイカの中心に異常を捉えた。その反応は時の門のエネルギーに似ていた。","传感器在马赛卡的中心定位到一处异常。它的特征与时间之门的能量相似。"],"Os desaparecidos descobriram que podiam observar os ladrilhos, mas não retornar plenamente a eles.":["The vanished discovered they could watch the tiles, but not fully return to them.","Los desaparecidos descubrieron que podían observar las baldosas, pero no regresar plenamente a ellas.","Les disparus découvrirent qu'ils pouvaient observer les tuiles, mais pas y revenir pleinement.","Die Verschwundenen entdeckten, dass sie die Kacheln beobachten, aber nicht ganz zu ihnen zurückkehren konnten.","Gli scomparsi scoprirono di poter osservare le tessere, ma non di potervi tornare del tutto.","消えた者たちは、タイルを見つめることはできても、完全には戻れないことを知った。","消失者发现，他们能注视地块，却无法完全回到其中。"],"Quando dois ladrilhos se aproximaram, um Espectro viu seu reflexo por um instante. Desde então, acreditam que a união poderá devolver-lhes a forma.":["When two tiles drew close, a Specter saw its reflection for an instant. Since then, they believe the union may give them back their form.","Cuando dos baldosas se acercaron, un Espectro vio su reflejo por un instante. Desde entonces, creen que la unión podrá devolverles la forma.","Quand deux tuiles se rapprochèrent, un Spectre vit son reflet un instant. Depuis, ils croient que l'union pourra leur rendre leur forme.","Als sich zwei Kacheln näherten, sah ein Gespenst für einen Augenblick sein Spiegelbild. Seitdem glauben sie, dass die Vereinigung ihnen ihre Gestalt zurückgeben kann.","Quando due tessere si avvicinarono, uno Spettro vide per un istante il proprio riflesso. Da allora credono che l'unione possa restituire loro la forma.","ふたつのタイルが近づいたとき、ある亡霊は一瞬だけ自分の姿を映して見た。それ以来、彼らはひとつになれば形を取り戻せると信じている。","两块地块彼此靠近时，一个幽灵在刹那间看见了自己的倒影。从那以后，他们相信合一能让他们重获形体。"],"Nas rochas de seus corpos, brilham marcas que não pertencem a nenhum idioma conhecido dos clãs.":["On the rock of their bodies glow marks that belong to no language known to the clans.","En la roca de sus cuerpos brillan marcas que no pertenecen a ningún idioma conocido por los clanes.","Dans la roche de leurs corps brillent des marques qui n'appartiennent à aucune langue connue des clans.","Auf dem Fels ihrer Körper leuchten Zeichen, die zu keiner den Clans bekannten Sprache gehören.","Sulla roccia dei loro corpi brillano segni che non appartengono a nessuna lingua conosciuta dai clan.","彼らの体の岩には、どの氏族も知らない言葉の印が光っている。","他们岩石般的身体上，闪耀着不属于任何氏族已知语言的印记。"],"O fogo pode unir a matéria. Mas o coração de Ígnea parece responder a algo que não nasceu das chamas.":["Fire can unite matter. But the heart of Ignea seems to answer to something that was not born of flames.","El fuego puede unir la materia. Pero el corazón de Ígnea parece responder a algo que no nació de las llamas.","Le feu peut unir la matière. Mais le cœur d'Ignéa semble répondre à quelque chose qui n'est pas né des flammes.","Feuer kann Materie vereinen. Doch das Herz von Ignea scheint auf etwas zu antworten, das nicht aus Flammen geboren wurde.","Il fuoco può unire la materia. Ma il cuore di Ignea sembra rispondere a qualcosa che non è nato dalle fiamme.","火は物質を結びつけられる。だが、イグネアの心臓は炎から生まれたのではない何かに応えているようだ。","火能把物质联结在一起。但伊格尼亚之心似乎在回应某种并非诞生于火焰的东西。"],"O oceano guarda um caminho. Segui-lo talvez revele não apenas um recife, mas a memória de um mundo inteiro.":["The ocean keeps a path. Following it may reveal not just a reef, but the memory of an entire world.","El océano guarda un camino. Seguirlo quizá revele no solo un arrecife, sino la memoria de un mundo entero.","L'océan garde un chemin. Le suivre pourrait révéler non seulement un récif, mais la mémoire d'un monde entier.","Der Ozean bewahrt einen Weg. Ihm zu folgen könnte nicht nur ein Riff enthüllen, sondern die Erinnerung an eine ganze Welt.","L'oceano custodisce una via. Seguirla potrebbe rivelare non solo una barriera, ma la memoria di un mondo intero.","海はひとつの道を守っている。それをたどれば、珊瑚礁だけでなく、ひとつの世界の記憶が明らかになるかもしれない。","大洋守护着一条道路。追随它，揭示的或许不只是一片珊瑚礁，而是整个世界的记忆。"],"A vida não esqueceu a terra que perdeu. As raízes continuam buscando aquilo que foi separado.":["Life has not forgotten the land it lost. The roots keep reaching for what was separated.","La vida no olvidó la tierra que perdió. Las raíces siguen buscando lo que fue separado.","La vie n'a pas oublié la terre qu'elle a perdue. Les racines continuent de chercher ce qui a été séparé.","Das Leben hat das verlorene Land nicht vergessen. Die Wurzeln greifen weiter nach dem, was getrennt wurde.","La vita non ha dimenticato la terra che ha perduto. Le radici continuano a cercare ciò che è stato separato.","命は失った大地を忘れていない。根は今も、隔てられたものへと伸び続けている。","生命没有忘记失去的土地。根须仍在伸向那些被分开的事物。"],"O exílio levou os Geada ao lugar mais frio do mundo — e talvez ao vestígio mais antigo de um caminho para os céus.":["Exile took the Frost to the coldest place in the world, and perhaps to the oldest trace of a path to the heavens.","El exilio llevó a los Escarcha al lugar más frío del mundo, y quizá al vestigio más antiguo de un camino hacia los cielos.","L'exil a mené les Givre à l'endroit le plus froid du monde, et peut-être au plus ancien vestige d'un chemin vers les cieux.","Das Exil führte den Frost an den kältesten Ort der Welt, und vielleicht zur ältesten Spur eines Weges in den Himmel.","L'esilio portò i Brina nel luogo più freddo del mondo, e forse alla traccia più antica di una via verso il cielo.","追放は霜の民を世界で最も寒い場所へと導いた。そしてそこはおそらく、天へ続く道の最も古い痕跡でもある。","放逐把霜冻族带到了世界上最寒冷的地方，也许也带到了一条通天之路最古老的痕迹前。"],"As caravanas provaram que povos separados podem voltar a se encontrar. A moeda antiga sugere que essa união já teve um símbolo.":["The caravans proved that separated peoples can find each other again. The ancient coin suggests that this union once had a symbol.","Las caravanas demostraron que los pueblos separados pueden volver a encontrarse. La moneda antigua sugiere que esa unión ya tuvo un símbolo.","Les caravanes ont prouvé que des peuples séparés peuvent se retrouver. La pièce ancienne suggère que cette union a déjà eu un symbole.","Die Karawanen haben bewiesen, dass getrennte Völker wieder zueinanderfinden können. Die alte Münze deutet an, dass diese Einheit einst ein Symbol hatte.","Le carovane hanno dimostrato che popoli separati possono ritrovarsi. L'antica moneta suggerisce che questa unione un tempo avesse un simbolo.","キャラバンは、隔てられた民がふたたび出会えることを証明した。古い硬貨は、その結びつきにかつて象徴があったことを示している。","商队证明了分离的民族能够重逢。那枚古币暗示，这种团结曾经拥有一个象征。"],"O som que os salvou ainda ecoa. Os ventos conhecem uma direção que os mapas não conseguem mostrar.":["The sound that saved them still echoes. The winds know a direction that maps cannot show.","El sonido que los salvó aún resuena. Los vientos conocen una dirección que los mapas no logran mostrar.","Le son qui les a sauvés résonne encore. Les vents connaissent une direction que les cartes ne peuvent montrer.","Der Klang, der sie rettete, hallt noch immer nach. Die Winde kennen eine Richtung, die keine Karte zeigen kann.","Il suono che li salvò echeggia ancora. I venti conoscono una direzione che le mappe non sanno mostrare.","彼らを救った音は今も響いている。風は、地図には示せない方角を知っている。","拯救了他们的声音仍在回荡。风知道一个地图无法标示的方向。"],"A matilha ouve um chamado além do vazio. Talvez a natureza reconheça algo que os povos esqueceram.":["The pack hears a call beyond the void. Perhaps nature recognizes something the peoples have forgotten.","La manada oye una llamada más allá del vacío. Quizá la naturaleza reconozca algo que los pueblos olvidaron.","La meute entend un appel au-delà du vide. Peut-être la nature reconnaît-elle quelque chose que les peuples ont oublié.","Das Rudel hört einen Ruf jenseits der Leere. Vielleicht erkennt die Natur etwas, das die Völker vergessen haben.","Il branco sente un richiamo oltre il vuoto. Forse la natura riconosce qualcosa che i popoli hanno dimenticato.","群れは虚空の向こうからの呼び声を聞いている。自然は、人々が忘れた何かを覚えているのかもしれない。","狼群听见了来自虚空彼端的呼唤。也许自然认出了各民族早已遗忘的东西。"],"Os cristais registraram uma porta que ainda não existe. A reconstrução pode ser o primeiro passo para alcançá-la.":["The crystals recorded a door that does not exist yet. Rebuilding may be the first step toward reaching it.","Los cristales registraron una puerta que todavía no existe. La reconstrucción puede ser el primer paso para alcanzarla.","Les cristaux ont enregistré une porte qui n'existe pas encore. La reconstruction peut être le premier pas pour l'atteindre.","Die Kristalle haben eine Tür festgehalten, die es noch nicht gibt. Der Wiederaufbau könnte der erste Schritt sein, sie zu erreichen.","I cristalli hanno registrato una porta che ancora non esiste. Ricostruire potrebbe essere il primo passo per raggiungerla.","水晶は、まだ存在しない扉を記録していた。再建は、そこへ至る最初の一歩なのかもしれない。","水晶记录下一扇尚不存在的门。重建或许是抵达那里的第一步。"],"Os robôs viajaram para vencer uma guerra, mas encontraram um mundo cujo futuro desafia seus cálculos.":["The robots traveled to win a war, but found a world whose future defies their calculations.","Los robots viajaron para ganar una guerra, pero encontraron un mundo cuyo futuro desafía sus cálculos.","Les robots ont voyagé pour gagner une guerre, mais ont trouvé un monde dont l'avenir défie leurs calculs.","Die Roboter reisten, um einen Krieg zu gewinnen, fanden aber eine Welt, deren Zukunft sich ihren Berechnungen widersetzt.","I robot viaggiarono per vincere una guerra, ma trovarono un mondo il cui futuro sfida i loro calcoli.","ロボットたちは戦争に勝つために旅立ったが、その未来が計算を拒む世界にたどり着いた。","机器人穿越时空是为了赢得战争，却发现了一个未来不受其计算支配的世界。"],"A perseguição revelou uma ameaça que não estava nos planos de nenhum dos lados da guerra.":["The pursuit revealed a threat that was not in the plans of either side of the war.","La persecución reveló una amenaza que no estaba en los planes de ninguno de los dos bandos.","La poursuite a révélé une menace qui ne figurait dans les plans d'aucun des deux camps.","Die Verfolgung enthüllte eine Bedrohung, die in den Plänen keiner der beiden Kriegsparteien stand.","L'inseguimento rivelò una minaccia che non era nei piani di nessuna delle due parti in guerra.","追跡は、戦争のどちらの陣営の計画にもなかった脅威を明らかにした。","这场追击揭示了一个不在交战双方任何计划之中的威胁。"],"A esperança de recuperar seus corpos cresce com cada ladrilho reunido. A última união pode mudar a fronteira entre presença e ausência.":["The hope of recovering their bodies grows with every tile reunited. The final union may change the border between presence and absence.","La esperanza de recuperar sus cuerpos crece con cada baldosa reunida. La última unión puede cambiar la frontera entre presencia y ausencia.","L'espoir de retrouver leurs corps grandit à chaque tuile réunie. L'union finale pourrait changer la frontière entre présence et absence.","Die Hoffnung, ihre Körper zurückzugewinnen, wächst mit jeder wiedervereinten Kachel. Die letzte Vereinigung könnte die Grenze zwischen Anwesenheit und Abwesenheit verschieben.","La speranza di riavere i propri corpi cresce con ogni tessera riunita. L'unione finale potrebbe cambiare il confine tra presenza e assenza.","体を取り戻す希望は、タイルがひとつ結ばれるごとに大きくなる。最後の結合は、存在と不在の境界を変えるかもしれない。","每一块地块重新相连，重获身体的希望就增长一分。最后的合一或许会改变存在与缺席之间的界限。"],"A escada para casa pode ser erguida. Mas a ordem esquecida sugere que o céu também guarda um dever inacabado.":["The stairway home can be raised. But the forgotten order suggests that the sky also holds an unfinished duty.","La escalera a casa puede levantarse. Pero la orden olvidada sugiere que el cielo también guarda un deber inacabado.","L'escalier vers la maison peut être dressé. Mais l'ordre oublié suggère que le ciel garde aussi un devoir inachevé.","Die Treppe nach Hause kann errichtet werden. Doch der vergessene Befehl deutet an, dass auch der Himmel eine unvollendete Pflicht birgt.","La scala verso casa può essere innalzata. Ma l'ordine dimenticato suggerisce che anche il cielo custodisce un dovere incompiuto.","故郷への階段は築ける。だが、忘れられた命は、空にもまだ果たされていない務めがあることを示している。","回家的阶梯可以建起。但被遗忘的命令暗示，天空也藏着一项未竟的使命。"],"Doze povos. Doze caminhos. Um mundo perdido.":["Twelve peoples. Twelve paths. A lost world.","Doce pueblos. Doce caminos. Un mundo perdido.","Douze peuples. Douze chemins. Un monde perdu.","Zwölf Völker. Zwölf Wege. Eine verlorene Welt.","Dodici popoli. Dodici sentieri. Un mondo perduto.","12の民。12の道。ひとつの失われた世界。","十二个民族。十二条道路。一个失落的世界。"],"Cada clã guardava uma parte da história.":["Each clan kept a part of the story.","Cada clan guardaba una parte de la historia.","Chaque clan gardait une part de l'histoire.","Jeder Clan bewahrte einen Teil der Geschichte.","Ogni clan custodiva una parte della storia.","どの氏族も、物語の一部を守っていた。","每个氏族都守护着故事的一部分。"],"E então, os Lumens responderam.":["And then, the Lumens answered.","Y entonces, los Lumens respondieron.","Et alors, les Lumens répondirent.","Und dann antworteten die Lumen.","E poi, i Lumen risposero.","そして、ルーメンが応えた。","然后，流明回应了。"],"A Forja Eterna e o Grande Farol se acenderam.":["The Eternal Forge and the Great Lighthouse lit up.","La Forja Eterna y el Gran Faro se encendieron.","La Forge Éternelle et le Grand Phare s'illuminèrent.","Die Ewige Schmiede und der Große Leuchtturm erstrahlten.","La Forgia Eterna e il Grande Faro si accesero.","永遠の鍛冶場と大灯台に光が灯った。","永恒熔炉与大灯塔亮了起来。"],"Raízes atravessaram o abismo. Cristais vibraram sob o gelo.":["Roots crossed the abyss. Crystals trembled beneath the ice.","Raíces atravesaron el abismo. Cristales vibraron bajo el hielo.","Des racines traversèrent l'abîme. Des cristaux vibrèrent sous la glace.","Wurzeln überquerten den Abgrund. Kristalle bebten unter dem Eis.","Le radici attraversarono l'abisso. I cristalli tremarono sotto il ghiaccio.","根は深淵を越えた。水晶は氷の下で震えた。","根须跨越了深渊。水晶在冰下颤动。"],"O selo da moeda brilhou. Os ventos convergiram. Um uivo respondeu. Os cristais mostraram o céu.":["The seal of the coin shone. The winds converged. A howl answered. The crystals showed the sky.","El sello de la moneda brilló. Los vientos convergieron. Un aullido respondió. Los cristales mostraron el cielo.","Le sceau de la pièce brilla. Les vents convergèrent. Un hurlement répondit. Les cristaux montrèrent le ciel.","Das Siegel der Münze leuchtete. Die Winde liefen zusammen. Ein Heulen antwortete. Die Kristalle zeigten den Himmel.","Il sigillo della moneta brillò. I venti convergevano. Un ululato rispose. I cristalli mostrarono il cielo.","硬貨の印章が輝いた。風が集まった。遠吠えが応えた。水晶は空を映した。","硬币之印闪耀。风汇聚而来。一声嚎叫作出回应。水晶映出了天空。"],"Os Autômatos receberam uma instrução incompleta. Os Astros detectaram a anomalia. Os Espectros viram seus reflexos. Os Colossos se ajoelharam.":["The Automatons received an incomplete instruction. The Astrals detected the anomaly. The Specters saw their reflections. The Colossi knelt.","Los Autómatas recibieron una instrucción incompleta. Los Astros detectaron la anomalía. Los Espectros vieron sus reflejos. Los Colosos se arrodillaron.","Les Automates reçurent une instruction incomplète. Les Astres détectèrent l'anomalie. Les Spectres virent leurs reflets. Les Colosses s'agenouillèrent.","Die Automaten empfingen eine unvollständige Anweisung. Die Astralen spürten die Anomalie auf. Die Gespenster sahen ihr Spiegelbild. Die Kolosse knieten nieder.","Gli Automi ricevettero un'istruzione incompleta. Gli Astri rilevarono l'anomalia. Gli Spettri videro i loro riflessi. I Colossi si inginocchiarono.","オートマトンは不完全な命令を受け取った。アストロは異常を感知した。亡霊は自らの姿を見た。巨像はひざまずいた。","自动机收到了一条不完整的指令。星族探测到了异常。幽灵看见了自己的倒影。巨像跪了下来。"],"O Mosaica estava inteiro.":["Mosaica was whole.","Mosaica estaba entero.","Mosaica était entier.","Mosaica war vollständig.","Mosaica era intera.","モザイカはひとつになった。","马赛卡完整了。"],"Mas a energia não parou.":["But the energy did not stop.","Pero la energía no se detuvo.","Mais l'énergie ne s'arrêta pas.","Doch die Energie hörte nicht auf.","Ma l'energia non si fermò.","だが、エネルギーは止まらなかった。","但能量没有停止。"],"Algo havia despertado.":["Something had awakened.","Algo había despertado.","Quelque chose s'était éveillé.","Etwas war erwacht.","Qualcosa si era risvegliato.","何かが目覚めていた。","有什么东西苏醒了。"],"“Vocês reuniram aquilo que foi separado. Agora, o caminho está aberto.”":["“You have gathered what was separated. Now, the way is open.”","“Ustedes reunieron lo que fue separado. Ahora, el camino está abierto.”","« Vous avez réuni ce qui avait été séparé. Maintenant, le chemin est ouvert. »","„Ihr habt vereint, was getrennt war. Jetzt ist der Weg offen.“","«Avete riunito ciò che era separato. Ora la via è aperta.»","「隔てられたものを、あなたたちはひとつにした。今、道は開かれた」","“你们把分离之物重新合一。现在，道路已经开启。”"],"O mundo foi reconstruído. Mas não estava sozinho.":["The world was rebuilt. But it was not alone.","El mundo fue reconstruido. Pero no estaba solo.","Le monde a été reconstruit. Mais il n'était pas seul.","Die Welt wurde wieder aufgebaut. Doch sie war nicht allein.","Il mondo era stato ricostruito. Ma non era solo.","世界は再建された。だが、ひとりではなかった。","世界重建了。但它并不孤单。"],"Rever o que aconteceu quando o mundo se uniu":["Watch again what happened when the world came together","Volver a ver lo que pasó cuando el mundo se unió","Revoir ce qui s'est passé quand le monde s'est réuni","Sieh dir noch einmal an, was geschah, als die Welt sich vereinte","Rivedi cosa è successo quando il mondo si è riunito","世界がひとつになったときに起きたことをもう一度見る","再看一次世界合一时发生的一切"],"ALÉM DO MOSAICO":["BEYOND THE MOSAIC","MÁS ALLÁ DEL MOSAICO","AU-DELÀ DE LA MOSAÏQUE","JENSEITS DES MOSAIKS","OLTRE IL MOSAICO","モザイクの彼方へ","镶嵌画之外"],"Voltar ao Arquivo":["Back to the Archive","Volver al Archivo","Retour aux Archives","Zurück zum Archiv","Torna all'Archivio","書庫に戻る","返回档案馆"],"Rever a Convergência":["Watch the Convergence again","Volver a ver la Convergencia","Revoir la Convergence","Die Konvergenz noch einmal ansehen","Rivedi la Convergenza","コンバージェンスをもう一度見る","再看一次汇聚"],"Ler em texto":["Read as text","Leer en texto","Lire en texte","Als Text lesen","Leggi come testo","テキストで読む","以文字阅读"],"Texto":["Text","Texto","Texte","Text","Testo","テキスト","文字"],"Novos artefatos":["New artifacts","Nuevos artefactos","Nouveaux artefacts","Neue Artefakte","Nuovi artefatti","新しいアーティファクト","新文物"],"Coleção dos {c} completa! Uma peça do Grande Mosaico se acendeu.":["{c} collection complete! A piece of the Great Mosaic has lit up.","¡Colección de los {c} completa! Una pieza del Gran Mosaico se encendió.","Collection des {c} complète ! Une pièce de la Grande Mosaïque s'est illuminée.","Sammlung von {c} vollständig! Ein Teil des Großen Mosaiks leuchtet auf.","Collezione dei {c} completa! Un pezzo del Grande Mosaico si è acceso.","{c}のコレクション完成！大モザイクのピースがひとつ灯りました。","{c}收藏已集齐！大镶嵌画的一块亮了起来。"],"Ver no Arquivo":["View in the Archive","Ver en el Archivo","Voir dans les Archives","Im Archiv ansehen","Vedi nell'Archivio","書庫で見る","在档案馆中查看"],"Artefato recuperado: {t}":["Artifact recovered: {t}","Artefacto recuperado: {t}","Artefact retrouvé : {t}","Artefakt wiedergefunden: {t}","Artefatto recuperato: {t}","アーティファクトを回収：{t}","已找回文物：{t}"],"As memórias deste clã ficam guardadas até ele ser desbloqueado.":["This clan's memories stay safe until the clan is unlocked.","Las memorias de este clan quedan guardadas hasta que se desbloquee.","Les mémoires de ce clan restent gardées jusqu'à ce qu'il soit débloqué.","Die Erinnerungen dieses Clans bleiben sicher verwahrt, bis der Clan freigeschaltet ist.","Le memorie di questo clan restano al sicuro finché il clan non viene sbloccato.","この氏族の記憶は、氏族が解放されるまで大切に保管されます。","此氏族的记忆会妥善保存，直到该氏族解锁。"],"Capítulo: as memórias dos {c}":["Chapter: the memories of the {c}","Capítulo: las memorias de los {c}","Chapitre : les mémoires des {c}","Kapitel: die Erinnerungen von {c}","Capitolo: le memorie dei {c}","章：{c}の記憶","篇章：{c}的记忆"],"Clã bloque
